<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walks</title>
</head>
<body>
  <h1>Walks</h1>
  <button id="load">Load walks</button>
  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Paste your config from Firebase Console > Project settings > Your apps
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const output = document.getElementById("output");

    document.getElementById("load").addEventListener("click", async () => {
      output.textContent = "Loading...";
      try {
        const snapshot = await getDocs(collection(db, "walks"));
        if (snapshot.empty) {
          output.textContent = "No walks found.";
          return;
        }
        output.textContent = snapshot.docs
          .map(d => d.id + ": " + JSON.stringify(d.data(), null, 2))
          .join("\n\n");
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
