<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walks</title>
</head>
<body>
  <h1>Walks</h1>
  <button id="load">Load walks</button>
  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Realtime Database connection for the habit-tracker project
    const firebaseConfig = {
      projectId: "habit-tracker-86ef8",
      databaseURL: "https://habit-tracker-86ef8-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    const output = document.getElementById("output");

    document.getElementById("load").addEventListener("click", async () => {
      output.textContent = "Loading...";
      try {
        const snapshot = await get(ref(db, "walks"));
        if (!snapshot.exists()) {
          output.textContent = "No walks found.";
          return;
        }
        // Each child is date: number of walks, e.g. "2026-10-07: 3"
        const lines = [];
        // Braces matter: Firebase stops looping if the callback returns a truthy value
        snapshot.forEach(child => {
          lines.push(child.key + ": " + JSON.stringify(child.val()));
        });
        output.textContent = lines.join("\n");
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
