<!-- ============ MODULE 1 ============ -->
<template id="t-m1">
<div class="prose">
<p>Most organising advice assumes you have a list problem. You probably have a <b>seeing</b> problem. Those need different fixes, and mixing them up is why a lot of systems collapse in week three.</p>

<h3>Two jobs hiding inside one list</h3>
<p>Any organising system does two jobs:</p>
<ul>
<li><b>Store:</b> hold every commitment, idea and obligation somewhere you trust, so your head can stop doing it.</li>
<li><b>Show:</b> put in front of you only what matters right now, so you can act without a committee meeting in your skull.</li>
</ul>
<p>The trouble is that most to-do lists do both jobs at once. The list has to be complete, or you stop trusting it. But a complete list is long, and a long list is exactly what you can't look at on a bad Tuesday. So you either keep the list thin and lose things, or keep it complete and avoid opening it. Both are failures of the same design.</p>
<p>Think of a warehouse and a shop window. The warehouse should hold everything. The shop window should show about five things, arranged so you can pick one. If the warehouse is the window, you're standing in a stockroom with the lights off. The proper terms: the warehouse is your <b>system of record</b> (or source of truth), and the window is a <b>view</b>, meaning a filtered, sorted slice of the record, usually produced by a <b>query</b>.</p>

<h3>Why your head is the wrong warehouse</h3>
<p>David Allen, whose book Getting Things Done came out in 2001, calls unfinished commitments <b>open loops</b>. Each one keeps a small amount of attention reserved for itself, in your <b>working memory</b>, whether or not you do anything about it. A well-known 2011 study by Masicampo and Baumeister found that making a specific plan for an unfinished goal reduced how much it kept intruding on later tasks. The practical reading is that you don't always need to finish a thing to quiet it. You need to capture it, decide the next step, and trust that the step lives somewhere reliable.</p>
<p>So the first rule of the whole course is boring and powerful: <b>everything gets exactly one home</b>. Not two places "just in case". One.</p>

<h3>Your situation specifically</h3>
<p>You've got projects with subtasks, unpredictable work around your team, recurring duties, goals with no deadline, admin and IT bits, and little daily habits. These are different kinds of thing with different rhythms. A single list sorted by date can't represent them, because half of them don't have dates. But views can. A view called "Today" can pull a deadline from a project, a recurring monthly sheet, a team issue and a lunchtime walk into one short page, without any of them having to live in the same place.</p>
<p>That's the architecture this course builds: a calm, boring store, and a handful of small views on top of it.</p>

<h3>How the course works</h3>
<p>Each module has the same shape:</p>
<ul>
<li>An idea, explained properly, with a diagram.</li>
<li>An activity you can do right here, which saves on your device.</li>
<li>An Obsidian fit, showing how to build it in your vault.</li>
<li>A paper fit, for the notebook side of your life.</li>
</ul>
<p>You don't have to adopt all of it. In fact, don't. The last module is about picking a minimum viable version and rolling it out slowly, because the usual way people fail at this is by building a cathedral in one weekend and then never going in.</p>
</div>

<section class="activity" data-act="1">
<h3>Activity: shrink the pile</h3>
<p class="hint">Sixty open commitments, one dot each. Switch filters on and watch the number you actually have to look at drop. Nothing is deleted. It's all still in the store.</p>
<div class="act-body"></div>

<div class="prose">
<aside class="fit"><h4>Obsidian fit</h4>
<p>Obsidian is naturally a store-plus-views tool. Notes are the store. Queries, written with the Tasks or Dataview plugins, are the views. The rule for your vault is that you never maintain a list by hand if a query can build it for you. A hand-written "Active Projects" note goes stale the next time you finish one; a query never does.</p></aside>
<aside class="fit paper"><h4>Paper fit</h4>
<p>On paper, the store and the view are physically the same page, which is why paper feels calm only while it's thin. A daily page is a great view, since it holds one day. A single master list in a notebook is a bad one, because it grows and you have to re-read all of it. Paper wants a small store and a ruthless view.</p></aside>
<div class="take"><b>Takeaway.</b> Separate storing from showing. The store is complete and trusted; the view is small and temporary. Overwhelm usually means you're looking at the store.</div>
</div>
</template>

<!-- ============ MODULE 2 ============ -->
<template id="t-m2">
<div class="prose">
<p>A lot of the mess in your description comes from one fact: you've listed things that look similar (stuff to do) but behave completely differently. Before any tool, you need names for the kinds of thing, because each kind has a different home and a different way of surfacing.</p>

<h3>The seven kinds</h3>
<ul>
<li><b>Project:</b> an outcome that takes more than one step and has a finish line. Test: can you say "it's done" and everyone agrees? Shipping a game build, doing your tax return, planning a trip.</li>
<li><b>Task (next action):</b> one physical step you can start without further thinking. "Download P60" is a task. "Sort out tax" is a project wearing a task's coat.</li>
<li><b>Event:</b> fixed time and place. Dentist at 3pm on Tuesday. It lives on a calendar and nowhere else, because it's the one thing that genuinely can't move.</li>
<li><b>Recurring commitment:</b> repeats on a known schedule. The monthly sales enablement sheet. It should generate its own next copy.</li>
<li><b>Reactive stream:</b> arrives unpredictably, and you can't schedule its arrival. A team member off sick, an IT ticket, a developer who needs coaching. You manage it with capacity, not dates.</li>
<li><b>Goal or area:</b> something you want to progress or maintain with no natural deadline. Learning a skill, keeping the team healthy, fitness. It needs a time budget instead of a due date.</li>
<li><b>Habit:</b> a tiny repeated behaviour, judged by consistency rather than completion. A lunchtime walk, enough water.</li>
</ul>

<h3>Goal versus project versus area</h3>
<p>This trio causes most of the confusion, so it's worth being exact. If something has an outcome and an end ("model one prop by 20 December"), it's a project. If it's an ongoing standard you want to uphold ("keep my team in good shape"), it's an <b>area of responsibility</b>, a term from Tiago Forte's PARA method (Projects, Areas, Resources, Archives). A goal with no date and no outcome is really a wish with a good haircut. It becomes real when you attach a time budget (module 8) or convert it into a project.</p>

<h3>The rule that saves you the most grief</h3>
<p><b>Don't date what isn't dated.</b> When you give a goal or a habit a fake due date, you manufacture a pile of overdue items that you'll learn to ignore, and then you'll ignore the real ones too. Dates belong to events, deadlines and recurring commitments. Everything else gets a different trigger: a time slot, a cue, or a capacity budget.</p>
</div>

<section class="activity" data-act="2">
<h3>Activity: name the kind</h3>

<div class="prose">
<aside class="fit"><h4>Obsidian fit</h4>
<p>Resist the urge to build seven elaborate folders. A tiny structure is enough:</p>
<ul>
<li>An Inbox note, where everything lands first.</li>
<li>A Projects folder, one note per project, with its tasks inside it.</li>
<li>An Areas folder for ongoing things like Team and Goals.</li>
<li>A Habits note, kept separate from the task system.</li>
<li>Your daily notes, which act as the Today page.</li>
</ul>
<p>Events stay in your calendar, and recurring tasks use the Tasks plugin's recurrence (module 6). A frontmatter property such as <code>type: project</code> lets you filter later without creating more folders.</p></aside>
<aside class="fit paper"><h4>Paper fit</h4>
<p>The Bullet Journal method, created by Ryder Carroll, already separates these: a future log for dated things, a monthly log, daily logs, and "collections" for lists by topic. Your seven kinds map onto those pages. Events go in the future log, recurring things on the monthly page, projects and areas as collections, and the daily page is for tasks and habits.</p></aside>
<div class="take"><b>Takeaway.</b> Classify before you organise. Projects and tasks finish; recurring items, reactive work, areas and habits continue. Each kind surfaces differently, so each gets a different trigger, and only some of them ever get a date.</div>
</div>
</template>

<!-- ============ MODULE 3 ============ -->
<template id="t-m3">
<div class="prose">
<p>Everything in your life needs a single front door. If ideas can arrive in your notebook, your phone, your email, a sticky note and a voice memo, you've created five inboxes, and the only person who checks all five is a version of you who doesn't exist.</p>

<h3>Capture is not organising</h3>
<p>The main mistake at the capture stage is trying to decide things while you capture them. "Should this be a task or a project? What's its priority? When's it due?" All of that is a different mental mode, and it makes capture slow, which makes you skip it. So split the work into two clean steps:</p>
<ul>
<li><b>Capture:</b> get it out of your head in under ten seconds, with no decisions.</li>
<li><b>Process:</b> later, in a batch, decide what each item is and where it goes.</li>
</ul>
<p>The idea comes straight from GTD: capture everything into a trusted inbox, then clarify. You can have more than one capture <i>point</i> (paper pad, phone, email) as long as they all drain into one <b>inbox</b> that you empty on a schedule.</p>

<h3>The triage questions</h3>
<p>When you process an item, ask in this order:</p>
<ul>
<li>Is it actionable? If not, it's trash, reference material, or a <b>someday/maybe</b> idea.</li>
<li>Does it take under two minutes? If yes, do it now. This is the two-minute rule, and the logic is that tracking it costs more than doing it.</li>
<li>Is it one step? Then it's a <b>task</b>. Give it a home, and a date only if it really has one.</li>
<li>Is it more than one step? Then it's a <b>project</b>. Write the outcome, and the very next action.</li>
</ul>
<p>The diagram has it as a flow. Notice the three exits on the left that stop an item from ever becoming a to-do. Most clutter is people turning ideas into obligations by accident.</p>

<h3>What "inbox zero" actually means</h3>
<p>It doesn't mean everything is done. It means everything has been <b>decided</b>. A clear inbox with forty well-placed tasks is a good state; an inbox with forty unsorted scraps is not. Process daily for ten minutes if you can, and at the very latest before your weekly review (module 11).</p>

<h3>The real next action</h3>
<p>A <b>next action</b> is the smallest visible physical step, written starting with a verb. "Tax" is a topic. "Find login for HMRC account" is a next action. If a task makes you flinch every time you see it, it's usually a project in disguise, and splitting it fixes the flinch.</p>
</div>

<p>You asked a sharp question: is a low-priority task inside a high-priority project better or worse than a high-priority task inside a low-priority project? The honest answer is that the question hides a mistake, and once you see it the balancing gets much easier.</p>

<h3>Two different questions wearing the same word</h3>
<p>"Priority" is being asked to answer two jobs:</p>
<ul>
<li><b>Project priority</b> answers: which outcomes deserve my limited attention this month? It's about <b>importance</b>, and it changes slowly.</li>
<li><b>Task priority</b> answers: of the moves available right now, which one first? It's mostly about <b>urgency</b>, which changes daily and can be calculated from dates.</li>
</ul>
<p>Comparing them directly is like comparing a salary to a bus timetable. They're not on the same scale. The Eisenhower matrix, attributed to US President Dwight Eisenhower, makes the same split: importance on one axis, urgency on the other, giving four boxes. Do first (important and urgent), schedule (important, not urgent), delegate (urgent, not important), eliminate (neither).</p>

<h3>The two-step method</h3>
<p>Instead of one global ranking, choose in two steps:</p>
<ul>
<li><b>Step one: choose the projects.</b> Limit how many are <i>active</i>. In Kanban this is a <b>work-in-progress limit</b> (WIP limit), and two or three active projects is a sensible start*. Everything else is "on deck": safe, visible in the store, but not competing for today.</li>
<li><b>Step two: choose the task within them.</b> Use deadline pressure first, then whether it unblocks other work, then how well it fits your energy and the time you have.</li>
</ul>

<h3>So, your actual question</h3>
<p>Take the high-priority project's low-priority task first only if it does something for the project: it has a date coming, or it blocks something else. If it's genuinely optional polish, it should wait, even inside a hot project. Conversely, a "high-priority" task in a low-priority project wins only if the word "high" means a real deadline or a blocker. If it just means "I feel anxious about it", it's an importance claim, and the project's priority already told you the answer.</p>
<p>Put simply, <b>tasks should inherit importance from their project by default</b>. You only override a task's priority when its situation differs: a hard date, or a dependency. This also means you don't have to prioritise every task by hand, which was never sustainable anyway.</p>

<h3>Derive urgency, don't type it</h3>
<p>Urgency is arithmetic on dates, so let the system compute it. A task due in two days is more urgent than one due in two weeks, whatever label you stuck on it. The Obsidian Tasks plugin, for example, calculates an urgency score from priority and dates that you can sort by*. Your own manual "priority" field is then reserved for the thing only you know: importance.</p>

<h3>A tiebreak order for stuck moments</h3>
<ul>
<li>Does something have a real deadline within three days?</li>
<li>Does it unblock another person or another task?</li>
<li>Does it belong to a top-priority active project?</li>
<li>Is it the smallest thing that moves a project forward?</li>
</ul>
<p>Stop at the first yes. If none apply, you have the luxury of choosing by energy.</p>
</div>

<template id="t-m5">
<div class="prose">
<p>Dates are the sharpest tool in the box, and most people use them like a hammer on everything. The fix is to use fewer dates, but to say exactly what each one means.</p>

<h3>Three dates, three meanings</h3>
<p>A single "due date" can't carry everything you want from it. Split it into three jobs:</p>
<ul>
<li><b>Due date:</b> the point after which something bad happens, usually to someone else or to a hard commitment. Tax deadline, a build handed to a publisher, a report someone is waiting for.</li>
<li><b>Scheduled date:</b> the day you <i>plan to work</i> on it. It's a promise to yourself, and it can slide without anyone being harmed.</li>
<li><b>Start date:</b> the earliest day the task should appear at all. Before it, the task is hidden from your views.</li>
</ul>
<p>These three are what the Obsidian Tasks plugin offers, by the way: due, scheduled and start, written with a calendar, hourglass and take-off emoji. Most to-do apps flatten them into one, which is why most to-do lists overflow.</p>

<h3>The honesty test for a due date</h3>
<p>Ask: <b>what actually happens if this slips a week?</b> If the answer is "nothing much", it isn't due, it's scheduled. A list full of fake deadlines trains you to ignore deadlines. Keep real due dates rare, and they'll keep their authority.</p>

<h3>Start dates are the secret weapon against overwhelm</h3>
<p>A task that can't be started for three weeks has no business on your screen today. Giving it a start date removes it from your views until it's relevant, while it stays safely in the store (remember module 1). This is the single most effective way to shrink a list without losing anything. It's the same logic as the mail you deliberately put in a drawer until the right month, which GTD formalises as a tickler file.</p>

<h3>Working backwards from a deadline</h3>
<p>For a project with a real deadline, plan <b>backwards</b>. Take the due date, subtract the effort you think the work needs, then subtract a buffer, and you get the <b>latest sensible start</b>. If that date is already close or past, you've found the real problem early. Tasks inside the project then get scheduled dates in a sensible order, and only the final step carries the true due date.</p>

<h3>Overdue is a decision, not a debt</h3>
<p>Overdue items pile up when you quietly roll them forward every day. Instead, treat each overdue item as a small decision at review time: do it now, reschedule it for a specific day, or drop it deliberately. Rescheduling with a real date is fine. Silently carrying it is the thing that builds guilt.</p>
</div>

<p>Recurring work is the easiest thing in your life to organise, because it's predictable, and the most embarrassing thing to drop, for the same reason. The goal is to make it generate itself, so remembering it isn't a daily act of willpower.</p>

<h3>Make the recurrence create the next one</h3>
<p>When you finish the monthly sales enablement sheet, the system should already have next month's copy waiting. If you have to remember to recreate it, you've merely moved the burden. In a task system this is a <b>recurrence rule</b>: you state the pattern once, and completing the task spawns the next instance with the new dates.</p>

<h3>Fixed schedule or when done?</h3>
<p>There are two honest ways a task can repeat, and choosing the right one matters:</p>
<ul>
<li><b>Fixed schedule:</b> the next one is due on the same calendar pattern no matter when you finished. A monthly report due on the last day of the month. Being late doesn't shift the next deadline.</li>
<li><b>When done:</b> the next one is counted from the day you actually finished. Maintenance jobs like "check backups every 2 weeks". If you're late, the gap doesn't collapse into a pile of catch-up copies.</li>
</ul>
<p>Rule of thumb: if someone external sets the rhythm, use a fixed schedule. If the rhythm is for your own upkeep, use when done.</p>

<h3>Add lead time</h3>
<p>A recurring item with only a due date appears on the day it's due, which is too late. Give it a start date a week or so earlier so it surfaces when you can still prepare. The monthly sheet might be due on the last day of the month, start appearing a week before, and be scheduled for the Monday of that last week.</p>

<h3>Define "done" and keep the record</h3>
<p>You said you need to <i>record</i> the monthly sheet. That's two jobs: do it, and keep proof. Make the output a link on the task or a line in a log, so each completion leaves a trace. The completion date that task systems stamp on finished items already gives you a history for free. For anything with more than three steps, keep a small checklist template note for the job, so you aren't rebuilding the steps from memory each month.</p>

<h3>Recurring is not the same as reactive</h3>
<p>Keep this clean. "Do the sales sheet" recurs on a known date. "Team member is struggling" does not, and trying to force it into a recurrence will give you a lot of empty reminders. The next module deals with that stream properly.</p>
</div>

<template id="t-m7">
<div class="prose">
<p>This is the hardest category for a planner, and your description is honest about why: the team is always either ill, playing up, or needing development, and you never know which. You can't schedule the arrival. What you can schedule is your <b>capacity</b> to deal with it.</p>

<h3>Stop trying to date the undatable</h3>
<p>If you try to track unpredictable work like deadlines, you'll fail, because there's nothing to put in the date field. Switch from tracking <i>when</i> to managing <i>room</i>. The real constraint isn't the date, it's whether you have slack when something lands.</p>

<h3>Four moves that tame a reactive stream</h3>
<ul>
<li><b>Triage at arrival.</b> Give every incoming thing one of four labels within a minute: now (genuinely urgent), today, this week, or just log it. Most things are not "now", and a fast label stops everything feeling equally on fire.</li>
<li><b>Reserve a buffer.</b> Block recurring time in your week that is explicitly for reactive work. If nothing lands, you use it for project work. If something does, you aren't blowing up your plan.</li>
<li><b>Convert the predictable parts into rhythm.</b> "Needs developing" and "needs checking in on" are predictable, even if the exact trigger isn't. Put regular one-to-ones and development sessions on the calendar. This turns a chunk of reactive work into scheduled work, which is far cheaper.</li>
<li><b>Capture to the person, not to the pile.</b> Give each team member a note. Anything about them goes there, in dated entries, with a running "next one-to-one agenda" list at the top. You aren't hunting through your global inbox before a conversation. This is a <b>running agenda</b>, a standard management habit.</li>
</ul>

<h3>Admin and IT: batch them</h3>
<p>Small admin and IT jobs are interrupt-driven and low-value per item. Collect them in one list and process them in a <b>batch</b>, one slot per week or per day, rather than switching to each as it appears. Switching costs more than the tasks themselves. Anything truly blocking (your laptop won't boot) skips the queue; everything else waits for the batch.</p>

<h3>The capacity rule</h3>
<p>If you plan a week to 100% of your hours, any interruption forces something to be dropped, and it will be something important and quiet. A common rule of thumb is to plan around 60 to 70 percent of your time and leave the rest as buffer*. The right figure depends on how reactive your job is, which you can measure: track your reactive hours for two weeks and plan the following month around the real number.</p>
</div>

<p>One page per person at the back of the notebook, with a running agenda written in the margin as things occur. Before each one-to-one, the page is already your agenda. A "waiting for" list on the facing page captures what you've delegated.</p></aside>
<div class="take"><b>Takeaway.</b> Manage reactive work with capacity, not dates: triage on arrival, protect a buffer, convert predictable parts into scheduled rhythm, and keep one running note per person.</div>
</div>
</template>

<!-- ============ MODULE 8 ============ -->
<template id="t-m8">
<div class="prose">
<p>Goals with no date and no deadline are the ones most likely to be abandoned, for a plain reason: nothing forces them. Every other item in your life has a trigger, and the goal has only your good intentions. This module is about giving it a trigger that isn't a fake deadline.</p>

<h3>Give it a slot, not a deadline</h3>
<p>The most reliable way to make progress on an open-ended goal is to give it a <b>recurring time slot</b>: a regular appointment with yourself, such as two sessions of ninety minutes a week. This is sometimes called <b>time blocking</b>. Put it on your calendar as an event, not as a task, because an event is a fixed block that you have to actively cancel, whereas a task can slip silently.</p>

<h3>Define the smallest session</h3>
<p>Every goal needs a <b>minimum viable session</b>: the shortest meaningful amount of work, such as fifteen minutes. On a bad day you do the minimum rather than nothing, which keeps the thread alive. Keep a one-line <b>next step</b> in the goal's note so you can start a session without having to think about what to do.</p>

<h3>Count sessions, not outcomes</h3>
<p>Outcome goals ("be fluent") are out of your direct control and give you nothing to tick. Process goals ("six sessions this month") are fully in your control. Track the process, and let the outcome follow. When you can name an outcome and a date, it has graduated, and you convert it into a project.</p>

<h3>Cap the number</h3>
<p>You can't give ten goals a real slot. Two or three active at once is realistic*, and the rest sit in a "someday" list that you read at your monthly review. If a goal has had no session for a month, make a conscious call: keep it, shrink it, or let it go. Letting go on purpose is a feature, not a failure.</p>

<h3>Protect the slots from the reactive stream</h3>
<p>Your goal slots will be the first thing to be eaten by the buffer from module 7. Two defences help. Put them early in the week, before the reactive load builds. And treat a slot that gets eaten as a trigger to <i>move</i> it to a named alternative time, not to cancel it.</p>
</div>

<!-- ============ MODULE 9 ============ -->
<template id="t-m9">
<div class="prose">
<p>Habits are the one category where the usual task logic works against you. A task is finished and disappears; a habit is never finished, so if you treat it like a task you generate a permanent trail of overdue guilt.</p>

<h3>Habits are not tasks</h3>
<p>Keep habits out of your task system entirely. No due dates, no overdue list, no red badges. A habit gets a light-touch tracker where you can see the shape of the week at a glance, and where missing a day costs nothing but a blank box. This is the same principle as module 2: don't date what isn't dated.</p>

<h3>Anchor, tiny, place</h3>
<p>A habit that depends on remembering is fragile. A habit that attaches to something you already do is sturdy. Build each one from three parts:</p>
<ul>
<li><b>Anchor:</b> an existing routine or event that reliably happens. "When I close my laptop for lunch."</li>
<li><b>Tiny version:</b> the smallest form of the behaviour, small enough to do on your worst day. "Put my shoes on and step outside."</li>
<li><b>Place:</b> where it happens, so the situation itself cues you.</li>
</ul>
<p>Psychologists call the "when X, then Y" form an <b>implementation intention</b>; Peter Gollwitzer's research on these found they improve follow-through compared with vague intentions. Linking a new habit to an existing routine is commonly called <b>habit stacking</b>.</p>

<h3>Design the environment first</h3>
<p>Your water habit is the textbook case. Trying to remember to drink is hard; putting a full bottle on the desk is easy. Reducing <b>friction</b> beats increasing motivation. For the lunchtime walk, the friction is deciding to go and finding your shoes, so leave them by the door and block the time on your calendar so the decision was already made.</p>

<h3>Never miss twice</h3>
<p>One missed day is noise. Two in a row starts a new pattern. The rule "never miss twice" lets you be human, because you aren't aiming at an unbroken streak, only at a quick return. Track "days done this week" rather than a chain, because streaks turn a single slip into a catastrophe and a catastrophe into quitting.</p>

<h3>Add slowly</h3>
<p>Start with one to three habits at a time*. When one is automatic (you'd notice if you skipped it), add the next. A tracker with fifteen habits on day one is another way of building the cathedral.</p>
</div>

<div class="prose">

<p>Keep habits as simple checkboxes in a Habits note or in the daily note, and strictly without due dates so the Tasks plugin never lists them as overdue. If you already have a script that copies ticked habits into the daily note and resets them, that is exactly the right shape: the habit list is a template, and each day gets a fresh set of boxes. Review the weekly count, not the streak.</p></aside>
<aside class="fit paper"><h4>Paper fit</h4>
<p>A habit grid on the monthly page is hard to beat: a row per habit, a column per day, shaded boxes. It's visible every time you open the notebook, and the visual gap-and-fill pattern is more motivating than any app badge.</p></aside>
<div class="take"><b>Takeaway.</b> Keep habits out of the task system. Build each from an anchor, a tiny version and a place, remove friction, never miss twice, and add them slowly.</div>

<!-- ============ MODULE 10 ============ -->
<template id="t-m10">
<div class="prose">
<p>This is the module where the whole thing becomes visible. You've split the kinds of thing, given each a home, and learned what the triggers are. Now you assemble <b>views</b>, the small windows that stop you needing to look at everything.</p>

<h3>The five views you actually need</h3>
<ul>
<li><b>Today:</b> what you'll look at every morning. Calendar events, a few chosen tasks, anything due or scheduled today, and your habit strip.</li>
<li><b>This week:</b> a looser look ahead, mainly for planning and to catch deadlines before they're tomorrow's problem.</li>
<li><b>Projects:</b> only the active ones, each with its single next action. A project with no next action is <b>stalled</b>, and this view is where stalled projects get caught.</li>
<li><b>Waiting and reactive:</b> things delegated or pending on other people, plus your admin and IT batch.</li>
<li><b>Someday and goals:</b> read monthly, not daily.</li>
</ul>

<h3>The Today page recipe</h3>
<p>Today should feel like a short note from a sensible friend, not a ledger. A good composition:</p>
<ul>
<li>Fixed events, from your calendar, because they define the available time.</li>
<li>Up to three <b>must-dos</b>, chosen by you each morning, which is the Eisenhower step from module 4.</li>
<li>Anything scheduled for today or overdue, capped to a small number.</li>
<li>Your reactive buffer, shown as a block rather than a list.</li>
<li>Your one to three habits.</li>
</ul>
<p>The cap is the point. A view without a limit is just the store again.</p>

<h3>Choose, don't be shown</h3>
<p>The most effective morning ritual takes about five minutes: look at the calendar, scan the candidate list, and pick three. The picking is the prioritising. You do it with fresh information, once, and then you stop deciding for the day. People who skip this and just work down a list end up doing whatever is easiest or loudest.</p>

<h3>Views are cheap, so test them</h3>
<p>Because a view is just a query, you can build it in minutes and delete it without losing any data. If a view makes you anxious or you never open it, it's the wrong view, not a character flaw. Change it.</p>
</div>

<!-- ============ MODULE 11 ============ -->
<template id="t-m11">
<div class="prose">
<p>Every system decays unless something maintains it. Reviews are the maintenance, and they're the part most people skip, which is why most systems quietly fall apart around the third week. The good news is that a review is a small, repeatable routine, and you can make it nearly mindless.</p>

<h3>Three rhythms</h3>
<ul>
<li><b>Daily, about five minutes in the morning:</b> glance at the calendar, process the inbox if it's piling up, pick your three. Optionally a two-minute shutdown at the end: tick what's done, and note tomorrow's first move.</li>
<li><b>Weekly, thirty to sixty minutes*:</b> the keystone. David Allen called the weekly review the critical success factor of Getting Things Done. It has three phases, "get clear, get current, get creative".</li>
<li><b>Monthly, about twenty to thirty minutes*:</b> look at areas, goals and the someday list. In the Bullet Journal method this is <b>migration</b>: you go through every open item and consciously move it forward, schedule it, or drop it. Practitioners often report that a surprising share of open items just evaporates at this point, and that's usually a benefit.</li>
</ul>

<h3>What happens in a weekly review</h3>
<ul>
<li><b>Get clear:</b> empty the inboxes, including paper, phone and email. Process them to zero.</li>
<li><b>Get current:</b> look at last week's calendar for loose ends, and next week's for what you need to prepare. Check every active project has a next action. Handle overdue items by deciding, not rolling.</li>
<li><b>Get creative:</b> look at goals and someday ideas, and ask what deserves a slot. Pick next week's projects, within the WIP limit.</li>
</ul>

<h3>A review is not doing</h3>
<p>The temptation in a review is to start doing the tasks you find. Don't. You're servicing the system, not working inside it. Set a timer, and write the findings down as tasks for later.</p>

<h3>A rescue review for bad weeks</h3>
<p>You will miss a weekly review, probably in the very week you need it most. Have a ten-minute fallback ready: clear the inbox, scan the calendar for the next seven days, list overdue items and decide on each, pick your three for tomorrow. That's enough to stop the slide, and it keeps the habit of reviewing alive.</p>

<h3>Why this beats a better app</h3>
<p>A mediocre system with regular reviews will outperform a gorgeous one that nobody maintains. If you take one thing from this whole course, make it the review, because the review is where open loops get closed.</p>
</div>

<!-- ============ MODULE 12 ============ -->
<template id="t-m12">
<div class="prose">
<p>The last module is about the choice you raised yourself: paper or digital, or some mix. The honest answer isn't that one wins. It's that each fails in a predictable way, and a good hybrid uses each where the other is weakest.</p>

<h3>Where each one fails</h3>
<ul>
<li><b>Paper is great at:</b> fast capture, focus with no notifications, the physical feeling of crossing something off.</li>
<li><b>Paper is bad at:</b> searching, recurrence, rearranging, and being lost or damaged.</li>
<li><b>Digital is great at:</b> queries, recurrence, search, backup, links between things.</li>
<li><b>Digital is bad at:</b> its own temptation. The classic trap is <b>system-building as procrastination</b>: hours spent tuning dashboards feel productive and aren't. Complete visibility of everything also feeds the overwhelm we started with.</li>
</ul>

<h3>Three workable hybrids</h3>
<ul>
<li><b>Paper day, digital store:</b> capture and plan the day on paper, then keep projects, recurrence and records in Obsidian. A weekly step moves what matters from the page into the vault.</li>
<li><b>Digital everything, paper for the week:</b> Obsidian is the system, but you hand-draw the weekly plan on paper and look at that, not the screen.</li>
<li><b>Minimal digital:</b> one inbox note, one Today view, one weekly review. Paper optional.</li>
</ul>

<h3>The bridge from paper to vault</h3>
<p>The hybrid lives or dies on a cheap bridge. The simplest is to photograph the day's page and put the image into that day's note, then process anything actionable during your daily or weekly review. The photo is the capture; the processing is the triage from module 3. If you already have a way of turning a photo of a page into text and tasks, that is the bridge, and you should lean on it instead of hand-typing.</p>

<h3>Two guard rails against over-building</h3>
<ul>
<li><b>A setup budget:</b> cap tinkering at a small fixed slot per week, say thirty minutes*, and keep it separate from real work.</li>
<li><b>A freeze period:</b> after you set up, change nothing for four weeks. You can't judge a system you keep rebuilding.</li>
</ul>

<h3>The minimum viable system</h3>
<p>Everything in this course reduces to three things you can start with tomorrow:</p>
<ul>
<li>One inbox, emptied daily.</li>
<li>One Today view, capped, chosen each morning.</li>
<li>One weekly review, with a ten-minute rescue version.</li>
</ul>
<p>Add the rest one piece at a time, only when you feel its absence: recurrence first, then people notes, then goal slots, then habits.</p>
</div>

/* ---------- audio / read aloud ---------- */
let curAudio=null;
function stopAudio(){try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function moduleText(root,title){
  const out=[title+'.'];
  $$('h3,p,li',root).forEach(n=>{
    if(n.closest('pre,.activity,.audio,footer,.nospeak'))return;
    const t=n.textContent.replace(/\s+/g,' ').trim();
    if(t)out.push(t.endsWith('.')||t.endsWith('?')||t.endsWith(':')?t:t+'.');
  });
  return out;
}
function chunk(lines){
  const out=[];
  lines.forEach(l=>{
    const parts=l.match(/[^.!?]+[.!?]*\s*/g)||[l];
    let cur='';
    parts.forEach(p=>{if((cur+p).length>220){if(cur)out.push(cur);cur=p}else cur+=p});
    if(cur)out.push(cur);
  });
  return out;
}
function audioBar(n,root,title){
  const bar=document.createElement('div');bar.className='audio';
  bar.innerHTML='<button class="primary small" data-a="pod">▶ Podcast version</button><button class="small" data-a="tts">🔊 Read aloud (device voice)</button><button class="small" data-a="stop" hidden>■ Stop</button><div class="msg"></div>';
  const msg=$('.msg',bar),stopB=$('[data-a=stop]',bar);
  const setMsg=t=>msg.textContent=t;
  $('[data-a=pod]',bar).onclick=()=>{
    stopAudio();
    const a=new Audio('audio/m'+String(n).padStart(2,'0')+'.mp3');
    curAudio=a;setMsg('Loading…');
    a.addEventListener('error',()=>{setMsg('The podcast audio has not been rendered yet. Try the device voice for now.');stopB.hidden=true});
    a.addEventListener('playing',()=>{setMsg('Playing the two-host version.');stopB.hidden=false});
    a.addEventListener('ended',()=>{stopB.hidden=true;setMsg('')});
    a.play().catch(()=>{});
  };
  $('[data-a=tts]',bar).onclick=()=>{
    stopAudio();
    if(!('speechSynthesis' in window)){setMsg('This viewer has no built-in voice.');return}
    const parts=chunk(moduleText(root,title));
    const voices=speechSynthesis.getVoices();
    const v=voices.find(x=>/en-GB/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));
    let i=0;
    const next=()=>{
      if(i>=parts.length){stopB.hidden=true;setMsg('');return}
      const u=new SpeechSynthesisUtterance(parts[i++]);
      if(v)u.voice=v;u.rate=0.98;u.onend=next;u.onerror=()=>{stopB.hidden=true};
      speechSynthesis.speak(u);
    };
    stopB.hidden=false;setMsg('Reading with your device voice. This is a stand-in until the natural voices are approved.');
    next();
  };
  stopB.onclick=()=>{stopAudio();stopB.hidden=true;setMsg('Stopped.')};
  return bar;
}

/* 1: shrink the pile */
function act1(r){
  const st=A(1);st.f=st.f||{};
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const types=['proj','task','task','task','rec','react','goal','hab','hab'];
  const items=[];
  for(let i=0;i<60;i++){
    const type=types[Math.floor(rnd()*types.length)];
    items.push({type,startIn:rnd()<0.45?Math.floor(rnd()*28)+2:0,dueIn:(type==='proj'||type==='task'||type==='rec')?Math.floor(rnd()*40):null,
      imp:rnd()<0.3,active:rnd()<0.4});
  }
  const F=[
   ['start','Hide what hasn’t started yet (start dates)',x=>x.startIn===0],
   ['own','Move habits and goals to their own tracker',x=>x.type!=='hab'&&x.type!=='goal'],
   ['act','Only work from active projects (a WIP limit)',x=>!(x.type==='proj'||x.type==='task')||x.active],
   ['soon','Only what is due within a week, or genuinely important',x=>x.imp||(x.dueIn!==null&&x.dueIn<=7)],
  ];
  function draw(){
    let vis=items.slice();
    F.forEach(([k,,fn])=>{if(st.f[k])vis=vis.filter(fn)});
    if(st.f.cap){vis=vis.slice().sort((a,b)=>(b.imp-a.imp)||((a.dueIn??99)-(b.dueIn??99))).slice(0,5)}
    const set=new Set(vis);
    r.innerHTML=`<div class="dots">${items.map(x=>`<i class="${set.has(x)?'':'off'}"></i>`).join('')}</div>
    <p><b>${vis.length}</b> of 60 visible.</p>
    ${F.map(([k,l])=>`<label class="f"><input type="checkbox" data-k="${k}" ${st.f[k]?'checked':''}>${l}</label>`).join('')}
    <label class="f"><input type="checkbox" data-k="cap" ${st.f.cap?'checked':''}>Cap the view at five items (your Today list)</label>
    <p class="fb">${vis.length>12?'Still a lot to look at. Try more filters.':vis.length>5?'Getting calmer.':'That is a view you can act on. The other '+(60-vis.length)+' are still stored, just not in your face.'}</p>`;
    $$('input',r).forEach(c=>c.onchange=()=>{st.f[c.dataset.k]=c.checked;save();draw()});
  }
  draw();
}

/* 3: brain dump + triage */
function act3(r){

  let timer=null,secs=300;
  const D=[['trash','Trash'],['ref','Reference'],['some','Someday'],['now','Do now (under 2 min)'],['task','Task'],['proj','Project']];

      r.innerHTML=`<textarea id="t" placeholder="One thing per line. Work stuff, home stuff, worries, ideas. Don't judge.">${esc(st.text)}</textarea>

      if(g('ref').length)md.push('## Reference',...g('ref').map(t=>'- '+t),'');

      const un=st.items.filter(x=>!x.d).length;
      r.innerHTML=`<table><tr><td>Trashed</td><td>${g('trash').length}</td><td>Done on the spot</td><td>${g('now').length}</td></tr>
      <tr><td>Tasks</td><td>${g('task').length}</td><td>Projects</td><td>${g('proj').length}</td></tr>
      <tr><td>Someday</td><td>${g('some').length}</td><td>Reference</td><td>${g('ref').length}</td></tr></table>

/* 6: recurrence builder */
function act6(r){
  const st=A(6);
  const today=new Date();today.setHours(12,0,0,0);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const lastDay=(y,m)=>new Date(y,m+1,0,12);
  const def={name:'Sales enablement sheet',pat:'month',n:1,on:'last',wd:'Friday',when:false,lead:7,late:5,due:iso(lastDay(today.getFullYear(),today.getMonth()))};
  Object.keys(def).forEach(k=>{if(st[k]==null)st[k]=def[k]});
  const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function rule(){
    const n=+st.n||1;
    let s;
    if(st.pat==='day')s=n>1?`every ${n} days`:'every day';
    else if(st.pat==='weekday')s='every weekday';
    else if(st.pat==='week')s=(n>1?`every ${n} weeks`:'every week')+(st.when?'':` on ${st.wd}`);
    else if(st.pat==='month')s=(n>1?`every ${n} months`:'every month')+(st.when||st.on==='same'?'':st.on==='last'?' on the last':` on the ${st.on}`);
    else s=n>1?`every ${n} years`:'every year';
    return s;
  }
  function addMonths(d,k,on){
    const y=d.getFullYear(),m=d.getMonth()+k;
    if(on==='last')return lastDay(y,m);
    const day=on==='1st'?1:on==='15th'?15:d.getDate();
    const ld=lastDay(y,m).getDate();
    return new Date(y,m,Math.min(day,ld),12);
  }
  function next(d,from){
    const n=+st.n||1;const x=new Date(from||d);
    if(st.pat==='day'){x.setDate(x.getDate()+n);return x}
    if(st.pat==='weekday'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6);return x}
    if(st.pat==='week'){const target=WD.indexOf(st.wd);x.setDate(x.getDate()+7*(n-1)+1);while(x.getDay()!==target)x.setDate(x.getDate()+1);return x}
    if(st.pat==='month')return addMonths(x,n,st.on);
    x.setFullYear(x.getFullYear()+n);return x;
  }
  function nextWD(fin){
    const n=+st.n||1;const x=new Date(fin);
    if(st.pat==='day'){x.setDate(x.getDate()+n)}
    else if(st.pat==='weekday'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
    else if(st.pat==='week'){x.setDate(x.getDate()+7*n)}
    else if(st.pat==='month'){return addMonths(x,n,'same')}
    else x.setFullYear(x.getFullYear()+n);
    return x;
  }
  function draw(){
    const due=new Date(st.due+'T12:00:00');
    const valid=!isNaN(due);
    const R=rule()+(st.when?' when done':'');
    let startS='';
    if(valid){const s=new Date(due);s.setDate(s.getDate()-(+st.lead||0));startS=iso(s)}
    const line=`- [ ] ${st.name||'Task'} 🔁 ${R}${valid&&st.lead>0?' 🛫 '+startS:''}${valid?' 📅 '+st.due:''}`;
    let list=[];
    if(valid){let c=due;for(let i=0;i<4;i++){c=next(due,c);list.push(iso(c))}}
    let wd='';
    if(valid){const fin=new Date(due);fin.setDate(fin.getDate()+(+st.late||0));wd=iso(nextWD(fin))}
    r.innerHTML=`<label class="f" style="display:block">Task name<input type="text" id="nm" value="${esc(st.name)}"></label>
    <div class="row"><select id="pat" style="flex:1">${[['day','Every N days'],['weekday','Every weekday'],['week','Every N weeks'],['month','Every N months'],['year','Every N years']].map(o=>`<option value="${o[0]}" ${st.pat===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
    <label class="muted">N <input type="number" id="n" min="1" max="12" value="${st.n}" style="width:70px"></label></div>
    ${st.pat==='month'?`<label class="f" style="display:block">Which day<select id="on">${[['same','Same date as the due date'],['last','The last day'],['1st','The 1st'],['15th','The 15th']].map(o=>`<option value="${o[0]}" ${st.on===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>`:''}
    ${st.pat==='week'?`<label class="f" style="display:block">On<select id="wd">${WD.map(w=>`<option ${st.wd===w?'selected':''}>${w}</option>`).join('')}</select></label>`:''}
    <div class="row"><label class="muted">Next due date<input type="text" id="due" value="${esc(st.due)}" placeholder="YYYY-MM-DD" style="width:140px"></label>
    <label class="muted">Appears (days early)<input type="number" id="lead" min="0" max="60" value="${st.lead}" style="width:90px"></label></div>
    <label class="f"><input type="checkbox" id="wh" ${st.when?'checked':''}> Count from when I finish (“when done”)</label>
    <h4>Line for your note</h4><pre class="nospeak">${esc(line)}</pre>
    <div class="row"><button class="primary small" id="cp">Copy</button></div>
    ${valid?`<h4>Next four due dates (fixed schedule)</h4><p>${list.join(' · ')} <span class="muted">(approximate; the plugin has its own rules for awkward month-ends)</span></p>
    <label class="f" style="display:block">If I finish it this many days late<input type="number" id="late" min="0" max="60" value="${st.late}" style="width:90px"></label>
    <div class="fb">Fixed schedule: the next one is still due <b>${list[0]}</b>.<br>When done: the next one would be due <b>${wd}</b>, counted from the day you actually finished.</div>`:'<p class="warn">Enter the due date as YYYY-MM-DD.</p>'}${st.when&&(st.pat==='week'||(st.pat==='month'&&st.on!=='same'))?'<p class="hint">With “when done” the fixed-day part is dropped, because the next date is counted from your finish day.</p>':''}`;
    const bind=(id,fn)=>{const e=$('#'+id,r);if(e)e.onchange=()=>{fn(e);save();draw()}};
    bind('nm',e=>st.name=e.value);bind('pat',e=>st.pat=e.value);bind('n',e=>st.n=Math.max(1,+e.value||1));bind('on',e=>st.on=e.value);bind('wd',e=>st.wd=e.value);
    bind('due',e=>st.due=e.value.trim());bind('lead',e=>st.lead=Math.max(0,+e.value||0));bind('wh',e=>st.when=e.checked);bind('late',e=>st.late=Math.max(0,+e.value||0));
    $('#cp',r).onclick=e=>copyText(line,e.target);
  }
  draw();
}

           ['Get creative',['Review goals and someday list: does anything deserve a slot?','Choose next week’s active projects (within the WIP limit)','Block goal slots, buffer and the next review in the calendar','Note one thing that worked and one that didn’t']]];
  const RES=['Clear the inbox','Scan the next seven days of calendar','Decide on each overdue item','Pick the three for tomorrow'];
  let secs=st.secs||0,timer=null,rescue=!!st.rescue;
  function draw(){
    const list=rescue?[['Rescue review (ten minutes)',RES]]:P;
    let n=0,d=0;list.forEach(([,it],pi)=>it.forEach((_,i)=>{n++;if(st.c[(rescue?'r':'p')+pi+'-'+i])d++}));
    r.innerHTML=`<p class="muted">Week ${wk}. ${d} of ${n} done.</p>
    <div class="row"><button class="small" id="tm">${timer?'Pause timer':'Start timer'}</button><span id="tv" class="muted">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span>
    <button class="small" id="rsc">${rescue?'Full review':'Rescue version'}</button></div>
    ${list.map(([ph,it],pi)=>`<h4>${ph}</h4>${it.map((t,i)=>{const k=(rescue?'r':'p')+pi+'-'+i;return `<label class="f"><input type="checkbox" data-k="${k}" ${st.c[k]?'checked':''}>${esc(t)}</label>`}).join('')}`).join('')}
    <div class="fb">${d===n?'Review done. Close the notebook and stop; do not start doing the tasks you found.':'Services the system, not the tasks. If you find a task, write it down and move on.'}</div>
    <button class="small" id="rs">Reset this week</button>`;
    $$('input[type=checkbox]',r).forEach(c=>c.onchange=()=>{st.c[c.dataset.k]=c.checked;save();draw()});
    $('#tm',r).onclick=()=>{if(timer){clearInterval(timer);timer=null;st.secs=secs;save();draw()}else{timer=setInterval(()=>{secs++;const v=$('#tv',r);if(!v){clearInterval(timer);return}v.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')},1000);draw()}};
    $('#rsc',r).onclick=()=>{clearInterval(timer);timer=null;rescue=!rescue;st.rescue=rescue;save();draw()};
    $('#rs',r).onclick=()=>{clearInterval(timer);timer=null;st.c={};secs=0;st.secs=0;save();draw()};
  }
  draw();
}

/* 12: blueprint */
function act12(r){
  const st=A(12);st.q=st.q||{};
  const Q=[
   ['q1','Where do ideas hit you first?',[['paper','Paper'],['phone','Phone or computer'],['either','Whichever is nearest']]],
   ['q2','When you build a digital system, you usually…',[['tinker','Tinker for hours, then drift away'],['simple','Keep it simple and use it']]],
   ['q3','How often do you need to search old notes?',[['often','Often'],['rare','Rarely']]],
   ['q4','Recurring jobs (monthly reports and so on)…',[['forget','I forget them too often'],['ok','I mostly remember']]],
   ['q5','Is planning away from a screen valuable to you?',[['yes','Yes'],['no','Not really']]]
  ];
  function draw(){
    const q=st.q;const all=Q.every(x=>q[x[0]]);
    let out='';
    if(all){
      let p=0,d=0;
      if(q.q1==='paper')p+=2;if(q.q1==='phone')d+=2;
      if(q.q2==='tinker')p+=2;
      if(q.q3==='often')d+=1;if(q.q4==='forget')d+=1;
      if(q.q5==='yes')p+=1;else d+=1;
      const hy=p>=d+2?['Paper day, digital store','Capture and plan your day on paper. Keep projects, recurrence and records in Obsidian, and move things across at the weekly review.']:
               d>=p+2?['Digital, with paper for the week','Run everything in Obsidian, but hand-draw the weekly plan on paper and look at that, not the screen.']:
               ['Balanced hybrid','Paper for the daily page and fast capture; Obsidian for projects, recurrence, people and goals; a photo of the page in the daily note is the bridge.'];
      const hab=A(9).sentence;
      out=`# My blueprint\n\n**Shape:** ${hy[0]}\n${hy[1]}\n\n## Minimum viable system (start here)\n- One inbox, emptied daily\n- One Today view, capped, with three chosen each morning\n- One weekly review, with a ten-minute rescue version\n\n## Four-week rollout\n- Week 1: inbox and the daily pick-three. Nothing else.\n- Week 2: weekly review, plus active projects with a WIP limit of 2 or 3.\n- Week 3: recurring tasks with start dates, plus one note per team member.\n- Week 4: goal slots on the calendar, plus one habit card${hab?' ('+hab+')':''}.\n- After week 4: freeze the system for four weeks. Setup budget: about 30 minutes a week*.\n\n## Starting vault structure\n- Inbox note\n- Projects/ (status and importance properties)\n- Areas/ (Team, Goals)\n- People/\n- Habits note\n- Daily notes with the Today query in the template\n- Weekly review template\n- Plugins: Tasks first, Dataview second, nothing else until missed`;
    }
    r.innerHTML=Q.map(([k,t,o])=>`<h4>${t}</h4><div class="cards">${o.map(a=>`<span class="chip ${q[k]===a[0]?'sel':''}" data-k="${k}" data-v="${a[0]}">${a[1]}</span>`).join('')}</div>`).join('')+
    (all?`<h4>Your blueprint</h4><pre class="nospeak" style="white-space:pre-wrap">${esc(out)}</pre><div class="row"><button class="primary small" id="cp">Copy</button></div>`:'<p class="hint">Answer all five to see your blueprint.</p>')+
    '<div class="row"><button class="small" id="rs">Reset answers</button></div>';
    $$('.chip',r).forEach(c=>c.onclick=()=>{q[c.dataset.k]=c.dataset.v;save();draw()});
    if(all)$('#cp',r).onclick=e=>copyText(out,e.target);
    $('#rs',r).onclick=()=>{st.q={};save();draw()};
  }
  draw();
}


/* ---------- offline audio, update check, service worker, full screen on first tap ---------- */
async function saveAudio(){
  const msg=$('#audMsg'),btn=$('#saveAud');
  if(!('caches' in window)){msg.textContent='This browser cannot store audio offline.';return}
  btn.disabled=true;
  try{
    const c=await caches.open('olaudio-v1');let done=0;
    for(let n=1;n<=12;n++){
      const u='audio/m'+String(n).padStart(2,'0')+'.mp3';
      if(!(await c.match(u))){const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);await c.put(u,r)}
      done++;msg.textContent=done+' of 12 saved…';
    }
    msg.textContent='All 12 saved on this device.';
  }catch(e){msg.textContent='Stopped: check your connection and tap again.'}
  btn.disabled=false;
}
async function checkUpdate(){
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),8000);
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store',signal:ac.signal});clearTimeout(to);
    if(!r.ok)return;
    const m=/const VERSION='([^']+)'/.exec(await r.text());
    if(m&&m[1]!==VERSION){
      $('#upd').innerHTML='<div class="card" style="margin:8px 12px"><b>New version v'+esc(m[1])+' available.</b> <button class="primary small" id="updB">Update now</button></div>';
      $('#updB').onclick=()=>{location.href=location.pathname+'?v='+encodeURIComponent(m[1])};
    }
  }catch(e){}
}
checkUpdate();setInterval(checkUpdate,5*60*1000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',function once(e){
  document.removeEventListener('click',once,true);
  if(e.target.closest&&e.target.closest('#clearBtn,#clrYes'))return;
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){const p=document.documentElement.requestFullscreen({navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}}catch(x){}
},true);

render();
</script>
