<title>Magic Duel</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#10151f; --panel:#161c2a; --panel2:#1e2638; --line:#2c3852; --text:#e9edf7; --muted:#8f9bb6;
  --gold:#e3b95a; --gold2:#a8802f; --good:#46c47c; --bad:#e8584f; --info:#5aa7f0;
  --W:#f4edcf; --U:#2f80d8; --B:#6a5a78; --R:#d9553f; --G:#3fa564; --C:#a9a9b3;
  --cw:clamp(50px,17vw,74px); --hw:clamp(60px,19vw,86px);
  color-scheme:dark;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){ :root{ } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;overflow:hidden;padding-top:var(--safe-t)}
.screen.active{display:flex;flex-direction:column}
.hidden{display:none!important}
h1,h2,h3{margin:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- menu ---------- */
.menu-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;background:radial-gradient(120% 80% at 50% 0%,#1b2540 0%,#0b0e14 60%)}
.logo{font-size:38px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.05;color:var(--gold);text-shadow:0 2px 18px rgba(227,185,90,.35)}
.logo small{display:block;font-size:13px;font-weight:600;letter-spacing:3px;color:var(--muted);margin-top:6px;text-transform:uppercase}
.mana-row{display:flex;gap:8px;margin-bottom:6px}
.mana-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.btn{display:block;width:100%;max-width:340px;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:17px;font-weight:600;text-align:center}
.btn:active{transform:scale(.98);filter:brightness(1.15)}
.btn.primary,.primary{background:linear-gradient(180deg,#f0cb71,#c99732);color:#1b1405;border-color:#f3d789;font-weight:800}
.btn.ghost{background:transparent}
.btn.small{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;max-width:none;display:inline-block}
.btn[disabled]{opacity:.4;pointer-events:none}
.menu-sub{color:var(--muted);font-size:13px;text-align:center;max-width:320px;line-height:1.4}
.record{color:var(--muted);font-size:13px}

/* ---------- generic screen header ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.topbar h2{font-size:18px;flex:1}
.back{background:none;border:none;font-size:22px;padding:4px 8px}
.pad{padding:14px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--gold2)}
.deckcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.deckcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(227,185,90,.15)}
.deckcard .row{display:flex;align-items:center;gap:8px}
.deckcard h3{font-size:16px;flex:1}
.deckcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.deckcard .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pips{display:flex;gap:4px}
.pip{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:inline-block}
.pip.W{background:var(--W)}.pip.U{background:var(--U)}.pip.B{background:var(--B)}.pip.R{background:var(--R)}.pip.G{background:var(--G)}.pip.C{background:var(--C)}
.packgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.packgrid .deckcard{margin:0}
.bottombar{padding:12px;border-top:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:8px;padding-bottom:calc(12px + var(--safe-b))}
.field-row{display:flex;gap:10px;align-items:center;font-size:14px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;flex:1}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.lesson h3{font-size:15px;color:var(--gold);margin-bottom:4px}
.lesson p{margin:0;font-size:14px;line-height:1.45;color:#cdd5e8}

/* ---------- game layout ---------- */
#screen-game{display:none;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto auto auto auto;background:radial-gradient(130% 60% at 50% 50%,#141c2e 0%,#0b0e14 70%)}
#screen-game.active{display:grid}
.pbar{display:flex;align-items:center;gap:10px;padding:5px 10px;background:rgba(10,13,20,.85);border-bottom:1px solid var(--line);font-size:13px;min-height:38px}
.pbar.me{border-top:1px solid var(--line);border-bottom:none}
.pbar .name{font-weight:700;flex:0 1 auto;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.life{font-size:20px;font-weight:800;color:#ff8f86;min-width:62px;position:relative;cursor:pointer;padding:0 6px;border-radius:8px}
.life.up{color:#7be3a4}
.life.legal,.pbar.legal{outline:2px solid var(--gold);animation:pulse 1s infinite}
.stat{color:var(--muted);display:flex;align-items:center;gap:3px;white-space:nowrap;cursor:default}
.stat b{color:var(--text)}
.stat.link{cursor:pointer;text-decoration:underline dotted}
.manaline{margin-left:auto;display:flex;gap:4px;align-items:center}
.mchip{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;border-radius:99px;padding:1px 7px 1px 3px;background:rgba(255,255,255,.07)}
.mchip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
.field{padding:6px 6px 4px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;min-height:0;position:relative}
.perms{display:flex;flex-wrap:wrap;gap:6px 5px;align-content:flex-start;justify-content:center;min-height:calc(var(--cw)*1.4)}
.lands{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:26px}
#oppField{background:linear-gradient(180deg,rgba(80,30,30,.12),transparent)}
#myField{background:linear-gradient(0deg,rgba(30,60,90,.14),transparent)}
#midBar{display:flex;flex-direction:column;gap:4px;padding:4px 8px;background:rgba(10,13,20,.8);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#phases{display:flex;gap:3px;align-items:center;justify-content:center;font-size:10.5px;white-space:nowrap}
.ph{white-space:nowrap;padding:3px 7px;border-radius:99px;color:var(--muted);border:1px solid transparent}
.ph.cur{background:var(--gold);color:#1b1405;font-weight:800}
.turnlbl{white-space:nowrap;font-weight:800;font-size:10.5px;margin-right:4px;padding:3px 8px;border-radius:99px;background:var(--panel2)}
.turnlbl.mine{color:#7be3a4}.turnlbl.theirs{color:#ff8f86}
#stackBox{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
#stackBox:empty{display:none}
.sitem{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--gold2);font-size:12px;max-width:80%}
.sitem.theirs{border-color:#a04a44}.sitem.legal{outline:2px solid var(--gold);animation:pulse 1s infinite}
.sitem b{color:var(--gold)}

/* ---------- cards ---------- */
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:6px;flex:0 0 auto;transition:transform .18s,filter .2s,box-shadow .2s,opacity .2s;background:#222;box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:pointer;overflow:visible}
.card .art,.card .face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:6px}
.card .art{object-fit:cover;opacity:0;transition:opacity .25s}
.card.has-art .art{opacity:1}
.card.has-art .face{opacity:0}
.face{display:flex;flex-direction:column;padding:3px 4px;border:2px solid #000;background:linear-gradient(160deg,var(--f1,#555),var(--f2,#222));font-size:clamp(7px,2.2vw,9px);line-height:1.1;overflow:hidden;color:#fff;transition:opacity .25s}
.face .fname{font-weight:800;font-size:1.1em;text-shadow:0 1px 2px #000}
.face .fcost{font-size:.9em;opacity:.9;margin:1px 0}
.face .ftype{font-size:.85em;opacity:.8;font-style:italic}
.face .ftext{margin-top:2px;font-size:.85em;opacity:.95;flex:1;overflow:hidden}
.face.W{--f1:#8a8467;--f2:#4a4733}.face.U{--f1:#1d5aa8;--f2:#0f2c55}.face.B{--f1:#4a3d58;--f2:#17121c}.face.R{--f1:#a63a27;--f2:#4a1810}.face.G{--f1:#2a7a46;--f2:#10351e}.face.M{--f1:#a08a3a;--f2:#4b3d12}.face.A{--f1:#7a7f88;--f2:#363a40}.face.L{--f1:#7a6748;--f2:#3a2f1c}
.face.token{border-style:dashed}
.card .badge{position:absolute;font-weight:800;font-size:clamp(9px,2.8vw,12px);line-height:1;padding:2px 4px;border-radius:5px;background:rgba(0,0,0,.82);color:#fff;border:1px solid rgba(255,255,255,.3);pointer-events:none;z-index:2}
.card .pt{right:-2px;bottom:-3px}
.card .pt.buff{color:#7cf0a5}.card .pt.nerf{color:#ff8f86}.card .pt.dmg{background:#7a1f1a}
.card .cnt{left:-2px;top:-2px;background:#6b4aa8}
.card .zz{position:absolute;left:2px;bottom:2px;font-size:11px;z-index:2;pointer-events:none;filter:drop-shadow(0 0 2px #000)}
.card .mark{position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:8px;pointer-events:none;z-index:1}
.card.tapped{transform:rotate(90deg);margin:calc(var(--cw)*.2) calc(var(--cw)*.2)}
.card.attached{margin-left:calc(var(--cw)*-.55);transform:translateY(-6px) scale(.8);z-index:0}
.card.legal .mark{box-shadow:0 0 0 3px var(--gold),0 0 14px 2px var(--gold);animation:pulse 1s infinite}
.card.rec .mark{box-shadow:0 0 0 3px #7be3a4,0 0 12px 2px rgba(123,227,164,.8)}
.card.sel .mark{box-shadow:0 0 0 3px #5aa7f0,0 0 14px 2px #5aa7f0}
.card.atk .mark{box-shadow:0 0 0 3px #ff8f86,0 0 14px 2px #e8584f}
.card.canact .mark{box-shadow:0 0 0 2px rgba(227,185,90,.7)}
.card.dim{filter:grayscale(.6) brightness(.6)}
.card.attacking{transform:translateY(-8px)}
.card.attacking.tapped{transform:rotate(90deg) translateX(-8px)}
.card .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:#e8584f;color:#fff;border-radius:99px;padding:1px 6px;z-index:3;white-space:nowrap;pointer-events:none}
.card .tag.blk{background:#2f80d8}
.land{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#111;cursor:pointer;transition:opacity .2s,transform .2s}
.land.W{background:var(--W)}.land.U{background:var(--U);color:#fff}.land.B{background:var(--B);color:#fff}.land.R{background:var(--R);color:#fff}.land.G{background:var(--G);color:#fff}.land.C,.land.X{background:var(--C)}
.land.D{background:linear-gradient(135deg,var(--d1) 50%,var(--d2) 50%);color:#fff;text-shadow:0 0 3px #000}
.land.tapped{opacity:.35;transform:rotate(90deg) scale(.9)}
#handWrap{background:rgba(8,10,16,.9);border-top:1px solid var(--line);padding:8px 6px 4px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#hand{display:flex;gap:4px;min-height:calc(var(--hw)*1.4 + 10px);width:max-content;min-width:100%;justify-content:center;padding:10px 8px 0}
#hand .card{width:var(--hw);height:calc(var(--hw)*1.4)}
#hand .card .face{font-size:clamp(8px,2.6vw,10px)}
#hand .card.castable{box-shadow:0 0 0 2px rgba(70,196,124,.8),0 2px 8px rgba(0,0,0,.6)}
#hand .card.unplayable{filter:brightness(.62)}
#hand .card.rec{transform:translateY(-8px)}
#actionBar{display:flex;align-items:center;gap:6px;padding:6px 8px calc(6px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--line)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:19px;flex:0 0 auto;padding:0}
#coachLine{flex:1;min-width:0;font-size:12px;line-height:1.25;color:#cfe6d8;padding:2px 4px;max-height:44px;overflow:hidden;cursor:pointer}
#coachLine b{color:#7be3a4}
#btnMain{flex:0 0 auto;min-width:104px;height:44px;border-radius:12px;padding:0 14px;font-size:15px;border:1px solid #f3d789}
#btnMain[disabled]{opacity:.45}
#promptBar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2a2410;border-top:1px solid var(--gold2);font-size:13px}
#promptBar .ptxt{flex:1;line-height:1.3}
#promptBar button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:13px}
#promptBar button.go{background:var(--gold);color:#1b1405;border-color:#f3d789}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;padding:14px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.78) 20%,rgba(0,0,0,.78) 80%,transparent);color:var(--gold);z-index:20;pointer-events:none;animation:banner 1.3s ease both}
#banner.theirs{color:#ff8f86}
@keyframes banner{0%{opacity:0;transform:scale(.9)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes pulse{50%{filter:brightness(1.5)}}
.float{position:absolute;font-weight:900;font-size:24px;pointer-events:none;z-index:30;text-shadow:0 2px 6px #000;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}

/* ---------- modals ---------- */
#modal-root{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:50}
.modal{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(3,5,10,.74);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fadein .15s}
.modal.center{align-items:center}
@keyframes fadein{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slide .2s ease-out;padding-bottom:var(--safe-b)}
.modal.center .sheet{border-radius:18px;max-width:92vw}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet header{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sheet header h3{flex:1;font-size:16px}
.sheet .body{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet footer{padding:10px 14px;display:flex;gap:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet footer .btn{flex:1;max-width:none;padding:12px;font-size:15px;min-width:110px}
.xbtn{background:none;border:none;font-size:22px;color:var(--muted)}
.inspect{display:flex;gap:12px}
.inspect .big{width:min(46vw,220px);height:calc(min(46vw,220px)*1.4);flex:0 0 auto;position:relative;border-radius:10px}
.inspect .big .card{width:100%;height:100%;--cw:min(46vw,220px);cursor:default}
.inspect .big .face{font-size:clamp(9px,2.9vw,13px);padding:6px}
.inspect .info{flex:1;min-width:0;font-size:13px;line-height:1.4}
.inspect .info h4{margin:0 0 2px;font-size:16px}
.inspect .typeline{color:var(--muted);margin-bottom:6px}
.inspect .rules{color:#dfe6f7;white-space:pre-wrap}
.status{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.status span{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.abtn{display:block;width:100%;text-align:left;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.abtn:disabled{opacity:.4}
.abtn small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.cardgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cardgrid .card{--cw:clamp(64px,22vw,96px)}
.cardgrid .card.chosen .mark{box-shadow:0 0 0 3px var(--gold),0 0 12px var(--gold)}
.cardgrid .card.chosen{transform:translateY(-6px)}
.row2{display:flex;gap:8px;align-items:center}
.coach{font-size:14px;line-height:1.45}
.coach .head{font-size:17px;font-weight:800;color:#7be3a4;margin-bottom:6px}
.coach .state{color:var(--muted);font-size:12px;margin-bottom:8px}
.coach .item{background:var(--panel2);border:1px solid var(--line);border-left:3px solid #7be3a4;border-radius:10px;padding:8px 10px;margin:6px 0}
.coach .item b{display:block}
.coach .item span{color:#cdd5e8;font-size:13px}
.coach .lessonbox{background:#1f2a18;border:1px solid #3d5a2a;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.coach .lessonbox b{color:#b8e68f}
.coach .alts{color:var(--muted);font-size:12.5px}
.coach .alts li{margin:3px 0}
.coach .fb{border-left-color:var(--gold)}
.logline{font-size:12.5px;padding:2px 0;color:#cdd5e8;border-bottom:1px solid rgba(255,255,255,.04)}
.logline.turn{color:var(--gold);font-weight:700;margin-top:6px}
.bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--good)}
.review .tr{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.review .tr span:first-child{width:28px;color:var(--muted)}
.review .tr .bar{flex:1}
.tick{display:inline-block;width:18px;text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.switch{width:46px;height:26px;border-radius:99px;background:#39435a;position:relative;border:none;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--good)}.switch.on::after{left:23px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(20,26,40,.96);border:1px solid var(--gold2);padding:10px 14px;border-radius:12px;font-size:13px;z-index:80;max-width:88vw;text-align:center;line-height:1.35}
.big-x{font-size:30px;text-align:center;font-weight:800;margin:10px 0}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper button{width:52px;height:52px;border-radius:50%;font-size:26px;border:1px solid var(--line);background:var(--panel2)}
@media (orientation:landscape) and (max-height:520px){
  :root{--cw:clamp(40px,8vw,56px);--hw:clamp(50px,9vw,70px)}
  .pbar{min-height:30px;padding:2px 8px}
  #coachLine{display:none}
}

html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
</style>

<div id="app">
  <section id="screen-menu" class="screen active"></section>
  <section id="screen-decks" class="screen"></section>
  <section id="screen-guide" class="screen"></section>
  <section id="screen-game" class="screen">
    <div id="oppBar" class="pbar opp"></div>
    <div id="oppField" class="field"><div id="oppPerms" class="perms"></div><div id="oppLands" class="lands"></div></div>
    <div id="midBar"><div id="phases"></div><div id="stackBox"></div></div>
    <div id="myField" class="field"><div id="myPerms" class="perms"></div><div id="myLands" class="lands"></div></div>
    <div id="myBar" class="pbar me"></div>
    <div id="promptBar" class="hidden"></div>
    <div id="handWrap"><div id="hand"></div></div>
    <div id="actionBar">
      <button id="btnCoach" class="iconbtn" title="Coach">💡</button>
      <div id="coachLine"></div>

<script>

(function () {

  }

    Midrange: 'Develop a solid board, remove the opponent\'s best threats and out-value them. Be flexible: attack when ahead, defend when behind.',

  load() { try { Object.assign(Settings, JSON.parse(localStorage.getItem('magicduel.settings') || '{}')); } catch (e) { /* ignore */ } if (globalThis.MTG_NO_IMAGES) Settings.images = false; Images.enabled = Settings.images; },
  save() { try { localStorage.setItem('magicduel.settings', JSON.stringify({ hints: Settings.hints, images: Settings.images, speed: Settings.speed, confirmEnd: Settings.confirmEnd, stopEnd: Settings.stopEnd, holdPriority: Settings.holdPriority })); } catch (e) { /* ignore */ } Images.enabled = Settings.images; },
  pace() { return { slow: 1.7, normal: 1, fast: 0.35 }[Settings.speed] || 1; },
};
MTG.Settings = Settings;

/* ---------- text helpers ---------- */
const KW_NAMES = { 'first strike': 'First strike', 'double strike': 'Double strike', flying: 'Flying', deathtouch: 'Deathtouch', lifelink: 'Lifelink', trample: 'Trample', vigilance: 'Vigilance', haste: 'Haste', reach: 'Reach', menace: 'Menace', defender: 'Defender', hexproof: 'Hexproof', indestructible: 'Indestructible', flash: 'Flash', cantBlock: "Can't block", cantAttack: "Can't attack", attacksEachCombat: 'Attacks each combat if able', 'hexproofFrom:B': 'Hexproof from black' };
const kwText = (kws) => kws.map((k) => KW_NAMES[k] || k).join(', ');
function rulesText(d) {
  if (d.text) return d.text;
  const k = (d.kw || []).filter((x) => KW_NAMES[x]);
  return k.length ? kwText(k) + '.' : '';
}
function costHTML(cost) {
  if (!cost) return '';
  return cost.replace(/[0-9]+|[WUBRGCX]/g, (m) => /\d|X/.test(m) ? `<b class="cn">${m}</b>` : `<span class="pip ${m}"></span>`);
}
const typeLine = (d) => [...d.types, ...(d.subtypes && d.subtypes.length ? ['—', ...d.subtypes] : [])].join(' ') + (d.basic ? '' : '');
const faceClass = (d) => { if (d.types.includes('Land')) return 'L'; const cs = d.colors; if (cs.length === 0) return 'A'; if (cs.length > 1) return 'M'; return cs[0]; };

/* ---------- UI singleton ---------- */
const UI = {
  g: null, cardEls: new Map(), landEls: new Map(), mode: 'idle', renderQueued: false, highlight: new Set(), logLines: [], coachNotes: [],
  priorityResolve: null, advice: null, advCtx: null, lastAdviceKey: '', gameOver: false, dialogs: [], human: null,

  /* ----- basic infra ----- */
  toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(UI._tt); UI._tt = setTimeout(() => t.classList.add('hidden'), ms || 2600); },
  showScreen(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 'screen-' + id)); UI.screen = id; },
  modal(opts) {
    const root = $('#modal-root');
    const m = el('div', 'modal' + (opts.center ? ' center' : ''));
    const sheet = el('div', 'sheet');
    if (opts.title != null) {
      const h = el('header'); h.append(el('h3', '', opts.title));
      if (opts.closable !== false) { const x = el('button', 'xbtn', '✕'); x.onclick = () => close(null); h.append(x); }
      sheet.append(h);
    }
    const body = el('div', 'body'); if (opts.body instanceof Node) body.append(opts.body); else if (opts.body) body.innerHTML = opts.body; sheet.append(body);
    let footer = null;
    if (opts.buttons) { footer = el('footer'); for (const b of opts.buttons) { const bt = el('button', 'btn ' + (b.cls || ''), b.label); if (b.disabled) bt.disabled = true; bt.onclick = () => { if (b.keep) { b.onclick && b.onclick(close, bt); } else close(b.value, b); }; footer.append(bt); } sheet.append(footer); }
    m.append(sheet); root.append(m);
    let resolve; const p = new Promise((r) => (resolve = r));
    const close = (v) => { if (!m.isConnected) return; m.remove(); UI.dialogs = UI.dialogs.filter((d) => d.m !== m); resolve(v); if (opts.onClose) opts.onClose(v); };
    if (opts.closable !== false) m.addEventListener('click', (e) => { if (e.target === m) close(null); });
    UI.dialogs.push({ m, close });
    return { m, sheet, body, footer, close, promise: p };
  },
  closeInspect() { if (UI.inspectModal) { UI.inspectModal.close(null); UI.inspectModal = null; } },
  closeTopDialog() { const d = UI.dialogs[UI.dialogs.length - 1]; if (d) { d.close(null); return true; } return false; },
  sleep,

  /* ----- card elements ----- */
  makeFace(d) {
    const f = el('div', 'face ' + faceClass(d) + (d.token ? ' token' : ''));
    f.innerHTML = `<div class="fname">${esc(d.name)}</div><div class="fcost">${esc(d.cost || '')}</div><div class="ftype">${esc(d.token ? 'Token ' + d.types.join(' ') : d.types.join(' '))}</div><div class="ftext">${esc(rulesText(d))}</div>`;
    return f;
  },
  buildCardEl(c, opts) {
    opts = opts || {}; const d = c.def;
    const e = el('div', 'card'); e.dataset.id = c.id;
    const img = el('img', 'art'); img.alt = ''; img.draggable = false;
    e.append(UI.makeFace(d), img);
    img.addEventListener('load', () => { if (img.getAttribute('src')) e.classList.add('has-art'); });
    img.addEventListener('error', () => { e.classList.remove('has-art'); img.removeAttribute('src'); });
    if (!d.token && Images.enabled) { img.dataset.name = d.name; Images.attach(img, d.name, opts.big ? 'normal' : 'small'); }
    e.append(el('div', 'mark'));
    return e;
  },
  cardEl(c) {
    let e = UI.cardEls.get(c.id);
    if (!e) {
      e = UI.buildCardEl(c); UI.cardEls.set(c.id, e);
      let timer = null, moved = false;
      e.addEventListener('pointerdown', (ev) => { moved = false; timer = setTimeout(() => { timer = null; UI.inspect(c.card || c, {}); }, 520); });
      e.addEventListener('pointermove', () => { if (timer) { moved = true; } });
      const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
      e.addEventListener('pointerleave', cancel); e.addEventListener('pointercancel', cancel);
      e.addEventListener('pointerup', (ev) => { if (timer) { clearTimeout(timer); timer = null; UI.onCardTap(c); } });
      e.addEventListener('contextmenu', (ev) => ev.preventDefault());
    }
    return e;
  },
  updateCardEl(e, c, inHand) {
    const g = UI.g, d = c.def;
    for (const b of [...e.querySelectorAll('.badge,.zz,.tag')]) b.remove();
    const onBf = c.zone === 'battlefield';
    e.classList.toggle('tapped', onBf && c.tapped);
    e.classList.toggle('attached', onBf && !!c.attachedTo);
    if (onBf && g.isCreature(c)) {
      const ch = g.chars(c); const base = [d.power || 0, d.toughness || 0];
      const t = ch.toughness - c.damage;
      const b = el('div', 'badge pt' + (c.damage ? ' dmg' : ch.power > base[0] || ch.toughness > base[1] ? ' buff' : ch.power < base[0] || ch.toughness < base[1] ? ' nerf' : ''), `${ch.power}/${t}`);
      e.append(b);
      if (g.isSick(c) && c.controller === 0) e.append(el('div', 'zz', '💤'));
      if (g.has(c, 'cantAttack') && g.has(c, 'cantBlock')) e.append(el('div', 'zz', '🚫'));
    }
    const cn = Object.entries(c.counters).filter(([, v]) => v);
    if (onBf && cn.length) e.append(el('div', 'badge cnt', cn.map(([k, v]) => (k === 'p1p1' ? '+' + v : k === 'm1m1' ? '-' + v : v + k)).join(' ')));
    if (onBf && c.flags.skipUntap > 0) e.append(el('div', 'zz', '❄️'));
    e.classList.toggle('legal', UI.mode === 'target' && UI.legalSet.has(c));
    e.classList.toggle('rec', UI.highlight.has(c.id));
    e.classList.toggle('sel', UI.mode === 'block' && UI.activeBlocker === c);
    e.classList.toggle('atk', (UI.mode === 'attack' && UI.atkSet.has(c)) || (UI.mode === 'block' && UI.blockAtk && UI.blockAtk.has(c)));
    e.classList.remove('castable', 'unplayable');
    if (inHand) {
      const p = g.players[0];
      const ok = UI.mode === 'priority' && g.canCast(p, c).ok;
      e.classList.toggle('castable', ok); e.classList.toggle('unplayable', !ok);
    }
    // attack/block tags
    if (UI.mode === 'attack' && UI.atkSet.has(c)) e.append(el('div', 'tag', 'ATTACK'));
    if (UI.mode === 'block' && UI.blockMap) {
      const bl = [...UI.blockMap.entries()].filter(([, a]) => a === c).length;
      if (bl) e.append(el('div', 'tag blk', 'BLOCKED ×' + bl));
      if (UI.blockMap.has(c)) e.append(el('div', 'tag blk', 'BLOCKS ' + UI.blockMap.get(c).name.split(' ')[0]));
    }
    if (g.combat && onBf && g.combat.attackers.some((a) => a.card === c)) e.classList.add('attacking'); else e.classList.remove('attacking');
  },
  landEl(c) {
    let e = UI.landEls.get(c.id);
    if (!e) {
      const d = c.def; const cols = d.dual ? d.dual.split('') : (d.basic ? [d.abilities[0].mana.colors[0]] : []);
      let cls = 'land ', txt = '';
      if (cols.length === 1) { cls += cols[0]; txt = cols[0]; } else if (cols.length === 2) { cls += 'D'; txt = ''; } else { cls += 'X'; txt = '◆'; }
      e = el('div', cls, txt); if (cols.length === 2) { e.style.setProperty('--d1', COLOR_HEX[cols[0]]); e.style.setProperty('--d2', COLOR_HEX[cols[1]]); }
      e.addEventListener('click', () => UI.onCardTap(c));
      UI.landEls.set(c.id, e);
    }
    e.classList.toggle('tapped', c.tapped);
    return e;
  },

  /* ----- rendering ----- */
  scheduleRender() { if (UI.renderQueued) return; UI.renderQueued = true; requestAnimationFrame(() => { UI.renderQueued = false; UI.render(); }); },
  render() {
    const g = UI.g; if (!g) return;
    UI.renderBars(); UI.renderPhases(); UI.renderStack();
    UI.renderField(1, $('#oppPerms'), $('#oppLands')); UI.renderField(0, $('#myPerms'), $('#myLands'));
    UI.renderHand(); UI.renderButtons(); UI.renderCoachLine();
  },
  renderBars() {
    const g = UI.g;
    for (const [pi, id] of [[1, '#oppBar'], [0, '#myBar']]) {
      const p = g.players[pi], bar = $(id);
      const legal = UI.mode === 'target' && UI.legalSet.has(p);
      bar.classList.toggle('legal', legal);
      let mana = '';
      if (pi === 0) {
        const tally = {}; for (const s of g.manaSources(p)) { const k = s.colors.length === 1 ? s.colors[0] : s.colors.join(''); tally[k] = (tally[k] || 0) + 1; }
        mana = '<div class="manaline">' + Object.entries(tally).map(([k, v]) => `<span class="mchip"><i style="background:${k.length === 1 ? COLOR_HEX[k] : `linear-gradient(135deg,${COLOR_HEX[k[0]]} 50%,${COLOR_HEX[k[1] || k[0]]} 50%)`}"></i>${v}</span>`).join('') + (Object.keys(tally).length ? '' : '<span class="stat">no mana</span>') + '</div>';
        const pool = Object.entries(p.pool).filter(([, v]) => v > 0); if (pool.length) mana = mana.replace('</div>', pool.map(([k, v]) => `<span class="mchip">pool ${k}${v}</span>`).join('') + '</div>');
      }
      bar.innerHTML = `<span class="name">${esc(p.name)}</span><span class="life" data-p="${pi}">♥ ${p.life}</span>` +
        (pi === 1 ? `<span class="stat">🖐 <b>${p.hand.length}</b></span>` : '') +
        `<span class="stat">📚 <b>${p.library.length}</b></span><span class="stat link" data-gy="${pi}">🪦 <b>${p.graveyard.length}</b></span>${p.exile.length ? `<span class="stat">✨ <b>${p.exile.length}</b></span>` : ''}` + mana;
      bar.querySelector('.life').onclick = () => UI.onPlayerTap(pi);
      const gy = bar.querySelector('[data-gy]'); gy.onclick = () => UI.showGraveyard(pi);
      if (UI.lastLife[pi] != null && UI.lastLife[pi] !== p.life) bar.querySelector('.life').classList.toggle('up', p.life > UI.lastLife[pi]);
      UI.lastLife[pi] = p.life;
    }
  },
  lastLife: [null, null],
  renderPhases() {
    const g = UI.g, box = $('#phases');
    const groups = [['upkeep', 'Upkeep', ['upkeep']], ['draw', 'Draw', ['draw']], ['main1', 'Main 1', ['main1']], ['begin', 'Combat', ['begin', 'attackers', 'blockers', 'firstStrike', 'damage', 'endCombat']], ['main2', 'Main 2', ['main2']], ['end', 'End', ['end', 'cleanup']]];
    const mine = g.active === 0;
    box.innerHTML = `<span class="turnlbl ${mine ? 'mine' : 'theirs'}">${g.over ? 'OVER' : (mine ? 'YOU' : 'OPP') + ' · T' + Math.ceil(g.turnNo / 2)}</span>` + groups.map(([k, label, steps]) => `<span class="ph ${steps.includes(g.step) ? 'cur' : ''}">${label}</span>`).join('');
  },
  renderStack() {
    const g = UI.g, box = $('#stackBox'); box.innerHTML = '';
    for (const it of g.stack.slice().reverse()) {
      const name = it.kind === 'spell' ? it.card.name : it.source.name;
      const tg = (it.targets || []).filter(Boolean).map((t) => t.isPlayer ? t.name : t.kind === 'spell' ? t.card.name : t.name);
      const chip = el('div', 'sitem' + (it.controller === 0 ? '' : ' theirs') + (UI.mode === 'target' && UI.legalSet.has(it) ? ' legal' : ''), `<b>${it.kind === 'spell' ? '⚡' : '✦'} ${esc(name)}</b>${it.kind !== 'spell' ? `<span>${esc(it.text || '')}</span>` : ''}${tg.length ? `<span>→ ${esc(tg.join(', '))}</span>` : ''}`);
      chip.onclick = () => { if (UI.mode === 'target' && UI.legalSet.has(it)) UI.pickTarget(it); else UI.inspect(it.card || it.source, {}); };
      box.append(chip);
    }
  },
  fieldCards(pi) {
    const g = UI.g;
    const perms = g.bf.filter((c) => c.controller === pi && !g.isLand(c));
    const roots = perms.filter((c) => !c.attachedTo);
    roots.sort((a, b) => (g.isCreature(b) ? 1 : 0) - (g.isCreature(a) ? 1 : 0));
    const out = [];
    for (const r of roots) { out.push(r); for (const a of r.attachments) if (a.controller === pi) out.push(a); }
    for (const c of perms) if (!out.includes(c)) out.push(c);
    return out;
  },
  renderField(pi, permsBox, landsBox) {
    const g = UI.g;
    const cards = UI.fieldCards(pi);
    const want = new Set();
    for (const c of cards) { const e = UI.cardEl(c); UI.updateCardEl(e, c, false); permsBox.append(e); want.add(e); }
    for (const e of [...permsBox.children]) if (!want.has(e)) e.remove();
    const lands = g.lands(pi); const lw = new Set();
    for (const c of lands) { const e = UI.landEl(c); landsBox.append(e); lw.add(e); }
    for (const e of [...landsBox.children]) if (!lw.has(e)) e.remove();
  },
  renderHand() {
    const g = UI.g, p = g.players[0], box = $('#hand');
    const cards = p.hand.slice().sort((a, b) => (g.isLand(a) - g.isLand(b)) || (a.def.cmc - b.def.cmc) || a.name.localeCompare(b.name));
    const want = new Set();
    for (const c of cards) { const e = UI.cardEl(c); UI.updateCardEl(e, c, true); box.append(e); want.add(e); }
    for (const e of [...box.children]) if (!want.has(e)) e.remove();
    const wrap = $('#handWrap'), n = cards.length;
    if (n) {
      const w = box.firstElementChild.offsetWidth || 70, avail = wrap.clientWidth - 20;
      const need = n * w + (n - 1) * 4, overlap = n > 1 && need > avail ? (need - avail) / (n - 1) : 0;
      cards.forEach((c, i) => { UI.cardEl(c).style.marginLeft = i && overlap ? `-${overlap.toFixed(1)}px` : ''; });
    }
  },
  possibleAttackers() { const g = UI.g; return g.bf.filter((c) => g.canAttack(c)); },
  renderButtons() {
    const g = UI.g, b = $('#btnMain'), pb = $('#promptBar');
    let label = '…', disabled = true, cls = 'primary';
    const m = UI.mode;
    if (g.over) { label = 'Game over'; }
    else if (m === 'priority') {
      disabled = false;
      if (g.stack.length) { const top = g.stack[g.stack.length - 1]; label = top.controller === 0 ? 'Resolve ▶' : 'Let it resolve ▶'; }
      else if (g.active === 0) { label = g.step === 'main1' ? (UI.possibleAttackers().length ? 'Combat ▶' : 'Main 2 ▶') : g.step === 'main2' ? 'End turn ▶' : 'Continue ▶'; }
      else label = 'Pass ▶';
    } else if (m === 'attack') { disabled = false; label = UI.atkSet.size ? `Attack (${UI.atkSet.size}) ▶` : 'No attack ▶'; }
    else if (m === 'block') { disabled = false; label = UI.blockMap.size ? `Block (${UI.blockMap.size}) ▶` : 'No blocks ▶'; }
    else if (m === 'target') { disabled = !UI.targetCancel; label = 'Cancel'; cls = ''; }
    else { label = g.active === 0 ? 'Your turn' : 'Opponent…'; }
    b.textContent = label; b.disabled = disabled; b.className = cls;
    if (!UI.promptText) pb.classList.add('hidden');
  },
  setPrompt(text, buttons) {
    UI.promptAt = Date.now();
    const pb = $('#promptBar'); UI.promptText = text;
    if (!text) { pb.classList.add('hidden'); pb.innerHTML = ''; return; }
    pb.classList.remove('hidden'); pb.innerHTML = '';
    pb.append(el('div', 'ptxt', text));
    for (const bt of buttons || []) { const x = el('button', bt.cls || '', bt.label); x.onclick = bt.onclick; pb.append(x); }
  },

  /* ----- coach ----- */
  setAdviceCtx(kind, args) { UI.advCtx = { kind, args }; UI.lastAdviceKey = ''; UI.refreshAdvice(); },
  getAdvice() {
    const g = UI.g, c = UI.advCtx; if (!g || !c) return null;
    const p = g.players[0];
    try {
      switch (c.kind) {
        case 'mulligan': return Coach.adviseMulligan(g, p, c.args.hand, c.args.n);
        case 'main': return Coach.adviseMain(g, p);
        case 'respond': return Coach.adviseResponse(g, p);
        case 'attack': return Coach.adviseAttack(g, p, c.args.possible);
        case 'block': return Coach.adviseBlock(g, p, c.args.atk, c.args.blk);
        case 'target': return Coach.adviseTarget(g, p, c.args.spec, c.args.o);
        case 'scry': return Coach.adviseScry(g, p, c.args.cards);
        case 'discard': return Coach.adviseDiscard(g, p, c.args.cards, c.args.n);
        default: return null;
      }
    } catch (e) { console.error(e); return null; }
  },
  refreshAdvice() {
    const g = UI.g; if (!g) return;
    const key = UI.advCtx ? UI.advCtx.kind + '|' + g.ver + '|' + g.stack.length + '|' + g.step : 'none';
    if (key === UI.lastAdviceKey) return; UI.lastAdviceKey = key;
    UI.advice = UI.advCtx ? UI.getAdvice() : null;
    UI.highlight = new Set(Settings.hints && UI.advice ? UI.advice.highlight : []);
  },
  renderCoachLine() {
    const g = UI.g, line = $('#coachLine'); UI.refreshAdvice();
    if (UI.mode === 'idle' || !UI.advice) { line.innerHTML = g.over ? '' : (g.active === 0 ? '' : '<span style="color:var(--muted)">Opponent is playing…</span>'); return; }
    if (!Settings.hints) { line.innerHTML = '<span style="color:var(--muted)">Tap 💡 for coach advice</span>'; return; }
    line.innerHTML = `<b>Coach:</b> ${esc(UI.advice.headline)}`;
  },
  showCoach() {
    const g = UI.g; UI.lastAdviceKey = ''; UI.refreshAdvice();
    const a = UI.advice; const body = el('div', 'coach');
    if (!a) body.innerHTML = `<div class="head">Coach</div><p>Nothing to decide right now. ${g && g.active !== 0 ? 'The opponent is playing; I\'ll advise when you can act.' : ''}</p>`;
    else {
      let h = `<div class="head">${esc(a.headline)}</div>`;
      if (a.state) h += `<div class="state">${esc(a.state)}</div>`;
      for (const it of a.items) h += `<div class="item"><b>${esc(it.text)}</b>${it.why ? `<span>${esc(it.why)}</span>` : ''}</div>`;
      const L = Coach.lessons[a.lesson];
      if (L) h += `<div class="lessonbox"><b>Strategy: ${esc(L.title)}.</b> ${esc(L.text)}</div>`;
      if (a.alternatives && a.alternatives.length) h += `<div class="alts"><b>Other options</b><ul>${a.alternatives.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      body.innerHTML = h;
    }
    if (UI.coachNotes.length) {
      const f = el('div', 'alts'); f.innerHTML = '<b>Feedback on your recent plays</b>' + UI.coachNotes.slice(-4).map((n) => `<div class="item fb"><span>${esc(n)}</span></div>`).join('');
      body.append(f);
    }
    const m = UI.modal({ title: '💡 Strategy coach', body, buttons: [{ label: Settings.hints ? 'Hide board hints' : 'Show hints on board', cls: 'ghost', value: 'toggle' }, { label: 'Strategy guide', cls: 'ghost', value: 'guide' }, { label: 'Close', value: null, cls: 'primary' }] });
    m.promise.then((v) => { if (v === 'toggle') { Settings.hints = !Settings.hints; Settings.save(); UI.lastAdviceKey = ''; UI.scheduleRender(); UI.toast(Settings.hints ? 'Coach hints on' : 'Coach hints off'); } else if (v === 'guide') MTG.App.showGuideModal(); });
  },
  coachFeedback(text, ok) {
    if (!Settings.hints) return; UI.coachNotes.push((ok ? '✔ ' : '💬 ') + text); UI.toast((ok ? '✔ ' : '💡 ') + text.slice(0, 160), ok ? 1800 : 4200);
  },

  /* ----- interactions ----- */
  onCardTap(c) {
    const g = UI.g;
    if (UI.mode === 'target' && UI.legalSet.has(c)) return UI.pickTarget(c);
    if (UI.mode === 'attack') {
      if (UI.atkPossible.includes(c)) { if (g.has(c, 'attacksEachCombat')) { UI.toast(c.name + ' must attack.'); return; } if (UI.atkSet.has(c)) UI.atkSet.delete(c); else UI.atkSet.add(c); UI.scheduleRender(); return; }
    }
    if (UI.mode === 'block') {
      if (UI.blockers.includes(c)) {
        if (UI.blockMap.has(c)) { UI.blockMap.delete(c); UI.activeBlocker = null; } else UI.activeBlocker = UI.activeBlocker === c ? null : c;
        UI.scheduleRender(); return;
      }
      if (UI.blockAtk.has(c)) {
        if (UI.activeBlocker) {
          if (g.canBlock(UI.activeBlocker, c)) { if (g.has(c, 'menace') && false) { /* handled at confirm */ } UI.blockMap.set(UI.activeBlocker, c); UI.activeBlocker = null; }
          else UI.toast(`${UI.activeBlocker.name} can't block ${c.name}` + (g.has(c, 'flying') ? ' (flying)' : '') + '.');
        } else UI.toast('Tap one of your untapped creatures first, then the attacker it should block.');
        UI.scheduleRender(); return;
      }
    }

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pips = (cols) => `<span class="pips">${(cols.length ? cols : ['C']).map((c) => `<span class="pip ${c}"></span>`).join('')}</span>`;

const App = (MTG.App = {
  sel: { tab: 'starter', starter: 's-rw', packs: [], opp: 'random' },
  last: null, game: null,

  /* ---------- records ---------- */
  record() { try { return JSON.parse(localStorage.getItem('magicduel.record') || '{"w":0,"l":0,"d":0}'); } catch (e) { return { w: 0, l: 0, d: 0 }; } },
  addRecord(res) { const r = App.record(); r[res]++; try { localStorage.setItem('magicduel.record', JSON.stringify(r)); } catch (e) { /* ignore */ } },

  /* ---------- menu ---------- */
  showMenu() {
    const r = App.record(); const s = $('#screen-menu');
    s.innerHTML = `<div class="menu-wrap">
      <div class="mana-row">${['W', 'U', 'B', 'R', 'G'].map((c) => `<span class="mana-dot" style="background:var(--${c})"></span>`).join('')}</div>
      <div class="logo">MAGIC DUEL<small>Play · Learn · Win</small></div>
      <button class="btn primary" id="mQuick">⚡ Quick play</button>
      <button class="btn" id="mDecks">🃏 Choose decks</button>
      <button class="btn" id="mGuide">📘 Strategy guide</button>
      <button class="btn" id="mSet">⚙️ Settings</button>
      <div class="record">Record: ${r.w} wins · ${r.l} losses${r.d ? ' · ' + r.d + ' draws' : ''}</div>
      <div class="menu-sub">Starter decks and Jumpstart-style theme packs, full Magic rules, and a coach that explains every decision.</div>
    </div>`;
    $('#mQuick').onclick = () => App.quickPlay();
    $('#mDecks').onclick = () => App.showDecks();
    $('#mGuide').onclick = () => App.showGuide();
    $('#mSet').onclick = () => App.showSettings();
    UI.showScreen('menu');
  },
  quickPlay() {
    const a = Decks.starters[Math.floor(Math.random() * Decks.starters.length)];
    let b; do b = Decks.starters[Math.floor(Math.random() * Decks.starters.length)]; while (b === a);
    App.startGame(a, b);
  },

  /* ---------- deck selection ---------- */
  showDecks() {
    const s = $('#screen-decks'); const S = App.sel;
    s.innerHTML = '';
    const top = el('div', 'topbar', '<button class="back" id="dBack">←</button><h2>Choose your deck</h2>');
    const scroll = el('div', 'scroll pad'); scroll.style.flex = '1';
    const seg = el('div', 'seg', `<button data-t="starter" class="${S.tab === 'starter' ? 'on' : ''}">Starter decks</button><button data-t="jump" class="${S.tab === 'jump' ? 'on' : ''}">Jumpstart · pick 2</button>`);
    scroll.append(seg);
    if (S.tab === 'starter') {
      scroll.append(el('p', 'menu-sub', 'Ready-made 40-card decks inspired by recent starter products. Pick one.'));
      for (const d of Decks.starters) {
        const prof = Coach.deckProfile(Decks.names(d));
        const c = el('div', 'deckcard' + (S.starter === d.id ? ' sel' : ''), `<div class="row"><h3>${esc(d.name)}</h3>${pips(Decks.colorsOf(Decks.names(d)))}<span class="tag">${prof.archetype}</span></div><p>${esc(d.blurb)}</p><p><b>Plan:</b> ${esc(d.plan)}</p><div class="row"><button class="btn small ghost" data-view="${d.id}">View cards</button></div>`);
        c.onclick = (e) => { if (e.target.dataset.view) { App.viewDeck(d); return; } S.starter = d.id; App.showDecks(); };
        scroll.append(c);
      }
    } else {
      scroll.append(el('p', 'menu-sub', 'Jumpstart style: choose two 20-card theme packs and they combine into one 40-card deck. You can pick the same colour twice.'));
      const grid = el('div', 'packgrid');
      for (const p of Decks.packs) {
        const n = S.packs.filter((x) => x === p.id).length;
        const c = el('div', 'deckcard' + (n ? ' sel' : ''), `<div class="row"><h3>${esc(p.name)}</h3>${pips([p.color])}</div><p>${esc(p.blurb)}</p>${n ? `<span class="tag" style="align-self:flex-start">Chosen${n > 1 ? ' ×2' : ''}</span>` : ''}<div class="row"><button class="btn small ghost" data-view="${p.id}">Cards</button></div>`);
        c.onclick = (e) => {
          if (e.target.dataset.view) { App.viewDeck({ name: p.name + ' pack', list: [...p.list, ...p.lands] }); return; }
          if (S.packs.length >= 2) S.packs = S.packs.slice(1); S.packs.push(p.id); App.showDecks();
        };
        grid.append(c);
      }
      scroll.append(grid);
      if (S.packs.length === 2) {
        const d = App.jumpDeck(); const prof = Coach.deckProfile(Decks.names(d));
        scroll.append(el('div', 'deckcard sel', `<div class="row"><h3>${esc(d.name)}</h3>${pips(Decks.colorsOf(Decks.names(d)))}<span class="tag">${prof.archetype}</span></div><p><b>Plan:</b> ${esc(prof.plan)}</p><div class="row"><button class="btn small ghost" id="dView">View cards</button><button class="btn small ghost" id="dClear">Clear</button></div>`));
      } else scroll.append(el('p', 'menu-sub', `Chosen ${S.packs.length}/2 themes.`));
    }
    const bottom = el('div', 'bottombar');
    const oppOpts = ['<option value="random">Random starter deck</option>', '<option value="jump">Random Jumpstart deck</option>', ...Decks.starters.map((d) => `<option value="${d.id}">${esc(d.name)}</option>`)];
    bottom.innerHTML = `<div class="field-row"><span>Opponent</span><select id="dOpp">${oppOpts.join('')}</select></div><button class="btn primary" id="dStart" style="max-width:none">Start game</button>`;
    s.append(top, scroll, bottom);
    $('#dOpp', s).value = S.opp;
    $('#dOpp', s).onchange = (e) => { S.opp = e.target.value; };
    $('#dBack', s).onclick = () => App.showMenu();
    seg.querySelectorAll('button').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; App.showDecks(); }));
    const dv = $('#dView', s); if (dv) dv.onclick = () => App.viewDeck(App.jumpDeck());
    const dc = $('#dClear', s); if (dc) dc.onclick = () => { S.packs = []; App.showDecks(); };
    const start = $('#dStart', s);
    start.disabled = S.tab === 'jump' && S.packs.length !== 2;
    start.onclick = () => {
      const mine = S.tab === 'starter' ? Decks.starters.find((d) => d.id === S.starter) : App.jumpDeck();
      let opp;
      if (S.opp === 'random') opp = Decks.starters[Math.floor(Math.random() * Decks.starters.length)];
      else if (S.opp === 'jump') opp = Decks.randomJumpstart();
      else opp = Decks.starters.find((d) => d.id === S.opp);
      App.startGame(mine, opp);
    };
    UI.showScreen('decks');
  },
  jumpDeck() { const [a, b] = App.sel.packs.map((id) => Decks.packs.find((p) => p.id === id)); return Decks.fromPacks(a, b); },
  viewDeck(d) {
    const body = el('div');
    const rows = d.list.slice().sort((a, b) => (MTG.cards[a[0]].types.includes('Land') - MTG.cards[b[0]].types.includes('Land')) || MTG.cards[a[0]].cmc - MTG.cards[b[0]].cmc);
    for (const [n, q] of rows) {
      const def = MTG.cards[n];
      const r = el('div', 'logline', `<b>${q}×</b> ${esc(n)} <span style="float:right;color:var(--muted)">${esc(def.cost || def.types[0])}</span>`);
      r.onclick = () => UI.inspect({ id: -1, def, name: n, zone: null, counters: {}, attachments: [], controller: 0, owner: 0, damage: 0, tapped: false, flags: {} }, {});
      body.append(r);
    }
    const prof = Coach.deckProfile(Decks.expand(d.list));
    body.prepend(el('div', 'lesson', `<h3>${prof.archetype}</h3><p>${esc(prof.plan)}</p><p style="color:var(--muted);margin-top:6px">${esc(prof.tips.join(' '))}</p>`));
    UI.modal({ title: d.name, body });
  },

  /* ---------- settings & guide ---------- */
  showSettings() {
    const body = el('div');
    const row = (key, title, sub) => {
      const r = el('div', 'toggle', `<div>${esc(title)}<small>${esc(sub)}</small></div>`); const sw = el('button', 'switch' + (Settings[key] ? ' on' : ''));
      sw.onclick = () => { Settings[key] = !Settings[key]; Settings.save(); sw.classList.toggle('on', Settings[key]); };
      r.append(sw); return r;
    };
    body.append(row('hints', 'Coach hints', 'Show advice and highlight the recommended play on the board'));
    body.append(row('images', 'Card artwork', 'Download card images from Scryfall by name (needs internet). Off = text cards'));
    const art = el('div', 'toggle', '<div>Card art<small id="artStatus">Not downloaded yet. Art loads as cards appear.</small></div>');
    const dl = el('button', 'btn small', 'Download all'); dl.onclick = () => {
      dl.disabled = true; const st = $('#artStatus'); st.textContent = 'Downloading…';
      Images.downloadAll((d, t, f) => { st.textContent = `Downloading ${d}/${t}` + (f ? ` (${f} failed)` : ''); }).then((r) => { dl.disabled = false; st.textContent = r.failed ? `${r.total - r.failed}/${r.total} cards downloaded. ${Images.lastError || 'Some art could not be fetched; those cards show as text.'}` : `All ${r.total} cards downloaded and cached.`; });
    };
    art.append(dl); body.append(art);
    body.append(row('confirmEnd', 'Confirm wasteful turn end', 'Ask before ending the turn with castable cards and spare mana'));
    body.append(row('stopEnd', 'Stop at opponent\'s end step', 'Pause when you hold a castable instant at the end of their turn'));
    body.append(row('holdPriority', 'Hold priority after casting', 'Get priority back with your spell on the stack (to chain spells). Off = it resolves automatically'));
    const sp = el('div', 'toggle', '<div>Game speed<small>How fast the opponent\'s actions play out</small></div>');
    const sel = el('select'); sel.style.flex = '0 0 120px'; sel.innerHTML = ['slow', 'normal', 'fast'].map((s) => `<option ${Settings.speed === s ? 'selected' : ''}>${s}</option>`).join('');
    sel.onchange = () => { Settings.speed = sel.value; Settings.save(); if (UI.g) UI.g.pace = Settings.pace(); }; sp.append(sel); body.append(sp);
    const rec = el('button', 'btn small ghost', 'Reset win/loss record'); rec.style.marginTop = '12px'; rec.onclick = () => { try { localStorage.removeItem('magicduel.record'); } catch (e) { /* ignore */ } UI.toast('Record reset'); if (UI.screen === 'menu') App.showMenu(); };
    body.append(rec);
    UI.modal({ title: 'Settings', body, buttons: [{ label: 'Done', cls: 'primary', value: null }] });
  },
  guideHTML() {
    let h = '<div class="lesson"><h3>Controls</h3><p><b>Tap</b> a card to see it and its actions (cast, play land, activate). <b>Press and hold</b> any card to inspect it. Cards with a green glow in your hand are castable. Mana is paid automatically from your lands. Press the gold button to move the game on: it always says what it will do next. When you attack, tap your creatures then confirm; when you block, tap your blocker, then the attacker. 💡 asks the coach, 📜 shows the log, tap a graveyard icon to see it.</p></div><p class="menu-sub" style="max-width:none">The Coach in this game uses the same planner as the computer opponent, so its advice is a real, working strategy — plus the reasoning behind it. These are the core ideas it keeps coming back to.</p>';
    for (const k of Object.keys(Coach.lessons)) { const L = Coach.lessons[k]; h += `<div class="lesson"><h3>${esc(L.title)}</h3><p>${esc(L.text)}</p></div>`; }
    h += `<div class="lesson"><h3>Turn checklist</h3><p>1) Check for lethal for both players. 2) Play a land. 3) Remove the biggest threat if the trade is good. 4) Attack if it is safe. 5) Spend the rest of your mana on the best development. 6) Keep instants for when they matter.</p></div>`;
    return h;
  },
  showGuide() {
    const s = $('#screen-guide'); s.innerHTML = '';
    s.append(el('div', 'topbar', '<button class="back" id="gBack">←</button><h2>Strategy guide</h2>'));
    const sc = el('div', 'scroll pad', App.guideHTML()); sc.style.flex = '1'; s.append(sc);
    $('#gBack', s).onclick = () => App.showMenu(); UI.showScreen('guide');
  },
  showGuideModal() { UI.modal({ title: 'Strategy guide', body: App.guideHTML() }); },

  /* ---------- game lifecycle ---------- */
  startGame(myDeck, oppDeck) {
    App.last = [myDeck, oppDeck]; Images.reset();
    const human = new MTG.HumanController(), ai = new MTG.AIController();
    const g = new MTG.Game({ decks: [Decks.names(myDeck), Decks.names(oppDeck)], controllers: [human, ai], names: ['You', 'Opponent'], deckNames: [myDeck.name, oppDeck.name] });
    App.game = g; UI.bindGame(g); UI.showScreen('game'); UI.render();
    Images.preload([...Decks.names(myDeck), ...Decks.names(oppDeck)], 'small');
    const mp = Coach.deckProfile(Decks.names(myDeck)), op = Coach.deckProfile(Decks.names(oppDeck));
    const brief = el('div', 'coach');
    brief.innerHTML = `<div class="item"><b>You: ${esc(myDeck.name)} <span style="color:var(--muted)">(${mp.archetype})</span></b><span>${esc(mp.plan)}</span></div>
      <div class="item" style="border-left-color:#ff8f86"><b>Opponent: ${esc(oppDeck.name)} <span style="color:var(--muted)">(${op.archetype})</span></b><span>${esc(op.plan)}</span></div>` +
      (Settings.hints ? `<div class="lessonbox"><b>Matchup tip.</b> ${esc(Coach.matchup(mp, op))}</div>` : '');
    const m = UI.modal({ title: 'Match start', body: brief, center: true, closable: false, buttons: [{ label: 'Let\'s play', cls: 'primary', value: true }] });
    m.promise.then(() => {
      g.run().then(() => { if (App.game === g && !UI.aborted) App.gameEnded(g); }).catch((e) => { console.error(e); UI.toast('Game error: ' + e.message, 8000); });
    });
    UI.aborted = false;
  },
  abortGame() {
    const g = App.game; if (!g) return;
    UI.aborted = true; g.over = true;
    if (UI.priorityResolve) { const r = UI.priorityResolve; UI.priorityResolve = null; r({ type: 'pass' }); }
    if (UI.attackRes) { const r = UI.attackRes; UI.attackRes = null; r([]); }
    if (UI.blockRes) { const r = UI.blockRes; UI.blockRes = null; r([]); }
    if (UI.targetRes) { const r = UI.targetRes; UI.targetRes = null; r(null); }
    while (UI.closeTopDialog());
    UI.mode = 'idle'; UI.setPrompt(null); App.game = null;
  },
  gameEnded(g) {
    if (UI.gameOver) return; UI.gameOver = true; $('#toast').classList.add('hidden'); UI.mode = 'idle'; UI.setPrompt(null); UI.highlight = new Set(); UI.render();
    const won = g.winner === 0, draw = g.winner < 0;
    App.addRecord(draw ? 'd' : won ? 'w' : 'l');
    const rv = Coach.gameReview(g, 0);
    const body = el('div', 'coach review');
    const maxA = Math.max(1, ...rv.turns.map((t) => t.avail));
    body.innerHTML = `<div class="head" style="color:${won ? '#7be3a4' : draw ? 'var(--gold)' : '#ff8f86'}">${draw ? 'Draw' : won ? 'Victory!' : 'Defeat'}</div><div class="state">${esc(g.resultReason)} · ${g.turnNo} turns</div>` +
      rv.items.map((i) => `<div class="item" style="border-left-color:${i.ok ? '#7be3a4' : 'var(--gold)'}"><b>${i.ok ? '✔' : '•'} ${esc(i.title)}</b><span>${esc(i.text)}</span></div>`).join('') +
      `<div class="alts"><b>Mana used each of your turns</b>` + rv.turns.map((t) => `<div class="tr"><span>T${Math.ceil(t.turn / 2)}</span><div class="bar"><i style="width:${Math.min(100, 100 * t.spent / maxA)}%"></i></div><span style="width:56px">${t.spent}/${t.avail}</span></div>`).join('') + `</div>` +
      `<div class="lessonbox"><b>Strategy: ${esc(Coach.lessons[rv.lesson].title)}.</b> ${esc(Coach.lessons[rv.lesson].text)}</div>`;
    const m = UI.modal({ title: 'Game review', body, closable: false, buttons: [{ label: 'Menu', value: 'menu', cls: 'ghost' }, { label: 'Rematch', value: 'again', cls: 'primary' }] });
    m.promise.then((v) => { if (v === 'again') App.startGame(App.last[0], App.last[1]); else App.showMenu(); });
  },
  gameMenu() {
    const g = App.game; if (!g || g.over) { App.showMenu(); return; }
    const body = el('div');
    const add = (label, fn, danger) => { const b = el('button', 'abtn', label); if (danger) b.style.borderColor = '#a04a44'; b.onclick = () => { m.close(null); fn(); }; body.append(b); };
    add('▶ Resume', () => {});
    add('💡 Strategy guide', () => App.showGuideModal());
    add('⚙️ Settings', () => App.showSettings());
    add('🏳️ Concede', () => UI.modal({ center: true, title: 'Concede?', body: '<p>This counts as a loss.</p>', buttons: [{ label: 'Keep playing', value: false }, { label: 'Concede', value: true, cls: 'primary' }] }).promise.then((v) => { if (v) { if (UI.priorityResolve) { g.concede(0); const r = UI.priorityResolve; UI.priorityResolve = null; r({ type: 'concede' }); } else g.concede(0); setTimeout(() => { if (!UI.gameOver) App.gameEnded(g); }, 50); } }), true);
    add('🏠 Quit to menu', () => { App.abortGame(); App.showMenu(); }, true);
    const m = UI.modal({ title: 'Menu', body });
  },
});

// Android Back button (called from the native shell)
window.onAndroidBack = function () {
  if (UI.closeTopDialog()) return true;
  if (UI.screen === 'game') { App.gameMenu(); return true; }
  if (UI.screen === 'decks' || UI.screen === 'guide') { App.showMenu(); return true; }
  return false;
};

window.addEventListener('DOMContentLoaded', () => {
  Settings.load();
  UI.g = new MTG.Game({ decks: [[], []], controllers: [], names: ['You', 'Opponent'] });   // dummy game so card inspection works on menus
  UI.init(); App.showMenu();
});
})();

</script>
