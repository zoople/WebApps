<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Magic Duel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="screen-menu" class="screen active"></section>
  <section id="screen-decks" class="screen"></section>
  <section id="screen-guide" class="screen"></section>
  <section id="screen-game" class="screen">
    <div id="oppBar" class="pbar opp"></div>
    <div id="oppField" class="field"><div id="oppPerms" class="perms"></div><div id="oppLands" class="lands"></div></div>
    <div id="midBar"><div id="phases"></div><div id="stackBox"></div></div>
    <div id="myField" class="field"><div id="myPerms" class="perms"></div><div id="myLands" class="lands"></div></div>
    <div id="myBar" class="pbar me"></div>
    <div id="promptBar" class="hidden"></div>
    <div id="handWrap"><div id="hand"></div></div>
    <div id="actionBar">
      <button id="btnCoach" class="iconbtn" title="Coach">💡</button>
      <div id="coachLine"></div>
      <button id="btnLog" class="iconbtn" title="Game log">📜</button>
      <button id="btnMenu" class="iconbtn" title="Menu">☰</button>
      <button id="btnMain" class="primary">…</button>
    </div>
    <div id="banner" class="hidden"></div>
  </section>
</div>
<div id="modal-root"></div>
<div id="toast" class="hidden"></div>
<script src="js/engine.js"></script>
<script src="js/cards.js"></script>
<script src="js/decks.js"></script>
<script src="js/ai.js"></script>
<script src="js/coach.js"></script>
<script src="js/images.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
