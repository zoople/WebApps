<body>
<style>
:root{
  --bg:#1a1316; --panel:#271c1f; --panel2:#30232a; --ink:#f4e8d3; --muted:#b8a387; --gold:#e4b84c; --velvet:#a3303d; --ok:#78c27c;
  --cover:#6f8fa8; --crack:#c9a24a; --truth:#c86a7a;
  --display:"Limelight","Didot","Bodoni 72",Georgia,serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 14px 6px}
.toprow{display:flex;align-items:center;gap:8px}
.toprow h1{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid #ffffff14;display:grid;place-items:center;font-size:17px;flex:none}
.bar{height:6px;background:#ffffff14;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .3s}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid #ffffff18;background:var(--panel);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps button.on{background:var(--gold);color:#2a1a10;border-color:var(--gold)}
.steps button .pc{font-size:11px;opacity:.8}
.steps button.done:not(.on){color:var(--ok)}
main{padding:4px 14px 120px;max-width:720px;margin:0 auto}
h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:28px;margin:14px 0 4px}
h3{margin:22px 0 8px;font-size:16px}
.lead{color:var(--muted);margin:0 0 10px}
.tips{background:#e4b84c12;border:1px solid #e4b84c33;border-radius:14px;padding:10px 12px;margin:10px 0}
.tips b{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tips ul{margin:6px 0 0;padding-left:18px}
.tips li{margin:3px 0;font-size:14px}
.card{background:var(--panel);border:1px solid #ffffff12;border-radius:16px;padding:12px;margin:10px 0}
.f{margin:10px 0}
.f label{display:block;font-weight:800;font-size:14px;margin-bottom:4px}
.f .hint{font-size:12.5px;color:var(--muted);margin:0 0 5px;line-height:1.35}
.f input,.f textarea,.f select{width:100%;background:var(--panel2);border:1px solid #ffffff1c;border-radius:11px;padding:11px 12px;font-size:16px;outline:none}
.f textarea{min-height:64px;resize:vertical;line-height:1.35}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
main input:not([type=checkbox]),main textarea{width:100%;background:var(--panel2);border:1px solid #ffffff1c;border-radius:11px;padding:11px 12px;font-size:16px;outline:none;color:var(--ink)}
main textarea{min-height:64px;resize:vertical;line-height:1.35}
main input:focus,main textarea:focus{border-color:var(--gold)}
.row .f{flex:1;margin:6px 0}
.wc{font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px}
.wc.over{color:#ff9b8a;font-weight:800}
.row{display:flex;gap:8px;align-items:center}
.emo{width:58px!important;flex:none;text-align:center;font-size:22px!important;padding:8px 4px!important}
.lv{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.lv .tag{flex:none;width:58px;border-radius:9px;padding:4px 0;text-align:center;font-size:11px;font-weight:800;line-height:1.2}
.lv .tag small{display:block;font-weight:600;font-size:9.5px;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
.tag.cover{background:#6f8fa833;color:#a9c6dd}.tag.crack{background:#c9a24a33;color:#ecd08a}.tag.truth{background:#c86a7a33;color:#f1a7b3}.tag.fixed{background:#ffffff14;color:var(--muted)}
.lv .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lv .grow .row input{flex:1}
.lv .role{font-size:12px;color:var(--muted)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid #e4b84c55;background:#e4b84c14;color:var(--gold);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}
.chip.arm{background:var(--gold);color:#2a1a10}
.line{border-left:3px solid #ffffff22;padding-left:10px;margin:12px 0}

Sheets", "intro": [["N", "Great-Aunt Odile left you three things: a tall, thin house on Larkspur Lane, a black cat called Mothball, and a note."], ["O", "“Start in the attic. Mind the dust. — O.”"], ["T", "I’ve brought bin bags and very low expectations. She was a seamstress, Nell. It’ll be buttons all the way down."], ["M", "Mrrp. (He sits on a dust sheet and refuses to move.)"], ["N", "Tap a generator, then tap it again to make something. Drag two matching things together to merge them. Every merge shakes open the boxes beside it."]], "outro": [["T", "Right. That’s one corner of floor I can actually see."], ["N", "Under the last dust sheet, pinned to a rafter with a hatpin: a playing card. The ace of moons. There is no such card."], ["M", "(He bats it once, then looks at you as though you ought to know what it means.)"], ["P", "Coo-ee! Door was open. Oh, you’ve started on her attic. Brave."], ["P", "Forty years next door and Odile never let me past the hatch. Mind if I have a nose?"]]}, {"title": "Letters in the Rafters", "intro": [["T", "There’s a fuse box up here. Why is there a fuse box in an attic?"], ["N", "Theo flips the switch. A row of bulbs along the beam stutters on, then off, then on again. It sounds a bit like applause."], ["N", "The dust sheets over the next stretch of floor slide away. (A Fuse Box is waiting in your gifts.)"], ["P", "And you can’t clear an attic without tea. I’ve brought my kettle up. It’s on loan, mind. (Free tea every few minutes.)"]], "outro": [["N", "The letters are tied in red ribbon, all addressed to the same name. Not Odile. “The Great Odelia.”"], ["P", "Paris. Vienna. The Palladium. Those are theatre letterheads, love."], ["T", "Your quiet seamstress aunt was on the stage?"], ["N", "One letter is shorter than the rest. “The trunk is yours, if you can find it. I never could open it without you. — F.”"]]}, {"title": "The Circus Trunk", "intro": [["N", "Behind the next dust sheet sits a striped trunk with brass corners. No keyhole. No hinges."], ["T", "It’s a trunk designed by someone who hates trunks."], ["M", "(He taps the lid twice with one paw. It clicks open.)"], ["T", "…Did your cat just—"], ["N", "(The Circus Trunk is in your gifts. Whatever comes out of it tells Odile’s story.)"]], "outro": [["P", "I remember now. Summer of ’68 she went away. Said she was nursing a sister in Lyon."], ["P", "Came back ten years later with that trunk and never said one word about it."], ["N", "Inside the lid, a programme: “The Great Odelia & Felix Marchetti present THE VANISHING MOON.”"], ["T", "Felix. “F.”"]]}, {"title": "The Great Odelia", "intro": [["N", "The last corner of the attic is darker than the rest, as if the light doesn’t quite want to go there."], ["P", "I’m not superstitious. I’m just going to stand here. By the hatch."]], "outro": [["N", "Odile’s diary, spring 1968: “Felix says the Moon can’t be done. A whole moon, gone, in front of two thousand people. I say it’s only a question of where you make them look.”"], ["N", "Autumn 1969: “We did it. Then he took the method and ran. Let him. He only has half.”"], ["T", "Half a trick?"]]}, {"title": "Smoke and Mirrors", "intro": [["T", "These aren’t shelves. Look at the joins. This whole wall is a stage flat."], ["N", "The attic isn’t an attic. Or not only. Odile built a little theatre up here, then hid it under dust sheets."]], "outro": [["N", "Behind the false wall: a tall mirror on a swivel, angled at the round window. A second diary: “The other half of the Moon is a window, a mirror, and patience.”"], ["M", "(He jumps onto the sill and sits very straight, like an assistant waiting for a cue.)"], ["P", "There was always a black cat. Always called Mothball. I assumed it was the same one, for a while there."]]}, {"title": "The Vanishing Moon", "intro": [["O", "“Light, cloth, a crystal, and someone who looks.” (Pinned to the mirror.)"], ["T", "That’s a shopping list. She’s left us a shopping list for a magic trick."]], "outro": [["N", "You set the crystal ball on its stand. Theo kills the bulbs. Mrs Pike, despite herself, climbs the ladder."], ["N", "The full moon sits in the round window. You tilt the mirror. For one long breath the window is empty: just dark sky where the moon should be."], ["T", "Where did it go?"], ["N", "You tilt it back. The moon is where it always was. Mothball purrs like a drum roll."], ["O", "“Felix had the trick. I had the reason. It was never about the moon, Nell. It was about two thousand people looking up at once. Keep the attic. Keep the cat. — O.”"], ["N", "The attic is yours. Merge as long as you like. Somewhere in the Circus Trunk’s chain there is still one thing nobody has seen."]]}], "orders": [{"say": "Got any yarn? I want to tie these bin bags shut properly.", "beat": "Bin bags tied. And under this sheet… a hatbox full of sequins. Buttons, apparently.", "by": "T"}, {"say": "Mrrp. (He wants a note to bat about under the rafters.)", "beat": "(He bats the note under a floorboard. Something underneath it rattles.)", "by": "M"}, {"say": "Find me an envelope for the receipts. There are… a lot of receipts.", "beat": "These receipts are all from a theatrical costumier in Covent Garden. Forty years of them.", "by": "T"}, {"say": "(He is pawing at a loose floorboard. A bolt and some yarn might shift it.)", "beat": "Under the floorboard: a playbill, folded small. The name on it has been scratched out.", "by": "N"}, {"say": "Wrench for the hatch hinge, and a sock to stop it squeaking. Don’t ask.", "beat": "Hatch fixed. Sock… deployed. Now we can get the big dust sheets off.", "by": "T"}, {"say": "Half these bulbs are dead. Spare one?", "beat": "Now I can see the rafters have writing on them. Dates. Cities. Paris, 1964.", "by": "T"}, {"say": "Bundle up those letters, dear. Letters want keeping together.", "beat": "Look at the postmarks. She told us she’d never been further than Brighton.", "by": "P"}, {"say": "(He has claimed a pair of opera gloves. Or he would like to.)", "beat": "(He curls up in the opera gloves like they were made for him. They may have been.)", "by": "M"}, {"say": "Hammer and a candle. The fuse box has opinions.", "beat": "The fuses are labelled in her handwriting. “Stage left.” “Stage right.” “Moon.”", "by": "T"}, {"say": "Another bundle. And look for ticket stubs tucked in them, I want to see where she played.", "beat": "A ticket stub. Front row, the Palladium. She kept one from every night.", "by": "P"}, {"say": "(He wants gloves to sleep on and a torch to guard them with.)", "beat": "Mothball has found the warmest spot in the attic. It is directly above the dust sheet with the trunk under it.", "by": "N"}, {"say": "(He drops a playing card at your feet. Then another. He wants the whole deck.)", "beat": "Every card in the deck is the same card. The ace of moons.", "by": "N"}, {"say": "A lantern and a wind-up key. That panel has a keyhole, and I’m not leaving it alone.", "beat": "The panel opens on a tiny clockwork stage. Little moon, little curtains. It still works.", "by": "T"}, {"say": "Is that silk? Let me see. Oh, that’s real silk.", "beat": "This silk was a costume once. You can see where the sequins were unpicked.", "by": "P"}, {"say": "If there’s a wand in that trunk I am absolutely going to wave it.", "beat": "I waved it. Nothing happened. I’m a bit gutted, honestly.", "by": "T"}, {"say": "(He is sitting on a stack of nothing, waiting for a diary to sit on instead.)", "beat": "The diary he chooses to sit on is the one from 1968.", "by": "N"}, {"say": "A diary and a silk bow to tie it shut. Some secrets want a ribbon.", "beat": "She tied her letters with silk bows. I used to see them on her doormat.", "by": "P"}, {"say": "A top hat! Bring it here, I want to try it on. Don’t tell anyone.", "beat": "It fits. Don’t you dare laugh.", "by": "P"}, {"say": "A saw and a stopwatch. Every trick in that corner is timed.", "beat": "The stopwatch is stopped at four minutes twelve. The exact length of the Moon act on the programme.", "by": "T"}, {"say": "(He has made a nest of letters. It needs a scarf.)", "beat": "In the nest of letters: one from Felix. Never opened.", "by": "N"}, {"say": "The programme says there was a rabbit. I need to see the rabbit.", "beat": "It’s not a real rabbit. It’s a very good puppet. I’m not crying, it’s dusty.", "by": "T"}, {"say": "A bonnet! And the gown she wore with it. I had one just like it. Well. Nearly.", "beat": "She wore this to my wedding. I never knew it was a costume.", "by": "P"}, {"say": "(He is batting a photograph around her tool roll. He wants both.)", "beat": "The photograph is of the last night of the Vanishing Moon. Seat A1 is empty. It was reserved for “F.”", "by": "N"}, {"say": "Her tool roll and the oil lamp. This false wall comes down today.", "beat": "The false wall comes away. Behind it, a mirror. Of course there’s a mirror.", "by": "T"}, {"say": "Her stage gown, under the spotlight. I want to see it properly.", "beat": "Oh, Odile. You were magnificent.", "by": "P"}, {"say": "(He and the rabbit are having a standoff. Music might calm everyone down.)", "beat": "The music settles it. Cat and rabbit share the windowsill.", "by": "N"}, {"say": "The whole archive, in order. And the photographs that go with it.", "beat": "The photos line up with the diaries. Every city, every year. Then nothing after 1969.", "by": "T"}, {"say": "Hold the gown still while I fix the beading, love. Pass me the tool roll.", "beat": "Every bead stitched by hand. That’s months of work, love.", "by": "P"}, {"say": "Stagehand’s tools to angle the mirror, and the violin for the overture.", "beat": "Mirror angled. Wireless tuned. All we need now is the moon.", "by": "T"}, {"say": "The dove. It belongs with the trick.", "beat": "She forgave him, you know. She just never told him.", "by": "P"}, {"say": "(The masks and the tiara. He is dressing the set like he’s done it before.)", "beat": "The set is dressed. Mothball takes his mark.", "by": "N"}, {"say": "The spotlight and the violin. She’d have wanted music.", "beat": "A bit of music for the finale. She’d insist.", "by": "P"}, {"say": "“…a crystal, and someone who looks.”", "beat": ""}], "notes": ["“New moon. Nothing to see. That’s the best time to set up.”", "“Crescent. Show them a sliver and they fill in the rest themselves. People love to finish a picture.”", "“Half moon. Half the trick is the method. The other half is the reason. Felix only ever had the first half.”", "“Full moon. Everyone looks up at once. That’s the moment, Nell. Not the vanishing. The looking.”"], "letters": ["“Odelia. I have the method and no idea what to do with it. When I make the moon vanish, they look at me. They’re supposed to look up.” — F.", "“Paris, 1973. I did the Moon tonight. It vanished perfectly and nobody gasped. I don’t understand. It’s the same trick.” — F.", "“London, 1979. I came to the stage door. You’d gone. They said you’d given it all up for sewing. I bought a ticket for a show that wasn’t on.” — F.", "“1985. I have a theory. You never hid the moon. You hid the audience from themselves for a second, then gave them back. I can’t do that part.” — F.", "“Last one, I think. I’m keeping seat A1 warm. If you ever do it again, I’ll be looking up.” — F."], "story": {"cover": "a quiet seamstress", "truth": "a stage magician", "truePlace": "theatre", "object": "The Vanishing Moon", "impossible": "a playing card: the ace of moons", "thesis": "It was never about the moon. It was about two thousand people looking up at once", "motif": "seat A1", "yearGone": "1968", "yearSplit": "1969", "excuse": "nursing a sister in Lyon"}};

/* required fields per step, for progress */
function req(id){
  const P=[];
  if(id==='premise') P.push('title','subtitle','player','terms.place','terms.covered','absent.name','absent.initial','absent.alias','partner.name','partner.initial',...Object.keys(W.story).map(k=>'story.'+k));
  if(id==='cast') ['T','P','M','S'].forEach(k=>P.push(`cast.${k}.name`,`cast.${k}.av`));
  if(id==='chains') MAIN.forEach(c=>{ P.push(`chains.${c.k}.name`); for(let i=0;i<c.len;i++) P.push(`chains.${c.k}.items.${i}.e`,`chains.${c.k}.items.${i}.n`); });
  if(id==='story'){ P.push('chains.S.name'); for(let i=0;i<8;i++) P.push(`chains.S.items.${i}.e`,`chains.S.items.${i}.n`,`chains.S.items.${i}.lore`); }
  if(id==='extras'){ [...RARES,...RES].forEach(c=>{ P.push(`chains.${c.k}.name`); for(let i=0;i<(c.len||4);i++) P.push(`chains.${c.k}.items.${i}.e`,`chains.${c.k}.items.${i}.n`); }); }
  if(id==='gens'){ GENS.forEach(g=>{ P.push(`gens.${g.k}.name`); for(let i=0;i<3;i++) P.push(`gens.${g.k}.items.${i}.e`,`gens.${g.k}.items.${i}.n`); }); P.push('gens.FG.name','gens.FG.items.0.e','gens.FG.items.0.n'); }
  if(id==='chapters') W.chapters.forEach((c,i)=>{ P.push(`chapters.${i}.title`); c.intro.forEach((_,j)=>P.push(`chapters.${i}.intro.${j}.1`)); c.outro.forEach((_,j)=>P.push(`chapters.${i}.outro.${j}.1`)); });
  if(id==='orders') W.orders.forEach((o,i)=>{ P.push(`orders.${i}.say`); if(ORD[i][1]!=='O') P.push(`orders.${i}.beat`); });
  if(id==='side'){ for(let i=0;i<4;i++) P.push(`notes.${i}`); for(let i=0;i<5;i++) P.push(`letters.${i}`); }
  return P;
}
function pct(id){ if(!W) return null; const P=req(id); if(!P.length) return null; return Math.round(P.filter(p=>String(get(p)||'').trim()).length/P.length*100); }

function renderSteps(){
  let tot=0,n=0;
  $('steps').innerHTML=STEPS.map((s,i)=>{ const p=pct(s.id); if(p!=null){ tot+=p; n++; }
    return `<button data-step="${i}" class="${i===step?'on':''}${p===100?' done':''}">${i+1}. ${s.t}${p!=null?` <span class="pc">${p===100?'✓':p+'%'}</span>`:''}</button>`; }).join('');
  $('pBar').style.width=(n?tot/n:0)+'%';
  $('steps').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
  const on=$('steps').querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
  $('hTitle').textContent=W&&W.title?W.title+' · Workshop':'Event Workshop';
}
function go(i){ step=Math.max(0,Math.min(STEPS.length-1,i)); save(); render(); window.scrollTo(0,0); }
let sub={chapter:0, ordCh:1};

function render(){
  if(!W){ W=null; }
  const s=STEPS[step].id, m=$('main');
  m.innerHTML = W||s==='start' ? VIEWS[s]() : VIEWS.start();
  renderSteps(); bind(); if(VIEWS[s+'_bind']) VIEWS[s+'_bind']();
  $('back').disabled=step===0; $('back').style.opacity=step===0?.4:1;
  $('next').textContent = step===STEPS.length-1 ? '▶ Play' : 'Next ›';
}
function bind(){
  $('main').querySelectorAll('[data-p]').forEach(el=>{
    el.oninput=()=>{ set(el.dataset.p, el.value); save();
      const wc=$('main').querySelector(`[data-wc="${CSS.escape(el.dataset.p)}"]`); if(wc){ const n=words(el.value), mx=+el.dataset.max; wc.textContent=`${n} / ${mx} words`; wc.classList.toggle('over',n>mx); }
      clearTimeout(bind._t); bind._t=setTimeout(()=>{ renderSteps(); refreshTokens(); },400); };
  });
  $('main').querySelectorAll('[data-wc]').forEach(wc=>{ const el=$('main').querySelector(`[data-p="${CSS.escape(wc.dataset.wc)}"]`); if(el) wc.classList.toggle('over',words(el.value)>+el.dataset.max); });
}
/* skeleton hints update live as the premise is filled in */
function refreshTokens(){ $('main').querySelectorAll('[data-skel]').forEach(el=>{ el.innerHTML=fill(el.dataset.skel); }); }
const skel=t=>`<div class="skel" data-skel="${esc(t)}">${fill(t)}</div>`;
const WHO={N:'Narrator',O:'Note',T:'Sceptic',P:'Witness',M:'Guide',F:'Letter'};
const whoName=k=>{ const c=W.cast[k]; if(k==='N') return 'Narrator'; if(k==='O') return (W.absent.name?W.absent.name+'’s note':'Note'); return (c&&c.name?`${c.av||''} ${c.name}`:WHO[k]); };

const VIEWS={};
VIEWS.start=()=>`<h2>Make your own event</h2>
  <p class="lead">Build a story event with the same structure and balance as Larkspur Attic, then play it.</p>
  ${tips(['Fill the premise first; every later hint uses your words','Each chain climbs from the cover story (bottom) to the truth (top)','The board, orders, rewards and pacing are fixed, so balance stays right','Everything saves on this phone as you type','▶ plays your event at any time, even half-written'],'How it works')}
  ${tips(['Cosy, wry, a little sad underneath','Short lines: about 13 words; never over 35','Evidence, not explanation: let the player work it out','The guide never speaks, never explained, always a step ahead','Jokes thin out as the stakes rise; one joke in the finale'],'The voice')}
  <h3>Story structure</h3>
  ${Object.entries(STRUCTURES).map(([k,st])=>`<div class="pack" style="border-color:var(--gold)"><b>${esc(st.name)} ✓</b><span>${esc(st.mood)} · ${esc(st.shape)}</span></div>`).join('')}
  <p class="mini">More structures to come: ${FUTURE.map(f=>esc(f.split(':')[0])).join(' · ')}. Each will have its own tone, cast and beats.</p>
  ${W?`<button class="big go" id="contBtn">Continue “${esc(W.title||'untitled')}”</button>`:''}
  <button class="big${W?'':' go'}" id="newBtn">Start a new event</button>
  <button class="big" id="exBtn">Open the Larkspur Attic example</button>
  <button class="big" id="impBtn">📂 Import an event file</button>
  ${W?`<button class="big warn" id="wipeBtn">Delete this draft</button>`:''}
  <p class="ver">Workshop ${VERSION} · <a href="event.html">Event player</a> · <a href="larkspur-attic.html">Larkspur Attic</a></p>`;
VIEWS.start_bind=()=>{
  const arm=(b,fn,msg)=>{ if(!b) return; b.onclick=()=>{ if(b.dataset.arm){ fn(); return; } b.dataset.arm=1; b._t=b.textContent; b.textContent=msg; b.classList.add('warn'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent=b._t; b.classList.remove('warn'); } },3000); }; };
  if($('contBtn')) $('contBtn').onclick=()=>go(1);
  const fresh=()=>{ W=blank(); save(); go(1); };
  if(W) arm($('newBtn'),fresh,'Tap again: this replaces your draft'); else $('newBtn').onclick=fresh;
  const ex=()=>{ W=Object.assign(blank(),JSON.parse(JSON.stringify(EXAMPLE))); W.id='larkspur-example'; save(); go(1); toast('Example loaded. Change anything you like.'); };
  if(W) arm($('exBtn'),ex,'Tap again: this replaces your draft'); else $('exBtn').onclick=ex;
  $('impBtn').onclick=()=>$('importFile').click();
  arm($('wipeBtn'),()=>{ W=null; try{ localStorage.removeItem(DRAFT); }catch(e){} step=0; render(); },'Tap again to delete');
};

  <h3>💡 Start from an idea</h3><p class="mini">Tap one to fill this page; then make it yours.</p>
  ${PACKS.map((p,i)=>`<button class="pack" data-pack="${i}"><b>${esc(p.t)}</b><span>${esc(p.cover)} → ${esc(p.truth)} · ${esc(p.object)}</span></button>`).join('')}
  <h3>The event</h3>
  ${field('title','Event title',{ph:'e.g. Gull Point Light',hint:'The place’s name; shown on the title screen'})}
  ${field('subtitle','Subtitle',{ph:'e.g. The Night Lantern',hint:'Usually the name of the secret object'})}
  ${field('player','Player’s name',{ph:'e.g. Nell',hint:'The silent protagonist who inherits the place'})}
  ${field('terms.place','The place (one word or two)',{ph:'e.g. lighthouse',hint:'Used in lines like “the {PLACE} is yours”'})}
  ${field('terms.covered','What covers the locked parts of the board?',{ph:'e.g. dust sheets',hint:'“Still under {COVERED}”'})}
  <h3>The absent one</h3>
  ${field('absent.name','Name',{ph:'e.g. Great-Aunt Clem',hint:'Who left the place behind; speaks only through notes'})}
  ${field('absent.initial','Initial (signs the notes)',{ph:'e.g. C'})}
  ${field('absent.alias','Secret name / stage name',{ph:'e.g. C. Thorne',hint:'Revealed at the end of chapter 2'})}
  ${field('story.cover','The cover story: what everyone believed',{ph:'e.g. a fussy hobby gardener'})}
  ${field('story.truth','The truth: what they really were',{ph:'e.g. the breeder of a lost rose'})}
  ${field('story.truePlace','What the place secretly is',{ph:'e.g. breeding laboratory',hint:'Revealed in chapter 5 (“this whole wall is part of a …”)'})}
  <h3>The partner (the counter-voice)</h3>
  ${field('partner.name','Name',{ph:'e.g. Julian',hint:'Had half of the secret and left; writes 5 letters'})}
  ${field('partner.initial','Initial',{ph:'e.g. J'})}
  <h3>The secret</h3>
  ${field('story.object','The secret object / trick / work',{ph:'e.g. The Midnight Rose',hint:'Named in chapter 3, performed in the finale'})}

  ${field('story.thesis','The thesis',{ph:'It was never about X. It was about Y',hint:'Only said plainly in the last note',area:1,max:25})}
  ${field('story.motif','A small recurring image',{ph:'e.g. an empty seat, a pressed petal',hint:'Appears in 2+ places, never explained'})}
  ${field('story.yearGone','The year they vanished from ordinary life',{ph:'e.g. 1958'})}
  ${field('story.yearSplit','The year the partner left with half',{ph:'e.g. 1962'})}
  ${field('story.excuse','The excuse they gave',{ph:'e.g. a cousin’s farm in Kent',hint:'The witness remembers it in chapter 3; evidence contradicts it'})}`;
VIEWS.premise_bind=()=>{
  $('main').querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm && (W.title||W.story.cover)){ b.dataset.arm=1; b.classList.add('arm'); b.querySelector('span').textContent='Tap again to replace your premise and cast'; return; }
    const p=PACKS[+b.dataset.pack];
    Object.assign(W,{title:p.t,subtitle:p.sub}); W.player=W.player||'Nell';
    W.terms.place=p.place; W.terms.covered=p.covered;
    W.absent={name:p.absent,initial:p.ini,alias:p.alias}; W.partner={name:p.partner,initial:p.pini};
    Object.assign(W.story,{cover:p.cover,truth:p.truth,truePlace:p.truePlace,object:p.object,impossible:p.impossible,thesis:p.thesis,motif:p.motif,yearGone:p.yearGone,yearSplit:p.yearSplit,excuse:p.excuse});
    W.cast.T={name:p.sc[0],av:p.sc[1]}; W.cast.P={name:p.wi[0],av:p.wi[1]}; W.cast.M={name:p.gu[0],av:p.gu[1]}; W.cast.S={name:p.side[0],av:p.side[1]};
    save(); render(); toast('Premise and cast filled. Make it yours.');
  });
};

function ladder(k,len,bands,roles,lore){
  const c=W.chains[k]||W.gens[k], base=W.chains[k]?'chains':'gens';
  let h='';
  for(let i=0;i<len;i++){
    const b=bands?bands[i]:'fixed', lab=bands?{cover:'cover',crack:'crack',truth:'truth'}[b]:'';
    h+=`<div class="lv"><div class="tag ${b}">L${i+1}${lab?`<small>${lab}</small>`:''}</div><div class="grow">
      ${roles&&roles[i]?`<div class="role">${roles[i]}</div>`:''}
      <div class="row">${emoIn(`${base}.${k}.items.${i}.e`)}<input data-p="${base}.${k}.items.${i}.n" value="${esc(c.items[i].n||'')}" placeholder="Level ${i+1} name"></div>
      ${lore?`<textarea data-p="chains.S.items.${i}.lore" data-max="30" placeholder="One sentence of lore, more intimate than the last">${esc(c.items[i].lore||'')}</textarea><div class="wc" data-wc="chains.S.items.${i}.lore">${words(c.items[i].lore)} / 30 words</div>`:''}
    </div></div>`;
  }
  return h;
}
const ideaChips=(k,list)=>list&&list.length?`<div class="ideas">${list.map((l,i)=>`<button class="chip" data-ladder="${k}" data-i="${i}">💡 ${esc(l[0])} … ${esc(l[l.length-1])}</button>`).join('')}</div>`:'';
function bindLadders(){
  $('main').querySelectorAll('[data-ladder]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ladder, c=W.chains[k]||W.gens[k], list=(LADDERS[k]||[])[+b.dataset.i]||RES_IDEAS[k];
    if(c.items.some(x=>x.n) && !b.dataset.arm){ b.dataset.arm=1; b.classList.add('arm'); b.textContent='Tap again to replace this chain'; return; }
    list.forEach((s,i)=>{ if(!c.items[i]) return; const sp=s.indexOf(' '); c.items[i].e=s.slice(0,sp); c.items[i].n=s.slice(sp+1); });
    save(); render(); toast('Filled. Rename anything to fit your story.');
  });
}

  ${MAIN.map(c=>`<div class="card"><h3 style="margin-top:0">${c.k} · ${c.slot}</h3><p class="mini">${c.what}. ${c.len} levels. Made by ${esc(nm(GENS.find(g=>g.makes===c.k).k,1)||'its generator')}.</p>

VIEWS.chapters=()=>{
  const i=sub.chapter, C=W.chapters[i], K=CH_SKEL[i];
  const lines=(arr,part)=>arr.map(([w,t],j)=>{ const sk=K[part][j]; return `<div class="line"><div class="who">${esc(whoName(w))}</div>${skel(sk[1])}
    <textarea data-p="chapters.${i}.${part}.${j}.1" data-max="35" placeholder="${sk[2]?esc(fill(sk[1],false)):'Write this line'}">${esc(t)}</textarea><div class="wc" data-wc="chapters.${i}.${part}.${j}.1">${words(t)} / 35 words</div></div>`; }).join('');
  return `<h2>Chapters</h2><p class="lead">Six chapters, three acts. Each ending answers a question and asks a bigger one.</p>
  <div class="tabs">${W.chapters.map((c,k)=>`<button data-ch="${k}" class="${k===i?'on':''}">${k+1}</button>`).join('')}</div>
  <div class="card"><b>Chapter ${i+1}</b> · ${K.acts} · ${K.zone} · gifts: ${fill(K.gifts)}</div>
  ${field(`chapters.${i}.title`,'Chapter title',{ph:'e.g. Dust Sheets'})}
  ${tips(['Hints in grey show what each line does, using your words','Guide lines: write the action in (brackets)','Lines with a pre-written hint can be kept as is: leave blank to use it'],'This chapter')}
  <h3>Opening scene</h3>${lines(C.intro,'intro')}
  <h3>After its last order</h3>${lines(C.outro,'outro')}`;
};
VIEWS.chapters_bind=()=>$('main').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ sub.chapter=+b.dataset.ch; render(); });

VIEWS.orders=()=>{
  const c=sub.ordCh;
  const cards=ORD.map((o,i)=>[o,i]).filter(([o])=>o[0]===c).map(([o,i])=>{
    const O=W.orders[i], needs=o[2].split(' ').map(x=>{ const [k,l]=x.split('.'); const it=(W.chains[k]||{items:[]}).items[+l-1]||{}; return `<span class="need"><b>${esc(it.e||'❔')}</b>${esc(it.n||k+' L'+l)}</span>`; }).join('');
    const final=o[1]==='O';
    return `<div class="order"><div class="head"><span class="num">#${i+1} · ${esc(whoName(o[1]))} asks</span><span class="btype">${o[3]} · ${o[4]}</span></div>
      <div class="needs">${needs}</div><p class="mini" style="margin:2px 0 6px">${BEATS[o[3]]}</p>${skel(o[5])}
      ${field(`orders.${i}.say`,'Request',{ph:final?'The last of the ingredients, in their voice':'Wants the item for a mundane reason',area:1,max:20})}
      ${final?'':`<div class="mini">Reply spoken by</div><div class="seg" data-by="${i}">${[o[1],'N'].map(w=>`<button data-w="${w}" class="${(O.by||o[1])===w?'on':''}">${esc(whoName(w))}</button>`).join('')}</div>
      ${field(`orders.${i}.beat`,'Reply when handed in',{ph:'One line: a clue, a laugh, or both',area:1,max:22})}`}</div>`; }).join('');
  return `<h2>Orders</h2><p class="lead">33 requests. Who asks and what they need are fixed (that’s the balance); you write the words.</p>
  ${tips(['Request: a mundane, in-character reason to want the item','Reply: one clue or one laugh, physically linked to the item','The guide’s requests and replies are (stage directions)','Threads: '+THREADS])}
  <div class="tabs">${[1,2,3,4,5,6].map(k=>`<button data-oc="${k}" class="${k===c?'on':''}">Ch ${k}</button>`).join('')}</div>${cards}`;
};
VIEWS.orders_bind=()=>{
  $('main').querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{ sub.ordCh=+b.dataset.oc; render(); });
  $('main').querySelectorAll('[data-by]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ W.orders[+seg.dataset.by].by=b.dataset.w; save(); seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
};

VIEWS.side=()=>`<h2>Notes & letters</h2>
  <p class="lead">Optional depth. Players who read them understand the ending before it arrives.</p>
  ${tips(['Notes and letters answer the thesis from opposite sides','Notes: the absent one knew why it worked','Letters: the partner spent a life trying to work it out','Keep each to one or two sentences'])}
  <h3>${esc(W.absent.name||'The absent one')}’s notes</h3><p class="mini">One per level of ${esc(W.chains.PT.name||'pass points')}, on the first claim.</p>
  ${[0,1,2,3].map(i=>`<div class="line"><div class="who">${esc(nm('PT',i+1)||'Level '+(i+1))}</div>${skel(NOTE_SKEL[i])}<textarea data-p="notes.${i}" data-max="30" placeholder="“…”">${esc(W.notes[i])}</textarea><div class="wc" data-wc="notes.${i}">${words(W.notes[i])} / 30 words</div></div>`).join('')}
  <h3>${esc(W.partner.name||'The partner')}’s letters</h3><p class="mini">Unlocked at pass tiers 3, 6, 9, 12 and 15, in date order.</p>
  ${[0,1,2,3,4].map(i=>`<div class="line"><div class="who">Letter ${i+1}</div>${skel(LETTER_SKEL[i])}<textarea data-p="letters.${i}" data-max="40" placeholder="“…” — {P_INITIAL}.">${esc(W.letters[i])}</textarea><div class="wc" data-wc="letters.${i}">${words(W.letters[i])} / 40 words</div></div>`).join('')}`;

/* labels default from earlier answers; blank = use the default */
function derived(){
  const T=tokens(), side=W.cast.S.name||'side orders', sl=side.toLowerCase(), place=T.PLACE||'place', sg=T.SG?W.gens.SG.items[0].n:'trunk';
  return { energyWord:(W.chains.EN.name||'energy').toLowerCase(), xpWord:(W.chains.XP.name||'stars').toLowerCase(), freeVerb:`make ${(W.chains.EN.name||'energy').toLowerCase()}`,
    ptWord:(W.chains.PT.items[0].n||'token').toLowerCase(), passName:(W.chains.PT.name?W.chains.PT.name.replace(/s$/,'')+' Pass':'Event Pass'),
    notesTitle:T.ABSENT?`${T.ABSENT}’s notebook`:'The notebook', lettersTitle:T.PARTNER?`${T.PARTNER}’s letters`:'The letters', loreFoundIn:`Found in the ${sg}`,
    storyEmpty:`Nothing yet. Somewhere in the ${place} is a ${sg} nobody can open.`, sideName:side, sideSold:`Sold at the ${sl}`,
    sideSay:`For the ${sl}. Anything you can spare.`, luckySay:`A lucky find! Something small for the ${sl}.`,
    doneTitle:`The ${place} is yours`, doneFound:`You found ${W.chains.S.items[7].n||'the last secret'}. ${T.ABSENT||'They'} would be smug.`, doneKeep:`Keep merging. The ${sg} still hides one last secret.`,
    completeTitle:W.subtitle||T.OBJECT||'Event complete', completeText:`You restored the ${place} and found out who ${T.ABSENT||'they'} really was.`,
    completeMore:`The board stays open. Merge as long as you like. The ${sg} chain has one level nobody has reached yet.`, storyHook:T.ABSENT?`Fill orders to uncover ${T.ABSENT}’s story`:'Fill orders to uncover the story' };
}
const LABELS=[['passName','Pass name'],['ptWord','A pass token is a…'],['energyWord','Energy is called'],['xpWord','Stars are called'],['freeVerb','The free generator lets you…'],['notesTitle','Title of the notes scenes'],['lettersTitle','Title of the letters scenes'],['loreFoundIn','Heading when a story item is found'],['storyEmpty','Journal, before any story item'],['sideName','Side orders label'],['sideSold','When a side order is done'],['sideSay','Side order request'],['luckySay','Lucky side order request'],['doneTitle','Order bar after the ending (title)'],['doneFound','…if they found the hidden top item'],['doneKeep','…if they haven’t yet'],['completeTitle','Ending card title'],['completeText','Ending card text'],['completeMore','Ending card small print'],['storyHook','Title screen line about the story']];
VIEWS.labels=()=>{ const D=derived(); return `<h2>Words & labels</h2><p class="lead">Small words used around the game. Blank fields use the grey default, built from your answers.</p>
  ${tips(['Defaults are usually fine','Change any that sound wrong in your world'])}
  ${LABELS.map(([k,l])=>`<div class="f"><label>${l}</label><input data-p="terms.${k}" value="${esc(W.terms[k]||'')}" placeholder="${esc(D[k])}"></div>`).join('')}`; };

/* ============================================================ build the playable config */
function build(){
  const D=derived(), E=JSON.parse(JSON.stringify(W));
  E.terms=Object.assign({},D,Object.fromEntries(Object.entries(W.terms).filter(([k,v])=>String(v||'').trim())));
  E.terms.place=W.terms.place||'place'; E.terms.covered=W.terms.covered||'covers';
  E.title=W.title||'Untitled event'; E.subtitle=W.subtitle||'';
  // blank names fall back to something readable, never to the template's story
  const fixChain=(k,c)=>{ c.name=c.name||k; c.items.forEach((it,i)=>{ it.e=it.e||'❔'; it.n=it.n||`${c.name} ${i+1}`; if('lore' in it) it.lore=it.lore||''; }); };
  Object.entries(E.chains).forEach(([k,c])=>fixChain(k,c)); Object.entries(E.gens).forEach(([k,c])=>fixChain(k,c));
  E.cast.O.name=W.cast.O.name||`${W.absent.name||'Their'}’s note`; E.cast.F.name=W.cast.F.name||`${W.partner.name||'The partner'}’s letter`;
  ['T','P','M','S'].forEach(k=>{ E.cast[k].name=E.cast[k].name||WHO[k]||'Side orders'; E.cast[k].av=E.cast[k].av||'🙂'; });
  E.chapters.forEach((c,i)=>{ c.title=c.title||`Chapter ${i+1}`;
    ['intro','outro'].forEach(part=>c[part]=c[part].map(([w,t],j)=>{ const sk=CH_SKEL[i][part][j]; return [w, String(t||'').trim() || (sk[2]?fill(sk[1],false):'')]; })); });
  E.orders.forEach((o,i)=>{ if(!String(o.say||'').trim()){ const its=ORD[i][2].split(' ').map(x=>{ const [k,l]=x.split('.'); return E.chains[k].items[+l-1]; }).map(it=>`${it.e} ${it.n}`); o.say=`Could you find me a ${its.join(' and a ')}?`; } });
  E.notes=E.notes.map(t=>t||'…'); E.letters=E.letters.map(t=>t||'…');
  delete E.checks; return E;
}
function play(){ const E=build(); try{ localStorage.setItem(CURRENT,JSON.stringify(E)); }catch(e){} location.href='event.html'; }
function download(){
  const E=build(), blob=new Blob([JSON.stringify(E,null,1)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(E.title||'event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Saved to your downloads');
}
const CHECKS=['Chapter 1 opens on an impossible object or contradiction','Every chapter ending answers one question and asks a bigger one','No line explains the backstory; evidence only','Each character has a job, a voice and a small arc','The guide is never explained, always a step ahead','Each chain climbs from the cover story to the truth','The motif shows up in 2+ places','Notes and letters answer the thesis from opposite sides','Comedy thins out; one joke in the finale','The ending reframes the title, gives a gift, leaves a door ajar'];
VIEWS.review=()=>{
  const issues=[]; STEPS.forEach((s,i)=>{ const P=req(s.id); const miss=P.filter(p=>!String(get(p)||'').trim()); if(miss.length) issues.push([i,`${s.t}: ${miss.length} blank`]); });
  const long=[]; const chk=(p,max,label,si)=>{ const n=words(get(p)); if(n>max) long.push([si,`${label}: ${n} words (max ${max})`]); };
  W.chapters.forEach((c,i)=>['intro','outro'].forEach(part=>c[part].forEach((_,j)=>chk(`chapters.${i}.${part}.${j}.1`,35,`Ch${i+1} ${part} line ${j+1}`,7))));
  W.orders.forEach((_,i)=>{ chk(`orders.${i}.say`,20,`Order #${i+1} request`,8); chk(`orders.${i}.beat`,22,`Order #${i+1} reply`,8); });
  return `<h2>Review & play</h2><p class="lead">Blank fields still play (with simple defaults), so you can test as you go.</p>
  <button class="big go" id="playBtn2">▶ Play this event</button>
  <button class="big" id="dlBtn">💾 Save event file (.json)</button>
  <button class="big" id="cpBtn">📋 Copy event as text</button>
  ${tips(['The event file is everything the game needs; keep it in your vault','Load it in the player with “📂 Load event file”','Progress is saved per event, so testing won’t touch Larkspur Attic'],'Saving')}
  <h3>Still to write</h3>${issues.length?issues.map(([i,t])=>`<div class="issue"><span>${esc(t)}</span><button data-jump="${i}">Go</button></div>`).join(''):'<p class="mini">Nothing blank. ✓</p>'}
  <h3>Lines that run long</h3>${long.length?long.slice(0,20).map(([i,t])=>`<div class="issue"><span>${esc(t)}</span><button data-jump="${i}">Go</button></div>`).join('')+(long.length>20?`<p class="mini">…and ${long.length-20} more</p>`:''):'<p class="mini">All within length. ✓</p>'}
  <h3>Story checklist</h3>${CHECKS.map((t,i)=>`<label class="chk"><input type="checkbox" data-chk="${i}" ${W.checks&&W.checks[i]?'checked':''}><span>${t}</span></label>`).join('')}`;
};
VIEWS.review_bind=()=>{
  $('playBtn2').onclick=play; $('dlBtn').onclick=download;
  $('cpBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(build())); toast('Copied'); }catch(e){ toast('Copy isn’t allowed here; use Save instead'); } };
  $('main').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(+b.dataset.jump));
  $('main').querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{ W.checks=W.checks||{}; W.checks[c.dataset.chk]=c.checked; save(); });
};

/* ============================================================ wiring */
$('back').onclick=()=>go(step-1);
$('next').onclick=()=>{ if(step===STEPS.length-1){ play(); return; } if(!W){ W=blank(); } go(step+1); };
$('playTop').onclick=()=>{ if(!W){ toast('Start or open an event first'); return; } play(); };
$('importFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const ev=JSON.parse(await f.text()); if(!ev||ev.format!=='merge-event/1') throw 0;
    const b=blank(); W=Object.assign(b,ev); W.terms=Object.assign(b.terms,ev.terms||{}); W.story=Object.assign(b.story,ev.story||{}); W.checks=W.checks||{};
    save(); go(1); toast('Event imported');
  }catch(err){ toast('That file isn’t an event from the Workshop'); } e.target.value=''; };
/* full screen */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
$('fsBtn').onclick=async()=>{ try{ if(fsEl()){ await (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  const el=document.documentElement, r=el.requestFullscreen||el.webkitRequestFullscreen; if(!r) throw 0; await r.call(el,{navigationUI:'hide'}); }catch(e){ toast('📱 On iPhone: Share → Add to Home Screen for full screen',3500); } };
const fsSync=()=>$('fsPath').setAttribute('d', fsEl()?'M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4':'M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4');
document.addEventListener('fullscreenchange',fsSync); document.addEventListener('webkitfullscreenchange',fsSync);
/* first tap anywhere asks for full screen once, like the games */
document.addEventListener('pointerdown',function once(e){ document.removeEventListener('pointerdown',once,true); if(e.target.closest('#fsBtn')) return; if(!fsEl()){ try{ const el=document.documentElement, r=el.requestFullscreen||el.webkitRequestFullscreen; const p=r&&r.call(el,{navigationUI:'hide'}); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } },true);
/* self-update */
async function checkUpdate(){ try{ if(location.protocol==='file:') return; const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
  const m=(await r.text()).match(/const VERSION='([^']+)'/); if(m&&m[1]!==VERSION){ const box=$('updBox'); box.innerHTML=`🔄 New version ${m[1]} <button id="updGo">Update now</button>`; box.hidden=false;
  $('updGo').onclick=()=>{ location.href=location.pathname+'?v='+encodeURIComponent(m[1].split(' ')[0]); }; } }catch(e){} }
checkUpdate(); setInterval(checkUpdate,4*60*1000);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(W){ const b=blank(); W=Object.assign(b,W); }
if(!W && step) step=0;
render();
</script>
