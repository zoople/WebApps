     if(c.it.focus) html+=`<i class=\"focus\">${CHAINS.E.items[2].e}${c.it.focus}<\/i>`;\n            if(c.it.ch<d.charges){\n              const p=Math.min(1,(now()-c.it.t)/d.rechargeMs), C=2*Math.PI*44;\n              html+=`<svg class=\"ring\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle class=\"trk\" cx=\"50\" cy=\"50\" r=\"44\"/><circle class=\"arc\" cx=\"50\" cy=\"50\" r=\"44\" stroke-dasharray=\"${(p*C).toFixed(1)} ${C.toFixed(1)}\"/><\/svg>`;\n              if(c.it.ch===0) cls+=' cool';\n            }\n          }\n          if(d.charges && chargedCell(i)){ cls+=' charged'; html+=`<i class=\"x2\">×2<\/i>`; }\n        } else {\n          if(isRes(c.it)) cls+=' res'; else if(isBoost(c.it)) cls+=' boost';\n          if(isCharger(c.it)){\n            if(c.it.on){ const C=2*Math.PI*44, p=Math.max(0,(c.it.end-now())/chargerMs(c.it)); cls+=' charging';\n              html+=`<svg class=\"ring\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle class=\"trk\" cx=\"50\" cy=\"50\" r=\"44\"/><circle class=\"arc tc\" cx=\"50\" cy=\"50\" r=\"44\" stroke-dasharray=\"${(p*C).toFixed(1)} ${C.toFixed(1)}\"/><\/svg><i class=\"gen\">⏳${fmt(Math.ceil((c.it.end-now())/1000))}<\/i>`; }\n            else html+=`<b class=\"musttag tc\">Tap<\/b>`;\n          }\n          if(c.it.st){ cls+=' must'; html+=`<b class=\"musttag\">Tap<\/b>`; }\n          else if(c.it.l===maxL(c.it.k) && (isRes(c.it)||def(c.it).recycle)) cls+=' maxed'; // only pulse tops you can tap to collect\n          if(needed.has(key(c.it.k,c.it.l))) html+=`<b class=\"chk\">✓<\/b>`;\n          else if(sideNeeded.has(key(c.it.k,c.it.l))) html+=`<b class=\"chk side\">✓<\/b>`;\n        }\n      }\n    }\n    if(i===sel) cls+=' sel';\n    if(fx[i]) cls+=' '+fx[i];\n    if(el.className!==cls) el.className=cls;\n    if(el._h!==html){ el.innerHTML=html; el._h=html; }\n  });\n  // replay animations: force reflow for fx cells then clear\n  if(Object.keys(fx).length){\n    const f=fx; fx={};\n    setTimeout(()=>{ Object.keys(f).forEach(i=>cellEls[i]&&cellEls[i].classList.remove(f[i])); }, f && Object.values(f).includes('hint')?2400:420);\n  }\n  renderHud(); renderOrders(tasks); renderInfo();\n  if(S.genQ&&S.genQ.length&&!genBusy){ genBusy=true; setTimeout(playGenStory,450); }\n}\nfunction renderHud(){\n  $('coins').textContent=S.coins; $('chips').textContent=S.chips||0;\n  $('passIc').textContent=CHAINS.N.items[0].e; $('pts').textContent=S.pts||0; $('passDot').hidden=!passReady();\n  { const l=stageOf(S.xp), lo=l>1?stageNeed(l-1):0, hi=stageNeed(l);\n    $('xpLv').textContent=l; $('xpTxt').textContent=`${S.xp-lo}/${hi-lo}`; $('xpBar').style.width=((S.xp-lo)/(hi-lo)*100)+'%'; }\n  $('giftBtn').hidden=!S.gifts.length; $('giftCount').textContent=S.gifts.length; renderPip();\n  const ci=Math.min(S.ch,CHAPTERS.length-1);\n  const chT=TASKS.filter(t=>t.ch===ci), dn=chT.filter(t=>S.done[t.id]).length;\n  $('chNum').textContent = S.complete?'Event complete':'Chapter '+(ci+1);\n  $('chName').textContent = CHAPTERS[ci].title;\n  $('chCount').textContent = S.complete?'✨':`${dn}/${chT.length}`;\n  $('chBar').style.width = (S.complete?100:dn/chT.length*100)+'%';\n}\nfunction fmt(s){ s=Math.max(0,s); return s>=60? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : '0:'+String(s).padStart(2,'0'); }\nconst readySince={};\nfunction renderOrders(tasks){\n  const box=$('orders');\n  box.innerHTML='';\n  if(S.complete){\n    const has=STORY_KEY && S.disc[key(STORY_KEY,maxL(STORY_KEY))];\n    box.innerHTML=`<div class=\"empty done\"><div><b>${T.doneTitle}<\/b>${has?T.doneHas:T.doneNot}${REFLECTIONS.length?'<button class=\"sbtn refl\" id=\"reflBtn\">✨ Reflections<\/button>':''}<\/div><\/div>`;\n    const rb=box.querySelector('#reflBtn'); if(rb) rb.onclick=e=>{ e.stopPropagation(); showReflections(); };\n  }\n  ensureSide();\n  /* two groups, Story then Jumble Sale; a ready order jumps to the front of its own group only */\n  const tnow=now(); let storyNewlyReady=false;\n  const group=arr=>{\n    const list=arr.map((t,i)=>({t,i,ready:taskStatus(t).ready}));\n    list.forEach(o=>{ if(o.ready){ if(!readySince[o.t.id]){ readySince[o.t.id]=tnow; if(!o.t.side) storyNewlyReady=true; } } else delete readySince[o.t.id]; });\n    list.sort((a,b)=>(b.ready-a.ready) || (a.ready ? readySince[a.t.id]-readySince[b.t.id] : 0) || (a.i-b.i));\n    return list.map(o=>o.t);\n  };\n  const story=group(tasks), side=group(S.side);\n  const label=(txt,cls)=>{ const l=document.createElement('div'); l.className='grp '+cls; l.innerHTML=`<span>${txt}<\/span>`; box.appendChild(l); };\n  if(storyNewlyReady) box.scrollTo({left:0,behavior:'smooth'});\n  const rows=[];\n  if(story.length){ rows.push(['label','Story','g-story']); story.forEach(t=>rows.push(t)); }\n  if(side.length){ rows.push(['label',CAST.S.name,'g-side']); side.forEach(t=>rows.push(t)); }\n  rows.forEach(t=>{\n    if(Array.isArray(t)){ label(t[1],t[2]); return; }\n    const st=taskStatus(t);\n    const el=document.createElement('div');\n    el.className='order'+(st.ready?' ready':'')+(t.side?' side':'')+(t.lucky?' lucky':'');\n    el.dataset.id=t.id;\n    if(!t.side && (!(S.seenOrd||{})[t.id] || flying===String(t.id))) el.classList.add('incoming');\n    el.innerHTML=`${!t.side&&!(S.readOrd||{})[t.id]?'<i class=\"opip\" title=\"New story\"><\/i>':''}<div class=\"who\"><span class=\"av\">${CAST[t.who].av}<\/span><span>${t.lucky?'🍀 Lucky':CAST[t.who].name}<\/span><\/div>\n      <div class=\"needs\">${t.need.map(([k,l],j)=>`<span class=\"need${st.have[j]?' have':''}${CHAINS[k].tile?' tile':''}\">${CHAINS[k].items[l-1].e}${st.have[j]?'<i>✓<\/i>':''}<\/span>`).join('')}${t.wheel?`<span class=\"need wh${st.wok?' have':''}\">💡<small>${Math.min(wheelDone(),t.wheel)}/${t.wheel}<\/small>${st.wok?'<i>✓<\/i>':''}<\/span>`:''}${t.sales?`<span class=\"need wh${st.sok?' have':''}\">${CAST.S.av}<small>${Math.min(salesFor(t),t.sales)}/${t.sales}<\/small>${st.sok?'<i>✓<\/i>':''}<\/span>`:''}<\/div>\n      <div class=\"act${st.ready&&!t.side?' rd':''}\">${st.ready?(t.side?'Hand over':'✓ Ready'):(t.side?t.rw:taskRewards(t)).map(([k,l])=>CHAINS[k].items[l-1].e).join(' ')}<\/div>`;\n    // tap the card for details; only the green \"Hand over\" strip delivers\n    // story orders only hand over from their details popup; side orders can still go from the strip\n    el.onclick=e=>{ if(t.side && e.target.closest('.act') && taskStatus(t).ready){ deliver(t); return; } showOrder(t); };\n    box.appendChild(el);\n  });\n  if(flying===null && box.querySelector('.order.incoming')) setTimeout(runArrivals,60);\n}\nlet sellArm=false;\nfunction renderInfo(){\n  const box=$('info');\n  const c=S.cells[sel];\n  if(sel<0||!c||!c.it||c.s!=='open'){\n    const tip = S.gifts.length ? 'You have a gift waiting. Tap 🎁 to put it on the board.'\n      : 'Tap a generator twice to make something. Drag matching items together to merge.';\n    box.innerHTML=`<div class=\"big\">🐕<\/div><div class=\"txt hintline\">${tip}<\/div>`;\n    return;\n  }\n  const it=c.it, d=def(it), ch=CHAINS[it.k];\n  if(it.wrap){ box.innerHTML=`<div class=\"big\">🎁<\/div><div class=\"txt\"><div class=\"nm\">A present<\/div><div class=\"ds\">${T.presentDesc} Tap to open it.<\/div><\/div>`; return; }\n  let ds='';\n  if(ch.wheel){\n    box.innerHTML=`<div class=\"big\">🎡<\/div><div class=\"txt\"><div class=\"nm\">Prize Wheel<small>💡 ${wheelDone()}/20 lit<\/small><\/div><div class=\"ds\">Tap to open. ${WHEEL_COST} 🎟️ per spin. New segments move the story on.<\/div><\/div><div class=\"btns\"><button class=\"sbtn\" id=\"wOpen\">Spin<\/button><button class=\"sbtn\" id=\"tkBtn\">Get 🎟️<\/button><\/div>`;\n    $('wOpen').onclick=()=>openWheel(sel); $('tkBtn').onclick=ticketShop; return;\n  }\n  if(isGen(it)){\n    if(d.want){ const w=CHAINS[it.want[0]].items[it.want[1]-1], F=feedSpec(d); ds=`Wants ${w.e} ${w.n}. Drop one on it to get ${F.count>1?F.count+' × ':'a '}${CHAINS[F.gives].items[0].e} ${CHAINS[F.gives].items[0].n}. It asks for something new each time.`; }\n    else if(d.fuelled) ds = it.fuel>0 ? `Tap again to cook. ${it.fuel} fuel left.` : `Cold. Drag ${fuelNames()} onto it.`;\n    else if(d.uses) ds=`Tap again. ${it.left} left, then it ${d.after?`leaves a ${CHAINS[d.after[0]].items[d.after[1]-1].e}`:'folds flat for good'}.${d.free&&it.l<maxL(it.k)?` Merge two unopened ones for a ${ch.items[it.l].n}.`:''}`;\n    else if(d.free){ refreshCharges(it); ds = it.ch>0 ? `Tap again to brew. ${it.ch} left.` : `Boiling… ready in ${nextChargeIn(it)}s.`; }\n    else { const mk=ch.main||[...(d.drop||[])].sort((x,y)=>y[2]-x[2])[0][0]; ds=`Tap again to make ${CHAINS[mk].name.toLowerCase()}${ch.rare?`, sometimes a rare ${CHAINS[ch.rare].name.toLowerCase()} item`:''}.`; if(d.charges) ds+= it.ch>0?` ${it.ch} left before a rest.`:` Resting: next in ${fmt(nextChargeIn(it))}.`;\n      if(canFocus(it)) ds+= it.focus?` Focused for ${it.focus} more taps.`:` Drag ${CHAINS.E.items[0].e} onto it for better rare odds.`; }\n    if(it.l<maxL(it.k) && !d.want && !d.fuelled && !d.free) ds+=` Merge two to get a ${ch.items[it.l].n}.`;\n    if(d.charges && chargedCell(sel)) ds+=' ⏱️ A Time Charger is doubling its recharge speed.';\n  } else if(isCharger(it)){\n    const here=Math.round(d.hours*60*CONFIG.chargerScale);\n    ds = it.on ? `Running: ${fmt(Math.ceil((it.end-now())/1000))} left. Timed generators in the 8 tiles around it recharge twice as fast. When it runs out it tops them up and disappears.`\n               : `Tap again to switch on. Runs ${here} min, doubling the recharge speed of timed generators around it. Can’t be merged once on.`+(it.l<maxL(it.k)?` Merge two for a ${ch.items[it.l].n}.`:'');\n  } else if(it.st){\n    ds=T.notesItem;\n  } else if(isBoost(it)){\n    ds=`Drag onto a generator: its next ${FOCUS[it.l-1]} taps find rare items ${FOCUS_MULT}× more often.`+(it.l<maxL(it.k)?` Merge two for ${FOCUS[it.l]} taps.`:' Top of the chain.');\n  } else if(ch.type==='res'){\n    const unit = ch.claim==='coins'?'🪙' : ch.claim==='skip'?'min time skip' : ch.claim==='points'?T.passName+' points' : ch.claim==='chips'?'🎟️ (raffle tickets)' : '⭐ applause';\n    if(ch.claim==='skip') ds=`Tap again to skip ${d.v} min on every generator’s recharge.`+(it.l<maxL(it.k)?` Merge two for ${ch.items[it.l].v} min.`:'');\n    else ds=`Tap again to collect +${d.v} ${unit}.`+(it.l<maxL(it.k)?` Merge two for +${ch.items[it.l].v}.`:' Top of the chain.');\n  } else if(ch.dust){\n    ds=`Drag onto a cobweb tile to clear it. The item underneath is yours.`;\n  } else if(it.k==='ET'){\n    ds=`Drag onto a generator to refill it straight away.`;\n  } else {\n    ds = (fuelValue(it)?`Burns in the stove for ${fuelValue(it)} fuel. `:'') + (ch.rare?`Rare find from the ${genLabel(genFor(it.k))}. `:'') + (it.l<maxL(it.k) ? `Merge two to make: ${ch.items[it.l].e} ${S.disc[key(it.k,it.l+1)]?ch.items[it.l].n:'???'}` : 'The top of this chain.');\n  }\n  const sv=sellValue(it);\n  box.innerHTML=`<div class=\"big\">${d.e}<\/div>\n    <div class=\"txt\"><div class=\"nm\">${d.n}<small>${ch.name!==d.n?ch.name+' · ':''}Lv ${it.l}<\/small><\/div><div class=\"ds\">${ds}<\/div><\/div>\n    <div class=\"btns\"><button class=\"sbtn\" id=\"chainBtn\">Chain<\/button>${sv?`<button class=\"sbtn${sellArm?' warn':''}\" id=\"sellBtn\">${sellArm?'Sure?':'Sell 🪙'+sv}<\/button>`:''}<\/div>`;\n  $('chainBtn').onclick=()=>showChain(it.k, it.l);\n  if(sv) $('sellBtn').onclick=()=>{ if(sellArm){ sellArm=false; sell(sel); } else { sellArm=true; renderInfo(); } };\n}\n\n/* ============================================================ input: tap / drag */\nconst ghost=$('ghost');\nlet press=null;\nboard.addEventListener('pointerdown',e=>{\n  const el=e.target.closest('.cell'); if(!el) return;\n  const i=+el.dataset.i;\n  press={i,x:e.clientX,y:e.clientY,drag:false,id:e.pointerId};\n  board.setPointerCapture?.(e.pointerId);\n});\nboard.addEventListener('pointermove',e=>{\n  if(!press) return;\n  const c=S.cells[press.i];\n  if(!press.drag){\n    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<8) return;\n    if(c.s!=='open'||!c.it){ press=null; return; }\n    if(c.it.st){ const pi=press.i; press=null; flo(`Tap to read it ${T.tokenIcon}`, pi); return; }\n    press.drag=true; sellArm=false;\n    ghost.textContent=def(c.it).e;\n    board.children[press.i].classList.add('lift');\n  }\n  ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-60%) scale(1.1)`;\n  const t=cellAt(e.clientX,e.clientY);\n  [...board.querySelectorAll('.drop')].forEach(x=>x.classList.remove('drop'));\n  if(t>=0&&t!==press.i) board.children[t].classList.add('drop');\n});\nfunction endPress(e,cancel){\n  if(!press) return;\n  const p=press; press=null;\n  ghost.style.transform='translate(-999px,-999px)';\n  [...board.querySelectorAll('.drop,.lift')].forEach(x=>x.classList.remove('drop','lift'));\n  if(cancel) return;\n  if(p.drag){ drop(p.i, cellAt(e.clientX,e.clientY)); }\n  else tap(p.i);\n}\nboard.addEventListener('pointerup',e=>endPress(e,false));\nboard.addEventListener('pointercancel',e=>endPress(e,true));\nfunction cellAt(x,y){\n  const r=board.getBoundingClientRect();\n  if(x<r.left||x>=r.right||y<r.top||y>=r.bottom) return -1;\n  const cs=r.width/7;\n  return Math.floor((y-r.top)/cs)*7+Math.floor((x-r.left)/cs);\n}\nfunction tap(i){\n  const c=S.cells[i];\n  SND.play('tap');\n  if(c.s==='sheet'){ const n=CHAPTERS.findIndex(ch=>ch.zone===c.z)+1; flo(`${T.sheetTap} Opens in Chapter ${n}`, i); return; }\n  if(c.s==='box'){ flo('Merge next to a box to open it', i); return; }\n  if(c.s==='web'){ const d=def(c.it); flo(`Stuck. Drop another ${d.e} on it`, i); sel=-1; render(); return; }\n  if(!c.it){ sel=-1; sellArm=false; render(); return; }\n  if(c.it.wrap){ unwrap(i); return; }\n  if(c.it.st){ sel=i; claim(i); return; } // story rosette: one tap reads it\n  if(CHAINS[c.it.k].wheel){ sel=i; render(); openWheel(i); return; } // the wheel opens on one tap\n  if(sel===i){\n    if(isCharger(c.it) && !c.it.on){ activateCharger(i); return; }\n    if(isGen(c.it)){ produce(i); return; }\n    if(isBoost(c.it)){ SND.play('nope'); flo(`${def(c.it).e} Drag me onto a generator for rarer finds`, i); return; }\n    if(isRes(c.it)){ const ch=CHAINS[c.it.k]; if(ch.claimMax && c.it.l<maxL(c.it.k)){ SND.play('nope'); toast(`Merge up to a ${ch.items[maxL(c.it.k)-1].e} ${ch.items[maxL(c.it.k)-1].n} to claim ${T.passName} points`); return; } claim(i); return; }\n    return;\n  }\n  if(isGen(c.it)){ const gk=key(c.it.k,c.it.l); // a generator you never heard about: its story plays when you first pick it up\n    if(GEN_STORY[gk]&&!(S.genSeen||{})[gk]&&!(S.genQ||[]).includes(gk)){ (S.genQ=S.genQ||[]).unshift(gk); genBusy=true; setTimeout(playGenStory,150); } }\n  sel=i; sellArm=false; render();\n}\n\n/* ============================================================ overlays */\n/* toasts never cover story dialogue: while a scene is open they wait, then show once it closes */\nlet heldToasts=[];\nfunction flushToasts(){\n  const list=heldToasts.filter((t,i,a)=>a.findIndex(x=>x[0]===t[0])===i).slice(-3); heldToasts=[];\n  list.forEach(([h,ms],i)=>setTimeout(()=>toast(h,ms),250+i*450));\n}\nfunction storyOpen(){ return !$('scene').hidden || $('modal').dataset.story==='1'; }\n/* one toast at a time, docked over the info panel; it stays until tapped, then the next one shows.\n   Sits just under dialogs (z 45 vs 50) and waits while one is open, so it never blocks a button. */\nlet toastQ=[], toastCur=null;\nfunction hideToasts(){\n  if(toastCur){ heldToasts.push([toastCur.h,toastCur.ms]); toastCur.el.remove(); toastCur=null; }\n  toastQ.forEach(t=>heldToasts.push(t)); toastQ=[];\n}\nfunction dockToast(){\n  const r=$('info').getBoundingClientRect(), b=$('toast').style;\n  b.left=r.left+'px'; b.top=r.top+'px'; b.width=r.width+'px'; b.height=r.height+'px';\n}\nconst overlayOpen=()=>storyOpen()||!$('modal').hidden;\nfunction toastMore(){ if(!toastCur) return; const m=toastCur.el.querySelector('.tm'); m.textContent=toastQ.length?`+${toastQ.length} more`:''; }\nfunction nextToast(){\n  if(toastCur||overlayOpen()) return;\n  const n=toastQ.shift(); if(!n) return;\n  dockToast();\n  const el=document.createElement('div'); el.className='t'; el.innerHTML=`<div>${n[0]}<\/div><span class=\"tm\"><\/span><span class=\"tx\">✕<\/span>`;\n  $('toast').appendChild(el);\n  toastCur={el,h:n[0],ms:n[1]}; toastMore();\n}\nfunction closeToast(){\n  const cur=toastCur; if(!cur) return;\n  toastCur=null; SND.play('tap');\n  cur.el.classList.add('out'); setTimeout(()=>{ cur.el.remove(); nextToast(); },150);\n}\n$('toast').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); closeToast(); });\n/* flo: a small message that floats up from a tile (or the middle of the board) and fades. No tap needed, never queues.\n   Keep toast() for things you need to read or decide on. */\nlet floN=0;\nfunction flo(html, cell){\n  if(storyOpen()){ return; }\n  const host=document.body, el=document.createElement('div'); el.className='flo'; el.innerHTML=html;\n  let x, y; const br=board.getBoundingClientRect();\n  if(cell!=null && cell>=0 && board.children[cell]){ const r=board.children[cell].getBoundingClientRect(); x=r.left+r.width/2; y=r.top+4; }\n  else { x=br.left+br.width/2; y=br.top+br.height*.42; }\n  y-= (floN%3)*20; floN++; setTimeout(()=>floN=Math.max(0,floN-1),900);\n  el.style.left=Math.max(70,Math.min(innerWidth-70,x))+'px'; el.style.top=y+'px';\n  host.appendChild(el); setTimeout(()=>el.remove(),1900);\n}\nfunction toast(html,ms=2200){\n  if(storyOpen()){ heldToasts.push([html,ms]); return; }\n  if(toastQ.some(t=>t[0]===html) || (toastCur&&toastCur.h===html)) return;\n  toastQ.push([html,ms]); if(toastQ.length>5) toastQ.splice(0,toastQ.length-5);\n  if(toastCur) toastMore(); else nextToast();\n}\nfunction playQueue(q,done){\n  if(!q.length){ done&&done(); return; }\n  const s=q.shift();\n  playScene(s, ()=>playQueue(q,done));\n}\nfunction playScene(sc,done){\n  const ov=$('scene'); let i=0;\n  hideToasts();\n  ov.hidden=false; ov.classList.toggle('clear',!!sc.clear);\n  const show=()=>{\n    if(i>=sc.lines.length){ ov.hidden=true; ov.innerHTML=''; if(done) done(); if(!storyOpen()) flushToasts(); setTimeout(runArrivals,300); return; }\n    const [who,txt]=sc.lines[i], cst=CAST[who];\n    const cls = who==='N'?'narr': (who==='O'||who==='F')?'note':'';\n    ov.innerHTML=`${i===0&&sc.title&&!sc.clear?`<div class=\"scene-title\"><small>${sc.title}<\/small>${sc.sub||''}<\/div>`:sc.clear?'':'<div style=\"margin:auto\"><\/div>'}\n      <div class=\"dlg ${cls}\" id=\"dlg\" role=\"button\" tabindex=\"0\">\n        ${sc.clear&&sc.title?`<div class=\"dtitle\">${sc.title}${sc.sub?` · <span>${sc.sub}<\/span>`:''}<\/div>`:''}${cst.name?`<div class=\"spk\"><span class=\"av\">${cst.av}<\/span><b>${cst.name}<\/b><\/div>`:''}\n        <p>${txt}<\/p>\n        <div class=\"foot\"><span>${i+1} / ${sc.lines.length}<\/span><span>Tap to continue ›<\/span><\/div>\n      <\/div>\n      <button class=\"sbtn\" id=\"skipBtn\" style=\"margin-top:10px\">Skip scene<\/button>`;\n    $('dlg').onclick=()=>{ SND.play('page'); i++; show(); };\n    $('dlg').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); SND.play('page'); i++; show(); } };\n    $('skipBtn').onclick=()=>{ i=sc.lines.length; show(); };\n    $('dlg').focus();\n  };\n  show();\n}\nfunction openModal(html,story){ $('modalBody').innerHTML=html; $('modal').hidden=false; $('modal').dataset.story=story?'1':''; if(story) hideToasts(); }\nfunction closeModal(){ const was=$('modal').dataset.story==='1'; $('modal').hidden=true; $('modal').dataset.story=''; if(was && !storyOpen()) flushToasts(); setTimeout(nextToast,200); setTimeout(runArrivals,250); }\n$('modal').addEventListener('click',e=>{ if(e.target.id==='modal' && !wheelBusy) closeModal(); });\n\nfunction chainHtml(k,cur){\n  const ch=CHAINS[k];\n  return `<div class=\"chain\">${ch.items.map((d,j)=>{\n    const kk=key(k,j+1), known=S.disc[kk];\n    if(known && (S.unrev||{})[kk]) return `<div class=\"ci wrap${cur===j+1?' cur':''}\" data-rv=\"${kk}\" role=\"button\"><span>🎁<\/span>Tap<\/div>`;\n    return `<div class=\"ci${known?'':' unk'}${cur===j+1?' cur':''}\"><span>${known?d.e:'?'}<\/span>${known?d.n:'Lv '+(j+1)}<\/div>`;\n  }).join('')}<\/div>`;\n}\nfunction showChain(k,cur){\n  const ch=CHAINS[k];\n  let extra='';\n  if(ch.gen){ const d=ch.items[0]; extra=`<p class=\"ds\">Makes: ${[...new Set(d.drop.map(x=>x[0]))].map(x=>CHAINS[x].name).join(', ')}.<\/p>${chainHtml(d.drop[0][0])}`; }\n  else { const g=genFor(k); if(g) extra=`<p style=\"color:var(--muted);font-size:13px\">Comes from the ${genLabel(g)}.<\/p>`; }\n  openModal(`<h2>${ch.name}<\/h2>${chainHtml(k,cur)}${extra}<div class=\"row-btns\"><button class=\"bigbtn\" onclick=\"closeModal()\">Close<\/button><\/div>`);\n}\nfunction showLore(it){\n  const d=def(it);\n  SND.play('magic');\n  openModal(`<h3 style=\"margin-top:0\">${T.loreFound}<\/h3><div style=\"font-size:54px;text-align:center\">${d.e}<\/div><h2 style=\"text-align:center\">${d.n}<\/h2><p style=\"font-style:italic;text-align:center\">${d.lore}<\/p><div class=\"row-btns\" style=\"justify-content:center\"><button class=\"bigbtn gold\" onclick=\"closeModal()\">Into the journal<\/button><\/div>`,true);\n}\nfunction journalHtml(){\n  let html=(S.complete&&REFLECTIONS.length?'<div class=\"row-btns\" style=\"margin-top:4px\"><button class=\"bigbtn gold\" data-refl=\"1\">✨ Reflections<\/button><\/div>':'')+`<h3 style=\"margin-top:4px\">Chapters<\/h3>`;\n  const upto=S.complete?CHAPTERS.length:S.ch+1;\n  for(let c=0;c<upto;c++){\n    const fin=S.journal.includes(c);\n    html+=`<div class=\"entry\"><b>${c+1}. ${CHAPTERS[c].title}<\/b><div class=\"row-btns\" style=\"margin-top:6px\">\n      <button class=\"sbtn\" data-scene=\"i${c}\">Replay opening<\/button>${fin?`<button class=\"sbtn\" data-scene=\"o${c}\">Replay ending<\/button>`:''}<\/div><\/div>`;\n  }\n  html+=`<h3>${T.loreHeading}<\/h3>`;\n  const lore=CHAINS.M.items.map((d,j)=>S.disc[key('M',j+1)]?`<div class=\"lore\"><span>${d.e}<\/span><div><b>${d.n}<\/b>${d.lore}<\/div><\/div>`:'').join('');\n  html+= lore || `<p style=\"color:var(--muted)\">${T.loreEmpty}<\/p>`;\n  if(wheelDone()>0){\n    html+=`<h3>💡 Under the wheel lights <span style=\"color:var(--muted);font-weight:400;font-size:13px\">${wheelDone()}/${WHEEL_N}<\/span><\/h3>`;\n    html+=wheelListHtml(true);\n  }\n  const mn=MOON_NOTES.filter((_,j)=>(S.moonSeen||{})[j+1]), fx=FELIX.filter((_,j)=>S.passGot[j*3+2]);\n  if(mn.length||fx.length){\n    html+=`<h3>Letters & notes<\/h3>`;\n    mn.forEach(ls=>html+=`<div class=\"lore\"><span>🌙<\/span><div>${ls[ls.length-1][1]}<\/div><\/div>`);\n    fx.forEach(ls=>html+=`<div class=\"lore\"><span>✉️<\/span><div>${ls.find(l=>l[0]==='F')[1]}<\/div><\/div>`);\n  }\n  return html;\n}\nfunction wireJournal(){\n  const rf=$('modalBody').querySelector('[data-refl]'); if(rf) rf.onclick=()=>{ closeModal(); showReflections(); };\n  $('modalBody').querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{\n    const s=b.dataset.scene, c=+s.slice(1), ch=CHAPTERS[c];\n    closeModal();\n    playScene({title:'Chapter '+(c+1), sub:ch.title, lines: s[0]==='i'?ch.intro:ch.outro});\n  });\n}\n/* ============================================================ mini quests */\nfunction stat(k,n=1){\n  if(!S) return;\n  const st=S.stats||(S.stats={}); st[k]=(st[k]||0)+n;\n  const q=QUESTS.find(x=>x.id===k);\n  if(q){ const t=(S.qt||{})[k]||0, tgt=q.steps[t];\n    if(tgt && st[k]>=tgt && st[k]-n<tgt) setTimeout(()=>{ SND.play('gift'); toast(`📋 Quest done: ${q.ic} ${q.n} ${tgt}<br><small>Claim it in 📖<\/small>`,3000); },250); }\n  renderPip();\n}\nfunction questReady(q){ const t=(S.qt||{})[q.id]||0; return t<q.steps.length && ((S.stats||{})[q.id]||0)>=q.steps[t]; }\nfunction questRw(t){ return QUEST_RW[Math.min(t,QUEST_RW.length-1)].map(([k,l])=>[k,Math.min(l,maxL(k))]); }\nfunction renderPip(){\n  const p=$('bookPip'); if(!p||!S) return;\n  const n=QUESTS.filter(questReady).length+Object.keys(S.unrev||{}).length;\n  p.hidden=!n; p.textContent=n>99?'99+':n;\n}\nfunction questsHtml(){\n  let h=`<p style=\"color:var(--muted);font-size:13px;margin-top:0\">• Little goals that run all event<br>• Each has several stages<br>• Rewards go to 🎁<\/p>`;\n  const row=q=>{ const t=S.qt[q.id]||0, v=S.stats[q.id]||0, fin=t>=q.steps.length, tgt=q.steps[Math.min(t,q.steps.length-1)], ready=questReady(q);\n    return {q,ready,fin,frac:fin?2:Math.min(1,v/tgt),html:`<div class=\"quest${ready?' done':''}${fin?' fin':''}\"><span class=\"qi\">${q.ic}<\/span><div class=\"qb\"><div class=\"qn\">${q.n}${fin?'':' '+tgt}<\/div>\n      <div class=\"qbar\"><i style=\"width:${fin?100:Math.min(100,v/tgt*100)}%\"><\/i><\/div>\n      <div class=\"qs\">${fin?'All stages done ✓':`${Math.min(v,tgt)}/${tgt} · stage ${t+1} of ${q.steps.length} · ${questRw(t).map(([k,l])=>CHAINS[k].items[l-1].e).join(' ')}`}<\/div><\/div>\n      ${ready?`<button class=\"sbtn\" style=\"background:var(--gold);color:#2a1a10\" data-q=\"${q.id}\">Claim<\/button>`:''}<\/div>`}; };\n  QUESTS.map(row).sort((a,b)=>(b.ready-a.ready)||(a.fin-b.fin)||(b.frac-a.frac)).forEach(r=>h+=r.html);\n  return h;\n}\nfunction claimQuest(id){\n  const q=QUESTS.find(x=>x.id===id); if(!q||!questReady(q)) return;\n  const t=S.qt[q.id]||0; S.qt[q.id]=t+1;\n  questRw(t).forEach(r=>S.gifts.push(r));\n  SND.play('gift');\n  save(); render(); showBook('q');\n}\n\n/* ============================================================ collection: new finds wait here, wrapped, until tapped */\nconst rwTxt=r=>[r.c?`🪙${r.c}`:'', r.x?`⭐${r.x}`:''].filter(Boolean).join(' ');\nfunction revealDisc(kk,el,quiet){\n  if(!(S.unrev||{})[kk]) return null;\n  const m=kk.match(/^([a-zA-Z]+?)(\\d+)$/); if(!m||!CHAINS[m[1]]) { delete S.unrev[kk]; return null; }\n  const k=m[1], l=+m[2], d=CHAINS[k].items[l-1], r=discRw(k,l);\n  delete S.unrev[kk];\n  S.coins+=r.c; if(r.x) addXP(r.x);\n  if(el){ el.className='ci flip'; el.removeAttribute('data-rv'); el.removeAttribute('role'); el.innerHTML=`<span>${d.e}<\/span>${d.n}<b class=\"rw\">+${rwTxt(r)}<\/b>`; }\n  if(!quiet){ SND.play(l>=5?'gift':'coin'); save(); render(); bookCounts(); }\n  return r;\n}\nfunction revealAll(){\n  const els=[...$('modalBody').querySelectorAll('[data-rv]')]; if(!els.length) return;\n  $('revAll').disabled=true;\n  const tot={c:0,x:0};\n  els.forEach((el,i)=>setTimeout(()=>{\n    const r=revealDisc(el.dataset.rv,el,true); if(r){ tot.c+=r.c; tot.x+=r.x; }\n    if(i%2===0) SND.play('coin');\n    if(i===els.length-1){ Object.keys(S.unrev||{}).forEach(kk=>{ const r2=revealDisc(kk,null,true); if(r2){ tot.c+=r2.c; tot.x+=r2.x; } });\n      SND.play('gift'); save(); render(); bookCounts(); const b=$('revAll'); if(b) b.parentNode.remove(); }\n  }, i*110));\n}\nfunction collectionHtml(){\n  const un=Object.keys(S.unrev||{}).length;\n  let h=`<p style=\"color:var(--muted);font-size:13px;margin-top:0\">• New finds wait here, wrapped 🎁<br>• Tap one to reveal it and collect a reward<br>• Higher levels pay more<\/p>`;\n  if(un>1) h+=`<div class=\"row-btns\" style=\"margin-top:0\"><button class=\"bigbtn gold\" id=\"revAll\">Reveal all ${un}<\/button><\/div>`;\n  const groups=[['Items',ch=>!ch.gen&&!ch.type&&ch.rare!==true],['Rare finds',ch=>!ch.gen&&ch.rare===true],['Resources',ch=>ch.type==='res'||ch.type==='boost'],['Generators',ch=>ch.gen]];\n  let hidden=0;\n  groups.forEach(([name,fn])=>{\n    const ks=Object.keys(CHAINS).filter(k=>fn(CHAINS[k]));\n    const found=ks.filter(k=>CHAINS[k].items.some((_,j)=>S.disc[key(k,j+1)]));\n    hidden+=ks.length-found.length;\n    if(!found.length) return;\n    // chains with wrapped finds first\n    found.sort((a,b)=>CHAINS[b].items.some((_,j)=>S.unrev[key(b,j+1)])-CHAINS[a].items.some((_,j)=>S.unrev[key(a,j+1)]));\n    h+=`<div class=\"cgrp\">${name}<\/div>`;\n    found.forEach(k=>{ const ch=CHAINS[k], n=ch.items.filter((_,j)=>S.disc[key(k,j+1)]).length;\n      h+=`<p class=\"cname\">${ch.name}<small>${n}/${ch.items.length}<\/small><\/p>${chainHtml(k)}`; });\n  });\n  if(hidden) h+=`<p style=\"color:var(--muted);font-size:13px;margin-top:14px\">${hidden} more chain${hidden>1?'s':''} still to find.<\/p>`;\n  return h;\n}\n\n/* ============================================================ the book: quests · collection · journal */\nlet bookTab='q';\nfunction bookCounts(){\n  const qn=QUESTS.filter(questReady).length, un=Object.keys(S.unrev||{}).length;\n  document.querySelectorAll('.tabs [data-tab]').forEach(b=>{ const n=b.dataset.tab==='q'?qn:b.dataset.tab==='c'?un:0; let p=b.querySelector('.pip');\n    if(n){ if(!p){ p=document.createElement('i'); p.className='pip'; b.appendChild(p); } p.textContent=n; } else if(p) p.remove(); });\n  renderPip();\n}\nfunction showBook(tab){\n  const qn=QUESTS.filter(questReady).length, un=Object.keys(S.unrev||{}).length;\n  tab=tab||(qn?'q':un?'c':bookTab); bookTab=tab;\n  const T=(id,lbl)=>`<button data-tab=\"${id}\" class=\"${tab===id?'on':''}\">${lbl}<\/button>`;\n  let h=`<div class=\"tabs\">${T('q','📋 Quests')}${T('c','🧩 Collection')}${T('j','📖 Journal')}<\/div>`;\n  h+= tab==='q'?questsHtml() : tab==='c'?collectionHtml() : journalHtml();\n  h+=`<div class=\"row-btns\"><button class=\"bigbtn\" onclick=\"closeModal()\">Close<\/button><\/div>`;\n  openModal(h);\n  $('modalBody').scrollTop=0;\n  bookCounts();\n  $('modalBody').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ SND.play('page'); showBook(b.dataset.tab); });\n  $('modalBody').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.q));\n  if($('revAll')) $('revAll').onclick=revealAll;\n  if(tab==='j') wireJournal();\n}\nconst showJournal=()=>showBook('j');\n$('modalBody').addEventListener('click',e=>{ const t=e.target.closest('[data-rv]'); if(t) revealDisc(t.dataset.rv,t); });\n\n/* ============================================================ new story orders arrive: big at the bottom, then fly up into the row */\nvar flying=null;\nfunction runArrivals(){\n  if(flying!==null||!S||S.complete||storyOpen()||!$('modal').hidden||!$('title').hidden) return;\n  const box=$('orders'), el=box.querySelector('.order.incoming'); if(!el) return;\n  const id=el.dataset.id; flying=id; const hold=box.querySelectorAll('.order.incoming').length>1?850:1400;\n  box.scrollTo({left:0});\n  const tr=el.getBoundingClientRect(), W=tr.width, H=tr.height;\n  const card=document.createElement('div'); card.className='arrive';\n  card.innerHTML='<div class=\"arrive-tag\">📜 New story request<\/div>';\n  const cl=el.cloneNode(true); cl.classList.remove('incoming'); cl.style.cssText=`width:${W}px;height:${H}px;margin:0`; card.appendChild(cl);\n  const x0=(innerWidth-W)/2, y0=innerHeight*.74-H/2;\n  card.style.left=x0+'px'; card.style.top=y0+'px'; card.style.width=W+'px';\n  document.body.appendChild(card);\n  SND.play('page');\n  card.animate([{transform:'translateY(70px) scale(.6)',opacity:0},{transform:'translateY(0) scale(1.4)',opacity:1}],{duration:450,easing:'cubic-bezier(.2,.9,.3,1.25)',fill:'forwards'});\n  setTimeout(()=>{\n    const tgt=box.querySelector(`.order[data-id=\"${id}\"]`), r=(tgt||el).getBoundingClientRect();\n    card.querySelector('.arrive-tag').animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'});\n    const a=card.animate([{transform:'translate(0,0) scale(1.4)',opacity:1},{transform:`translate(${r.left-x0}px,${r.top-y0}px) scale(1)`,opacity:1}],{duration:620,easing:'cubic-bezier(.55,0,.3,1)',fill:'forwards'});\n    a.onfinish=()=>{\n      card.remove(); (S.seenOrd||(S.seenOrd={}))[id]=1; save(); flying=null;\n      const t2=box.querySelector(`.order[data-id=\"${id}\"]`); if(t2){ t2.classList.remove('incoming'); t2.classList.add('landed'); }\n      SND.play('tap');\n      setTimeout(runArrivals,200);\n    };\n  },hold);\n}\n\nlet resetArm=false;\nfunction showMenu(){\n  openModal(`<h2>${EVENT.title}<\/h2><p style=\"color:var(--muted)\">${EVENT.tagline} · no timer · story ${EVENT.version}<br>Merge Stories ${VERSION}<\/p>\n    <div class=\"row-btns\"><button class=\"bigbtn gold\" id=\"shopOpen\">🛒 ${P2.shopName}<\/button><\/div>\n    <h3>Sound<\/h3>\n    <div class=\"row-btns\" style=\"margin-top:0\"><button class=\"bigbtn${SND.pref.music?' gold':''}\" id=\"musBtn\">♪ Music: ${SND.pref.music?'On':'Off'}<\/button><button class=\"bigbtn${SND.pref.sfx?' gold':''}\" id=\"sfxBtn\">Sound effects: ${SND.pref.sfx?'On':'Off'}<\/button><\/div>\n    <h3>Help<\/h3><div class=\"row-btns\" style=\"margin-top:0\"><button class=\"bigbtn\" id=\"sosOpen\">I’m stuck…<\/button><\/div>\n    <h3>Stories<\/h3><div class=\"row-btns\" style=\"margin-top:0\"><button class=\"bigbtn\" id=\"ejectMenu\">⏏ Change story<\/button><\/div><p style=\"color:var(--muted);font-size:13px\">Each story keeps its own save.<\/p>\n    <h3>Save<\/h3><p style=\"color:var(--muted);font-size:13px\">Progress saves in this browser automatically.<\/p>\n    <div class=\"row-btns\"><button class=\"bigbtn warn\" id=\"resetBtn\">${resetArm?'Tap again to wipe everything':'Restart event'}<\/button><button class=\"bigbtn\" onclick=\"closeModal()\">Close<\/button><\/div>`);\n  $('shopOpen').onclick=showShop;\n  $('ejectMenu').onclick=()=>ejectStory();\n  $('musBtn').onclick=()=>{ SND.setMusic(!SND.pref.music); showMenu(); };\n  $('sosOpen').onclick=showSOS;\n  $('sfxBtn').onclick=()=>{ SND.setSfx(!SND.pref.sfx); showMenu(); SND.play('tap'); };\n  $('resetBtn').onclick=()=>{ if(!resetArm){ resetArm=true; showMenu(); return; } resetArm=false; S=freshState(); sel=-1; save(); closeModal(); render(); startIntro(); };\n}\n/* emergency help: small, slow to refill, a couple of taps deep so it stays a last resort */\nconst SOS_COOLDOWN=30*60000;\nfunction showSOS(){\n  const left=k=>Math.max(0,Math.ceil(((S[k]||0)+SOS_COOLDOWN-now())/1000));\n  const tl=left('sosT'), el=left('sosE');\n  openModal(`<h2>I’m stuck<\/h2><p style=\"color:var(--muted);font-size:13px\">• For when there’s genuinely nothing to d his father’s store and swept its floor every morning, thinking about lids.'},\n    {e:'🔩',n:'The Twist Lid', lore:'Sweeping up a smashed jar of marmalade, Emilio had his idea: a lid that screws on and never leaks.'},\n    {e:'🏭',n:'Factory Deed', lore:'He took the idea to the bank, and the Bellavista Jar Works was born.'},\n    {e:'💸',n:'The Fortune', lore:'By 1910 every kitchen in America had a Bellavista jar. Emilio was a very rich man, and still restless.'},\n    {e:'🏡',n:'House Plans', lore:'With his fortune he built a house with a great walled garden, and an orangery for forty trees, because oranges smelled like the one good thing about the crossing.'},\n    {e:'🌍',n:'Postcards from Everywhere', lore:'Passion for travel, the papers said. It wasn’t. He sailed the world for twenty years looking for the girl with the oranges.'}]},\n  /* the statue: the Star Board pays out its fragments; whole again, it becomes the stonemason's yard */\n  ST:{name:'The Statue', items:[\n    {e:'🪨',n:'Marble Fragment'},{e:'🗿',n:'Broken Statue'},\n    {e:'🏛️',n:'Stonemason’s Yard', gen:true, charges:24, rechargeMs:60000, drop:[['SJ',1,30],['SJ',2,32],['SJ',3,22],['SJ',4,12],['SJ',5,4]]}]},\n  /* the stonemason's work, up to the piece the statue is missing */\n  SJ:{name:'Stonework', items:[\n    {e:'🫙',n:'Jam Jar'},{e:'🍯',n:'Marmalade Pot'},{e:'🏺',n:'Terracotta Pot'},{e:'⚱️',n:'Stone Urn'},\n    {e:'🧱',n:'Carving Block'},{e:'✋',n:'Stone Hand'},{e:'🤚',n:'Polished Hand'},{e:'🍊',n:'The Stone Orange'}]},\n  /* resources: tap twice to claim */\n  C:{name:'Coins', type:'res', claim:'coins', items:[\n    {e:'🪙',n:'Penny',v:1},{e:'💶',n:'Banknote',v:5},{e:'👛',n:'Coin Purse',v:12},{e:'💰',n:'Money Bag',v:30},{e:'💎',n:'Jar King’s Fortune',v:75}]},\n  X:{name:'Applause', type:'res', claim:'xp', items:[\n    {e:'👏',n:'Clap',v:1},{e:'🙌',n:'Cheer',v:3},{e:'🎉',n:'Hooray',v:8},{e:'🎊',n:'Celebration',v:20},{e:'🏆',n:'Garden Prize',v:50}]},\n  N:{name:'Stars', type:'res', claim:'points', items:[\n    {e: hat’s Garibaldi. He was here before me. He was here before everybody.'],\n      ['N','<em>• Tap the ☎️ telephone twice for brass numbers<br>• The ⚙️ mulcher shows the number it wants: drop it in for six 🌱 seedlings<br>• Tap the 📦 pallet to unpack it<\/em>'],\n    ],\n    outro:[\n      ['P','Look at that. Actual floor. There’s a whole garden out there under the brambles.'],\n      ['W','There’s a plinth by the front gate, too. Empty. Has been since before my time.'],\n      ['P','An empty plinth. Who steals a statue?'],\n      ['W','<em>(Wilf finds something urgent to do with a hosepipe.)<\/em>'],\n    ]},\n  { title:'Brambles', zone:1, gifts:[['DR',1]],\n    intro:[\n      ['N','Behind the garage the brambles are taller than you. Somewhere in there is a walled garden.'],\n      ['P','There’s a trunk in here with a name on it. E. Bellavista, Genoa.'],\n      ['W','Emilio. He built this place. Came over on a boat when he was nine.'],\n      ['N','<em>(A 🪶 feather duster is in your gifts. Drag it onto a cobwebbed tile to clear it.)<\/em>'],\n    ],\n    outro:[\n      ['N','Under the brambles: a long glasshouse, its panes green with age. Inside, a row of dead trees in tubs.'],\n      ['W','Orange trees. Forty of them. He had them shipped from Sicily, one by one.'],\n      ['P','Oranges. In Wisconsin.'],\n      ['W','He didn’t like being told no. Especially by the weather.'],\n    ]},\n  { title:'The Orangery', zone:2, gifts:[['GB',5]],\n    intro:[\n      ['N','You prop the orangery doors open. It smells of dust and, very faintly, still of oranges.'],\n      ['P','Why oranges? He made jars. He should have built a jar museum.'],\n      ['W','Ask Garibaldi. He was there.'],\n      ['M','<em>(Garibaldi walks slowly to the oldest tree and lies against its tub, the way you might lean on an old friend.)<\/em>'],\n      ['N','<em>(A 🪑 garden bench is in your gifts. Merge two benches for a ⛲ fountain: it turns up pieces of Emilio’s story.)<\/em>'],\n    ],\n    outro:[\n      ['N','Tucked in the soil of the oldest tub: a dried orange peel, kept in wax paper for a hundred years.'],\n      ['P','Who keeps orange peel for a hundred years?'],\n      ['W','Somebody who couldn’t keep the girl it came from.'],\n      ['P','What girl?'],\n      ['W','Ask me tomorrow.'],\n    ]},\n  { title:'Postcards', zone:3, gifts:[['gC',1]],\n    intro:[\n      ['N','The last corner of the garden is a potting shed, and the potting shed is full of postcards.'],\n      ['N','Hundreds. Cairo, Lima, Bombay, Cork. All addressed the same way: “To the girl with the oranges.” Not one of them sent.'],\n      ['P','He wrote to her for twenty years and never posted a single one?'],\n      ['W','He had no address. No name. Just the oranges, and the colour of her hair.'],\n      ['N','<em>(A 🕰️ grandfather clock is in your gifts. It makes time charger shards: merge them up and switch one on to speed up the generators around it.)<\/em>'],\n    ],\n    outro:[\n      ['P','So. He crossed on the ship, she shared her oranges, and they lost each other at the docks.'],\n      ['P','Then he spent his whole life getting rich enough to go and look for her, and never found her.'],\n      ['W','I never said that.'],\n      ['P','Wilf.'],\n      ['W','The statue on the front gate. Bring it back, and I’ll tell you who it was.'],\n    ]},\n  { title:'The Empty Plinth', zone:null, gifts:[['ET',1]],\n    intro:[\n      ['N','Wilf leads you to a corner of the garage you haven’t opened. Under a tarpaulin: broken marble.'],\n      ['W','Taken down in 1943 for safekeeping. The stonemason died before he could put her back. Nobody else knew how.'],\n      ['P','Her. So it IS a woman.'],\n      ['W','<em>(Wilf says nothing at all, very loudly.)<\/em>'],\n      ['N','<em>(Earn ✨ stars to collect the statue fragments from the Star Board. Merge them back into a 🗿 statue, then into a 🏛️ stonemason’s yard.)<\/em>'],\n    ],\n    outro:[\n      ['N','The statue stands on the bench in two halves: a woman in a gardener’s apron, one hand held out. The hand is missing.'],\n      ['P','What was she holding?'],\n      ['W','What do you think?'],\n      ['P','…An orange.'],\n    ]},\n  { title:'The Stone Orange', zone:null, gifts:[],\n    intro:[\n      ['N','The stonemason’s yard is working again. Wilf has found the old man’s chisels.'],\n      ['W','He carved the hand and the orange from life. Said he’d never had a sitter keep so still.'],\n      ['P','A sitter? She was HERE? He found her?'],\n      ['W','…Finish the hand.'],\n    ],\n    outro:[\n      ['N','The stone orange goes back into the stone hand. It fits as if it never left.'],\n      ['W','He came home in 1921, old and tired and done with looking. And the orangery smelled of oranges.'],\n      ['W','The housekeeper had hired a gardener while he was away. A widow from Cork, red hair going grey. She’d kept his forty trees alive for six years.'],\n      ['P','The girl from the ship.'],\n      ['W','Clara. She saw the house in the papers, the jar king who built an orangery in Wisconsin, and she knew. So she came, and she waited.'],\n      ['P','Why didn’t she just write to him?'],\n      ['W','She said a man who plants forty orange trees for you can come home and find you himself.'],\n      ['W','They had eleven years. He put her on the gate so she’d be the first thing anyone saw.'],\n      ['M','<em>(Garibaldi walks to the plinth and settles at its foot, exactly where the moss is worn smooth.)<\/em>'],\n      ['W','Clara was my grandmother. I’ve kept her trees for fifty-one years. Somebody had to.'],\n      ['P','Wilf. The park opens in the spring. It’s going to be called Clara’s Garden.'],\n      ['W','<em>(Wilf looks at the hosepipe for a very long time.)<\/em>'],\n      ['N','The garden is yours. Merge as long as you like. There are still pieces of Emilio’s story nobody has found.'],\n    ]},\n];\n\n/* orders. Big beats carry `more`: a short exchange where the cast confirm what just happened. */\nconst TASKS = [\n  // ch1: the garage\n  {ch:0, who:'P', need:[['D',2]], coins:8, say:'This phone still has a dial tone! Bring me a brass “1” from it. I need to ring somebody about the brambles.', beat:['P','Engaged. The council’s line has been engaged since 1971, apparently.']},\n  {ch:0, who:'W', need:[['GB',2]], coins:8, say:'Feed the mulcher and get me some cuttings. If the hedge sees we mean business it might behave.', beat:['W','There. Now she knows we’re serious.']},\n  {ch:0, who:'M', need:[['GB',1]], coins:6, say:'(Garibaldi is staring at the seedlings. He has been staring for some time.)', beat:['M','<em>(He eats one seedling, very slowly, and looks at you as if you’ve done well.)<\/em>']},\n  {ch:0, who:'P', need:[['D',3],['GB',2]], coins:10, say:'A “2” for the gate code and some cuttings for the planters. I want the drive to look less haunted.', beat:['P','Less haunted. Still a bit haunted. It’s a start.']},\n  {ch:0, who:'W', need:[['GB',3]], coins:10, say:'A potted shrub by the garage door. His father kept one there, for luck.', beat:['W','A lemon tree, by the till. Never fruited once in thirty winters. He kept it anyway.']},\n  // ch2: brambles\n  {ch:1, who:'P', need:[['M',1]], coins:12, say:'There’s a steamer trunk in the brambles with a name on it. Bring it up to the house. Carefully!', beat:['P','E. Bellavista. Genoa to New York. He was nine.'], more:[['W','Nine years old, two weeks in steerage. No wonder he never sat still after.']]},\n  {ch:1, who:'W', need:[['GB',4]], coins:12, say:'A topiary tree for the gate. Even an empty plinth deserves company.', beat:['W','He had it clipped into a swan. I’ve only ever managed a duck.']},\n  {ch:1, who:'M', need:[['D',4],['GB',3]], coins:12, say:'(Garibaldi has knocked a “3” behind the shrubs and is sitting on a pot. He would like both back.)', beat:['M','<em>(He accepts both with great dignity and goes to sleep on them.)<\/em>']},\n  {ch:1, who:'P', need:[['D',5]], coins:14, say:'A “4” for the house number. Bellavista House, number four. There are no numbers one to three. Nobody knows why.', beat:['P','Wilf says Emilio bought the whole street, then couldn’t decide where to start.']},\n  {ch:1, who:'W', need:[['GB',5]], coins:16, say:'Bring me a garden bench. I’ve been standing up for fifty-one years and I’d like a sit.', beat:['W','Ahh. That’s the stuff. Don’t tell Priya.']},\n  // ch3: the orangery\n  {ch:2, who:'P', need:[['M',2]], coins:16, say:'Wilf says there’s a ship’s ticket somewhere in the orangery soil. Find it before he “tidies” it.', beat:['P','Steerage, 1893. Look, there’s an orange drawn in the corner. A child’s drawing.'], more:[['W','Not his. Hers.'],['P','Whose?'],['W','Ask me tomorrow.']]},\n  {ch:2, who:'W', need:[['D',6],['GB',4]], coins:16, say:'A “5” for the glasshouse thermostat and a topiary for the door. Oranges need coaxing.', beat:['W','Fifty-five degrees. Not one less. Clara’s rule.'], more:[['P','Who’s Clara?'],['W','Did I say Clara? Fifty-five degrees.']]},\n  {ch:2, who:'M', need:[['GB',5]], coins:16, say:'(Garibaldi wants a bench in the orangery, by the oldest tree. He is very clear about this.)', beat:['M','<em>(He doesn’t sit on it. He sits beside it, as if he’s saving it for somebody.)<\/em>']},\n  {ch:2, who:'P', need:[['M',3]], coins:18, say:'There were jars in that trunk. Mama’s preserves, Wilf says. I want one for the house.', beat:['P','Half of them leaked on the crossing. Look at that lid. Terrible lid.'], more:[['W','He thought so too. Nine years old and already cross about lids.']]},\n  {ch:2, who:'W', need:[['D',7],['M',3]], coins:18, say:'A “6” for the old railway timetable, and another of Mama’s jars. I’ve a hunch about something.', beat:['W','Train west, 1894. Papa opened a hardware shop by the lake. Nails, string and very good marmalade.']},\n  // ch4: postcards\n  {ch:3, who:'P', need:[['M',4]], coins:20, say:'A railway ticket keeps turning up in the fountain. Bring it to me. I’m building a timeline.', beat:['P','New York, then Wisconsin. And a girl on a boat. Why is she in every story and nowhere in the records?']},\n  {ch:3, who:'W', need:[['GB',5],['D',7]], coins:20, say:'Another bench, and a “6”. The potting shed has a combination lock and I’ve forgotten it. Twice.', beat:['W','Six-six-six. He had a sense of humour, Emilio.']},\n  {ch:3, who:'M', need:[['M',5]], coins:20, say:'(Garibaldi is scratching at a painted sign in the fountain. He wants it hung up.)', beat:['M','<em>(Once it’s hung, he sits under it and doesn’t move until supper.)<\/em>'], more:[['W','He was Papa’s tortoise first. Came over from Genoa in a hatbox.'],['P','He’s a hundred and thirty?'],['W','He doesn’t like to talk about it.']]},\n  {ch:3, who:'P', need:[['D',8],['GB',4]], coins:22, say:'A “7” for the postcard boxes and a topiary for the shed. I’m sorting all of them, every single one.', beat:['P','Four hundred and twelve postcards. Not one name. Just “the girl with the oranges”.']},\n  {ch:3, who:'W', need:[['M',6]], coins:24, say:'His school satchel is in that fountain somewhere. Fifteen, he was, when he left school.', beat:['W','Left school, swept his father’s floor and never complained once. Well. Once. Loudly.']},\n  // ch5: the empty plinth\n  {id:20, ch:4, who:'P', need:[['SJ',1]], coins:26, say:'Put the statue back together and the stonemason’s yard comes back to life. Bring me the first thing it carves.', beat:['N','A woman in a gardener’s apron, one hand held out. The hand is gone.'], more:[['P','Wilf. Who is she?'],['W','Finish her and I’ll tell you.']]},\n  {id:23, ch:4, who:'P', after:true, need:[['SJ',3]], coins:28, say:'Now the yard’s carving again, bring me a terracotta pot. Practice, before we carve the hand.', beat:['P','Wonky. Characterful. Wilf says that’s what the stonemason used to say.']},\n  {id:21, ch:4, who:'W', need:[['M',7]], coins:26, say:'There’s a shop broom in the story pile. He swept that floor every morning before school, then instead of school.', beat:['W','He was sweeping up a smashed jar when it came to him. A lid that screws on and never leaks.']},\n  {id:22, ch:4, who:'M', need:[['D',8],['GB',5]], coins:26, say:'(Garibaldi has pushed a “7” and a bench up against the plinth. He wants a seat with a view.)', beat:['M','<em>(He watches the gate all afternoon, as if somebody is due.)<\/em>']},\n  {id:24, ch:4, who:'W', need:[['M',8]], coins:30, say:'Bring me the twist lid. The very first one. It’s in the story pile somewhere, I’d stake my hosepipe on it.', beat:['W','The Bellavista lid. Every kitchen in the country had one by 1910.'], more:[['P','So he was rich. Why not hire somebody to find her?'],['W','He did. Eleven detectives. Then he went himself.']]},\n  // ch6: the stone orange\n  {id:25, ch:5, who:'P', need:[['SJ',5],['GB',4]], coins:32, say:'A carving block from the yard and a topiary for the gate post. We’re nearly there.', beat:['P','The gate post says 1921. Wilf says that’s the year he came home.']},\n  {id:26, ch:5, who:'W', need:[['M',9]], coins:34, say:'The factory deed. Bring it. I want it framed in the hall, where she wanted it.', beat:['W','She said a man should be proud of a good lid. She was the only one who never laughed at it.'], more:[['P','She. You keep saying she.'],['W','Do I.']]},\n  {id:27, ch:5, who:'M', need:[['SJ',6],['GB',5]], coins:34, say:'(Garibaldi has his nose against the stone hand. He wants it finished, and a bench to watch from.)', beat:['M','<em>(He has decided the stone face is somebody he knows.)<\/em>']},\n  {id:28, ch:5, who:'P', need:[['D',8]], coins:36, say:'One more number. A “7”. The gate code is 1-9-2-1 and the lock wants a 7 to reset, don’t ask me why.', beat:['P','The gate swings open on its own, which is either the wind or a sign. I choose sign.']},\n  {id:29, ch:5, who:'O', need:[['SJ',8],['M',8]], coins:50, say:'“For the gate. Finish her hand, and bring the story home.”'},\n];\n\n/* the Star Board: six event levels, as in the original. The statue comes from here. */\nconst PASS=[\n  {pts:20, rw:[['ST',1]]},\n  {pts:45, rw:[['ST',1],['H',1]]},\n  {pts:80, rw:[['ST',2],['ET',1]]},\n  {pts:115, rw:[['C',3],['DR',1]]},\n  {pts:150, rw:[['H',2],['ET',1]]},\n  {pts:190, rw:[['SJ',4],['C',4]]},\n];\nconst FELIX=[\n  [['N','Tucked into the reward: a postcard. Cairo, 1912. Never sent.'],['F','“To the girl with the oranges. I am in Egypt. The oranges here are very good but not as good as yours. I have looked in every market. If you are reading this, I am still looking. — E.”']],\n  [['N','Another postcard, the last in the box. Cork, 1920.'],['F','“To the girl with the oranges. I came to Ireland because your hair was the colour of the hills here. Nobody remembers a girl on a ship. I am going home. I have kept your trees. — E.”'],['W','<em>(Wilf reads it twice and puts it in his top pocket.)<\/em>']],\n];\nconst MOON_NOTES=[\n  [['N','Folded inside the sparkle: a page from Wilf’s garden diary.'],['W','“Day one. Planted nothing. Watched the tortoise. He watched me back. I think I have the job.”']],\n  [['W','“The oranges must be at fifty-five degrees. Somebody taught me that a long time ago. I still check it twice a day.”']],\n  [['W','“Somebody asked me today why I never left. I said the trees need me. That’s mostly true.”']],\n  [['W','“Somebody once told me the best things grow where you can see them from the gate. I didn’t understand until I was fifty.”']],\n];\nconst P2={ shopName:'Mrs Lindqvist’s Garden Shop', shopBlurb:'Mrs Lindqvist sells whatever turns up in the old shed' };\n/* the event shop, as in the original: rising prices on numbers and shards, flat prices on the rest */\nconst SHOP_ITEMS=[\n  {id:'Z0', item:['D',1], price:{base:15, mult:1.3, max:120}, what:'A brass “0”, for the mulcher or for merging. Gets dearer each time'},\n  {id:'V1', item:['V',1], price:{base:12, mult:1.3, max:60}, what:'A time charger shard. Gets dearer each time'},\n  {id:'H1', item:['H',1], price:40, what:'Skips 15 minutes on every generator'},\n  {id:'DR', item:['DR',1], price:20, what:'Clears one cobwebbed tile'},\n  {id:'ET', item:['ET',1], price:30, what:'Refills one generator. Drag it onto the one you need'},\n];\n\nconst REFLECTIONS=[\n  ['N','Spring. Clara’s Garden opens at nine. There’s a queue by half past eight.'],\n  ['P','Forty orange trees, and every one of them in fruit. Wilf won’t say how.'],\n  ['W','Fifty-five degrees. And talking to them. Gran talked to them every morning. So did he, once he was home.'],\n  ['P','He crossed the whole world looking for her, and she was in his garden the entire time.'],\n  ['W','She liked that, I think. Being found, instead of finding.'],\n  ['M','<em>(Garibaldi has taken up position at the foot of the statue. Visitors have started leaving him lettuce.)<\/em>'],\n  ['P','Twelve detectives, four hundred postcards and a jar factory. All because of some oranges on a boat.'],\n  ['W','Eleven detectives. And it wasn’t the oranges. It was that she shared them. Nobody shared anything in steerage.'],\n  ['N','In the hall, framed: the factory deed, and beside it, in wax paper, a hundred-year-old orange peel.'],\n  ['P','Wilf. Why did you stay? Really.'],\n  ['W','Somebody had to keep her trees. And somebody had to wait for the right person to come and finish her hand.'],\n  ['W','Took fifty-one years. Worth it.'],\n];\n\n/* every generator gets a little story the first time it appears */\nconst GEN_STORY={\n  gX1:[['P','A pallet of boxes, still shrink-wrapped. The label says “Bellavista Jar Works, Seconds”.'],['W','Papa’s old shop stock. Tills, clocks, all sorts. He never threw anything away.']],\n  gX2:[['P','Two pallets, stacked. That’s a lot of unpacking.'],['W','That’s a lot of finding things.']],\n  gR1:[['P','An old shop till. It still rings!'],['W','Papa’s. It came from the hardware store. There’s a telephone wedged in the cash drawer, don’t ask me why.']],\n  gR2:[['P','A proper brass cash register. It weighs as much as I do.'],['W','Emilio bought it with his first factory wages. For his father. His father never used it. Too fancy.']],\n  gR3:[['W','The counting house. The whole factory office, more or less.'],['P','There’s a drawer marked “Detectives”. It’s full of receipts.']],\n  gP1:[['P','A rotary phone. And a little brass number fell out of the dial.'],['W','Those numbers are what the mulcher runs on. It has a combination lock. I fitted it after the incident.'],['P','What incident?'],['W','We don’t talk about the incident.']],\n  gP2:[['P','A candlestick telephone. It rings by itself sometimes.'],['W','So did the old one. Garibaldi sits on the line.']],\n  gP3:[['W','The old switchboard. Emilio had one put in so he could ring every shipping office in New York at once.'],['P','That is either romantic or terrifying.']],\n  gC1:[['P','A grandfather clock. It’s stopped at ten past four.'],['W','Stopped the day he died, 1932. Nobody’s had the heart to wind it. You can, if you like. It makes good time charger shards.']],\n  WC1:[['W','The mulcher. She eats what you give her and gives you seedlings. Show her the right brass number or she sulks.'],['M','<em>(Garibaldi retreats a respectful distance.)<\/em>']],\n  GB6:[['P','A fountain! And something’s caught in the basin. A ticket?'],['W','Things turn up in that fountain. Bits of him. Always have.']],\n  GB7:[['W','The gazebo. He used to sit in there in the evenings, at the end.'],['P','On his own?'],['W','Ask me another time.']],\n  GB8:[['P','A garden folly. A tiny castle for no reason at all.'],['W','There was a reason. Somebody’s birthday. He never said whose.']],\n  ST3:[['W','The stonemason’s yard. The old man’s chisels, cleaned and oiled.'],['P','Let’s finish her.']],\n};\n\n/* little goals that run all event */\nconst QUESTS=[\n  {id:'gen',     ic:'🔨', n:'Use generators',        steps:[25,100,250,500,1000,2000]},\n  {id:'merge',   ic:'🔗', n:'Make merges',           steps:[20,50,150,300,600,1200]},\n  {id:'compost', ic:'⚙️', n:'Feed the mulcher',       steps:[3,10,25,50]},\n  {id:'story',   ic:'📜', n:'Fill story orders',     steps:[3,10,20]},\n  {id:'high',    ic:'🌟', n:'Make level 5+ items',   steps:[3,10,25,60]},\n  {id:'claim',   ic:'🪙', n:'Claim coins & stars',   steps:[10,40,100,250]},\n  {id:'open',    ic:'📦', n:'Open boxes & cobwebs',  steps:[10,25,45]},\n  {id:'disc',    ic:'🧩', n:'Discover new items',    steps:[15,30,50,70]},\n  {id:'sell',    ic:'🪙', n:'Sell items',            steps:[5,20,50]},\n];\n", "events/larkspur-attic/event.js": "/* Larkspur Attic: a Merge Stories cartridge (the Second Pass balance). Words, cast, chains, board, orders,\n   balance, cover, colours and music for this story. The engine is shared. */\nconst EVENT = {\n  id: 'larkspur-attic', title: 'Larkspur Attic', tagline: 'The Vanishing Moon', version: 'v8',\n  themeColor: '#1a1316',\n  cover: { art: \"<svg class=\\\"cover\\\" viewBox=\\\"0 0 360 230\\\" role=\\\"img\\\" aria-label=\\\"Moonlight through a round attic window onto a trunk and a black cat\\\"><defs><radialGradient id=\\\"atGlow\\\" cx=\\\".5\\\" cy=\\\".42\\\" r=\\\".6\\\"><stop offset=\\\"0\\\" stop-color=\\\"#4a2c36\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#1a1316\\\"/><\/radialGradient><radialGradient id=\\\"atBeam\\\" cx=\\\".5\\\" cy=\\\"0\\\" r=\\\"1\\\"><stop offset=\\\"0\\\" stop-color=\\\"#f4e8d3\\\" stop-opacity=\\\".22\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#f4e8d3\\\" stop-opacity=\\\"0\\\"/><\/radialGradient><\/defs><rect width=\\\"360\\\" height=\\\"230\\\" fill=\\\"url(#atGlow)\\\"/><path d=\\\"M0 0 L180 -40 L360 0 V20 L180 -18 L0 20Z\\\" fill=\\\"#2c1e22\\\"/><path d=\\\"M40 0 L40 230 M320 0 L320 230\\\" stroke=\\\"#3f2c21\\\" stroke-width=\\\"10\\\"/><path d=\\\"M0 28 L180 -8 L360 28\\\" stroke=\\\"#3f2c21\\\" stroke-width=\\\"12\\\" fill=\\\"none\\\"/><circle cx=\\\"180\\\" cy=\\\"78\\\" r=\\\"46\\\" fill=\\\"#0f1a2c\\\" stroke=\\\"#4a3427\\\" stroke-width=\\\"9\\\"/><path d=\\\"M180 32 V124 M134 78 H226\\\" stroke=\\\"#4a3427\\\" stroke-width=\\\"4\\\"/><circle cx=\\\"196\\\ 64,65]],[40,[56,59,62,64]],[40,[56,59,64,68]]],   // Dm7  Fmaj7  E7   E\n    [[36,[55,59,64,67]],[45,[57,60,64,67]],[41,[57,60,65,69]],[43,[55,59,62,67]]],   // Cmaj7 Am7  F    G\n    [[36,[55,59,64,67]],[40,[55,59,64,67]],[41,[57,60,64,69]],[43,[55,59,62,65]]],   // Cmaj7 Em7  Fmaj7 G7\n  ];\n  const SCALE=[57,59,60,62,64,65,67,69,71,72];\n      const bass=(m,t,dur,g=.17)=>{ voice({m,t,dur,g,a:.06,wave:'sine',det:0,lp:300}); voice({m,t,dur:dur*.6,g:g*.18,a:.05,wave:'triangle',det:3,lp:420}); };\n      const keys=(m,t,g,dur)=>{ voice({m,t,dur,g,a:.025,wave:'triangle',det:6,lp:1500,lpEnd:550}); voice({m:m+12,t,dur:dur*.4,g:g*.15,a:.02,wave:'sine',det:3,lp:2000}); };\n      const STEPS=128;\n    let lastNote=57;\n    for(let step=0;step<STEPS;step++){\n      const t=step*BEAT+.01, bar=Math.floor(step/4), beat=step%4, phrase=Math.floor(bar/4);\n      const [root,chord]=PROGS[phrase%PROGS.length][bar%4];\n      if(beat===0){ pad(chord,t,BEAT*4.6); bass(root,t,BEAT*2.8); }\n      if(beat===2 && rnd()<.5) bass(root+(rnd()<.5?7:12),t,BEAT*1.6,.1);\n      if(phrase%2===1){ [0,.5].forEach(h=>{ const n=chord[(step*2+h*2)%chord.length]+12; voice({m:n,t:t+h*BEAT,dur:BEAT*.9,g:.012,a:.01,wave:'triangle',det:5,lp:1700,lpEnd:600}); }); }\n      const p = beat===0?.7 : beat===2?.4 : .15;\n      if(rnd()<p && !(bar%4===3 && beat>1)){\n        const pool = beat===0 ? chord.map(x=>x+12).concat(chord.filter(x=>x>=57)) : SCALE;\n        let target=pool[Math.floor(rnd()*pool.length)];\n        if(Math.abs(target-lastNote)>7) target=pool.reduce((a,b)=>Math.abs(b-lastNote)<Math.abs(a-lastNote)?b:a);\n        lastNote=target; keys(target,t,.07,BEAT*(beat===0?3:2));\n      }\n    }\n    } },\n};\n\nconst CONFIG = {\n  cols: 7, rows: 9,\n  saveKey: 'merge-stories:larkspur-attic', legacySaveKey: 'larkspur-attic-pass2',\n  sideOpen: true,         // the Jumble Sale is open from the start\n};\n\nconst CHAINS = {\n  P:{name:'Papers', items:[\n    {e:'📄',n:'Torn Scrap'},{e:'📃',n:'Note'},{e:'✉️',n:  word about it.'],\n      ['N','Inside the lid, a programme: “The Great Odelia & Felix Marchetti present THE VANISHING MOON.”'],\n      ['T','Felix. “F.”'],\n    ]},\n  { title:'The Great Odelia', zone:3, gifts:[['E',2]],\n    intro:[\n      ['N','The last corner of the attic is darker than the rest, as if the light doesn’t quite want to go there.'],\n      ['P','I’m not superstitious. I’m just going to stand here. By the hatch.'],\n    ],\n    outro:[\n      ['N','Odile’s diary, spring 1968: “Felix says the Moon can’t be done. A whole moon, gone, in front of two thousand people. I say it’s only a question of where you make them look.”'],\n      ['N','Autumn 1969: “We did it. Then he took the method and ran. Let him. He only has half.”'],\n      ['T','Half a trick?'],\n      ['P','He stole it. Her own trick, and he walked off with it.'],\n      ['T','And she just… let him?'],\n      ['P','“Let him.” That’s Odile all over. She never raised her voice. She just went very quiet and very busy.'],\n      ['M','<em>(Mothball hops off the diary and sits facing the round window.)<\/em>'],\n    ]},\n  { title:'Smoke and Mirrors', zone:null, gifts:[['E',3]],\n    intro:[\n      ['T','These aren’t shelves. Look at the joins. This whole wall is a stage flat.'],\n      ['N','The attic isn’t an attic. Or not only. Odile built a little theatre up here, then hid it under dust sheets.'],\n    ],\n    outro:[\n      ['N','Behind the false wall: a tall mirror on a swivel, angled at the round window. A second diary: “The other half of the Moon is a window, a mirror, and patience.”'],\n      ['M','<em>(He jumps onto the sill and sits very straight, like an assistant waiting for a cue.)<\/em>'],\n      ['P','There was always a black cat. Always called Mothball. I assumed it was the same one, for a while there.'],\n    ]},\n  { title:'The Vanishing Moon', zone:null, gifts:[['E',3]],\n    intro:[\n      ['O','“Light, cloth, a crystal, and someone who looks.” <em>(Pinned to the mirror.)<\/em>'],\n      ['T','That’s a shopping list. She’s left us a shopping list for a magic trick.'],\n    ],\n    outro:[\n      ['N','You set the crystal ball on its stand. Theo kills the bulbs. Mrs Pike, despite herself, climbs the ladder.'],\n      ['N','The full moon sits in the round window. You tilt the mirror. For one long breath the window is empty: just dark sky where the moon should be.'],\n      ['T','Where did it go?'],\n      ['N','You tilt it back. The moon is where it always was. Mothball purrs like a drum roll.'],\n      ['O','“Felix had the trick. I had the reason. It was never about the moon, Nell. It was about two thousand people looking up at once. Keep the attic. Keep the cat. — O.”'],\n      ['N','The attic is yours. Merge as long as you like. Somewhere in the Circus Trunk’s chain there is still one thing nobody has seen.'],\n    ]},\n];\n\nconst TASKS = [\n  // ch1 — zone 0 only\n  {beat:['T','Bin bags tied. And under this sheet… a hatbox full of sequins. Buttons, apparently.'], ch:0, who:'T', need:[['F',2]], coins:8,  say:'Got any yarn? I want to tie these bin bags shut properly.'},\n  {beat:['M','(He bats the note under a floorboard. Something underneath it rattles.)'], ch:0, who:'M', need:[['P',2]], coins:8, say:'Mrrp. (He wants a note to bat about under the rafters.)'},\n  {beat:['T','These receipts are all from a theatrical costumier in Covent Garden. Forty years of them.'], ch:0, who:'T', need:[['P',3]], coins:10, say:'Find me an envelope for the receipts. There are… a lot of receipts.'},\n  {beat:['N','Under the floorboard: a playbill, folded small. The name on it has been scratched out.'], ch:0, who:'M', need:[['T',1],['F',2]], coins:8, say:'(He is pawing at a loose floorboard. A bolt and some yarn might shift it.)'},\n  {beat:['T','Hatch fixed. Sock… deployed. Now we can get the big dust sheets off.'], ch:0, who:'T', need:[['T',2],['F',3]], coins:12, say:'Wrench for the hatch hinge, and a sock to stop it squeaking. Don’t ask.'},\n  // ch2 — nst P2={ shopName:'Mrs Pike’s Odds & Ends', shopBlurb:'Mrs Pike sells whatever turns up in her own loft' };\n\nconst SHOP_ITEMS=[\n  {id:'ET', item:['ET',1], price:30, what:'Refills one generator. Drag it onto the one you need'},\n  {id:'H1', item:['H',1], price:90, what:'Skips 15 minutes on every generator and the kettle'},\n];\n\nconst REFLECTIONS=[\n  ['N','Later, with the bulbs back on and an ordinary moon in the round window, the three of you sit on the trunk and try to put it all in order.'],\n  ['T','So. Nineteen sixty-eight. Two of them build a trick nobody thinks can be done. And it works.'],\n  ['P','And the night it works, he takes her notebook and goes. Paris, Vienna, wherever they’d book him. Not a word to her.'],\n  ['T','But he only took the how. The mirror, the timing, the four minutes twelve. Not the why.'],\n  ['P','That’s what she meant by half. He could make the moon disappear. He could never make anyone care that it had.'],\n  ['N','She came home, called it a sister in Lyon, and sewed hems on Larkspur Lane for forty years. The theatre went under dust sheets with everything else.'],\n  ['P','I used to think she was hiding from him. Now I think she was keeping the other half safe. In case.'],\n  ['T','Then why never open his letter?'],\n  ['P','She opened one. Folded it into a dove and put it in the act. That was her answer, love. The other one she didn’t need to read.'],\n  ['T','And seat A1. Every night, empty. Kept for a man who never came back.'],\n  ['P','And he kept her one at a show she never did again. Pair of them. Forty years of saving seats.'],\n  ['M','(Mothball settles on the empty stand where the crystal ball sat, exactly where the moon would be.)'],\n  ['N','Forgiving him didn’t mean letting him back in. It meant finishing the trick without him, so it was never only his. Tonight, it was finished.'],\n  ['T','…Do you reckon Felix ever knew?'],\n  ['P','No, love. But he said he’d be looking up. I’d like to think he was.'],\n];\n\n\nconst GEN_STORY={\n  gD1:[['T','A paper tray. Receipts, ration books, and one very old Valentine.'],['P','Odile kept everything. Every scrap. I always thought it was thrift.']],\n  gD2:[['N','The trays slot into a writing bureau with a lid that sticks.'],['T','There’s a stamp in here from 1965. Paris. Never used.']],\n  gD3:[['P','A printing press! In an attic!'],['T','Every playbill she ever had. She printed them herself.']],\n  gS1:[['P','Her sewing basket. I borrowed thread from this every Christmas for forty years.'],['M','<em>(Mothball climbs in and takes up residence.)<\/em>']],\n  gS2:[['N','A proper sewing kit: tailor’s chalk, pins, a thimble worn through on one side.'],['P','She sewed left-handed. I never noticed till now.']],\n  gS3:[['T','This isn’t a hobby corner. It’s a costume department.'],['P','Sequins by the jar. “A seamstress,” she said. Well. She wasn’t lying.']],\n  gT1:[['T','Finally, something I understand. Hammer, saw, and… a trick dagger.'],['P','Put that down, love.']],\n  gT2:[['N','The tools spread out across a workbench marked with chalk lines.'],['T','These are stage marks. Exits, entrances. Somebody rehearsed a show up here.']],\n  gT3:[['T','Trapdoors. Pulleys. A box with false sides. Your aunt was a menace.'],['P','A lovely menace.']],\n  gL1:[['T','Labelled in her handwriting. “Moon.” Who labels a fuse “Moon”?'],['P','Someone who needed to find it in the dark.']],\n  gL2:[['N','Rows of brass sliders, each with a tiny paper label.'],['T','Footlights, wash, spot… and one just marked “Felix, don’t”.']],\n  gL3:[['N','The attic fills with warm stage light. For a moment it’s 1968.'],['P','Oh. Oh, look at it.']],\n  gM1:[['P','No keyhole, no hinges, and it opens for the cat.'],['T','Of course it does.']],\n  gM2:[['N','A tall mirror in a gilt frame. Your reflection seems to arrive half a second late.'],['T','I’m choosing not to think about that.']],\n  gM3:[['P','This is the act. The whole act, laid out and ready.'],['T','Every trick she ever did, in one corner of an attic.']],\n  gK1:[['P','My kettle. On loan. It’s seen me through three husbands and a flood.'],['T','It whistles in a minor key. Fitting, really.']],\n};\n\nconst QUESTS=[\n  {id:'gen',   ic:'🔨', n:'Use generators',        steps:[25,100,250,500,1000,2000]},\n  {id:'merge', ic:'🔗', n:'Make merges',           steps:[20,50,150,300,600,1200]},\n  {id:'side',  ic:'🏷️', n:'Finish Jumble Sales',   steps:[3,10,25,50,100]},\n  {id:'rare',  ic:'💎', n:'Find rare items',       steps:[3,10,25,50,100]},\n  {id:'story', ic:'📜', n:'Fill story orders',     steps:[3,10,20]},\n  {id:'high',  ic:'🌟', n:'Make level 5+ items',   steps:[3,10,25,60]},\n  {id:'claim', ic:'🪙', n:'Claim coins, stars & moons', steps:[10,40,100,250]},\n  {id:'open',  ic:'📦', n:'Open boxes & cobwebs',  steps:[10,25,45]},\n  {id:'disc',  ic:'🧩', n:'Discover new items',    steps:[15,30,50,70]},\n  {id:'sell',  ic:'🪙', n:'Sell items',            steps:[5,20,50]},\n];\n\n\n\n", "events/pennywhistle-fete/event.js": "/* Pennywhistle Fete: a Merge Stories cartridge. Everything that makes this story itself lives here:\n   words, cast, chains, board, orders, balance, wheel, cover, colours and music. The engine is shared. */\nconst EVENT = {\n  id: 'pennywhistle-fete', title: 'Pennywhistle Fete', tagline: 'The Mystery Prize', version: 'v20',\n  themeColor: '#14303a',\n  cover: { art: \"<svg class=\\\"cover\\\" viewBox=\\\"0 0 360 230\\\" role=\\\"img\\\" aria-label=\\\"A prize wheel on the village green at sunset, under bunting\\\"><defs><linearGradient id=\\\"cvSky\\\" x1=\\\"0\\\" y1=\\\"0\\\" x2=\\\"0\\\" y2=\\\"1\\\"><stop offset=\\\"0\\\" stop-color=\\\"#173f4c\\\"/><stop offset=\\\".55\\\" stop-color=\\\"#2f7a80\\\"/><stop offset=\\\".85\\\" stop-color=\\\"#f0a46a\\\"/><stop offset=\\\"1\\\" stop-color=\\\"#ffd27a\\\"/><\/linearGradient><radialGradient id=\\\"cvGlow\\\" cx=\\\".5\\\" cy=\\\".5\\\" r=\\\".5\\\"><stop offset=\\\"0\\\" stop-color=\\\"#ffe9a0\\\" stop-opacity=\\\".55\\\"/><st
