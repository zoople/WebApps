<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Harvest Hollow</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="harvest-hollow.webmanifest">
<meta name="theme-color" content="#1b140d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harvest Hollow">
<style>
:root{
  --ink:#2b2118; --ink2:#5b4a38; --paper:#f6e7c3; --paper2:#ead5a6; --gold:#e8b230; --gold2:#b8851a;
  --good:#5aa34a; --bad:#c8503c; --blue:#4a86c5; --panel:#3a2a1c; --panel2:#523b27;
  --tex-wood:none; --tex-felt:none; --tex-soil:none; --tex-metal:none; --tex-paper:none; --tex-bench:none;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b140d;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#3a2606;background:linear-gradient(#ffd96a,#e8a720);box-shadow:0 3px 0 #9a6a0e,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a0e,0 3px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:disabled{filter:grayscale(.85) brightness(.85);cursor:not-allowed}
.btn.green{background:linear-gradient(#a6e08a,#58a83e);color:#0f2c06;box-shadow:0 3px 0 #2f6a1f,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.blue{background:linear-gradient(#9fcdf5,#4a86c5);color:#0b2440;box-shadow:0 3px 0 #28537f,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.grey{background:linear-gradient(#e6dcc8,#b9a98a);color:#33261a;box-shadow:0 3px 0 #7d6e55,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;color:#fff3d6;background:linear-gradient(rgba(70,48,28,.92),rgba(40,27,15,.92));border:1px solid rgba(255,220,150,.35);box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);white-space:nowrap}
.pill small{opacity:.7;font-weight:600}

/* ---------- world ---------- */
#world{background:#4d8a3a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--safe-t)) 10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .sp{flex:1;pointer-events:none}
#bag{display:flex;gap:8px}
#bGuide.off{opacity:.5;filter:grayscale(1)}
#goal.min{cursor:pointer;padding:5px 12px}#goal.min #goalMin{display:none}
#goalMin{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #b8851a;background:rgba(255,255,255,.55);color:#5b3a18;font-weight:900;line-height:1;padding:0}
#goal .tip{display:block;font-weight:600;font-size:13px;margin-top:2px}
#goalrow{flex-basis:100%;order:10;pointer-events:none}
#goal{pointer-events:auto;white-space:normal;max-width:min(380px,100%);display:inline-flex;align-items:flex-start;gap:8px;background:linear-gradient(#fff3cf,#f0d58a);color:#3a2606;border:2px solid #b8851a;font-size:14px;line-height:1.3}
.blt{margin:0;padding-left:20px}.blt li{margin:5px 0;line-height:1.4}
.sec{font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);margin:12px 0 2px}
.row.ready{background:rgba(120,200,90,.25);border-radius:10px;padding:8px;border-bottom:0;margin:3px 0}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.say .face{flex:none;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;background:radial-gradient(#fff6d8,#e5c682);border:3px solid #7a5530;box-shadow:inset 0 -5px 8px rgba(120,70,10,.3),0 3px 6px rgba(0,0,0,.3)}
.say .who{font-weight:800;font-family:Georgia,serif;font-size:19px}
.say .txt{background:rgba(255,255,255,.6);border:2px solid #7a5530;border-radius:14px;padding:10px 12px;line-height:1.45}
.goalbox{margin-top:12px;padding:9px 11px;border-radius:10px;background:rgba(232,178,48,.3);border:1px solid rgba(184,133,26,.6);font-weight:700}
#bag span.it{display:inline-flex;gap:3px;align-items:center}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#e0412f;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));padding:6px 14px;border-radius:999px;background:rgba(30,20,10,.72);color:#ffeec8;font-size:13px;pointer-events:none;max-width:90vw;text-align:center;transition:opacity .5s}
#stickzone{position:absolute;left:0;bottom:0;width:60%;height:55%;display:none;touch-action:none;z-index:4}
#stick{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(rgba(255,238,200,.16),rgba(40,28,16,.38));border:2px solid rgba(255,230,170,.45);box-shadow:inset 0 0 18px rgba(0,0,0,.35);opacity:.55;transition:opacity .15s;pointer-events:none}
#stick.on{opacity:.95}
#knob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#e0a526 70%,#9a6a0e);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.25)}
#talkBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--safe-b));display:none;z-index:5;font-size:16px;padding:12px 20px}
@media (pointer:coarse){#stickzone{display:block}#talkBtn{left:auto;right:16px;transform:none;bottom:calc(70px + var(--safe-b))}}
@media (pointer:coarse){#hint{left:auto;right:10px;transform:none;bottom:calc(20px + var(--safe-b));max-width:calc(100vw - 190px);font-size:12px;border-radius:14px}}
@media (max-width:560px){#hud .lbl{display:none}#hud .btn.small{padding:7px 10px}}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:50}
.toast{padding:8px 16px;border-radius:12px;background:rgba(255,246,222,.96);color:var(--ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:toastIn .25s ease-out,toastOut .4s 2.4s forwards;border:2px solid var(--gold)}
@keyframes toastIn{from{transform:translateY(-12px) scale(.9);opacity:0}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- title ---------- */
#title{background:radial-gradient(ellipse at 50% 30%,rgba(255,220,130,.35),transparent 60%),var(--tex-wood),#5a3d24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:5}
#title h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,9vw,72px);color:#ffe9a8;text-shadow:0 3px 0 #7a4a12,0 7px 16px rgba(0,0,0,.5);letter-spacing:1px}
#title p{margin:0;color:#f2dcae;max-width:520px;line-height:1.45}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw);margin-top:10px}
#title .menu .btn{font-size:18px;padding:13px}
#title .ver{margin-top:2px;padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe9a8;font-size:13px;font-weight:700;letter-spacing:.5px}
#title .upd{padding:8px 14px;border-radius:12px;background:#fff3cf;color:#3a2606;font-weight:700;border:2px solid #b8851a;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#title .ios{font-size:13px;color:#f2dcae;max-width:340px;opacity:.9}
#title .sub{font-size:13px;color:#f2dcae;opacity:.85}
.sign{background:var(--tex-paper),var(--paper);border:3px solid #7a5530;border-radius:14px;padding:14px 18px;box-shadow:0 8px 22px rgba(0,0,0,.5)}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:30;background:rgba(15,9,3,.62);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.sheet{color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--tex-paper),var(--paper);border:4px solid #7a5530;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(120,80,20,.25);padding:16px 18px;position:relative;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.sheet h2{margin:0 0 4px;font-family:Georgia,serif;font-size:24px}
.sheet .x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid #7a5530;background:#f3dba5;font-weight:900;color:#5b3a18}
.sheet .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(90,60,25,.35)}
.sheet .row:last-child{border-bottom:0}
.sheet .grow{flex:1;min-width:0}
.sheet .muted{color:var(--ink2);font-size:13px}
.bar{height:9px;border-radius:5px;background:rgba(60,40,15,.25);overflow:hidden;margin-top:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.bar>i{display:block;height:100%;background:linear-gradient(#9be07a,#4ea23a);border-radius:5px;transition:width .3s}
.cost{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:8px;background:rgba(70,45,15,.13);font-weight:700;margin:2px 3px 2px 0;font-size:14px}
.cost.no{background:rgba(200,60,40,.2);color:#8b2412}
.bhead{display:flex;gap:12px;align-items:center}
.bicon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(#fff5d8,#e5c682);border:3px solid #7a5530;box-shadow:inset 0 -4px 8px rgba(120,70,10,.3)}
.lvl{display:inline-block;padding:1px 9px;border-radius:9px;background:#5b3a18;color:#ffe9a8;font-size:13px;font-weight:700}
ul.perks{margin:6px 0;padding-left:20px;font-size:14px}ul.perks li{margin:2px 0}ul.perks li.new{color:#2f7a1f;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.field input[type=range]{width:100%;accent-color:#b8851a}

/* ---------- minigame shell ---------- */
#mg{z-index:20;display:flex;flex-direction:column}
.mgbar{display:flex;gap:6px;align-items:center;padding:calc(8px + var(--safe-t)) 10px 8px;flex-wrap:wrap;position:relative;z-index:3}
.mgbar .sp{flex:1}
.mgbar h3{margin:0;font-family:Georgia,serif;color:#ffe9a8;text-shadow:0 2px 0 rgba(0,0,0,.5);font-size:19px}
.tag{padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe9c0;font-weight:700;font-size:13px;border:1px solid rgba(255,230,160,.3)}
.tag.free{background:#3b6f9a}

/* ---------- bolt game ---------- */
#bolt{background:radial-gradient(ellipse at 50% 0%,rgba(255,235,170,.28),transparent 65%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.55),transparent 70%),var(--tex-bench),#6b4a2c}
#boltArea{flex:1;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center}
#boltBoard{transform-origin:center center;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 8px;--bw:58px;--bh:34px}
.podium{position:relative;width:calc(var(--bw) + 20px);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-top:4px}
.podium .stack{position:relative;width:var(--bw);height:calc(var(--cap)*var(--bh) + 22px)}
.podium .rod{position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(180deg,#a9b0b8 0 2px,#e9edf1 2px 4px,#6d747c 4px 6px);box-shadow:inset -3px 0 3px rgba(0,0,0,.45),inset 3px 0 3px rgba(255,255,255,.45),0 0 3px rgba(0,0,0,.5)}
.podium .rod::after{content:"";position:absolute;top:-4px;left:2px;right:2px;height:8px;border-radius:50%;background:radial-gradient(#fff,#9aa3ad)}
.podium .base{width:calc(var(--bw) + 20px);height:20px;border-radius:12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.4)),var(--tex-metal),#8f98a2;box-shadow:0 5px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7);margin-top:-4px;position:relative}
.podium .base::after{content:"";position:absolute;left:10px;right:10px;top:-5px;height:8px;border-radius:50%;background:radial-gradient(#555a60,#2c3034)}
.podium.sel .base{box-shadow:0 0 0 3px #ffd54a,0 0 18px 4px rgba(255,213,74,.8),0 5px 8px rgba(0,0,0,.55)}
.podium.done .base{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.35)),linear-gradient(90deg,#f1d36a,#fff2a8,#d5a92a)}
.podium.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bolt{position:absolute;left:0;width:var(--bw);height:calc(var(--bh) - 2px);bottom:calc(var(--i)*var(--bh) + 2px);border-radius:8px/10px;
  --h:0;
  background:
   linear-gradient(180deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%),
   linear-gradient(90deg,hsl(var(--h) 70% 26%) 0 13%,hsl(var(--h) 75% 46%) 13% 30%,hsl(var(--h) 85% 62%) 30% 50%,hsl(var(--h) 78% 50%) 50% 72%,hsl(var(--h) 70% 30%) 72% 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.3);
  transition:transform .2s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.6);font-weight:900}
.bolt::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:11px;margin:-5px 0 0 -9px;border-radius:50%;background:radial-gradient(#2a2f35 35%,#585f67);box-shadow:inset 0 1px 2px #000;opacity:.0}
.bolt.hid{--h:215;background:
   linear-gradient(180deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,.35) 100%),
   linear-gradient(90deg,#3c4047 0 13%,#5b6068 13% 30%,#7a808a 30% 50%,#5e646c 50% 72%,#3a3e44 72% 100%);color:#d9dde3}
.bolt.lift{transform:translateY(calc(-1*var(--lift)))}
.bolt.drop{animation:drop .28s cubic-bezier(.3,1.3,.5,1)}
@keyframes drop{from{transform:translateY(-40px);opacity:.4}}
.bolt.reveal{animation:reveal .45s}
@keyframes reveal{0%{filter:brightness(2.5)}100%{filter:none}}
.mgfoot{padding:8px 10px calc(10px + var(--safe-b));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative;z-index:3}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(10,6,2,.6);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.overlay .sheet{text-align:center}
.stars{font-size:44px;letter-spacing:6px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.stars .off{opacity:.25;filter:grayscale(1)}
.reward{display:inline-flex;gap:8px;align-items:center;font-size:26px;font-weight:800;margin:6px 0}

/* ---------- card game ---------- */
#cards{background:radial-gradient(ellipse at 50% 40%,rgba(120,220,140,.18),transparent 65%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%),var(--tex-felt),#2f6b48;color:#fff}
.tablewrap{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 10px;overflow:auto;min-height:0}
.fields{display:flex;gap:10px;justify-content:center}
.plot{position:relative;flex:1;max-width:210px;min-width:92px;border-radius:14px;border:3px solid #4a2d15;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.35)),var(--tex-soil),#5b3a22;box-shadow:inset 0 4px 14px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4);cursor:pointer;min-height:176px}
.plot.hot{outline:3px dashed #ffe27a;outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:rgba(255,226,122,.3)}}
.plot .pl{font-size:12px;font-weight:700;color:#ffe9c0;text-align:center;min-height:30px;line-height:1.25}
.pile{position:relative;width:62px;height:112px;margin-top:2px}
.pile .pc{position:absolute;left:0;width:62px;height:70px}
.plot.locked{align-items:center;justify-content:center;border-style:dashed;background:rgba(0,0,0,.25);cursor:default}
.mid{display:flex;gap:10px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.zone{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.zone h4{margin:0;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfe9d5;font-weight:700}
.zrow{display:flex;gap:8px;align-items:flex-start}
.deck{position:relative;width:66px;height:92px;border-radius:9px;background:repeating-linear-gradient(45deg,#7a3b2a 0 6px,#8f4a35 6px 12px);border:3px solid #f6e7c3;box-shadow:1px 1px 0 #5a2a1c,3px 3px 0 #f6e7c3,4px 4px 0 #5a2a1c,6px 6px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fbe9bd;text-shadow:0 2px 2px rgba(0,0,0,.6)}
.hand{display:flex;padding:14px 4px 8px;overflow-x:auto;min-height:130px}
.hand .card{margin-left:calc(-1*var(--ov,14px));flex:none}.hand .card:first-child{margin-left:auto}.hand .card:last-child{margin-right:auto}
.card{position:relative;width:70px;height:106px;border-radius:9px;border:3px solid #fff3d0;color:#2b2118;
  --h:30;
  background:var(--tex-paper),linear-gradient(160deg,hsl(var(--h) 85% 88%),hsl(var(--h) 70% 72%));background-blend-mode:multiply,normal;
  box-shadow:0 3px 7px rgba(0,0,0,.5),inset 0 0 0 1px hsl(var(--h) 50% 40% / .5);display:flex;flex-direction:column;align-items:center;padding:3px 2px;transition:transform .15s,box-shadow .15s}
.card .em{font-size:34px;line-height:46px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.card .nm{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:hsl(var(--h) 60% 22%)}
.card .mt{font-size:9px;line-height:1.15;margin-top:auto;color:hsl(var(--h) 55% 22%);font-weight:700;text-align:center}
.card.cur{transform:translateY(-12px);box-shadow:0 0 0 3px #ffe27a,0 0 16px 3px rgba(255,226,122,.8),0 6px 10px rgba(0,0,0,.5);z-index:2}
.card.sm{width:62px;height:70px;position:absolute;left:0;border-radius:8px}
.card.sm .em{font-size:28px;line-height:34px}
.card.sm .nm,.card.sm .mt{display:none}
.card.big{width:74px;height:110px;cursor:pointer}
.card.flip{animation:flip .35s}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}}
.mcol{display:flex;flex-direction:column;align-items:center;gap:5px}
.msg{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,230,160,.3);color:#fff3cf;font-size:15px;margin:0 10px}
.floatc{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:#ffe27a;text-shadow:0 2px 3px #000;z-index:50;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}

@media (max-width:480px){
  .plot{min-height:156px}
  .card.big{width:66px;height:104px}
}
</style>

<script>
'use strict';
/* =====================================================================
   HARVEST HOLLOW — a walkable village meta-game wrapping two mini-games
   (Nuts & Bolts sorting + Bean Harvest cards). Single file, no assets.
   ===================================================================== */
const VERSION='v9 · 9 Oct 2026';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(a,r=Math.random)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};

/* ---------- audio: soft modern synth (bells, plucks, gentle reverb) ---------- */
let AC=null,master=null,verbIn=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('hh.muted')==='1'}catch(e){}
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume();return AC}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3.5;comp.attack.value=.004;comp.release.value=.2;
    master=AC.createGain();master.gain.value=.9;master.connect(comp);comp.connect(AC.destination);
    const len=Math.floor(AC.sampleRate*1.5),ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
    const conv=AC.createConvolver();conv.buffer=ir;const vg=AC.createGain();vg.gain.value=.5;conv.connect(vg);vg.connect(comp);verbIn=conv;
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  }catch(e){AC=null}
  return AC;
}
function route(node,send){node.connect(master);if(send&&verbIn){const s=AC.createGain();s.gain.value=send;node.connect(s);s.connect(verbIn)}}
function voice(f,o={}){
  if(muted||!audio())return;
  const{d=.3,type='sine',v=.1,at=.006,when=0,slide=0,lp=0,send=.3,det=0}=o;
  const t=AC.currentTime+when,osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);if(det)osc.detune.value=det;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let n=osc;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;osc.connect(fl);n=fl}
  n.connect(g);route(g,send);osc.start(t);osc.stop(t+d+.05);
}
function noise(o={}){
  if(muted||!audio())return;
  const{d=.06,v=.08,f=900,q=1,type='bandpass',when=0,send=.1}=o;
  const t=AC.currentTime+when,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl);fl.connect(g);route(g,send);src.start(t,Math.random()*.5);src.stop(t+d+.02);
}
// glassy bell / marimba-ish chime: fundamental + soft inharmonic partials
function bell(f,v=.08,when=0,len=.9){
  voice(f,{d:len,v,when,at:.004,send:.45});
  voice(f*2.76,{d:len*.45,v:v*.28,when,at:.003,send:.4});
  voice(f*5.4,{d:len*.2,v:v*.1,when,at:.002,send:.3});
}
const PENT=[0,2,4,7,9];
const pent=i=>523.25*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12);
const tone=(f,d=.1,type='sine',v=.08,when=0,slide=0)=>voice(f,{d,type,v,when,slide:slide?(f+slide)/f:0});
const sfx={
  pick:()=>{noise({d:.03,v:.05,f:4200,type:'highpass'});voice(880,{d:.1,v:.05,type:'triangle',lp:2600})},
  chop:()=>{voice(190,{d:.14,v:.2,slide:.45,type:'sine'});noise({d:.07,v:.12,f:1000,q:.8,send:.05});voice(95,{d:.18,v:.16,when:.01,type:'sine'})},
  get:()=>{bell(784,.07);bell(1175,.06,.07)},
  drop:()=>{voice(300,{d:.16,v:.12,slide:2,type:'sine',lp:2200});noise({d:.04,v:.04,f:2500,type:'highpass',when:.05})},
  bad:()=>{voice(210,{d:.28,v:.1,slide:.62,type:'triangle',lp:900,send:.1})},
  win:()=>{[523.25,659.25,783.99,987.77,1046.5].forEach((f,i)=>bell(f,.08,i*.095,1.2))},
  coin:()=>{bell(1318.5,.07);bell(1760,.06,.07,.7)},
  click:()=>{voice(640,{d:.06,v:.05,type:'triangle',lp:2400});noise({d:.02,v:.025,f:5000,type:'highpass'})},

};

const defState=()=>({v:1,coins:25,energy:MAXE,eT:Date.now(),carry:{},store:{},cap:6,bld:{bolt:1,card:1},boltLvl:0,st:{},claimed:{},seen:{},story:0,say:1,tools:{axe:1,pick:1,basket:1}});

function openModal(html,onClose){

const costHTML=(c,have)=>Object.entries(c).map(([k,v])=>{
  const h=k==='coins'?S.coins:(S.store[k]||0);const e=k==='coins'?'🪙':ITEMS[k].e;
  return `<span class="cost ${h>=v?'':'no'}">${e} ${v}${have?` <small>(${h})</small>`:''}</span>`}).join('');
const canPay=c=>Object.entries(c).every(([k,v])=>(k==='coins'?S.coins:(S.store[k]||0))>=v);
function pay(c){for(const[k,v]of Object.entries(c)){if(k==='coins')S.coins-=v;else S.store[k]-=v}}
function reward(r){for(const[k,v]of Object.entries(r)){if(k==='coins'){S.coins+=v;stat('earned',v)}else if(k==='energy')S.energy=Math.min(MAXE+3,S.energy+v);else S.store[k]=(S.store[k]||0)+v}}
const rewardHTML=r=>Object.entries(r).map(([k,v])=>`<span class="cost">${k==='coins'?'🪙':k==='energy'?'⚡':ITEMS[k].e} +${v}</span>`).join('');

function energyTick(){
  const n=Date.now();
  if(S.energy>=MAXE){S.eT=n;return}
  const k=Math.floor((n-S.eT)/ERGEN);if(k>0){S.energy=Math.min(MAXE,S.energy+k);S.eT+=k*ERGEN;if(S.energy>=MAXE)S.eT=n}
}

/* =====================================================================
   PROCEDURAL TEXTURES  (wood, felt, soil, metal, paper) → CSS vars
   ===================================================================== */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function speckle(g,w,h,n,light,dark,sz=1.4,r=Math.random){
  for(let i=0;i<n;i++){g.fillStyle=r()<.5?light:dark;g.fillRect(r()*w,r()*h,sz*(.5+r()),sz*(.5+r()))}
}
function woodCanvas(w=256,h=256,r=mulberry(7),base=[32,48,38]){
  const c=mk(w,h),g=c.getContext('2d');const bh=h/8;
  for(let b=0;b<8;b++){
    const hh=base[0]+r()*8-4,ss=base[1]+r()*10-5,ll=base[2]+r()*9-4;
    const gr=g.createLinearGradient(0,b*bh,0,(b+1)*bh);
    gr.addColorStop(0,`hsl(${hh} ${ss}% ${ll+4}%)`);gr.addColorStop(.5,`hsl(${hh} ${ss}% ${ll}%)`);gr.addColorStop(1,`hsl(${hh} ${ss}% ${ll-4}%)`);
    g.fillStyle=gr;g.fillRect(0,b*bh,w,bh);
    for(let k=0;k<26;k++){ // grain
      const y=b*bh+r()*bh,amp=.6+r()*1.6,ph=r()*6,fr=.01+r()*.03;
      g.strokeStyle=`rgba(${r()<.6?'40,22,8':'255,225,170'},${.05+r()*.12})`;g.lineWidth=.6+r()*1.1;g.beginPath();
      for(let x=0;x<=w;x+=8){const yy=y+Math.sin(x*fr+ph)*amp;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke();
    }
    if(r()<.55){ // knot
      const kx=r()*w,ky=b*bh+bh/2;
      for(let k=4;k>0;k--){g.strokeStyle=`rgba(40,20,5,${.1+k*.05})`;g.lineWidth=1;g.beginPath();g.ellipse(kx,ky,k*3.2,k*1.8,0,0,7);g.stroke()}
      g.fillStyle='rgba(40,20,5,.35)';g.beginPath();g.ellipse(kx,ky,2.4,1.4,0,0,7);g.fill();
    }
    g.fillStyle='rgba(20,10,0,.55)';g.fillRect(0,b*bh,w,1.6);
    g.fillStyle='rgba(255,230,180,.18)';g.fillRect(0,b*bh+1.6,w,1);
    // nails
    g.fillStyle='rgba(30,20,10,.55)';g.beginPath();g.arc(6,b*bh+bh/2,1.6,0,7);g.arc(w-6,b*bh+bh/2,1.6,0,7);g.fill();
  }
  return c;
}
function feltCanvas(r=mulberry(3)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#2f6b48';g.fillRect(0,0,160,160);
  speckle(g,160,160,5200,'rgba(190,255,200,.08)','rgba(0,20,0,.14)',1.3,r);
  for(let i=0;i<260;i++){g.strokeStyle=`rgba(200,255,210,${.03+r()*.04})`;g.lineWidth=.6;const x=r()*160,y=r()*160;g.beginPath();g.moveTo(x,y);g.lineTo(x+r()*7-3,y+r()*7-3);g.stroke()}
  return c;
}
function soilCanvas(r=mulberry(5)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#5b3a22';g.fillRect(0,0,160,160);
  for(let y=0;y<160;y+=16){ // furrows
    const gr=g.createLinearGradient(0,y,0,y+16);gr.addColorStop(0,'rgba(255,200,140,.18)');gr.addColorStop(.35,'rgba(255,200,140,0)');gr.addColorStop(.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
    g.fillStyle=gr;g.fillRect(0,y,160,16);
  }
  speckle(g,160,160,3800,'rgba(255,210,150,.16)','rgba(20,8,0,.3)',1.6,r);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(${90+r()*50|0},${70+r()*30|0},${50+r()*20|0},.6)`;g.beginPath();g.ellipse(r()*160,r()*160,1+r()*2.5,1+r()*1.6,r()*3,0,7);g.fill()}
  return c;
}
function metalCanvas(r=mulberry(11)){
  const c=mk(128,64),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'#c9d0d8');gr.addColorStop(.5,'#9aa3ad');gr.addColorStop(1,'#7b848e');g.fillStyle=gr;g.fillRect(0,0,128,64);
  for(let i=0;i<420;i++){const y=r()*64;g.strokeStyle=`rgba(${r()<.5?'255,255,255':'30,35,40'},${.04+r()*.1})`;g.lineWidth=.5+r()*.6;g.beginPath();g.moveTo(r()*60,y);g.lineTo(60+r()*68,y+r()*.8-.4);g.stroke()}
  return c;
}
function paperCanvas(r=mulberry(9)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#f6e7c3';g.fillRect(0,0,160,160);
  for(let i=0;i<14;i++){const gr=g.createRadialGradient(0,0,0,0,0,1);g.save();g.translate(r()*160,r()*160);g.scale(20+r()*40,20+r()*40);
    const rg=g.createRadialGradient(0,0,0,0,0,1);rg.addColorStop(0,`rgba(${150+r()*40|0},${110+r()*30|0},60,.05)`);rg.addColorStop(1,'rgba(150,110,60,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,1,0,7);g.fill();g.restore()}
  speckle(g,160,160,2600,'rgba(255,255,255,.5)','rgba(120,80,30,.16)',1.1,r);
  for(let i=0;i<200;i++){g.strokeStyle=`rgba(120,80,30,${.03+r()*.05})`;g.lineWidth=.5;const x=r()*160,y=r()*160;g.beginPath();g.moveTo(x,y);g.lineTo(x+r()*10-5,y+r()*4-2);g.stroke()}
  return c;
}
function installTextures(){
  const root=document.documentElement.style;
  const set=(n,c)=>root.setProperty(n,`url(${c.toDataURL('image/png')})`);
  set('--tex-wood',woodCanvas(256,256,mulberry(7),[28,45,30]));
  set('--tex-bench',woodCanvas(256,256,mulberry(21),[30,38,34]));
  set('--tex-felt',feltCanvas());set('--tex-soil',soilCanvas());set('--tex-metal',metalCanvas());set('--tex-paper',paperCanvas());
}
installTextures();
/* =====================================================================
   WORLD — tile village, sprites, movement, gathering, stations
   ===================================================================== */
const TS=48,MW=34,MH=24;
const hash=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};

/* ---- definitions ---- */
const BLD=[
  {id:'sawmill',name:'Sawmill',x:4,y:3,kind:'craft',icon:'🪚',wall:'wood',wh:28,roof:[14,50,38],in:{wood:2},out:'plank',time:3.5},
  {id:'kiln',name:'Brick Kiln',x:10,y:3,kind:'craft',icon:'🔥',wall:'stone',wh:22,roof:[10,48,30],in:{stone:2},out:'brick',time:4},
  {id:'barn',name:'Barn',x:16,y:3,kind:'barn',icon:'📦',wall:'wood',wh:6,roof:[6,58,34]},
  {id:'bolt',name:'Bolt Works',x:22,y:3,kind:'game',game:'bolt',icon:'⚙️',wall:'metal',wh:212,roof:[214,28,34]},
  {id:'card',name:'Card Barn',x:28,y:3,kind:'game',game:'card',icon:'🃏',wall:'wood',wh:108,roof:[285,34,36]},
  {id:'jam',name:'Jam Kitchen',x:11,y:9,kind:'craft',icon:'🍓',wall:'wood',wh:345,roof:[340,50,42],in:{berries:3},out:'jam',time:4},
  {id:'bakery',name:'Bakery',x:19,y:9,kind:'craft',icon:'🥖',wall:'wood',wh:40,roof:[205,45,38],in:{wheat:2},out:'bread',time:4}
];
BLD.forEach(b=>{b.door=[b.x+1,b.y+3]});
const BOARD={x:15,y:10,door:[15,11]};
const NODE_T={
  tree:{item:'wood',max:4,time:1.7,regrow:22,sfx:'chop',verb:'Chopping'},
  rock:{item:'stone',max:4,time:2.1,regrow:26,sfx:'chop',verb:'Mining'},
  bush:{item:'berries',max:3,time:1.3,regrow:18,sfx:'get',verb:'Picking'},
  wheat:{item:'wheat',max:3,time:1.4,regrow:20,sfx:'get',verb:'Reaping'}
};

const TOOL_OF={tree:'axe',rock:'pick',bush:'basket',wheat:'basket'};
const gatherTime=type=>NODE_T[type].time*(1-.14*(((S.tools||{})[TOOL_OF[type]]||1)-1));

/* ---- map ---- */
const grid=[];            // 0 grass 1 path 2 water 3 mat
const block=new Uint8Array(MW*MH);
const isBlocked=(x,y)=>x<0||y<0||x>=MW||y>=MH||block[y*MW+x]===1;
const nodes=[],decor=[];
const nodeAt={};
function buildMap(){
  const r=mulberry(1234);
  for(let y=0;y<MH;y++){grid[y]=new Array(MW).fill(0)}
  const hl=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)grid[y][x]=1};
  const vl=(x,y0,y1)=>{for(let y=y0;y<=y1;y++)grid[y][x]=1};
  hl(4,31,6);vl(17,6,14);hl(12,22,12);hl(6,28,14);vl(6,14,17);vl(26,14,17);vl(14,12,14);
  // water
  const lake=(cx,cy,rx,ry)=>{for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<1+(hash(x,y,3)-.5)*.35)grid[y][x]=2}};
  lake(31,21,4.2,3.2);lake(3.5,22,3.3,2.3);
  // buildings
  BLD.forEach(b=>{
    for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)block[(b.y+dy)*MW+b.x+dx]=1;
    grid[b.door[1]][b.door[0]]=3;
  });
  block[BOARD.y*MW+BOARD.x]=1;grid[BOARD.door[1]][BOARD.door[0]]=3;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(grid[y][x]===2)block[y*MW+x]=1;
  // border forest
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const edge=x<2||x>=MW-2||y<2||y>=MH-1;
    if(edge&&grid[y][x]!==2&&r()<(x<1||x>=MW-1||y<1||y>=MH-1?1:.7)){block[y*MW+x]=1;decor.push({k:'tree',x,y,v:Math.floor(r()*3),big:true})}
  }
  const free=(x,y)=>x>=2&&y>=2&&x<MW-2&&y<MH-1&&!block[y*MW+x]&&grid[y][x]===0&&!nodeAt[x+','+y];
  const near=(x,y,d)=>nodes.some(n=>Math.abs(n.x-x)<d&&Math.abs(n.y-y)<d);
  const scatter=(type,x0,x1,y0,y1,count,gap)=>{
    let tries=0;while(count>0&&tries++<800){
      const x=x0+Math.floor(r()*(x1-x0+1)),y=y0+Math.floor(r()*(y1-y0+1));
      if(!free(x,y)||near(x,y,gap))continue;
      const n={type,x,y,ch:NODE_T[type].max,t:0,acc:0,v:Math.floor(r()*3)};nodes.push(n);nodeAt[x+','+y]=n;count--;
    }
  };
  scatter('tree',3,11,15,21,15,2);
  scatter('rock',24,31,8,13,10,2);
  scatter('bush',12,21,17,21,9,2);

    if(P.moving||doorAt[P.x+','+P.y]!==P.xfer.b)P.xfer=null;

const ents=[];
function buildEnts(){

  decor.forEach(d=>{if(d.k==='tree')ents.push({by:d.y*TS+TS-3,deco:d});else ents.push({by:d.y*TS+d.oy,deco:d,low:true})});
  BLD.forEach(b=>ents.push({by:(b.y+3)*TS-4,bld:b}));
  ents.push({by:BOARD.y*TS+TS-2,board:true});

function drawEnt(g,e,time){
  if(e.node){
    const n=e.node,x=n.x*TS+TS/2,y=n.y*TS+TS-3,full=n.ch>0;
    if(full&&n.type!=='wheat'){g.save();g.globalAlpha=.55+.2*Math.sin(time*3+n.x);g.fillStyle='rgba(255,236,150,.28)';g.strokeStyle='rgba(255,226,110,.9)';g.lineWidth=2.5;g.beginPath();g.ellipse(x,y-1,24,10,0,0,7);g.fill();g.stroke();g.restore()}

    }

    g.fillStyle='#000';g.fillText(f.e,f.x0+(f.x1-f.x0)*e,f.y0+(f.y1-f.y0)*e-Math.sin(u*Math.PI)*38);g.globalAlpha=1}

  g.fillStyle=lg(g,0,0,W,H,[[0,'rgba(255,238,190,.10)'],[.6,'rgba(255,255,255,0)'],[1,'rgba(30,50,110,.10)']]);g.fillRect(0,0,W,H);
  drawGuideEdge(g,W,H,time);
}

const OUT='rgba(35,18,8,.62)';

  /* ground shadow */

    else if(u<.5){aA=-.2+(-2.3+.2)*ease(u/.5);lean=-.04*ease(u/.5)}

  else{

    });

    // hair fringe
    g.fillStyle=lg(g,x-hr,hy-hr,x+hr,hy,[[0,hair[0]],[1,hair[1]]]);
    g.beginPath();g.moveTo(x-hr,hy-1);g.quadraticCurveTo(x-hr,hy-hr-1,x,hy-hr-1);g.quadraticCurveTo(x+hr,hy-hr-1,x+hr,hy-1);

    if(o.glasses){g.strokeStyle='#5a3b22';g.lineWidth=1.3;g.beginPath();ex.forEach(dx=>{g.moveTo(x+dx+4,hy+1);g.arc(x+dx,hy+1,4,0,7)});if(!side){g.moveTo(x-1,hy+1);g.lineTo(x+1,hy+1)}g.stroke()}

  }
  /* headwear */
  if(o.hat==='straw'){

    g.strokeStyle='rgba(150,100,30,.35)';g.lineWidth=.9;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*3.6,hy-20);g.quadraticCurveTo(x+i*4.6,hy-14,x+i*4.2,hy-8);g.stroke()}
    g.fillStyle='#c0392b';g.fillRect(x-10.2,hy-11.5,20.4,3.4);g.strokeStyle=OUT;g.lineWidth=.9;g.strokeRect(x-10.2,hy-11.5,20.4,3.4);

    if(!back){g.fillStyle=cc;g.beginPath();g.ellipse(x+(side?sg*8:0),hy-4,side?8:11,3,0,0,7);g.fill();g.stroke()}

  if(lean)g.restore();
}

    const ready=items.filter(i=>!i.cl&&i.ok);
    const prog=items.filter(i=>!i.cl&&!i.ok).sort((x,y)=>y.a/y.b-x.a/x.b);
    const done=items.filter(i=>i.cl);
    const row=(i,kind)=>`<div class="row ${kind}" style="${kind==='done'?'opacity:.5':''}"><div class="grow"><b>${i.q.t}</b>

const bldBy=id=>BLD.find(b=>b.id===id);
const doorT=(b,icon,text)=>({text,t:{x:b.door[0],y:b.door[1],icon,label:b.name}});

function nearestNode(type){
  let best=null,bd=1e9;
  for(const n of nodes){if(n.type!==type||n.ch<=0)continue;const d=Math.abs(n.x-P.x)+Math.abs(n.y-P.y);if(d<bd){bd=d;best=n}}
  return best||nodes.find(n=>n.type===type);
}
function gatherT(type){
  const info={tree:['🌳','Tree','Walk onto a tree and stand still to chop wood'],rock:['⛰️','Rocks','Walk onto a rock and stand still to mine stone']}[type];
  const n=nearestNode(type);
  return{text:info[2],t:{x:n.x,y:n.y,icon:info[0],label:info[1]}};
}
function supply(item){
  const cfg={plank:{b:'sawmill',raw:'wood',node:'tree'},brick:{b:'kiln',raw:'stone',node:'rock'}}[item];
  const b=bldBy(cfg.b),s=stn(b.id),need=Object.values(b.in)[0],nm=ITEMS[item].n.toLowerCase();
  if((S.carry[item]||0)>0)return barnT(`Drop your ${nm} at the Barn (step on the red mat)`);
  if(s.out>0)return doorT(b,ITEMS[item].e,`Your ${nm} is ready! Step on the ${b.name} mat to collect it`);
  if((S.carry[cfg.raw]||0)>=need)return doorT(b,ITEMS[cfg.raw].e,`Step on the ${b.name} mat to feed it ${ITEMS[cfg.raw].n.toLowerCase()}`);
  if(s.buf>=need)return doorT(b,'⏳',`The ${b.name} is working. Wait a moment, then step on its mat`);
  if(carryN()>=S.cap)return barnT('Your backpack is full. Drop it at the Barn first');
  return gatherT(cfg.node);
}
function upgradeAction(game){
  const lv=S.bld[game],b=bldBy(game);
  if(lv>=MAXLV)return null;
  const c=upCost(lv),icon=game==='bolt'?'⚙️':'🃏';
  if(canPay(c))return doorT(b,icon,`You can afford it! Step on the mat and press ⬆ Upgrade`);
  if(S.coins<c.coins)return doorT(b,icon,`You need ${c.coins}🪙 (you have ${S.coins}). Play here to earn coins`);
  if((S.store.plank||0)<c.plank)return supply('plank');

}

function drawGuideEdge(g,W,H,time){
  if(!GUIDE)return;const t=GUIDE.a.t;

  g.beginPath();g.moveTo(34,0);g.lineTo(18,-13);g.lineTo(18,13);g.closePath();g.stroke();g.fill();g.restore();
  g.fillStyle=rg(g,-4,-4,2,0,0,24,[[0,'#fff6d0'],[1,'#e8b230']]);g.strokeStyle='#5a3a00';g.lineWidth=3;g.beginPath();g.arc(0,0,21,0,7);g.fill();g.stroke();

/* =====================================================================
   MINI-GAME 1: BOLT WORKS — nuts & bolts sorting
   Levels are random but verified solvable by a solver before they're dealt.
   ===================================================================== */
const BHUE=[2,28,48,92,142,176,206,238,282,326];
const BSYM=['●','▲','■','◆','★','♥','✚','☾','☀','♣'];

/* ---- solver: greedy best-first search over single-nut moves ---- */
function boltMoves(p,cap){
  const out=[];let emptyDone=false;
  for(let i=0;i<p.length;i++){
    const a=p[i];if(!a.length)continue;
    const mono=a.every(x=>x===a[0]);if(mono&&a.length===cap)continue;
    const c=a[a.length-1];emptyDone=false;
    for(let j=0;j<p.length;j++){
      if(i===j)continue;const b=p[j];if(b.length>=cap)continue;
      if(!b.length){if(emptyDone||mono)continue;emptyDone=true;out.push([i,j])}
      else if(b[b.length-1]===c)out.push([i,j]);
    }
  }
  return out;
}
const boltKey=p=>p.map(a=>a.join('')).sort().join('|');
const boltH=p=>{let h=0;for(const a of p){if(!a.length)continue;let r=1;while(r<a.length&&a[r]===a[0])r++;h+=a.length-r;if(r<a.length)h+=1}return h};
const boltSolved=(p,cap)=>p.every(a=>!a.length||(a.length===cap&&a.every(x=>x===a[0])));
function solveBolt(start,cap,limit=30000){
  const s0=start.map(a=>a.slice());
  if(boltSolved(s0,cap))return[];
  const heap=[];const push=n=>{heap.push(n);let i=heap.length-1;while(i){const p=(i-1)>>1;if(heap[p].f<=heap[i].f)break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let a=i*2+1,b=a+1,m=i;if(a<heap.length&&heap[a].f<heap[m].f)m=a;if(b<heap.length&&heap[b].f<heap[m].f)m=b;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return t};
  const seen=new Set([boltKey(s0)]);
  push({p:s0,g:0,f:boltH(s0)*2,par:null,mv:null});
  let n=0;
  while(heap.length&&n++<limit){
    const cur=pop();
    for(const[i,j]of boltMoves(cur.p,cap)){
      const np=cur.p.map(a=>a.slice());np[j].push(np[i].pop());
      const k=boltKey(np);if(seen.has(k))continue;seen.add(k);
      const node={p:np,g:cur.g+1,f:boltH(np)*2+(cur.g+1)*.25,par:cur,mv:[i,j]};
      if(boltSolved(np,cap)){const path=[];for(let x=node;x.par;x=x.par)path.unshift(x.mv);return path}
      push(node);
    }
  }
  return null;
}
function genBolt(o,depth=0){
  const{colors,empty,cap,mystery}=o;
  for(let t=0;t<60;t++){
    const bag=[];for(let c=0;c<colors;c++)for(let k=0;k<cap;k++)bag.push(c);
    shuffle(bag);
    const pegs=[];for(let i=0;i<colors;i++)pegs.push(bag.slice(i*cap,(i+1)*cap));
    for(let e=0;e<empty;e++)pegs.push([]);
    if(cap>1&&pegs.some(a=>a.length&&a.every(x=>x===a[0])))continue;
    const sol=solveBolt(pegs,cap,t<30?20000:40000);
    if(sol){
      const hid=pegs.map(a=>a.map((_,j)=>j<a.length-1&&Math.random()<mystery));
      return{pegs,hid,cap,par:sol.length,sol};
    }
  }
  if(depth<3)return genBolt({...o,empty:empty+1},depth+1);
  throw new Error('no puzzle');
}

  if(lv>=3)empty++;
  const mystery=n<2?0:Math.random()<.75?clamp(.12+n*.04,.12,.55):0;
  return{colors,empty,cap,mystery};
}

function leaveMG(){const mg=$('#mg');mg.classList.add('hidden');mg.innerHTML='';B=null;C=null;if(!worldOn)return;hud()}
const topOf=a=>a[a.length-1];
function pegDone(a){return a.length===B.cap&&a.every(x=>x===a[0])}
function renderBolt(anim){
  if(!B)return;
  const board=$('#boltBoard');board.style.setProperty('--cap',B.cap);
  board.innerHTML='';
  B.pegs.forEach((a,i)=>{
    const p=el(`<div class="podium${B.sel===i?' sel':''}${pegDone(a)?' done':''}" data-i="${i}"><div class="stack"><div class="rod"></div></div><div class="base"></div></div>`);
    const st=$('.stack',p);
    a.forEach((c,j)=>{
      const hid=B.hid[i][j]&&j<a.length-1&&false; // hidden only while buried (flag cleared on reveal)
      const isHid=B.hid[i][j];
      const b=el(`<div class="bolt${isHid?' hid':''}" style="--i:${j};--h:${BHUE[c]}">${isHid?'?':BSYM[c]}</div>`);

      if(anim&&anim.reveal&&anim.reveal[0]===i&&anim.reveal[1]===j)b.classList.add('reveal');
      st.appendChild(b);
    });
    p.onclick=()=>boltClick(i);
    board.appendChild(p);
  });
  $('#bMoves').textContent='Moves '+B.moves;
  $('#bUndo').textContent=`↶ Undo${B.undos===Infinity?'':` (${B.undos})`}`;$('#bUndo').disabled=!B.hist.length||B.undos<=0||B.done;
  $('#bHint').textContent=`💡 Hint${B.hints===Infinity?'':` (${B.hints})`}`;$('#bHint').disabled=B.hints<=0||B.done;
  fitBolt();
  if(B.hintMove){const[f,t]=B.hintMove;const pf=board.children[f],pt=board.children[t];if(pf)pf.querySelector('.base').style.boxShadow='0 0 0 3px #7ee37a,0 0 16px 4px rgba(126,227,122,.8)';if(pt)pt.querySelector('.base').style.boxShadow='0 0 0 3px #7ac0ff,0 0 16px 4px rgba(122,192,255,.8)'}
}
function fitBolt(){
  const area=$('#boltArea'),board=$('#boltBoard');if(!area||!board||!B)return;
  const n=B.pegs.length,cw=area.clientWidth-16,ch=area.clientHeight-8;
  const pw=58+20+8,ph=B.cap*34+22+20+18+18;
  let best=null;
  for(let r=1;r<=4;r++){const cols=Math.ceil(n/r);const s=Math.min(cw/(cols*pw),ch/(r*ph),1.7);if(!best||s>best.s+.001)best={s,cols}}
  board.style.width=best.cols*pw+'px';board.style.transform=`scale(${best.s})`;
}
function boltClick(i){
  if(!B||B.done)return;
  B.hintMove=null;
  const a=B.pegs[i];
  if(B.sel===null){if(!a.length)return;B.sel=i;sfx.pick();renderBolt();return}
  if(B.sel===i){B.sel=null;sfx.click();renderBolt();return}
  const from=B.sel;
  if(boltCanMove(from,i)){boltDoMove(from,i)}
  else{
    sfx.bad();const pod=$('#boltBoard').children[i];pod.classList.add('shake');

  }
}
function boltCanMove(f,t){

}
function boltDoMove(f,t){
  B.hist.push({pegs:B.pegs.map(a=>a.slice()),hid:B.hid.map(a=>a.slice())});

  B.moves++;B.sel=null;
  let reveal=null;const rf=B.pegs[f];

function boltUndo(){

}

  if(!B||B.done)return;
  B.pegs=B.start.map(a=>a.slice());B.hid=B.startHid.map(a=>a.slice());B.hist=[];B.moves=0;B.sel=null;B.hintMove=null;sfx.click();renderBolt();
}
function boltHint(){

  $('#cTable').querySelectorAll('[data-h]').forEach(b=>b.onclick=e=>{e.stopPropagation();cardHarvest(+b.dataset.h,true);renderCards()});
  $('#cTable').querySelectorAll('[data-m]').forEach(m=>m.onclick=()=>{if(C.phase==='market'){C.sel=+m.dataset.m;sfx.pick();renderCards()}});
  $('#cTable').querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>cardTrade(+b.dataset.trade));
  const fin=$('#cFinish');if(fin)fin.onclick=()=>cardEndRound();
  const hd=$('#cTable .hand');if(hd){const n=C.hand.length,cw=66,avail=hd.clientWidth-16;
    const ov=n>1?clamp((n*cw-avail)/(n-1),6,cw-24):6;hd.style.setProperty('--ov',ov+'px')}
  const sk=$('#cSkip');if(sk)sk.onclick=()=>{sfx.click();cardFlip()};
  const bu=$('#cBuy');if(bu)bu.onclick=()=>{if(C.coins<3)return;C.coins-=3;C.nFields=3;sfx.coin();C.msg='You bought a third field!';renderCards()};
  $('#cTable').querySelectorAll('[data-lock]').forEach(p=>p.onclick=()=>{C.msg='Buy a 3rd field with the button below (3🪙).';renderCards()});
}
function floatAt(el_,text){
  if(!el_)return;const r=el_.getBoundingClientRect();
  const f=el(`<div class="floatc">${text}</div>`);f.style.left=(r.left+r.width/2-20)+'px';f.style.top=(r.top+30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);
}
function cardHarvest(i,manual){
  const f=C.fields[i];if(f.t===null)return 0;
  const c=payout(f.t,f.n);
  floatAt($(`[data-f="${i}"]`),c>0?`+${c} 🪙`:'cleared');
  C.coins+=c;C.roundCoins+=c;C.harvested+=c;C.discard+=f.n;
  if(c>0)sfx.coin();else sfx.click();
  if(manual)C.msg=c>0?`Harvested ${CROPS[f.t].n} for ${c} coin${c>1?'s':''}.`:`Cleared the ${CROPS[f.t].n} field (no payout).`;
  f.t=null;f.n=0;return c;
}
function cardPlant(i){
  if(C.done)return;const card=curCard();
  if(!card){C.msg='Nothing to plant right now.';renderCards();return}
  if(i>=C.nFields)return;
  const f=C.fields[i];let note='';
  if(f.t!==null&&f.t!==card.t){const c=cardHarvest(i,false);note=` (harvested the old crop for ${c}🪙)`}
  f.t=card.t;f.n++;sfx.drop();
  if(C.phase==='final'){
    C.hand.shift();C.msg=`Planted ${CROPS[card.t].n}.${note}`;
    if(!C.hand.length){cardEndRound();return}
    renderCards();return;
  }
  if(C.phase==='market'){C.market.splice(C.sel,1);C.sel=0;C.msg=`Planted ${CROPS[card.t].n}.${note}`;cardAfterMarket()}
  else{
    C.hand.shift();
    if(C.phase==='plant1'){
      if(C.hand.length){C.phase='plant2';C.msg=`Planted ${CROPS[card.t].n}.${note} Plant the next card too, or skip.`;renderCards()}
      else{C.msg=`Planted.${note}`;cardFlip()}
    }else{C.msg=`Planted ${CROPS[card.t].n}.${note}`;cardFlip()}
  }
}
function cardFlip(){
  if(C.deck.length===0){
    if(!C.hand.length){cardEndRound();return}
    C.phase='final';C.market=[];C.msg='⚠ The deck is empty! Plant what you can from your hand (left to right), harvest, then finish the round.';renderCards();return;
  }
  C.market=[];for(let k=0;k<2&&C.deck.length;k++)C.market.push(C.deck.pop());
  C.phase='market';C.sel=0;C.msg=`Market: plant each card or trade it away (${C.trades} trade${C.trades===1?'':'s'} left).`;sfx.pick();
  renderCards(-1);
}
function cardTrade(i){
  if(C.phase!=='market'||C.trades<=0)return;
  const c=C.market.splice(i,1)[0];C.trades--;C.sel=0;C.msg=`Traded the ${CROPS[c.t].n} away.`;sfx.click();cardAfterMarket();
}
function cardAfterMarket(){
  if(C.market.length){C.msg+=` Now the other card.`;renderCards();return}
  // draw three to the back of the hand
  for(let k=0;k<3&&C.deck.length;k++)C.hand.push(C.deck.pop());
  C.turn++;
  if(!C.hand.length&&!C.deck.length){cardEndRound();return}
  C.phase='plant1';
  C.msg=C.deck.length?`Drew cards. Plant the first card in your hand.`:`The deck is empty — plant the cards in your hand, harvest, then finish the round.`;
  renderCards();
}
function cardEndRound(){
  const left=C.hand.length;
  for(let i=0;i<C.nFields;i++)cardHarvest(i,false);
  C.phase='over';renderCards();
  const last=C.round>=C.o.rounds;
  let reward=0,mult=C.o.mult;
  if(last){
    C.done=true;reward=Math.round(C.coins*mult);
    if(C.mode==='play'){S.coins+=reward;stat('earned',reward);stat('cardGames');stat('cardCoins',C.harvested);save(true);hud()}
  }
  sfx.win();
  const sh=el(`<div class="overlay"><div class="sheet"><h2>${last?'🌾 Harvest complete!':`Round ${C.round} done`}</h2>
    <div class="muted">This round you harvested</div><div class="reward">🪙 ${C.roundCoins}</div>
    ${left?`<div class="muted">${left} card${left>1?'s':''} left in your hand went unplanted.</div>`:''}
    ${last?`<div class="muted">Total ${C.coins}🪙${mult>1?` × ${mult} Level-5 bonus`:''}</div>
      ${C.mode==='play'?`<div class="reward">+${reward} 🪙 banked</div>`:'<div class="reward" style="font-size:16px">Free play — no rewards</div>'}`:''}
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
      ${last?(C.mode==='play'?`<button class="btn green" id="oAgain" ${S.energy<1?'disabled':''}>Play again · ⚡1</button>`:'<button class="btn green" id="oAgain">Play again</button>'):'<button class="btn green" id="oNext">Next round →</button>'}
      ${last?'<button class="btn grey" id="oBack">Back to village</button>':''}</div></div></div>`);
  $('#cards').appendChild(sh);
  if($('#oNext'))$('#oNext').onclick=()=>{sh.remove();cardRound()};
  if($('#oBack'))$('#oBack').onclick=leaveMG;
  if($('#oAgain'))$('#oAgain').onclick=()=>{if(C.mode==='play'){if(S.energy<1)return;spendEnergy();startCards('play')}else startCards('free',C.o)};
}
/* =====================================================================
   TITLE + BOOT
   ===================================================================== */
function showTitle(){
  stopWorld();$('#world').classList.add('hidden');$('#mg').classList.add('hidden');
  const t=$('#title');t.classList.remove('hidden');
  const has=S.story>0||(S.st&&(Object.keys(S.st).length>0||S.coins!==25));
  t.innerHTML=`<div style="font-size:54px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))">🌾⚙️🃏</div>
    <h1>Harvest Hollow</h1>
    <p>Gather wood, stone, berries and wheat. Craft goods. Then step into the workshops and play puzzles and card games to earn the coins that grow your village.</p>
    <div class="menu">
      <button class="btn green" id="tPlay">${has?'▶ Continue village':'▶ Start village'}</button>
      <button class="btn blue" id="tFB">⚙️ Free Play — Bolt Sorting</button>
      <button class="btn blue" id="tFC">🃏 Free Play — Bean Harvest</button>
      ${has?'<button class="btn grey" id="tReset" style="font-size:15px">🗑 Start over (erase my village)</button>':''}
    </div>
    <div class="sub">Free play never touches your progress · Progress saves in this browser</div>
    <div class="ver">Version ${VERSION}</div>
    ${iosHint()}<div id="updBox"></div>`;
  $('#tPlay').onclick=()=>{sfx.click();goFull();startWorld()};
  $('#tFB').onclick=()=>{goFull();openFreeSetup('bolt')};
  $('#tFC').onclick=()=>{goFull();openFreeSetup('card')};
  showUpdateBanner();
  const tr=$('#tReset');if(tr)tr.onclick=askReset;
}
// free play started from the title screen has no world behind it
const _leave=leaveMG;
leaveMG=function(){
  _leave();
  if(!worldOn){showTitle()}
};
/* ---- full screen ---- */
const fsRoot=document.documentElement,fsReq=fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const isStandalone=()=>(window.matchMedia&&(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches))||navigator.standalone===true;
function goFull(){
  if(S.autoFs===false||isStandalone()||fsOn()||!fsReq)return;
  try{const p=fsReq.call(fsRoot,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}
}
function toggleFull(){
  try{
    if(fsOn()){S.autoFs=false;fsExit.call(document)}
    else{S.autoFs=true;const p=fsReq.call(fsRoot,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>toast('Full screen is blocked here. Open the link in your browser (not an in-app viewer).'))}
  }catch(e){toast('Full screen is blocked here. Open the link in your browser (not an in-app viewer).')}
  save(true);
}
function iosHint(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!isStandalone()?'<div class="ios">📱 For full screen on iPhone/iPad: tap Share → Add to Home Screen, then open it from there.</div>':''}
$('#bFull').onclick=toggleFull;
if(!fsReq||isStandalone())$('#bFull').classList.add('hidden');

/* ---- self-update: spot a stale cached copy and offer the fresh one ---- */
let newVersion=null;
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION){newVersion=m[1];showUpdateBanner();if(worldOn)toast(`🔄 Update ready: ${m[1]}. Open ☰ to refresh.`)}
  }catch(e){}
}
function reloadFresh(){save(true);flushFlyers();location.href=location.pathname+'?v='+encodeURIComponent((newVersion||'').split(' ')[0]||Date.now());}
function showUpdateBanner(){
  const box=$('#updBox');if(!box||!newVersion)return;
  box.innerHTML=`<div class="upd">🔄 A newer version is available (${newVersion}) <button class="btn small green" id="updGo" style="margin-left:8px">Update now</button></div>`;
  $('#updGo').onclick=reloadFresh;
}
checkUpdate();setInterval(checkUpdate,5*60*1000);
addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
load();
checkStory(true);
setInterval(()=>save(true),8000);
addEventListener('visibilitychange',()=>{if(document.hidden){flushFlyers();save(true)}});
addEventListener('beforeunload',()=>{flushFlyers();save(true)});
showTitle();
</script>
