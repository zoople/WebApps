<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Harvest Hollow</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="harvest-hollow.webmanifest">
<meta name="theme-color" content="#1b140d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harvest Hollow">
<style>
:root{
  --ink:#2b2118; --ink2:#5b4a38; --paper:#f6e7c3; --paper2:#ead5a6; --gold:#e8b230; --gold2:#b8851a;
  --good:#5aa34a; --bad:#c8503c; --blue:#4a86c5; --panel:#3a2a1c; --panel2:#523b27;
  --tex-wood:none; --tex-felt:none; --tex-soil:none; --tex-metal:none; --tex-paper:none; --tex-bench:none;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b140d;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#3a2606;background:linear-gradient(#ffd96a,#e8a720);box-shadow:0 3px 0 #9a6a0e,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a0e,0 3px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:disabled{filter:grayscale(.85) brightness(.85);cursor:not-allowed}
.btn.green{background:linear-gradient(#a6e08a,#58a83e);color:#0f2c06;box-shadow:0 3px 0 #2f6a1f,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.blue{background:linear-gradient(#9fcdf5,#4a86c5);color:#0b2440;box-shadow:0 3px 0 #28537f,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.grey{background:linear-gradient(#e6dcc8,#b9a98a);color:#33261a;box-shadow:0 3px 0 #7d6e55,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;color:#fff3d6;background:linear-gradient(rgba(70,48,28,.92),rgba(40,27,15,.92));border:1px solid rgba(255,220,150,.35);box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);white-space:nowrap}
.pill small{opacity:.7;font-weight:600}

/* ---------- world ---------- */
#world{background:#4d8a3a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--safe-t)) 10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .sp{flex:1;pointer-events:none}
#bag{display:flex;gap:8px}
#bGuide.off{opacity:.5;filter:grayscale(1)}
#goal.min{cursor:pointer;padding:6px 14px;border-radius:999px}#goal.min #goalMin{display:none}
#goalMin{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #b8851a;background:rgba(255,255,255,.55);color:#5b3a18;font-weight:900;line-height:1;padding:0}
#goal .tip{display:block;font-weight:600;font-size:13px;margin-top:2px}
#goalrow{flex-basis:100%;order:10;pointer-events:none}
#goal{border-radius:14px;padding:9px 12px;pointer-events:auto;white-space:normal;max-width:min(380px,100%);display:inline-flex;align-items:flex-start;gap:8px;background:linear-gradient(#fff3cf,#f0d58a);color:#3a2606;border:2px solid #b8851a;font-size:14px;line-height:1.3}
.blt{margin:0;padding-left:20px}.blt li{margin:5px 0;line-height:1.4}
.sec{font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);margin:12px 0 2px}
.row.ready{background:rgba(120,200,90,.25);border-radius:10px;padding:8px;border-bottom:0;margin:3px 0}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.say .face{flex:none;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;background:radial-gradient(#fff6d8,#e5c682);border:3px solid #7a5530;box-shadow:inset 0 -5px 8px rgba(120,70,10,.3),0 3px 6px rgba(0,0,0,.3)}
.say .who{font-weight:800;font-family:Georgia,serif;font-size:19px}
.say .txt{background:rgba(255,255,255,.6);border:2px solid #7a5530;border-radius:14px;padding:10px 12px;line-height:1.45}
.goalbox{margin-top:12px;padding:9px 11px;border-radius:10px;background:rgba(232,178,48,.3);border:1px solid rgba(184,133,26,.6);font-weight:700}
#bag span.it{display:inline-flex;gap:3px;align-items:center}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#e0412f;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));padding:6px 14px;border-radius:999px;background:rgba(30,20,10,.72);color:#ffeec8;font-size:13px;pointer-events:none;max-width:90vw;text-align:center;transition:opacity .5s}
#stickzone{position:absolute;left:0;bottom:0;width:60%;height:55%;display:none;touch-action:none;z-index:4}
#stick{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(rgba(255,238,200,.16),rgba(40,28,16,.38));border:2px solid rgba(255,230,170,.45);box-shadow:inset 0 0 18px rgba(0,0,0,.35);opacity:.55;transition:opacity .15s;pointer-events:none}
#stick.on{opacity:.95}
#knob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#e0a526 70%,#9a6a0e);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.25)}
#talkBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--safe-b));display:none;z-index:5;font-size:16px;padding:12px 20px}
@media (pointer:coarse){#stickzone{display:block}#talkBtn{left:auto;right:16px;transform:none;bottom:calc(70px + var(--safe-b))}}
@media (pointer:coarse){#hint{left:auto;right:10px;transform:none;bottom:calc(20px + var(--safe-b));max-width:calc(100vw - 190px);font-size:12px;border-radius:14px}}
@media (max-width:560px){#hud .lbl{display:none}#hud .btn.small{padding:7px 10px}}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:50}
.toast{padding:8px 16px;border-radius:12px;background:rgba(255,246,222,.96);color:var(--ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:toastIn .25s ease-out,toastOut .4s 2.4s forwards;border:2px solid var(--gold)}
@keyframes toastIn{from{transform:translateY(-12px) scale(.9);opacity:0}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- title ---------- */
#title{background:radial-gradient(ellipse at 50% 30%,rgba(255,220,130,.35),transparent 60%),var(--tex-wood),#5a3d24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:5}
#title h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,9vw,72px);color:#ffe9a8;text-shadow:0 3px 0 #7a4a12,0 7px 16px rgba(0,0,0,.5);letter-spacing:1px}
#title p{margin:0;color:#f2dcae;max-width:520px;line-height:1.45}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw);margin-top:10px}
#title .menu .btn{font-size:18px;padding:13px}
#title .ver{margin-top:2px;padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe9a8;font-size:13px;font-weight:700;letter-spacing:.5px}
#title .upd{padding:8px 14px;border-radius:12px;background:#fff3cf;color:#3a2606;font-weight:700;border:2px solid #b8851a;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#title .ios{font-size:13px;color:#f2dcae;max-width:340px;opacity:.9}
#title .sub{font-size:13px;color:#f2dcae;opacity:.85}
.sign{background:var(--tex-paper),var(--paper);border:3px solid #7a5530;border-radius:14px;padding:14px 18px;box-shadow:0 8px 22px rgba(0,0,0,.5)}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:30;background:rgba(15,9,3,.62);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.sheet{color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--tex-paper),var(--paper);border:4px solid #7a5530;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(120,80,20,.25);padding:16px 18px;position:relative;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.sheet h2{margin:0 0 4px;font-family:Georgia,serif;font-size:24px}
.sheet .x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid #7a5530;background:#f3dba5;font-weight:900;color:#5b3a18}
.sheet .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(90,60,25,.35)}
.sheet .row:last-child{border-bottom:0}
.sheet .grow{flex:1;min-width:0}
.sheet .muted{color:var(--ink2);font-size:13px}
.bar{height:9px;border-radius:5px;background:rgba(60,40,15,.25);overflow:hidden;margin-top:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.bar>i{display:block;height:100%;background:linear-gradient(#9be07a,#4ea23a);border-radius:5px;transition:width .3s}
.cost{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:8px;background:rgba(70,45,15,.13);font-weight:700;margin:2px 3px 2px 0;font-size:14px}
.cost.no{background:rgba(200,60,40,.2);color:#8b2412}
.bhead{display:flex;gap:12px;align-items:center}
.bicon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(#fff5d8,#e5c682);border:3px solid #7a5530;box-shadow:inset 0 -4px 8px rgba(120,70,10,.3)}
.lvl{display:inline-block;padding:1px 9px;border-radius:9px;background:#5b3a18;color:#ffe9a8;font-size:13px;font-weight:700}
ul.perks{margin:6px 0;padding-left:20px;font-size:14px}ul.perks li{margin:2px 0}ul.perks li.new{color:#2f7a1f;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.field input[type=range]{width:100%;accent-color:#b8851a}

/* ---------- minigame shell ---------- */
#mg{z-index:20;display:flex;flex-direction:column}
.mgbar{display:flex;gap:6px;align-items:center;padding:calc(8px + var(--safe-t)) 10px 8px;flex-wrap:wrap;position:relative;z-index:3}
.mgbar .sp{flex:1}
.mgbar h3{margin:0;font-family:Georgia,serif;color:#ffe9a8;text-shadow:0 2px 0 rgba(0,0,0,.5);font-size:19px}
.tag{padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe9c0;font-weight:700;font-size:13px;border:1px solid rgba(255,230,160,.3)}
.tag.free{background:#3b6f9a}

/* ---------- bolt game ---------- */
#bolt{background:radial-gradient(ellipse at 50% 18%,rgba(130,170,255,.20),transparent 62%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.45),transparent 70%),linear-gradient(#2c3a57,#18202f);user-select:none;-webkit-user-select:none}
#boltArea{flex:1;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center}
#boltBoard{transform-origin:center center;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 8px;--bw:58px;--bh:34px}
.podium{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .15s,opacity .2s;position:relative;width:calc(var(--bw) + 20px);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-top:32px}
.podium .stack{position:relative;width:var(--bw);height:calc(var(--cap)*var(--bh) + 14px)}
.podium .rod{position:absolute;left:50%;top:0;bottom:0;transition:height .25s cubic-bezier(.3,1.4,.5,1);width:16px;margin-left:-8px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(180deg,#a9b0b8 0 2px,#e9edf1 2px 4px,#6d747c 4px 6px);box-shadow:inset -3px 0 3px rgba(0,0,0,.45),inset 3px 0 3px rgba(255,255,255,.45),0 0 3px rgba(0,0,0,.5)}
.podium .rod::after{content:"";position:absolute;top:-4px;left:2px;right:2px;height:8px;border-radius:50%;background:radial-gradient(#fff,#9aa3ad)}
.podium .base{width:calc(var(--bw) + 20px);height:20px;border-radius:12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.4)),var(--tex-metal),#8f98a2;box-shadow:0 5px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7);margin-top:-4px;position:relative}
.podium .base::after{content:"";position:absolute;left:10px;right:10px;top:-5px;height:8px;border-radius:50%;background:radial-gradient(#555a60,#2c3034)}
.podium .fullbadge{position:absolute;top:-36px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(#6fe27e,#2d9a3e);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;border:3px solid #fff3cf;box-shadow:0 0 14px 3px rgba(255,213,74,.95);z-index:6}
.podium.done .rod{box-shadow:inset -3px 0 3px rgba(0,0,0,.45),inset 3px 0 3px rgba(255,255,255,.45),0 0 14px 3px rgba(255,213,74,.8)}
.podium.done .bolt{box-shadow:0 0 0 2px #ffd54a,0 0 12px 2px rgba(255,213,74,.9),0 3px 4px rgba(0,0,0,.5);filter:brightness(1.08) saturate(1.1)}
.podium.done{cursor:default}
.podium.justdone{animation:donePop .7s}
@keyframes donePop{25%{transform:scale(1.14)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.podium .spk{position:absolute;left:50%;top:30%;font-size:16px;pointer-events:none;animation:spk .9s ease-out forwards;z-index:7}
@keyframes spk{from{transform:translate(-50%,0) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.1);opacity:0}}
.podium .slot{position:absolute;left:3px;right:3px;height:calc(var(--bh) - 6px);bottom:calc(var(--i)*var(--bh) + 4px);border:2px dashed rgba(255,255,255,.4);border-radius:8px;background:rgba(0,0,0,.14);pointer-events:none}

.podium .fullbadge.cap{background:radial-gradient(#ff8a7a,#c43a2c);box-shadow:0 0 12px 2px rgba(255,90,70,.8);font-size:15px}
.podium.dropok .base{box-shadow:0 0 0 3px #7ee37a,0 0 16px 4px rgba(126,227,122,.85),0 5px 8px rgba(0,0,0,.55);animation:okb 1s infinite}
@keyframes okb{50%{box-shadow:0 0 0 3px #c6f5c2,0 0 6px 2px rgba(126,227,122,.4),0 5px 8px rgba(0,0,0,.55)}}
.podium.dropno{opacity:.55}
.podium:active{transform:scale(.97)}
.podium.sel .base{box-shadow:0 0 0 3px #ffd54a,0 0 18px 4px rgba(255,213,74,.8),0 5px 8px rgba(0,0,0,.55)}
.podium.done .base{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.35)),linear-gradient(90deg,#f1d36a,#fff2a8,#d5a92a)}
.podium.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bolt{position:absolute;left:0;width:var(--bw);height:calc(var(--bh) - 2px);bottom:calc(var(--i)*var(--bh) + 2px);border-radius:8px/10px;
  --h:0;
  background:
   linear-gradient(180deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%),
   linear-gradient(90deg,hsl(var(--h) 70% 26%) 0 13%,hsl(var(--h) 75% 46%) 13% 30%,hsl(var(--h) 85% 62%) 30% 50%,hsl(var(--h) 78% 50%) 50% 72%,hsl(var(--h) 70% 30%) 72% 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.3);
  transform-origin:50% 100%;transition:translate .24s cubic-bezier(.3,1.5,.5,1),scale .2s,filter .2s;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.6);font-weight:900}
.bolt::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:11px;margin:-5px 0 0 -9px;border-radius:50%;background:radial-gradient(#2a2f35 35%,#585f67);box-shadow:inset 0 1px 2px #000;opacity:.0}
.bolt.hid{--h:215;background:
   linear-gradient(180deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,.35) 100%),
   linear-gradient(90deg,#3c4047 0 13%,#5b6068 13% 30%,#7a808a 30% 50%,#5e646c 50% 72%,#3a3e44 72% 100%);color:#d9dde3}
.bolt.lift{translate:0 calc(-1*var(--lift));scale:1.1;z-index:6;filter:brightness(1.12);box-shadow:0 14px 10px -6px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.3);animation:liftbob 1.1s ease-in-out .25s infinite}
@keyframes liftbob{50%{rotate:2.5deg}0%,100%{rotate:-2.5deg}}
.bolt.flying{transition:none!important;translate:none!important;scale:none!important;rotate:none!important;animation:none!important;z-index:30;filter:brightness(1.12)}
.bolt.wave{animation:wave .55s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*55ms)}
@keyframes wave{40%{translate:0 -12px;scale:1.1}}
.ripple{position:absolute;left:50%;bottom:-4px;width:40px;height:14px;margin-left:-20px;border-radius:50%;border:3px solid rgba(255,255,255,.75);pointer-events:none;animation:ripple .5s ease-out forwards}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(2);opacity:0}}
.dust{position:absolute;left:50%;bottom:2px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;animation:dust .5s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.bolt.reveal{animation:reveal .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes reveal{0%{filter:brightness(2.6);scale:1.25}100%{filter:none;scale:1}}
.mgfoot{padding:8px 10px calc(10px + var(--safe-b));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative;z-index:3}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(10,6,2,.6);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.overlay .sheet{text-align:center}
.stars{font-size:44px;letter-spacing:6px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.stars .off{opacity:.25;filter:grayscale(1)}
.reward{display:inline-flex;gap:8px;align-items:center;font-size:26px;font-weight:800;margin:6px 0}

/* ---------- card game: ONE card row on top, tappable fields at the bottom ---------- */
#cards{--cw:min(17.5vw,calc((var(--vh,1vh)*100 - 410px)/3),84px);--hw:calc(var(--cw)*.62);--pw:calc(var(--cw)*.95);background:radial-gradient(ellipse at 50% 40%,rgba(120,220,140,.18),transparent 65%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%),var(--tex-felt),#2f6b48;color:#fff;overflow:hidden}
#cards .mgbar{padding-bottom:4px;gap:5px}
#cards .mgbar h3{display:none}
@media (min-width:600px){#cards .mgbar h3{display:block}}
@media (max-width:600px){#mg .lbl{display:none}}
#cards .tag{font-size:12px;padding:3px 8px}
.cg{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:0 8px 2px}
/* step tracker */
.stp{flex:none;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800;color:#cfe9d5}
.stp .st{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);white-space:nowrap;opacity:.7}

.none{color:#cfe9d5;font-size:12px;align-self:center}

  background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.35)),var(--tex-soil),#5b3a22;box-shadow:inset 0 4px 14px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.4);transition:box-shadow .15s}

  background:var(--tex-paper),linear-gradient(160deg,hsl(var(--h) 85% 88%),hsl(var(--h) 70% 72%));background-blend-mode:multiply,normal;

.floatc{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:#ffe27a;text-shadow:0 2px 3px #000;z-index:50;animation:floatUp 1.1s ease-out forwards}

#cFoot{padding-top:2px}

<script>
'use strict';
/* =====================================================================
   HARVEST HOLLOW — a walkable village meta-game wrapping two mini-games
   (Nuts & Bolts sorting + Bean Harvest cards). Single file, no assets.
   ===================================================================== */
const VERSION='v28 · 11 Oct 2026';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(a,r=Math.random)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};

/* ---------- audio: soft modern synth (bells, plucks, gentle reverb) ---------- */
let AC=null,master=null,verbIn=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('hh.muted')==='1'}catch(e){}
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume();return AC}
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    try{AC=new Ctx({latencyHint:'playback'})}catch(e){AC=new Ctx()}
    // master chain: high-pass (phone speakers distort below ~90 Hz) -> high-shelf cut -> gentle compressor -> out
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;hp.Q.value=.6;
    const hs=AC.createBiquadFilter();hs.type='highshelf';hs.frequency.value=5500;hs.gain.value=-5;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-22;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.025;comp.release.value=.25;
    hp.connect(hs);hs.connect(comp);comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.6;master.connect(hp);
    const len=Math.floor(AC.sampleRate*1.5),ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
    const conv=AC.createConvolver();conv.buffer=ir;const vg=AC.createGain();vg.gain.value=.5;conv.connect(vg);vg.connect(hp);verbIn=conv;
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  }catch(e){AC=null}
  return AC;
}
function route(node,send){node.connect(master);if(send&&verbIn){const s=AC.createGain();s.gain.value=send;node.connect(s);s.connect(verbIn)}}
let liveVoices=0;
function voice(f,o={}){
  if(muted||!audio()||liveVoices>=28)return;
  const{d=.3,type='sine',v:v0=.1,at:at0=.006,when=0,slide=0,lp=0,send=.3,det=0}=o;
  const v=Math.min(v0,.3),at=Math.max(at0,.008);
  const t=AC.currentTime+.02+when,osc=AC.createOscillator(),g=AC.createGain();liveVoices++;
  osc.onended=()=>{liveVoices--;try{osc.disconnect();g.disconnect()}catch(e){}};
  osc.type=type;osc.frequency.setValueAtTime(f,t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);if(det)osc.detune.value=det;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let n=osc;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;osc.connect(fl);n=fl}
  n.connect(g);route(g,send);osc.start(t);osc.stop(t+d+.05);
}
function noise(o={}){
  if(muted||!audio())return;
  const{d=.06,v:nv=.08,f=900,q=1,type='bandpass',when=0,send=.1}=o;const v=Math.min(nv,.07);
  if(liveVoices>=28)return;
  const t=AC.currentTime+.02+when,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();liveVoices++;
  src.onended=()=>{liveVoices--;try{src.disconnect();g.disconnect()}catch(e){}};
  src.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl);fl.connect(g);route(g,send);src.start(t,Math.random()*.5);src.stop(t+d+.02);
}
// glassy bell / marimba-ish chime: fundamental + soft inharmonic partials
function bell(f,v=.08,when=0,len=.9){
  voice(f,{d:len,v,when,at:.004,send:.45});
  voice(f*2.76,{d:len*.45,v:v*.28,when,at:.003,send:.4});
  voice(f*5.4,{d:len*.2,v:v*.1,when,at:.002,send:.3});
}
const PENT=[0,2,4,7,9];
const pent=i=>523.25*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12);
const tone=(f,d=.1,type='sine',v=.08,when=0,slide=0)=>voice(f,{d,type,v,when,slide:slide?(f+slide)/f:0});
const sfx={
  pick:()=>{noise({d:.03,v:.05,f:4200,type:'highpass'});voice(880,{d:.1,v:.05,type:'triangle',lp:2600})},
  chop:()=>{voice(190,{d:.14,v:.2,slide:.45,type:'sine'});noise({d:.07,v:.12,f:1000,q:.8,send:.05});voice(95,{d:.18,v:.16,when:.01,type:'sine'})},
  get:()=>{bell(784,.07);bell(1175,.06,.07)},
  drop:()=>{voice(300,{d:.16,v:.12,slide:2,type:'sine',lp:2200});noise({d:.04,v:.04,f:2500,type:'highpass',when:.05})},
  bad:()=>{voice(210,{d:.28,v:.1,slide:.62,type:'triangle',lp:900,send:.1})},
  win:()=>{[523.25,659.25,783.99,987.77,1046.5].forEach((f,i)=>bell(f,.08,i*.095,1.2))},
  coin:()=>{bell(1318.5,.07);bell(1760,.06,.07,.7)},
  click:()=>{voice(640,{d:.06,v:.05,type:'triangle',lp:2400});noise({d:.02,v:.025,f:5000,type:'highpass'})},
  chime:i=>bell(pent(i),.055,0,.8)
};

/* ---------- tiny helpers: save, toast, panels ---------- */
const SAVE_KEY='harvestHollow.v1';

  held.length=0;if(typeof stickReset==='function')stickReset();

const costHTML=(c,have)=>Object.entries(c).map(([k,v])=>{
  const h=k==='coins'?S.coins:(S.store[k]||0);const e=k==='coins'?'🪙':ITEMS[k].e;
  return `<span class="cost ${h>=v?'':'no'}">${e} ${v}${have?` <small>(${h})</small>`:''}</span>`}).join('');

function reward(r){for(const[k,v]of Object.entries(r)){if(k==='coins'){S.coins+=v;stat('earned',v)}else if(k==='energy')S.energy=Math.min(MAXE+3,S.energy+v);else S.store[k]=(S.store[k]||0)+v}}

function energyTick(){
  const n=Date.now();
  if(S.energy>=MAXE){S.eT=n;return}
  const k=Math.floor((n-S.eT)/ERGEN);if(k>0){S.energy=Math.min(MAXE,S.energy+k);S.eT+=k*ERGEN;if(S.energy>=MAXE)S.eT=n}
}

   PROCEDURAL TEXTURES  (wood, felt, soil, metal, paper) → CSS vars
   ===================================================================== */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function speckle(g,w,h,n,light,dark,sz=1.4,r=Math.random){
  for(let i=0;i<n;i++){g.fillStyle=r()<.5?light:dark;g.fillRect(r()*w,r()*h,sz*(.5+r()),sz*(.5+r()))}
}
function woodCanvas(w=256,h=256,r=mulberry(7),base=[32,48,38]){
  const c=mk(w,h),g=c.getContext('2d');const bh=h/8;
  for(let b=0;b<8;b++){
    const hh=base[0]+r()*8-4,ss=base[1]+r()*10-5,ll=base[2]+r()*9-4;
    const gr=g.createLinearGradient(0,b*bh,0,(b+1)*bh);
    gr.addColorStop(0,`hsl(${hh} ${ss}% ${ll+4}%)`);gr.addColorStop(.5,`hsl(${hh} ${ss}% ${ll}%)`);gr.addColorStop(1,`hsl(${hh} ${ss}% ${ll-4}%)`);
    g.fillStyle=gr;g.fillRect(0,b*bh,w,bh);
    for(let k=0;k<26;k++){ // grain
      const y=b*bh+r()*bh,amp=.6+r()*1.6,ph=r()*6,fr=.01+r()*.03;
      g.strokeStyle=`rgba(${r()<.6?'40,22,8':'255,225,170'},${.05+r()*.12})`;g.lineWidth=.6+r()*1.1;g.beginPath();
      for(let x=0;x<=w;x+=8){const yy=y+Math.sin(x*fr+ph)*amp;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke();
    }
    if(r()<.55){ // knot
      const kx=r()*w,ky=b*bh+bh/2;
      for(let k=4;k>0;k--){g.strokeStyle=`rgba(40,20,5,${.1+k*.05})`;g.lineWidth=1;g.beginPath();g.ellipse(kx,ky,k*3.2,k*1.8,0,0,7);g.stroke()}
      g.fillStyle='rgba(40,20,5,.35)';g.beginPath();g.ellipse(kx,ky,2.4,1.4,0,0,7);g.fill();
    }
    g.fillStyle='rgba(20,10,0,.55)';g.fillRect(0,b*bh,w,1.6);
    g.fillStyle='rgba(255,230,180,.18)';g.fillRect(0,b*bh+1.6,w,1);
    // nails
    g.fillStyle='rgba(30,20,10,.55)';g.beginPath();g.arc(6,b*bh+bh/2,1.6,0,7);g.arc(w-6,b*bh+bh/2,1.6,0,7);g.fill();
  }
  return c;
}
function feltCanvas(r=mulberry(3)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#2f6b48';g.fillRect(0,0,160,160);
  speckle(g,160,160,5200,'rgba(190,255,200,.08)','rgba(0,20,0,.14)',1.3,r);
  for(let i=0;i<260;i++){g.strokeStyle=`rgba(200,255,210,${.03+r()*.04})`;g.lineWidth=.6;const x=r()*160,y=r()*160;g.beginPath();g.moveTo(x,y);g.lineTo(x+r()*7-3,y+r()*7-3);g.stroke()}
  return c;
}
function soilCanvas(r=mulberry(5)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#5b3a22';g.fillRect(0,0,160,160);
  for(let y=0;y<160;y+=16){ // furrows
    const gr=g.createLinearGradient(0,y,0,y+16);gr.addColorStop(0,'rgba(255,200,140,.18)');gr.addColorStop(.35,'rgba(255,200,140,0)');gr.addColorStop(.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
    g.fillStyle=gr;g.fillRect(0,y,160,16);
  }
  speckle(g,160,160,3800,'rgba(255,210,150,.16)','rgba(20,8,0,.3)',1.6,r);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(${90+r()*50|0},${70+r()*30|0},${50+r()*20|0},.6)`;g.beginPath();g.ellipse(r()*160,r()*160,1+r()*2.5,1+r()*1.6,r()*3,0,7);g.fill()}
  return c;
}
function metalCanvas(r=mulberry(11)){
  const c=mk(128,64),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'#c9d0d8');gr.addColorStop(.5,'#9aa3ad');gr.addColorStop(1,'#7b848e');g.fillStyle=gr;g.fillRect(0,0,128,64);
  for(let i=0;i<420;i++){const y=r()*64;g.strokeStyle=`rgba(${r()<.5?'255,255,255':'30,35,40'},${.04+r()*.1})`;g.lineWidth=.5+r()*.6;g.beginPath();g.moveTo(r()*60,y);g.lineTo(60+r()*68,y+r()*.8-.4);g.stroke()}
  return c;
}
function paperCanvas(r=mulberry(9)){
  const c=mk(160,160),g=c.getContext('2d');g.fillStyle='#f6e7c3';g.fillRect(0,0,160,160);
  for(let i=0;i<14;i++){const gr=g.createRadialGradient(0,0,0,0,0,1);g.save();g.translate(r()*160,r()*160);g.scale(20+r()*40,20+r()*40);
    const rg=g.createRadialGradient(0,0,0,0,0,1);rg.addColorStop(0,`rgba(${150+r()*40|0},${110+r()*30|0},60,.05)`);rg.addColorStop(1,'rgba(150,110,60,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,1,0,7);g.fill();g.restore()}
  speckle(g,160,160,2600,'rgba(255,255,255,.5)','rgba(120,80,30,.16)',1.1,r);
  for(let i=0;i<200;i++){g.strokeStyle=`rgba(120,80,30,${.03+r()*.05})`;g.lineWidth=.5;const x=r()*160,y=r()*160;g.beginPath();g.moveTo(x,y);g.lineTo(x+r()*10-5,y+r()*4-2);g.stroke()}
  return c;
}

/* ---- map ---- */
const grid=[];            // 0 grass 1 path 2 water 3 mat
const block=new Uint8Array(MW*MH);
const isBlocked=(x,y)=>x<0||y<0||x>=MW||y>=MH||block[y*MW+x]===1;
const nodes=[],decor=[];
const nodeAt={};
function buildMap(){
  const r=mulberry(1234);
  for(let y=0;y<MH;y++){grid[y]=new Array(MW).fill(0)}
  const hl=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)grid[y][x]=1};
  const vl=(x,y0,y1)=>{for(let y=y0;y<=y1;y++)grid[y][x]=1};
  hl(4,31,6);vl(17,6,14);hl(12,22,12);hl(6,28,14);vl(6,14,17);vl(26,14,17);vl(14,12,14);hl(6,31,12);vl(6,12,14);
  // water
  const lake=(cx,cy,rx,ry)=>{for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<1+(hash(x,y,3)-.5)*.35)grid[y][x]=2}};
  lake(31,21,4.2,3.2);lake(3.5,22,3.3,2.3);
  // buildings
  BLD.forEach(b=>{
    for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)block[(b.y+dy)*MW+b.x+dx]=1;
    grid[b.door[1]][b.door[0]]=3;
  });
  block[BOARD.y*MW+BOARD.x]=1;grid[BOARD.door[1]][BOARD.door[0]]=3;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(grid[y][x]===2)block[y*MW+x]=1;
  // border forest
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const edge=x<2||x>=MW-2||y<2||y>=MH-1;
    if(edge&&grid[y][x]!==2&&r()<(x<1||x>=MW-1||y<1||y>=MH-1?1:.7)){block[y*MW+x]=1;decor.push({k:'tree',x,y,v:Math.floor(r()*3),big:true})}
  }
  const free=(x,y)=>x>=2&&y>=2&&x<MW-2&&y<MH-1&&!block[y*MW+x]&&grid[y][x]===0&&!nodeAt[x+','+y];
  const near=(x,y,d)=>nodes.some(n=>Math.abs(n.x-x)<d&&Math.abs(n.y-y)<d);
  const scatter=(type,x0,x1,y0,y1,count,gap)=>{
    let tries=0;while(count>0&&tries++<800){
      const x=x0+Math.floor(r()*(x1-x0+1)),y=y0+Math.floor(r()*(y1-y0+1));
      if(!free(x,y)||near(x,y,gap))continue;
      const n={type,x,y,ch:NODE_T[type].max,t:0,acc:0,v:Math.floor(r()*3)};nodes.push(n);nodeAt[x+','+y]=n;count--;
    }
  };
  scatter('tree',3,11,15,21,15,2);
  scatter('rock',24,31,8,13,10,2);
  scatter('bush',12,21,17,21,9,2);
  scatter('crystal',17,22,14,20,6,2);
  for(let y=16;y<=19;y++)for(let x=23;x<=28;x++){if(grid[y][x]!==0||block[y*MW+x])continue;const n={type:'wheat',x,y,ch:3,t:0,acc:0,v:(x+y)%3};nodes.push(n);nodeAt[x+','+y]=n}
  // scattered non-blocking decor
  for(let i=0;i<150;i++){
    const x=2+Math.floor(r()*(MW-4)),y=2+Math.floor(r()*(MH-3));
    if(grid[y][x]!==0||block[y*MW+x]||nodeAt[x+','+y])continue;
    const k=r();decor.push({k:k<.55?'flower':k<.8?'tuft':'pebble',x,y,v:Math.floor(r()*4),ox:r()*30+9,oy:r()*20+20});
  }
  // a few decorative non-gatherable trees near the plaza
  [[8,8],[9,11],[25,9],[27,11],[14,7],[21,7],[5,10],[30,16]].forEach(([x,y])=>{if(free(x,y)){block[y*MW+x]=1;decor.push({k:'tree',x,y,v:(x+y)%3,big:true})}});
}

function spr(w,h,ax,ay,fn){const c=mk(w,h),g=c.getContext('2d');fn(g,w,h);return{c,ax,ay}}
const rg=(g,x,y,r0,x2,y2,r1,stops)=>{const gr=g.createRadialGradient(x,y,r0,x2,y2,r1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr};
const lg=(g,x,y,x2,y2,stops)=>{const gr=g.createLinearGradient(x,y,x2,y2);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr};
function shadowEll(g,x,y,rx,ry,a=.3){g.fillStyle=`rgba(10,25,5,${a})`;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}

      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+lean/2,y-hgt/2,x+lean,y-hgt);g.stroke();

    g.fillStyle=lg(g,0,4,0,TS-4,[[0,'#d9534a'],[1,'#a22d2d']]);g.beginPath();g.roundRect(4,6,TS-8,TS-12,7);g.fill();
    g.strokeStyle='#f7dd9a';g.lineWidth=2.5;g.beginPath();g.roundRect(8,10,TS-16,TS-20,4);g.stroke();
    for(let i=0;i<26;i++){g.strokeStyle='rgba(255,255,255,.07)';g.beginPath();g.moveTo(8,10+i*1.2);g.lineTo(TS-8,10+i*1.2);g.stroke()}
    return c})();
  /* trees */
  const treeCol=[[105,48],[98,52],[118,44]];
  SP.tree=[0,1,2].map(v=>spr(92,116,46,106,(g,w,h)=>{
    const r=mulberry(300+v);const[hu,sa]=treeCol[v];

const CHIP={crystal:['#7fe0ff','#c9f4ff','#3aa0d8'],tree:['#8a5a2b','#5cae3f','#a8703a'],rock:['#9aa3ab','#c9d0d6','#6c737a'],bush:['#6a4fc0','#c0392b','#4fae3f'],wheat:['#e8c040','#f4dc7a','#b89a30']};

function swingInfo(){
  const nd=nodeAt[P.x+','+P.y];if(!(P.gather>0)||!nd||P.moving)return null;
  const type=nd.type==='tree'?'chop':nd.type==='rock'?'mine':'pick',per=type==='pick'?.9:.62;
  return{type,u:((P.swing||0)%per)/per};
}
function impactFx(nd){
  const side=P.dir==='l'?-1:1,x=P.px+side*16,y=P.py+10;
  burst(x,y,CHIP[nd.type],nd.type==='rock'?9:7,70,75,.55,3);
  if(nd.type==='rock')burst(x,y-2,['#fff3b0','#ffd23a'],5,90,40,.3,2);

}
function resize(){
  const r=cv.getBoundingClientRect();if(!r.width)return;
  DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
  const tiles=clamp(Math.round(r.width/50),8,20);Z=r.width/(tiles*TS);VW=tiles*TS;VH=r.height/Z;restStick();
}

const paused=()=>!$('#modal').classList.contains('hidden')||!$('#mg').classList.contains('hidden')||!worldOn;
function fl(x,y,text,col='#fff'){floats.push({x,y,text,col,t:0})}

function tryStep(dx,dy){
  const nx=P.x+dx,ny=P.y+dy;
  if(dx)P.dir=dx>0?'r':'l';else P.dir=dy>0?'d':'u';
  if(isBlocked(nx,ny))return false;
  P.tx=nx;P.ty=ny;P.moving=true;P.t=0;P.gather=0;P.swing=0;P.lastImpact=-1;
  if(!doorAt[nx+','+ny])P.lastDoor=null;
  return true;
}
function bfs(sx,sy,gx,gy){
  const prev=new Int16Array(MW*MH).fill(-2);const q=[sy*MW+sx];prev[sy*MW+sx]=-1;
  for(let i=0;i<q.length;i++){
    const c=q[i],cx=c%MW,cy=(c/MW)|0;if(cx===gx&&cy===gy)break;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(isBlocked(nx,ny)||prev[ny*MW+nx]!==-2)continue;prev[ny*MW+nx]=c;q.push(ny*MW+nx)}
  }
  if(prev[gy*MW+gx]===-2)return null;
  const path=[];let c=gy*MW+gx;while(c!==sy*MW+sx){path.unshift([c%MW,(c/MW)|0]);c=prev[c]}return path;
}
function walkTo(tx,ty){
  // clicked a building? go to its door
  for(const b of BLD){if(tx>=b.x&&tx<b.x+3&&ty>=b.y&&ty<b.y+3){tx=b.door[0];ty=b.door[1]}}
  if(tx===BOARD.x&&ty===BOARD.y){tx=BOARD.door[0];ty=BOARD.door[1]}
  if(isBlocked(tx,ty))return;
  const fromX=P.moving?P.tx:P.x,fromY=P.moving?P.ty:P.y;
  const p=bfs(fromX,fromY,tx,ty);if(p){P.path=p}
}
const KEYMAP={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
addEventListener('keydown',e=>{
  const d=KEYMAP[e.key];if(!d)return;if(paused())return;e.preventDefault();
  if(!held.includes(d))held.push(d);P.path=[];

let stickDir=null;
function stickReset(){stickDir=null;const k=$('#knob');if(k)k.style.transform='translate(0,0)'}
function restStick(){const z=$('#stickzone'),b=$('#stick');if(z&&b&&z.clientHeight){b.style.left='20px';b.style.top=(z.clientHeight-160)+'px'}}
(function(){
  const zone=$('#stickzone'),base=$('#stick'),knob=$('#knob');let id=null,cx=0,cy=0;const R=54;
  const move=e=>{
    if(e.pointerId!==id)return;const r=zone.getBoundingClientRect();
    let dx=e.clientX-r.left-cx,dy=e.clientY-r.top-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    if(d<R*[.55,.42,.3,.2,.12][(S.stickSens||3)-1])stickDir=null;else stickDir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
  };
  zone.addEventListener('pointerdown',e=>{
    if(id!==null)return;e.preventDefault();id=e.pointerId;try{zone.setPointerCapture(id)}catch(_){}
    const r=zone.getBoundingClientRect();cx=clamp(e.clientX-r.left,70,r.width-70);cy=clamp(e.clientY-r.top,70,r.height-70);
    base.style.left=(cx-70)+'px';base.style.top=(cy-70)+'px';base.classList.add('on');move(e);
  });
  zone.addEventListener('pointermove',move);
  const up=e=>{if(e.pointerId!==id)return;id=null;base.classList.remove('on');stickReset();restStick()};
  zone.addEventListener('pointerup',up);zone.addEventListener('pointercancel',up);
})();

/* ---- arrival effects ---- */
function onArrive(){
  const b=doorAt[P.x+','+P.y];if(!b)return;
  if(b.kind==='barn'||b.kind==='craft')P.xfer={b,phase:'in',t:.15,n:0,put:0,took:0,full:false,bagFull:false};
}
/* ---- unloading / loading happens one item at a time ---- */
const flyers=[],FLY=.6;let inbound=0;const bufFly={};
const transferBusy=()=>!!P.xfer||flyers.length>0;
function fly(item,dir,b,land){
  const px=P.px,py=P.py-26,bx=b.x*TS+72,by=(b.y+2)*TS+4;
  flyers.push(Object.assign(dir==='in'?{e:ITEMS[item].e,x0:px,y0:py,x1:bx,y1:by,t:0}:{e:ITEMS[item].e,x0:bx,y0:by,x1:px,y1:py,t:0},{land}));
}
function flushFlyers(){while(flyers.length){const f=flyers.pop();if(f.land)f.land()}}
// items only count (store, stats, objectives) when they actually land
function xferStep(){
  const x=P.xfer,b=x.b,idx=x.n+x.put+x.took;
  if(b.kind==='barn'){
    const k=Object.keys(S.carry).find(k=>S.carry[k]>0);
    if(!k){finishXfer();return}
    S.carry[k]--;x.n++;
    fly(k,'in',b,()=>{S.store[k]=(S.store[k]||0)+1;stat('st_'+k);stat('delivered');burst(b.x*TS+72,(b.y+2)*TS+4,['#ffe27a','#fff6c8'],7,55,55,.5,2.6);hud();save()});
  }else{
    const[item,need]=Object.entries(b.in)[0],s=stn(b.id);
    if(x.phase==='in'){
      if((S.carry[item]||0)>0&&s.buf+(bufFly[b.id]||0)<need*3){
        S.carry[item]--;bufFly[b.id]=(bufFly[b.id]||0)+1;x.put++;
        fly(item,'in',b,()=>{bufFly[b.id]--;s.buf++;hud();save()});
      }else{if((S.carry[item]||0)>0)x.full=true;x.phase='out';x.t=.3;return}
    }else{
      if(s.out>0&&carryN()+inbound<S.cap){
        s.out--;inbound++;x.took++;
        fly(b.out,'out',b,()=>{inbound--;S.carry[b.out]=(S.carry[b.out]||0)+1;hud();save()});
      }else{if(s.out>0)x.bagFull=true;finishXfer();return}
    }
  }
  sfx.chime(Math.min(idx,14));
  hud();
}
function finishXfer(){
  const x=P.xfer,b=x.b;P.xfer=null;
  if(b.kind==='barn'){if(x.n){sfx.get();fl(b.x*TS+72,b.y*TS-4,`Stored ${x.n}`,'#ffe9a8')}}
  else{
    if(x.took){sfx.get();fl(b.x*TS+72,b.y*TS-4,`+${x.took} ${ITEMS[b.out].e}`,'#fff')}
    if(x.put)fl(b.x*TS+72,b.y*TS+14,`Fed ${x.put}`,'#fff');
    if(x.full)toast(`${b.name} is full`);
    if(x.bagFull)toast('Bag full!');
  }
  hud();
}
// game halls and the quest board open once you come to rest on their mat
function idleDoor(){
  const b=doorAt[P.x+','+P.y];
  if(!b||!(b.kind==='game'||b.kind==='board')||P.lastDoor===b.id)return;
  P.lastDoor=b.id;held.length=0;P.path=[];b.kind==='board'?openQuests():openBuilding(b);
}
/* ---- update ---- */
function update(dt){
  const stepT=.15;
  // stations
  for(const b of BLD){if(b.kind!=='craft')continue;const s=stn(b.id);const need=Object.values(b.in)[0];
    if(s.buf>=need&&s.out<6){s.prog+=dt;if(s.prog>=b.time){s.prog=0;s.buf-=need;s.out++;stat('craft_'+b.out);sfx.get();fl(b.x*TS+72,b.y*TS+20,ITEMS[b.out].e,'#fff');hud();checkQuestBadge()}}
    else s.prog=0}
  // one-at-a-time transfers + flying items
  if(P.xfer){
    if(P.moving||doorAt[P.x+','+P.y]!==P.xfer.b)P.xfer=null;
    else{P.xfer.t-=dt;if(P.xfer.t<=0){P.xfer.t=Math.max(.22,.36-(P.xfer.n+P.xfer.put+P.xfer.took)*.012);xferStep()}}
  }
  for(let i=flyers.length-1;i>=0;i--){flyers[i].t+=dt;if(flyers[i].t>=FLY){const f=flyers.splice(i,1)[0];if(f.land)f.land()}}
  // nodes regrow
  for(const n of nodes){if(n.ch<NODE_T[n.type].max){n.t+=dt;if(n.t>=NODE_T[n.type].regrow){n.ch=NODE_T[n.type].max;n.t=0}}}
  // movement
  if(P.moving){
    P.t+=dt;P.walk+=dt*9;
    if(P.t>=stepT){P.x=P.tx;P.y=P.ty;P.moving=false;P.t-=stepT;burst(P.x*TS+TS/2,P.y*TS+TS-4,['rgba(230,215,180,.55)'],2,14,12,.4,2.6);onArrive()}
  }
  if(!P.moving&&!paused()){
    let dx=0,dy=0;
    const dk=held.length?held[held.length-1]:stickDir;
    if(dk){const d=DIRS[dk];dx=d[0];dy=d[1]}
    else if(P.path.length){const nx=P.path[0];dx=nx[0]-P.x;dy=nx[1]-P.y;
      if(Math.abs(dx)+Math.abs(dy)!==1||isBlocked(nx[0],nx[1])){P.path=[];dx=dy=0}else P.path.shift()}
    if(dx||dy){const keep=P.t;tryStep(dx,dy);P.t=Math.min(keep,stepT*.5)}
    if(!P.moving)idleDoor();
  }
  // gathering
  const nd=nodeAt[P.x+','+P.y];
  if(!P.moving&&nd&&nd.ch>0){
    const T=NODE_T[nd.type];
    if(nd.type!=='crystal'&&carryN()>=S.cap){P.gather=0;if(!P.fullToast||performance.now()-P.fullToast>2500){P.fullToast=performance.now();toast('Bag full — drop it at the Barn 📦')}}
    else if(ENERGY_COST[nd.type]&&S.energy<ENERGY_COST[nd.type]){P.gather=0;if(!P.fullToast||performance.now()-P.fullToast>2500){P.fullToast=performance.now();toast('Out of ⚡ energy! Mine 💎 crystals, eat bread/jam, or rest')}}
    else{
      P.gather+=dt;P.swing=(P.swing||0)+dt;
      {const per=isForage(nd.type)?.9:.62,c=Math.floor(P.swing/per),u=(P.swing%per)/per,hit=isForage(nd.type)?.25:.58;
       if(u>=hit&&P.lastImpact!==c){P.lastImpact=c;impactFx(nd)}}
      if(P.gather>=gatherTime(nd.type)){
        P.gather=0;nd.ch--;nd.t=0;burst(P.px,P.py+4,CHIP[nd.type],10,70,80);stat('g_'+T.item);sfx.get();
        if(T.item==='energy'){const gain=3;S.energy=Math.min(MAXE,S.energy+gain);if(S.energy>=MAXE)S.eT=Date.now();fl(P.x*TS+24,P.y*TS-14,`+${gain} ⚡`,'#9fe8ff')}
        else{S.carry[T.item]=(S.carry[T.item]||0)+1;fl(P.x*TS+24,P.y*TS-14,`+1 ${ITEMS[T.item].e}`,'#fff');
          if(ENERGY_COST[nd.type]){spendEnergy();fl(P.x*TS+24,P.y*TS-34,`-${ENERGY_COST[nd.type]} ⚡`,'#ffd36a')}}
        hud();checkQuestBadge();save();
      }
    }
  }else{P.gather=0;P.swing=0;P.lastImpact=-1}
  shake=Math.max(0,shake-dt*16);
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>1.1)floats.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)parts.splice(i,1)}
  // camera
  const px=(P.moving?P.x+(P.tx-P.x)*Math.min(1,P.t/stepT):P.x)*TS+TS/2,py=(P.moving?P.y+(P.ty-P.y)*Math.min(1,P.t/stepT):P.y)*TS+TS/2;
  P.px=px;P.py=py;
  const tx=clamp(px-VW/2,0,Math.max(0,MW*TS-VW)),ty=clamp(py-VH/2,0,Math.max(0,MH*TS-VH));
  const k=1-Math.pow(.0008,dt);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}

/* ---- ground cache ---- */
let groundC=null;
function buildGround(){
  const c=mk(MW*TS,MH*TS),g=c.getContext('2d');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=grid[y][x];
    if(t===2){g.fillStyle=lg(g,x*TS,y*TS,x*TS+TS,y*TS+TS,[[0,'#4b9fdc'],[.5,'#3a86c6'],[1,'#2a68a8']]);g.fillRect(x*TS,y*TS,TS,TS);
      g.fillStyle=rg(g,x*TS+TS/2,y*TS+TS/2,2,x*TS+TS/2,y*TS+TS/2,TS*.8,[[0,'rgba(10,50,110,.28)'],[1,'rgba(10,50,110,0)']]);g.fillRect(x*TS,y*TS,TS,TS);continue}
    if(t===1||t===3){g.drawImage(SP.path[Math.floor(hash(x,y)*3)],x*TS,y*TS)}
    else g.drawImage(SP.grass[Math.floor(hash(x,y,1)*4)],x*TS,y*TS);
  }
  // large soft variation
  const r=mulberry(77);
  for(let i=0;i<70;i++){const x=r()*MW*TS,y=r()*MH*TS,rad=70+r()*140;g.fillStyle=rg(g,x,y,0,x,y,rad,[[0,r()<.5?'rgba(190,230,110,.14)':'rgba(20,70,30,.14)'],[1,'rgba(0,0,0,0)']]);g.fillRect(x-rad,y-rad,rad*2,rad*2)}
  // path rims + shore foam
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=grid[y][x];
    const ng=(dx,dy)=>{const yy=y+dy,xx=x+dx;return yy>=0&&xx>=0&&yy<MH&&xx<MW?grid[yy][xx]:0};
    if(t===1||t===3){
      [[0,-1,x*TS,y*TS,TS,3],[0,1,x*TS,y*TS+TS-3,TS,3],[-1,0,x*TS,y*TS,3,TS],[1,0,x*TS+TS-3,y*TS,3,TS]].forEach(([dx,dy,rx,ry,rw,rh])=>{
        if(ng(dx,dy)===0){g.fillStyle='rgba(90,60,25,.38)';g.fillRect(rx,ry,rw,rh)}});
    }
    if(t===2){
      [[0,-1,x*TS,y*TS,TS,6],[0,1,x*TS,y*TS+TS-6,TS,6],[-1,0,x*TS,y*TS,6,TS],[1,0,x*TS+TS-6,y*TS,6,TS]].forEach(([dx,dy,rx,ry,rw,rh])=>{
        if(ng(dx,dy)!==2){g.fillStyle='rgba(235,250,255,.55)';g.fillRect(rx,ry,rw,rh);g.fillStyle='rgba(235,250,255,.25)';g.fillRect(dx?rx+(dx>0?-3:3):rx,dy?ry+(dy>0?-3:3):ry,dx?3:rw,dy?3:rh)}});
    }
    if(t===3){g.drawImage(SP.mat,x*TS,y*TS)}
  }
  // soft cast shadows (sun from the upper left)
  BLD.forEach(b=>{
    const x0=b.x*TS,yb=(b.y+3)*TS;
    g.save();g.fillStyle='rgba(15,35,10,.2)';g.beginPath();g.moveTo(x0+10,yb-6);g.lineTo(x0+3*TS-4,yb-6);g.lineTo(x0+3*TS+34,yb+16);g.lineTo(x0+34,yb+16);g.closePath();g.fill();
    g.fillStyle='rgba(15,35,10,.12)';g.beginPath();g.ellipse(x0+1.5*TS+14,yb+8,2.1*TS,16,0,0,7);g.fill();g.restore();
  });
  groundC=c;
}
buildGround();

/* ---- entities ---- */
const ents=[];
function buildEnts(){
  ents.length=0;
  nodes.forEach(n=>ents.push({by:n.y*TS+TS-3,node:n}));
  decor.forEach(d=>{if(d.k==='tree')ents.push({by:d.y*TS+TS-3,deco:d});else ents.push({by:d.y*TS+d.oy,deco:d,low:true})});
  BLD.forEach(b=>ents.push({by:(b.y+3)*TS-4,bld:b}));
  ents.push({by:BOARD.y*TS+TS-2,board:true});
  NPCS.forEach(n=>ents.push({by:n.y*TS+TS-3,npc:n}));
  ents.sort((a,b)=>a.by-b.by);
}
buildEnts();
function put(g,s,x,y){g.drawImage(s.c,Math.round(x-s.ax),Math.round(y-s.ay))}
function putSway(g,s,x,y,time,amp,ph){
  const k=Math.sin(time*1.6+ph)*amp+Math.sin(time*.7+ph*2)*amp*.5;
  g.save();g.translate(Math.round(x),Math.round(y));g.transform(1,0,k,1,0,0);g.drawImage(s.c,Math.round(-s.ax),Math.round(-s.ay));g.restore();
}
function drawEnt(g,e,time){
  if(e.node){
    const n=e.node,x=n.x*TS+TS/2,y=n.y*TS+TS-3,full=n.ch>0;
    if(full&&n.type!=='wheat'){g.save();g.globalAlpha=.55+.2*Math.sin(time*3+n.x);g.fillStyle='rgba(255,236,150,.28)';g.strokeStyle='rgba(255,226,110,.9)';g.lineWidth=2.5;g.beginPath();g.ellipse(x,y-1,24,10,0,0,7);g.fill();g.stroke();g.restore()}
    if(n.type==='tree'){if(full)putSway(g,SP.tree[n.v],x,y,time,.012,n.x*.7+n.y);else put(g,SP.stump,x,y)}
    else if(n.type==='rock')put(g,full?SP.rock[n.v]:SP.rockGone,x,y);
    else if(n.type==='crystal'){put(g,full?SP.crystal[n.v]:SP.crystalGone[n.v],x,y);if(full){g.save();g.globalAlpha=.5+.3*Math.sin(time*3+n.x);g.font='14px sans-serif';g.textAlign='center';g.fillText('✨',x+10+Math.sin(time*2+n.y)*3,y-34-Math.sin(time*2.4+n.x)*4);g.restore()}}
    else if(n.type==='bush'){if(full)putSway(g,SP.bush[n.v],x,y,time,.008,n.x+n.y*.3);else put(g,SP.bushGone[n.v],x,y)}
    else{
      if(full)putSway(g,SP.wheat[n.v],x,y,time,.05,n.x*.5+n.y*.4);else put(g,SP.wheatGone[n.v],x,y);
      if(full){const sway=Math.sin(time*2+n.x*.7+n.y)*1.2;g.save();g.globalAlpha=.0;g.restore();void sway}
    }
    if(full&&n.ch<NODE_T[n.type].max){ // charge pips
      for(let i=0;i<n.ch;i++){g.fillStyle='rgba(255,255,255,.85)';g.fillRect(n.x*TS+TS/2-(n.ch*5)/2+i*5,n.y*TS+TS-2,3.5,3.5)}
    }
  }else if(e.deco){
    const d=e.deco;

function render(time){
  const g=ctx;g.setTransform(DPR*Z,0,0,DPR*Z,0,0);
  g.fillStyle='#4d8a3a';g.fillRect(0,0,VW,VH);
  g.translate(-Math.round(cam.x)+(shake?(Math.random()-.5)*shake*2:0),-Math.round(cam.y)+(shake?(Math.random()-.5)*shake*2:0));
  g.drawImage(groundC,0,0);
  const x0=Math.floor(cam.x/TS)-1,x1=Math.ceil((cam.x+VW)/TS)+1,y0=Math.floor(cam.y/TS)-1,y1=Math.ceil((cam.y+VH)/TS)+1;
  // water shimmer + mat pulse
  for(let y=Math.max(0,y0);y<Math.min(MH,y1);y++)for(let x=Math.max(0,x0);x<Math.min(MW,x1);x++){
    const t=grid[y][x];
    if(t===2){for(let k=0;k<2;k++){const ph=time*.9+hash(x,y,k)*6.28+k*2;const yy=y*TS+10+k*22+Math.sin(ph)*3,xx=x*TS+8+((Math.sin(ph*.7)+1)*10);
      g.strokeStyle=`rgba(255,255,255,${.18+.12*Math.sin(ph)})`;g.lineWidth=2;g.beginPath();g.moveTo(xx,yy);g.quadraticCurveTo(xx+8,yy-3,xx+16,yy);g.stroke()}}
    else if(t===3){const p=(Math.sin(time*3)+1)/2;g.strokeStyle=`rgba(255,235,150,${.35+.5*p})`;g.lineWidth=2.5;g.beginPath();g.roundRect(x*TS+3,y*TS+3,TS-6,TS-6,9);g.stroke()}
  }
  // entities + player depth-sorted
  let drewP=false;const pby=P.py+TS/2+2;
  for(const e of ents){
    if(!drewP&&e.by>pby){drawPlayer(g,time);drewP=true}
    const ex=e.node?e.node.x:e.deco?e.deco.x:e.bld?e.bld.x:e.npc?e.npc.x:BOARD.x,ey=e.node?e.node.y:e.deco?e.deco.y:e.bld?e.bld.y:e.npc?e.npc.y:BOARD.y;
    if(ex<x0-3||ex>x1+3||ey<y0-1||ey>y1+3)continue;
    drawEnt(g,e,time);
  }
  if(!drewP)drawPlayer(g,time);
  // bubbles
  g.save();
  for(const b of BLD){
    if(b.x<x0-3||b.x>x1+1||b.y<y0-2||b.y>y1)continue;
    const cx=b.x*TS+72;
    if(b.kind==='craft'){
      const s=stn(b.id),need=Object.values(b.in)[0],item=Object.keys(b.in)[0];
      const ready=s.out>0;
      bubble(g,cx,b.y*TS-6,`${ITEMS[item].e}${s.buf}/${need*3}  ▸  ${ITEMS[b.out].e}${s.out}`,s.prog>0?s.prog/b.time:(s.buf>=need?0:null));
      if(ready){g.font='20px sans-serif';g.textAlign='center';g.fillText('❗',cx,b.y*TS-26+Math.sin(time*5)*3)}
    }else if(b.kind==='game'){
      const lv=S.bld[b.game];bubble(g,cx,b.y*TS-6,`${b.name} · Lv ${lv}`);
    }else if(b.kind==='barn'){
      const n=carryN();bubble(g,cx,b.y*TS-6,n>0?`Drop off ${n} item${n>1?'s':''} here`:'Storage Barn');
    }
  }
  bubble(g,BOARD.x*TS+TS/2,BOARD.y*TS-62,'Quests');
  g.restore();
  if(GUIDE)drawGuide(g,time);
  for(const f of flyers){const u=f.t/FLY,e=u*u*(3-2*u);g.globalAlpha=u>.85?(1-u)/.15:1;g.font='24px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillStyle='#000';g.fillText(f.e,f.x0+(f.x1-f.x0)*e,f.y0+(f.y1-f.y0)*e-Math.sin(u*Math.PI)*38);g.globalAlpha=1}

  for(const f of floats){g.globalAlpha=1-f.t/1.1;g.font='bold 17px "Trebuchet MS",sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.65)';g.strokeText(f.text,f.x,f.y-f.t*38);g.fillStyle=f.col;g.fillText(f.text,f.x,f.y-f.t*38);g.globalAlpha=1}
  // soft vignette (screen space)
  g.setTransform(DPR,0,0,DPR,0,0);
  const W=cv.width/DPR,H=cv.height/DPR;
  g.fillStyle=rg(g,W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75,[[0,'rgba(0,0,0,0)'],[1,'rgba(10,25,5,.35)']]);g.fillRect(0,0,W,H);
  g.fillStyle=lg(g,0,0,W,H,[[0,'rgba(255,238,190,.10)'],[.6,'rgba(255,255,255,0)'],[1,'rgba(30,50,110,.10)']]);g.fillRect(0,0,W,H);
  drawGuideEdge(g,W,H,time);
}
function frame(t){

  energyTick();update(dt);guideT+=dt;if(guideT>.3){guideT=0;refreshGuide()}updateTalk();render(now);

const OUT='rgba(35,18,8,.62)';

function person(g,x,y,o){

    if(o.glasses){g.strokeStyle='#5a3b22';g.lineWidth=1.3;g.beginPath();ex.forEach(dx=>{g.moveTo(x+dx+4,hy+1);g.arc(x+dx,hy+1,4,0,7)});if(!side){g.moveTo(x-1,hy+1);g.lineTo(x+1,hy+1)}g.stroke()}

  }
  /* headwear */
  if(o.hat==='straw'){

function openQuests(){
  const build=()=>{
    const items=QUESTS.map(q=>{const[a,b]=q.g();return{q,a,b,cl:!!S.claimed[q.id],ok:a>=b}});
    const ready=items.filter(i=>!i.cl&&i.ok);
    const prog=items.filter(i=>!i.cl&&!i.ok).sort((x,y)=>y.a/y.b-x.a/x.b);
    const done=items.filter(i=>i.cl);
    const row=(i,kind)=>`<div class="row ${kind}" style="${kind==='done'?'opacity:.5':''}"><div class="grow"><b>${i.q.t}</b>
      ${kind==='prog'?`<div class="muted">${Math.min(i.a,i.b)} / ${i.b}</div><div class="bar"><i style="width:${Math.min(100,i.a/i.b*100)}%"></i></div>`:''}</div>
      <div>${rewardHTML(i.q.r)}</div>${kind==='ready'?`<button class="btn small green" data-q="${i.q.id}">Claim</button>`:kind==='done'?'<span>✅</span>':''}</div>`;
    return `<h2>📜 Quest Board</h2><div class="muted">Gather, craft and play to earn rewards. Finished quests rise to the top.</div>
      ${ready.length?`<div class="sec">Ready to claim · ${ready.length}</div>${ready.map(i=>row(i,'ready')).join('')}`:''}
      ${prog.length?`<div class="sec">In progress</div>${prog.map(i=>row(i,'prog')).join('')}`:''}
      ${done.length?`<div class="sec">Completed</div>${done.map(i=>row(i,'done')).join('')}`:''}`;
  };
  const wire=()=>{
    const sh=$('#modal .sheet');
    sh.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
      const q=QUESTS.find(x=>x.id===b.dataset.q);if(!qDone(q)||S.claimed[q.id])return;
      S.claimed[q.id]=1;reward(q.r);sfx.coin();save(true);hud();
      const keep=sh.scrollTop;sh.innerHTML=`<button class="x">✕</button>`+build();sh.querySelector('.x').onclick=closeModal;sh.scrollTop=keep;wire();
    });
  };
  openModal(build());wire();
}

  };
  const wire=()=>{
    const sh=$('#modal .sheet');
    const redraw=()=>{sh.innerHTML=`<button class="x">✕</button>`+draw();sh.querySelector('.x').onclick=closeModal;wire()};

    const fr=sh.querySelector('[data-front]');if(fr)fr.onclick=()=>{if(S.energy<3)return;closeModal();spendEnergy(3);startFront('play')};
    sh.querySelector('[data-free]').onclick=()=>{closeModal();openFreeSetup(b.game)};
    sh.querySelector('[data-help]').onclick=()=>openRules(b.game);
    const up=sh.querySelector('[data-up]');if(up)up.onclick=()=>{const lv=S.bld[b.game];const c=upCost(lv);if(!canPay(c))return;pay(c);S.bld[b.game]++;stat('up_'+b.game);sfx.win();toast(`${gm.icon} ${gm.name} is now Level ${lv+1}!`);save(true);hud();redraw()};
  };
  openModal(draw());wire();
}

function curStep(){return STORY[S.story]||null}
function checkStory(silent){
  let moved=false;

    const st=curStep();
    if(!silent){reward(st.r);toast(`⭐ Step complete! ${rewardHTML(st.r)}`);sfx.win()}

   MINI-GAME 1: BOLT WORKS — nuts & bolts sorting
   Levels are random but verified solvable by a solver before they're dealt.
   ===================================================================== */
const BHUE=[2,28,48,92,142,176,206,238,282,326];
const BSYM=['●','▲','■','◆','★','♥','✚','☾','☀','♣'];

/* ---- solver: greedy best-first search over single-nut moves ---- */
function boltMoves(p,cap){
  const out=[];let emptyDone=false;
  for(let i=0;i<p.length;i++){
    const a=p[i];if(!a.length)continue;
    const mono=a.every(x=>x===a[0]);if(mono&&a.length===cap)continue;
    const c=a[a.length-1];emptyDone=false;
    for(let j=0;j<p.length;j++){
      if(i===j)continue;const b=p[j];if(b.length>=cap)continue;
      if(!b.length){if(emptyDone||mono)continue;emptyDone=true;out.push([i,j])}
      else if(b[b.length-1]===c)out.push([i,j]);
    }
  }
  return out;
}
const boltKey=p=>p.map(a=>a.join('')).sort().join('|');
const boltH=p=>{let h=0;for(const a of p){if(!a.length)continue;let r=1;while(r<a.length&&a[r]===a[0])r++;h+=a.length-r;if(r<a.length)h+=1}return h};
const boltSolved=(p,cap)=>p.every(a=>!a.length||(a.length===cap&&a.every(x=>x===a[0])));
function solveBolt(start,cap,limit=30000){
  const s0=start.map(a=>a.slice());
  if(boltSolved(s0,cap))return[];
  const heap=[];const push=n=>{heap.push(n);let i=heap.length-1;while(i){const p=(i-1)>>1;if(heap[p].f<=heap[i].f)break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let a=i*2+1,b=a+1,m=i;if(a<heap.length&&heap[a].f<heap[m].f)m=a;if(b<heap.length&&heap[b].f<heap[m].f)m=b;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return t};
  const seen=new Set([boltKey(s0)]);
  push({p:s0,g:0,f:boltH(s0)*2,par:null,mv:null});
  let n=0;
  while(heap.length&&n++<limit){
    const cur=pop();
    for(const[i,j]of boltMoves(cur.p,cap)){
      const np=cur.p.map(a=>a.slice());np[j].push(np[i].pop());
      const k=boltKey(np);if(seen.has(k))continue;seen.add(k);
      const node={p:np,g:cur.g+1,f:boltH(np)*2+(cur.g+1)*.25,par:cur,mv:[i,j]};
      if(boltSolved(np,cap)){const path=[];for(let x=node;x.par;x=x.par)path.unshift(x.mv);return path}
      push(node);
    }
  }
  return null;
}
function genBolt(o,depth=0){
  const{colors,empty,cap,mystery}=o;
  for(let t=0;t<60;t++){
    const bag=[];for(let c=0;c<colors;c++)for(let k=0;k<cap;k++)bag.push(c);
    shuffle(bag);
    const pegs=[];for(let i=0;i<colors;i++)pegs.push(bag.slice(i*cap,(i+1)*cap));
    for(let e=0;e<empty;e++)pegs.push([]);
    if(cap>1&&pegs.some(a=>a.length&&a.every(x=>x===a[0])))continue;
    const sol=solveBolt(pegs,cap,t<30?20000:40000);
    if(sol){
      const hid=pegs.map(a=>a.map((_,j)=>j<a.length-1&&Math.random()<mystery));
      return{pegs,hid,cap,par:sol.length,sol};
    }
  }
  if(depth<3)return genBolt({...o,empty:empty+1},depth+1);
  throw new Error('no puzzle');
}

/* ---------- two computer players (classic mode) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FMAX=t=>CROPS[t].meter[CROPS[t].meter.length-1][0];
const aiF=a=>a.fields.slice(0,a.nF);
const aiCan=(a,i)=>{const F=aiF(a);return!(F[i].n===1&&F.some((o,j)=>j!==i&&o.n>=2))};
const aiFits=(a,t)=>aiF(a).some(f=>f.t===null||f.t===t);
const aiWant=(a,t)=>aiF(a).some(f=>f.t===t&&f.n<FMAX(t))?3:aiF(a).some(f=>f.t===null)?2:0;

function aiHarvest(a,i){
  const f=a.fields[i],c=payout(f.t,f.n);a.coins+=c;
  for(let k=0;k<f.n-c;k++)C.discardPile.push({t:f.t});

function aiPlant(a,card){
  const F=aiF(a);
  let i=F.findIndex(f=>f.t===card.t);
  if(i<0)i=F.findIndex(f=>f.t===null);
  if(i<0){   // forced to replant: cash in the field that pays best now (fewest beans on ties)
    let pool=F.map((f,j)=>j).filter(j=>aiCan(a,j));if(!pool.length)pool=F.map((f,j)=>j);
    pool.sort((x,y)=>payout(F[y].t,F[y].n)-payout(F[x].t,F[x].n)||F[x].n-F[y].n);
    i=pool[0];aiHarvest(a,i);

  a.fields[i].t=card.t;a.fields[i].n++;
}
function aiCashIn(a){   // harvest fields that are maxed out or can't realistically grow any more
  aiF(a).forEach((f,i)=>{
    if(f.t===null||!aiCan(a,i))return;
    const nx=nextStep(f.t,f.n);
    if(payout(f.t,f.n)>0&&(!nx||deckLeft(f.t)<nx[0]-f.n))aiHarvest(a,i);

function aiBuy(a){

function aiPre(a){   // plant 1st (must), 2nd (if it fits well), flip two

  if(a.hand.length&&aiWant(a,a.hand[0].t)>=2)aiPlant(a,a.hand.shift());

function aiPost(a){for(let i=0;i<3;i++){const c=drawCard();if(c)a.hand.push(c)}aiCashIn(a)}
// what each computer player would do with a card from MY market
function offersFor(c){
  if(!C.classic||c.locked)return[];
  const out=[];
  C.ai.forEach((a,k)=>{
    if(aiWant(a,c.t)>=2&&aiFits(a,c.t)){
      const h=a.hand.find((x,ix)=>ix>0&&aiWant(a,x.t)===0&&humanFits(x.t)&&x.t!==c.t);
      out.push({k,h});
    }
  });
  return out;
}
// how each computer player answers when I offer a card of type t
function botReplies(t){
  return C.ai.map((a,k)=>{
    const w=aiWant(a,t);
    if(w>=1&&aiFits(a,t)){
      const h=a.hand.find((x,ix)=>ix>0&&aiWant(a,x.t)===0&&humanFits(x.t)&&x.t!==t);
      if(h||w>=2)return{k,ok:true,h};

  });
}
// I ask the bots for a bean type I'm growing (any card from their hand can be traded in the real game)
function askReplies(t){

// a bot proposes a trade to me. opts: {get:card, give:myHandCard|null, fromBot:bool}
function botOpts(a,c){
  const opts=[];
  const seen=new Set();
  if(c&&humanFits(c.t)){
    C.hand.forEach(x=>{if(!seen.has(x.t)&&x.t!==c.t&&aiWant(a,x.t)>=2&&aiFits(a,x.t)){seen.add(x.t);opts.push({get:c,give:x})}});
    opts.push({get:c,give:null});
  }else if(!c){
    const h=a.hand.find((y,ix)=>ix>0&&aiWant(a,y.t)===0&&humanFits(y.t));
    if(h)C.hand.forEach(x=>{if(!seen.has(x.t)&&x.t!==h.t&&aiWant(a,x.t)>=2&&aiFits(a,x.t)){seen.add(x.t);opts.push({get:h,give:x,fromBot:true})}});
  }
  return opts.slice(0,4);
}
function askBot(k,opts){
  return new Promise(res=>{C.phase='aigift';C.gift={k,opts,res};C.aiMarket=[opts[0].get];C.msg=`Bot ${k+1} offers you a trade`;renderCards()});
}
function answerGift(n){

async function runAIs(){
  const G=C;
  for(let k=0;k<2;k++){
    const a=G.ai[k];
    G.phase='ai';G.activeAI=k;G.aiMarket=[];G.msg='';if(k===0)renderCards();
    await sleep(120);if(C!==G)return;
    const flips=aiPre(a);G.aiMarket=flips.slice();G.msg='';
    await sleep(120);if(C!==G)return;
    for(const c of flips){
      if(aiWant(a,c.t)>=2){aiPlant(a,c);continue}
      const other=G.ai[1-k];
      if(aiWant(other,c.t)===3&&aiFits(other,c.t)){aiPlant(other,c);continue}
      const opts=botOpts(a,c);
      if(opts.length){const take=await askBot(k,opts);if(C!==G)return;if(take)continue}
      aiPlant(a,c);
    }
    {const o2=botOpts(a,null);if(o2.length){await askBot(k,o2);if(C!==G)return}}
    G.aiMarket=[];aiPost(a);
    await sleep(200);if(C!==G)return;
  }
  G.phase='plant1';G.activeAI=-1;G.msg='';
  if(!G.hand.length&&!G.deck.length&&!(G.classic&&G.pass<G.o.rounds&&G.discardPile.length)){cardEndRound();return}
  renderCards();
}
function cardAfterMarket(){

  C.drew=0;for(let k=0;k<3;k++){const c=drawCard();if(c){C.hand.push(c);C.drew++}}
  C.turn++;if(C.classic)C.trades=C.o.trades;
  if(!C.hand.length&&!C.deck.length&&!(C.classic&&C.pass<C.o.rounds&&C.discardPile.length)){cardEndRound();return}
  C.msg=`${C.reshuffled?'🔀 ':''}${C.deck.length?'🂠 +3':'🂠 +3 · 🏁'}`;C.reshuffled=false;
  addAnim(C.hand.slice(C.hand.length-C.drew).map((c,i)=>({from:'deck',dst:`.grp.q .cards .card:nth-child(${C.hand.length-C.drew+i+1})`,html:faceHTML(c.t),delay:.3+i*.18})));

      ${last?'<button class="btn grey" id="oBack">Back to village</button>':''}</div></div></div>`);
  $('#cards').appendChild(sh);
  if($('#oNext'))$('#oNext').onclick=()=>{sh.remove();cardRound()};
  if($('#oBack'))$('#oBack').onclick=leaveMG;
  if($('#oAgain'))$('#oAgain').onclick=()=>{if(C.mode==='play'){if(S.energy<1)return;spendEnergy();startCards('play')}else startCards('free',C.o)};
}
/* =====================================================================
   TITLE + BOOT
   ===================================================================== */
function showTitle(){
  stopWorld();$('#world').classList.add('hidden');$('#mg').classList.add('hidden');
  const t=$('#title');t.classList.remove('hidden');
  const has=S.story>0||(S.st&&(Object.keys(S.st).length>0||S.coins!==25));
  t.innerHTML=`<div style="font-size:54px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))">🌾⚙️🃏</div>
    <h1>Harvest Hollow</h1>
    <p>Gather wood, stone, berries and wheat. Craft goods. Then step into the workshops and play puzzles and card games to earn the coins that grow your village.</p>
    <div class="menu">
      <button class="btn green" id="tPlay">${has?'▶ Continue village':'▶ Start village'}</button>
      <button class="btn blue" id="tFF">⚔️ Free Play — The Frontier</button>
      <button class="btn blue" id="tFW">🛡️ Free Play — The Watch</button>
      <button class="btn blue" id="tFL">💡 Free Play — Lights Out</button>
      <button class="btn blue" id="tFM">🎴 Free Play — Triple Match</button>
      <button class="btn blue" id="tFB">⚙️ Free Play — Bolt Sorting</button>
      <button class="btn blue" id="tFC">🃏 Free Play — Beans (Classic)</button>
      ${has?'<button class="btn grey" id="tReset" style="font-size:15px">🗑 Start over (erase my village)</button>':''}
    </div>
    <div class="sub">Free play never touches your progress · Progress saves in this browser</div>
    <div class="ver">Version ${VERSION}</div>
    ${iosHint()}<div id="updBox"></div>`;
  $('#tPlay').onclick=()=>{sfx.click();goFull();startWorld()};
  $('#tFB').onclick=()=>{goFull();openFreeSetup('bolt')};
  $('#tFF').onclick=()=>{goFull();openFreeSetup('watch','front')};
  $('#tFW').onclick=()=>{goFull();openFreeSetup('watch')};
  $('#tFL').onclick=()=>{goFull();openFreeSetup('lights')};
  $('#tFM').onclick=()=>{goFull();openFreeSetup('match')};
  $('#tFC').onclick=()=>{goFull();openFreeSetup('card')};
  showUpdateBanner();
  const tr=$('#tReset');if(tr)tr.onclick=askReset;
}
// free play started from the title screen has no world behind it
const _leave=leaveMG;
leaveMG=function(){
  _leave();
  if(!worldOn){showTitle()}
};
/* ---- full screen ---- */
const fsRoot=document.documentElement,fsReq=fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const isStandalone=()=>(window.matchMedia&&(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches))||navigator.standalone===true;
function goFull(){
  if(S.autoFs===false||isStandalone()||fsOn()||!fsReq)return;
  try{const p=fsReq.call(fsRoot,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}
}
function toggleFull(){
  try{
    if(fsOn()){S.autoFs=false;fsExit.call(document)}
    else{S.autoFs=true;const p=fsReq.call(fsRoot,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>toast('Full screen is blocked here. Open the link in your browser (not an in-app viewer).'))}
  }catch(e){toast('Full screen is blocked here. Open the link in your browser (not an in-app viewer).')}
  save(true);
}
function iosHint(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!isStandalone()?'<div class="ios">📱 For full screen on iPhone/iPad: tap Share → Add to Home Screen, then open it from there.</div>':''}
$('#bFull').onclick=toggleFull;
if(!fsReq||isStandalone())$('#bFull').classList.add('hidden');

/* ---- self-update: spot a stale cached copy and offer the fresh one ---- */
let newVersion=null;
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION){newVersion=m[1];showUpdateBanner();if(worldOn)toast(`🔄 Update ready: ${m[1]}. Open ☰ to refresh.`)}
  }catch(e){}
}
function reloadFresh(){save(true);flushFlyers();location.href=location.pathname+'?v='+encodeURIComponent((newVersion||'').split(' ')[0]||Date.now());}
function showUpdateBanner(){
  const box=$('#updBox');if(!box||!newVersion)return;
  box.innerHTML=`<div class="upd">🔄 A newer version is available (${newVersion}) <button class="btn small green" id="updGo" style="margin-left:8px">Update now</button></div>`;
  $('#updGo').onclick=reloadFresh;
}
checkUpdate();setInterval(checkUpdate,5*60*1000);
addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
load();
checkStory(true);
setInterval(()=>save(true),8000);
addEventListener('visibilitychange',()=>{if(document.hidden){flushFlyers();save(true);try{if(AC&&AC.state==='running')AC.suspend()}catch(e){}}else{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}});
addEventListener('beforeunload',()=>{flushFlyers();save(true)});
showTitle();
</script>
