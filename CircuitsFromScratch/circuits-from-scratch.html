<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circuits from Scratch</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="circuits-from-scratch.webmanifest">
<meta name="theme-color" content="#0E1317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circuits">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --canvas:#F6F8F9; --grid:#E1E6EA;
  --ink:#16212B; --muted:#56646F; --line:#CCD4DA;
  --wire:#9AA6B0; --hi:#16935F; --mid:#7DBFA2; --neg:#7A5BD0; --flow:#E09A12;
  --led:#E0433F; --glow:#FF6A5C; --ledg:#1FA463; --glowg:#3BD48A; --accent:#1C5D7A; --accent-ink:#FFFFFF;
  --good:#16935F; --good-bg:#E3F4EC; --bad:#C23B35; --bad-bg:#FBE9E7; --note-bg:#EEF4F7;
  --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(22,33,43,.06),0 6px 24px rgba(22,33,43,.06);
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1317; --panel:#161E24; --canvas:#11181D; --grid:#1C262D;
  --ink:#E3E9ED; --muted:#93A2AD; --line:#2A3740;
  --wire:#56656F; --hi:#35C98A; --mid:#2F7F5E; --neg:#9C84F0; --flow:#F5B53A;
  --led:#FF5A52; --glow:#FF6A5C; --ledg:#2FD07E; --glowg:#3BD48A; --accent:#5DB0D2; --accent-ink:#0C1216;
  --good:#35C98A; --good-bg:#15302A; --bad:#FF6E66; --bad-bg:#3A1C1C; --note-bg:#172731;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1317; --panel:#161E24; --canvas:#11181D; --grid:#1C262D;
  --ink:#E3E9ED; --muted:#93A2AD; --line:#2A3740;
  --wire:#56656F; --hi:#35C98A; --mid:#2F7F5E; --neg:#9C84F0; --flow:#F5B53A;
  --led:#FF5A52; --glow:#FF6A5C; --ledg:#2FD07E; --glowg:#3BD48A; --accent:#5DB0D2; --accent-ink:#0C1216;
  --good:#35C98A; --good-bg:#15302A; --bad:#FF6E66; --bad-bg:#3A1C1C; --note-bg:#172731;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1140px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 22px/1.1 var(--display);letter-spacing:.01em;margin:0;cursor:pointer}
.brand h1 span{color:var(--hi)}
.brand .crumb{font:600 15px var(--display);color:var(--muted)}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{flex:1 1 14px;min-width:14px;height:8px;border:0;border-radius:2px;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--mid)}
.dots button.quiz{background:transparent;outline:1.5px solid var(--line);outline-offset:-1.5px}
.dots button.quiz.done{background:var(--mid);outline-color:var(--mid)}
.dots button.mist{background:var(--bad-bg);outline:1.5px solid var(--bad);outline-offset:-1.5px}
.dots button.mist.done{background:var(--bad)}
.dots button.cur{background:var(--accent);outline-color:var(--accent)}
.dots button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
main.step.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow.mist{color:var(--bad)}
h2{font:600 clamp(22px,3.2vw,30px)/1.15 var(--display);margin:4px 0 0;text-wrap:balance}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.lab{display:grid;gap:12px;position:sticky;top:110px}
@media (max-width:860px){.lab{position:static}}
.canvas{background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.canvas svg{display:block;width:100%;height:auto}
.canvas svg.wide{min-width:540px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{font:600 14px var(--mono);display:inline-flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tog .knob{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s;flex:none}
.tog .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tog[aria-pressed="true"]{border-color:var(--hi)}
.tog[aria-pressed="true"] .knob{background:var(--hi)}
.tog[aria-pressed="true"] .knob::after{transform:translateX(16px)}
.tog.bad[aria-pressed="true"]{border-color:var(--bad)}
.tog.bad[aria-pressed="true"] .knob{background:var(--bad)}
.tog .st{font-size:12px;color:var(--muted);min-width:2.2em}
.hold{font:600 14px var(--mono);padding:9px 16px;border-radius:8px;border:1.5px dashed var(--accent);background:var(--panel);color:var(--accent);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold.down{background:var(--accent);color:var(--accent-ink);border-style:solid}
.seg{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;font:500 13px var(--mono)}
.seg .sl{padding:0 10px;color:var(--muted)}
.seg button{font:600 13px var(--mono);border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.bad[aria-pressed="true"]{background:var(--bad);color:#fff}
.rng{display:flex;align-items:center;gap:10px;font:500 13px var(--mono);flex:1 1 260px;min-width:0}
.rng input{flex:1;min-width:80px;accent-color:var(--accent)}
.rng output{min-width:6.5em;font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--body);padding:9px 16px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tog:focus-visible,.opt:focus-visible,.seg button:focus-visible,.hold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meters{display:flex;flex-wrap:wrap;gap:6px}
.meter{font:500 13px var(--mono);padding:5px 9px;border-radius:6px;background:var(--canvas);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.meter b{color:var(--muted);font-weight:500;margin-right:6px}
.meter.hi{border-color:var(--hi);color:var(--hi)}
.meter.warn{border-color:var(--bad);color:var(--bad)}
.now{font-size:15px;background:var(--note-bg);border-radius:8px;padding:10px 12px;border-left:3px solid var(--flow);min-height:4.5em}
.now.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.now strong{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--muted);margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend .l-hi{background:var(--hi)} .legend .l-lo{background:var(--wire)} .legend .l-neg{background:var(--neg)}
.legend .l-fl{background:repeating-linear-gradient(90deg,var(--flow) 0 3px,transparent 3px 7px)}
.scope{border:1px solid var(--line);border-radius:8px;background:var(--canvas);padding:8px 6px 4px}
.scope svg{display:block;width:100%;height:auto;touch-action:pan-y}
.scope .sk{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.sleg{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);padding:2px 6px}
.sleg i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px}
.text{max-width:64ch}
.text p{margin:0 0 12px}
.text h3{font:600 17px/1.3 var(--display);margin:18px 0 6px}
.text ul,.text ol{margin:0 0 12px;padding-left:22px}
.text li{margin-bottom:5px}
.why{background:var(--note-bg);border-radius:8px;padding:12px 14px;margin:14px 0}
.why .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.why.bad{background:var(--bad-bg)} .why.bad .k{color:var(--bad)}
.why.fix{background:var(--good-bg)} .why.fix .k{color:var(--good)}
.formula{font:500 15px var(--mono);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:inline-block;margin:2px 0 12px}
table.tt{border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
table.tt th,table.tt td{padding:4px 12px;text-align:center;border-bottom:1px solid var(--line)}
table.tt th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.05em}
table.tt tr.on td{background:var(--good-bg);color:var(--good);font-weight:600}
table.cmp{border-collapse:collapse;font-size:14px;margin-bottom:12px;width:100%}
table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{font:600 12px var(--mono);color:var(--muted)}
.ttwrap{overflow-x:auto}
nav.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.hint{font-size:13px;color:var(--muted)}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.quiz{display:grid;gap:16px;max-width:760px}
.q{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.q .qn{font:600 12px var(--mono);color:var(--muted)}
.q .qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:6px}
.opt{text-align:left;font:15px/1.45 var(--body);padding:9px 12px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:14px;padding:8px 12px;border-radius:6px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.score{font:600 15px var(--mono)}
details.reveal{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}
details.reveal summary{cursor:pointer;font-weight:600}
details.reveal p{margin:8px 0 0}
table.parts{border-collapse:collapse;font-size:14px;margin-bottom:12px}
table.parts td,table.parts th{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left}
table.parts th{font:600 12px var(--mono);color:var(--muted)}
/* home */
.home{display:grid;gap:18px}
.intro{max-width:70ch}
.intro h2{margin-bottom:8px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod{display:grid;gap:8px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.mod:hover{border-color:var(--accent)}
.mod .n{font:600 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.mod h3{font:600 19px/1.2 var(--display);margin:0}
.mod p{margin:0;font-size:14px;color:var(--muted)}
.mod .mistakes{font-size:13px;color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi)}
.mod .meta{font:500 12px var(--mono);color:var(--muted);display:flex;justify-content:space-between}
/* svg */
svg text{font-family:var(--mono)}
.w{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.w.hi{stroke:var(--hi)} .w.mid{stroke:var(--mid)} .w.neg{stroke:var(--neg)} .w.bad{stroke:var(--bad)}
.dot{fill:var(--wire)} .dot.hi{fill:var(--hi)} .dot.mid{fill:var(--mid)} .dot.neg{fill:var(--neg)} .dot.bad{fill:var(--bad)}
.part{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.part.badp{stroke:var(--bad)}
.partf{fill:var(--ink)}
.body{fill:var(--canvas);stroke:var(--muted);stroke-width:1.2}
.body.on{fill:var(--good-bg);stroke:var(--hi)}
.body.dead{fill:var(--bad-bg);stroke:var(--bad)}
.bg{stroke:var(--canvas);stroke-width:7;fill:none}
.flow{fill:none;stroke:var(--flow);stroke-linecap:round;stroke-linejoin:round}
.flow.s{stroke-width:2.2;stroke-dasharray:2 10}
.flow.b{stroke-width:3.6;stroke-dasharray:4 8}
.flow.x{stroke-width:5;stroke-dasharray:6 6;stroke:var(--bad)}
.lbl{fill:var(--muted);font-size:11px}
.nlbl{fill:var(--ink);font-size:12px;font-weight:600}
.blbl{fill:var(--bad);font-size:12px;font-weight:600}
.tag{fill:var(--panel);stroke:var(--line)}
.tagt{fill:var(--ink);font-size:11px;font-weight:600}
.ledtri{stroke:var(--ink);stroke-width:1.8;fill:var(--canvas)}
.glow{fill:var(--glow)} .glow.g{fill:var(--glowg)}
.burn{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.float{animation:flick .35s steps(2) infinite}
@keyframes flick{50%{opacity:.25}}
.grid{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--muted);font-size:10px}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.t1{stroke:var(--s1)} .t2{stroke:var(--s2)} .f1{fill:var(--s1)} .f2{fill:var(--s2)}
.cross{stroke:var(--ink);stroke-width:1;opacity:.5}
@media (prefers-reduced-motion:reduce){
  .float{animation:none} main.step.enter{animation:none}
  .tog .knob,.tog .knob::after{transition:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="home" title="All modules">Circuits <span>from scratch</span></h1><div class="count" id="count"></div></div>
    <div class="crumb" id="crumb"></div>
    <div class="dots" id="dots" aria-label="Steps"></div>
  </header>
  <main class="step" id="step" aria-live="polite"></main>
</div>

<script>
(function(){
"use strict";
/* ================= storage ================= */
function load(k,d){try{var v=localStorage.getItem("cfs-"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("cfs-"+k,JSON.stringify(v));}catch(e){}}
var REDUCED=false;try{REDUCED=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
var PH=0; /* global flow phase, advanced by the animation loop */

/* ================= tiny helpers ================= */
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function fx(v,d){return (Math.abs(v)<5e-4?0:v).toFixed(d==null?2:d);}
function fV(v){return fx(v,2)+" V";}
function fI(a){a=Math.abs(a);if(a>=1)return fx(a,2)+" A";if(a>=1e-3)return (a*1e3).toFixed(a>=0.01?0:1)+" mA";if(a>=1e-6)return Math.round(a*1e6)+" µA";return "0";}
function fR(r){return r>=1e6?(r/1e6)+" MΩ":r>=1000?(r/1000)+" kΩ":r+" Ω";}
function fC(c){return c>=1e-6?Math.round(c*1e6)+" µF":c>=1e-9?Math.round(c*1e9)+" nF":Math.round(c*1e12)+" pF";}
function fT(t){return t>=1?fx(t,2)+" s":t>=1e-3?(t*1e3).toFixed(t>=0.01?0:1)+" ms":Math.round(t*1e6)+" µs";}
function b01(x){return x?1:0;}

/* ================= SVG primitives ================= */
function pl(a){var s="";for(var i=0;i<a.length;i+=2)s+=a[i]+","+a[i+1]+" ";return s;}
/* voltage -> wire class. true/false = logic; numbers are real volts */
function vc(v){if(v===true)return "hi";if(v===false||v==null)return "lo";if(v==="mid"||v==="neg"||v==="bad"||v==="hi"||v==="lo")return v;
  if(typeof v==="number"){if(v<-0.05)return "neg";if(v>=2.5)return "hi";if(v>=0.9)return "mid";return "lo";}return "lo";}
function W(a,v){return '<polyline class="w '+vc(v)+'" points="'+pl(a)+'"/>';}
/* current flow: sz s|b|x, k = strength 0..1 (fades the dashes) */
function F(a,sz,k){if(k===false||k===0||(typeof k==="number"&&k<0.015))return "";k=(k==null||k===true)?1:clamp(k,0,1);sz=sz||"s";
  var off=-(PH*(sz==="s"?1:1.6))%12;
  return '<polyline class="flow '+sz+'" style="stroke-dashoffset:'+off.toFixed(2)+';opacity:'+(0.3+0.7*k).toFixed(2)+'" points="'+pl(a)+'"/>';}
function D(x,y,v){return '<circle class="dot '+vc(v)+'" cx="'+x+'" cy="'+y+'" r="3.4"/>';}
function T(x,y,s,c,a){return '<text class="'+(c||"lbl")+'" x="'+x+'" y="'+y+'" text-anchor="'+(a||"middle")+'">'+s+'</text>';}
function TAG(x,y,s,a){var w=s.length*6.6+10,x0=a==="end"?x-w:a==="start"?x:x-w/2;
  return '<rect class="tag" x="'+x0.toFixed(1)+'" y="'+(y-10)+'" width="'+w.toFixed(1)+'" height="16" rx="4"/>'+T(x0+w/2,y+2,s,"tagt");}
function R(x1,y1,x2,y2,label,side,cls){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
  var z=Math.min(36,L-8),s=(L-z)/2,n=6,amp=6,p="M"+x1+" "+y1+" L"+(x1+ux*s)+" "+(y1+uy*s);
  for(var i=1;i<=n;i++){var t=s+z*(i-.5)/n,g=i%2?1:-1;p+=" L"+(x1+ux*t+px*amp*g).toFixed(1)+" "+(y1+uy*t+py*amp*g).toFixed(1);}
  p+=" L"+(x1+ux*(s+z))+" "+(y1+uy*(s+z))+" L"+x2+" "+y2;
  var out='<path class="part'+(cls?" "+cls:"")+'" d="'+p+'"/>';
  if(label){var mx=(x1+x2)/2,my=(y1+y2)/2;side=side||1;
    if(Math.abs(dx)>Math.abs(dy))out+=T(mx,side>0?my-11:my+19,label);
    else out+=T(mx+11*side,my+4,label,"lbl",side>0?"start":"end");}

/* hist: {t:[...], a:[...], b:[...]} ; panels: [{title, unit, min, max, ticks, series:[{key,name,c:1|2}], refs:[{v,label}]}] */
function hpush(s,vals,win){
  if(!s.h){s.h={t:[]};}
  var h=s.h;h.t.push(s.t);for(var k in vals){if(!h[k])h[k]=[];if(!isFinite(vals[k]))vals[k]=0;h[k].push(vals[k]);}
  var cut=s.t-win*1.05;while(h.t.length>2&&h.t[1]<cut){h.t.shift();for(var k2 in h)if(k2!=="t")h[k2].shift();}

}
function hclear(s){s.h={t:[]};}
var HOVER=null; /* 0..1 across plot width */
function SCOPE(s,panels,win,tlabel){
  var W0=360,PL=40,PR=12,ph=96,gap=34,H=panels.length*(ph+gap)+8,o="",h=s.h||{t:[]},t1=s.t,t0=t1-win;
  function X(t){return PL+(t-t0)/win*(W0-PL-PR);}

    var top=i*(ph+gap)+22;function Y(v){return top+ph-(clamp(v,p.min,p.max)-p.min)/(p.max-p.min)*ph;}
    o+=T(PL,top-8,p.title+" ("+p.unit+")","axis","start");
    (p.ticks||[p.min,p.max]).forEach(function(v){o+='<line class="grid" x1="'+PL+'" x2="'+(W0-PR)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>'+T(PL-5,Y(v)+3,(Math.abs(v)<1e-9?"0":(+v.toFixed(2))),"axis","end");});
    (p.refs||[]).forEach(function(r){o+='<line class="ref" x1="'+PL+'" x2="'+(W0-PR)+'" y1="'+Y(r.v).toFixed(1)+'" y2="'+Y(r.v).toFixed(1)+'"/>'+T(W0-PR-2,Y(r.v)-4,r.label,"axis","end");});
    p.series.forEach(function(se){
      var d=h[se.key];if(!d||d.length<2)return;var pts=[];
      for(var j=0;j<d.length;j++){if(h.t[j]<t0)continue;pts.push(X(h.t[j]).toFixed(1)+","+Y(d[j]*(se.scale||1)).toFixed(1));}
      if(pts.length>1)o+='<polyline class="trace t'+se.c+'" points="'+pts.join(" ")+'"/>';
      var last=d[d.length-1]*(se.scale||1);o+='<circle class="f'+se.c+'" cx="'+X(t1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="3"/>';
    });

      var hx=PL+HOVER*(W0-PL-PR),ht=t0+HOVER*win,j=0,best=1e9;for(var q=0;q<h.t.length;q++){var dd=Math.abs(h.t[q]-ht);if(dd<best){best=dd;j=q;}}
      o+='<line class="cross" x1="'+hx.toFixed(1)+'" x2="'+hx.toFixed(1)+'" y1="'+top+'" y2="'+(top+ph)+'"/>';
      var lab=p.series.map(function(se){var d=h[se.key];return d?se.name+" "+(d[j]*(se.scale||1)).toFixed(2)+" "+p.unit:"";}).join("  ");
      o+=TAG(clamp(hx,PL+60,W0-PR-60),top+12,lab);

}

 ctl:[{k:"pos",type:"seg",label:"Switch",opts:[[0,"charge"],[1,"discharge"]]}],
 scope:function(s){return {panels:rcPanels(s),win:6};},
 text:`<p>A <b>capacitor</b> is two metal plates separated by a thin insulator. Charge can't cross the gap, but it can pile up on the plates. That stored charge is stored energy, a little like water in a tank.</p>
<p>The switch here has two positions:</p>
<ul><li><b>charge:</b> connects the resistor to the + rail.</li><li><b>discharge:</b> connects it to the − rail instead, so the capacitor can empty itself through the resistor.</li></ul>
<p>Watch the scope under the diagram. When charging starts, the current is biggest at first and then dies away, while the voltage rises quickly and then levels off at 5 V. The curve is the same shape every time.</p>
<div class="why"><span class="k">Why does the current slow down?</span>The current is pushed by the voltage <b>across the resistor</b>, which is the battery's 5 V minus the capacitor's voltage. Empty capacitor: all 5 V is across the resistor, so the current is big (5 V ÷ 10 kΩ = 0.5 mA). Nearly full: almost nothing is left across the resistor, so almost no current flows.</div>
<p class="hint">The little + and − marks on the plates grow as charge builds up. The curved plate is the capacitor's negative side. Electrolytic capacitors like this one have a + side and a − side, and getting them backwards is a mistake you'll see in step 5.</p>`},

   now:el<tau?"Less than one time constant has passed. The capacitor is filling fast because the current is still large.":el<5*tau?"After 1 τ it reached 63% (3.16 V). Every further τ closes 63% of the gap that's left: 86% after 2 τ, 95% after 3 τ.":"After 5 τ it's over 99% full. Engineers treat that as “done”."};},

 text:`<p>How fast a capacitor fills depends on two things:</p>
<ul><li><b>R</b>: a bigger resistor lets less current through, so filling takes longer.</li><li><b>C</b>: a bigger capacitor holds more charge, so filling takes longer.</li></ul>
<p>Multiply them and you get the <b>time constant</b>, written τ (the Greek letter tau):</p>
<div class="formula">τ = R × C &nbsp;&nbsp; 10 kΩ × 100 µF = 10 000 × 0.0001 = 1 second</div>
<p>The rule of thumb:</p>
<ul><li>After <b>1 τ</b> the capacitor is <b>63%</b> full.</li><li>After <b>5 τ</b> it's over <b>99%</b> full.</li></ul>
<p>Discharging follows the same rule backwards: after 1 τ, 63% of the charge has gone.</p>
<p>Try the buttons. Doubling R or C doubles the time. That's the whole basis of every RC timer: pick R and C to get the delay you want.</p>
<div class="why"><span class="k">Units tip</span>Ω × F = seconds. Convert to plain numbers first: 47 kΩ = 47 000 Ω and 220 µF = 0.000 22 F, so 47 000 × 0.000 22 = 10.3 s.</div>`},

 scope:function(s){return {panels:[{title:"Capacitor voltage",unit:"V",min:0,max:5,ticks:[0,2.5,5],series:[{key:"v",name:"Capacitor voltage",c:1}],refs:[{v:1.9,label:"LED stops conducting ≈ 1.9 V"}]},{title:"LED current",unit:"mA",min:0,max:3,ticks:[0,1.5,3],series:[{key:"id",name:"LED current",c:2}]}]};},win:8,
 text:`<p>Now the capacitor is a real power source. Charge it, then flip to <b>discharge</b>: the LED lights and slowly fades.</p>
<p>A 1000 µF capacitor with a 1 kΩ resistor has τ ≈ 1 s, so the fade takes a few seconds.</p>
<h3>Two things to notice</h3>
<ol><li>The LED fades instead of switching off suddenly. Less voltage means less current, which means less light.</li><li>The LED goes dark while the capacitor still has nearly 2 V left. Below about 2 V an LED stops conducting completely. This catches people out when they expect a capacitor to run something "until it's empty".</li></ol>
<div class="why"><span class="k">Where you meet this</span>This is why a gadget's light can glow for a moment after you pull the plug: a capacitor in the power supply is still emptying.</div>`},

{title:"Mistake: the short circuit",part:"Mistake · Short circuit",mist:true,init:{wire:"across",sw:false},
 diag:function(s){var d=shortDiag(s);return {svg:d.svg,bad:d.short,
   meters:[["Battery current",d.short?"≈ 15 A":d.on?"≈ 9 mA":"0",d.short?"warn":d.on],["LED",d.on?"ON":"off",d.on],["Battery",d.short?"overheating":"fine",d.short?"warn":true]],
   now:d.short?"The closed switch is a wire straight from the + rail to the − rail with almost no resistance. Nearly all the current takes that path. The only thing limiting it is the battery's own small internal resistance, so roughly 15 A flows. The LED does go out, but only because the battery's voltage collapses. The battery and wires get hot and the battery drains in minutes. In a real circuit this melts wires and can make batteries leak or catch fire.":s.wire==="across"?"Switch open: the LED is lit and everything looks fine. Close the switch to see what this wiring really does.":(s.sw?"Switch in series and closed: one loop, current limited by the 330 Ω to about 9 mA. LED on.":"Switch in series and open: the loop is broken, no current anywhere. LED off, battery safe.")};},
 ctl:[{k:"wire",type:"seg",label:"Switch wired",opts:[["across","across the battery ✗",1],["series","in series ✓"]]},{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>A very common first circuit: “I want a switch that turns the LED off.” The tempting wiring puts the switch <b>across</b> the battery (from + rail to − rail). Close it and the LED does go off.</p>
<p>But look at the loop the switch creates: + rail → switch → − rail. There's no resistor in it, so nothing limits the current. That's a <b>short circuit</b>.</p>
<div class="why bad"><span class="k">What goes wrong</span>Current takes the easiest path. With the switch closed, the switch path is thousands of times easier than the LED path, so almost all the current goes that way: about 15 A from a small battery pack instead of 9 mA. Batteries overheat, wires get hot, and in a simulator you'll see absurd currents or a warning.</div>
<div class="why fix"><span class="k">The fix</span>Put the switch <b>in series</b>, in the same loop as the LED. Open breaks the loop, closed completes it. The 330 Ω still limits the current whenever it flows.</div>
<h3>How to spot a short before you power up</h3>
<ul><li>Trace every loop from + to −. Does each one pass through something that limits current (a resistor, an LED with its resistor, a motor)? If a loop is only wires and switches, it's a short.</li><li>Capacitors count too. Shorting a charged capacitor with a wire or screwdriver dumps all its charge at once, which makes a spark and can damage it.</li></ul>`},

   now:s.rev?(s.heat<0.4?"It charges at first, so it can look fine. But the insulating layer inside an electrolytic capacitor only works one way round. Backwards, it slowly breaks down.":"The current never stops: it leaks straight through the capacitor. That leakage heats the electrolyte inside. Real capacitors in this state bulge, hiss, leak or even pop. The circuit's timing is also wrong, because it isn't really a capacitor any more."):(s.v<4.9?"Charging normally.":"The right way round: fully charged, the current stops completely, just as in step 1.")};},
 ctl:[{k:"rev",type:"tog",label:"Capacitor backwards",bad:1}],
 scope:function(s){return {panels:[{title:"Current",unit:"mA",min:0,max:5,ticks:[0,2.5,5],series:[{key:"i",name:"Current",c:2}]}]};},win:8,
 text:`<p>The big capacitors used for timing (1 µF and up) are usually <b>electrolytic</b>. They are <b>polarised</b>: one leg must go to the more positive side.</p>
<ul><li>On the part: a stripe with minus signs marks the <b>negative</b> leg, which is also the shorter one.</li><li>On a diagram: the straight plate (marked +) is positive. The curved plate is negative.</li><li>In a simulator, check the + marking after you rotate or flip the part.</li></ul>
<div class="why bad"><span class="k">What goes wrong</span>Backwards, the capacitor's thin internal insulating layer breaks down. Instead of the current dying away, a leakage current keeps flowing. The part heats up, timing goes wrong, and it can bulge or burst. It may seem to work for a few seconds first, which is what makes this mistake sneaky.</div>
<div class="why fix"><span class="k">The fix</span>The + leg goes towards the + rail, or to whichever side of the circuit sits at the higher voltage. Small ceramic capacitors (usually under 1 µF) have no polarity and can go either way.</div>`},

{quiz:true,title:"Quick check: capacitors",part:"Check 1",qs:[
 {q:"A capacitor starts charging through a resistor. When is the current biggest?",o:["Right at the start, when the capacitor is empty","At the end, when it's full","It's the same the whole time","Halfway"],c:0,w:"At the start all 5 V is across the resistor, so the current is largest. As the capacitor's voltage rises there's less voltage across the resistor, so less current flows."},
 {q:"What is the time constant of 47 kΩ and 100 µF?",o:["0.47 s","4.7 s","47 s","4700 s"],c:1,w:"47 000 Ω × 0.0001 F = 4.7 s. After 4.7 s the capacitor is 63% full, and after about 23.5 s (5 τ) it's practically full."},
 {q:"A switch wired from the + rail straight to the − rail is closed. What happens?",o:["Nothing, switches have no effect","A short circuit: a huge current flows through the switch because nothing in that loop limits it","The LED gets brighter","The battery voltage doubles"],c:1,w:"A loop made only of wire and a switch has almost no resistance, so the current is limited only by the battery itself. That's a short circuit."},
 {q:"Why did the LED go out while the capacitor still had about 2 V in it?",o:["The capacitor broke","An LED needs about 2 V before it conducts at all","The resistor stopped working","2 V is the same as 0 V"],c:1,w:"Below its forward voltage (about 2 V for a red LED) an LED doesn't conduct, so the remaining charge can't flow through it."}
]},

{title:"An RC timer: a light that stays on",part:"Part 2 · Timing",init:{v:0,btn:false,C:220e-6,norb:false,rel:null,off:null},sim:timerSim,
 onChange:function(s,k){if(k==="C"){s.v=0;hclear(s);s.rel=null;s.off=null;}},
 diag:function(s){var d=timerDiag(s);return {svg:d.svg,meters:timerMeters(s,d),
   now:s.btn?"Button held: the capacitor charges quickly through the 100 Ω (point X rises to 5 V). At the same time a small current flows through the 22 kΩ into the transistor's base, so the transistor is on and the LED is lit.":(d.Ic>1e-4?"Button released. The capacitor is now the only thing keeping the base current flowing: top plate → X → 22 kΩ → base → emitter → bottom rail → bottom plate. As it drains, the base current shrinks. The LED stays fully on while there's plenty of base current, then dims.":(s.v>0.05||s.rel!=null?"The capacitor has dropped below about 0.7 V. The base can't draw current any more, so the transistor is off and the LED is dark.":"Press and hold the button for a second, then let go."))};},
 ctl:[{k:"btn",type:"hold",label:"Hold to press the button"},{k:"C",type:"seg",label:"C",opts:[[100e-6,"100 µF"],[220e-6,"220 µF"],[470e-6,"470 µF"]]}],
 scope:function(s){return {panels:timerPanels(s)};},win:20,
 text:`<p>Now we use RC timing for something practical: <b>press a button and an LED stays on for a while after you let go.</b> Hallway lights and car interior lights use this idea.</p>
<p>Three parts work together:</p>
<ol><li><b>Button + 100 Ω</b> fill the capacitor quickly while the button is pressed.</li><li>The <b>capacitor</b> stores the charge.</li><li>The <b>transistor</b> (the same switch as in the XOR module) turns the LED on whenever it gets base current, and the base current comes from the capacitor through the <b>22 kΩ</b>.</li></ol>
<p>Hold the button, let go and watch the scope. The LED stays on until the capacitor voltage falls towards 0.7 V, the point where the transistor's base stops conducting.</p>
<div class="why"><span class="k">Why the 22 kΩ sets the delay</span>The capacitor can only empty through the 22 kΩ and the base. That's an RC discharge with τ ≈ 22 kΩ × 220 µF ≈ 4.8 s. A bigger capacitor or base resistor means a longer delay. Try 470 µF.</div>
<p class="hint">Why a transistor at all? The LED needs about 9 mA, but the capacitor only has to supply about 0.2 mA of base current. The transistor multiplies that small current, so a small capacitor lasts far longer than if it powered the LED directly.</p>`},

{title:"Mistake: no base resistor",part:"Mistake · Missing resistor",mist:true,init:{v:0,btn:false,C:220e-6,norb:true,rel:null,off:null},sim:timerSim,
 onChange:function(s,k){s.rel=null;s.off=null;hclear(s);},
 diag:function(s){var d=timerDiag(s);return {svg:d.svg,meters:timerMeters(s,d),bad:s.norb&&(d.Ib>5e-3),
   now:s.norb?(s.btn?"With a plain wire instead of the 22 kΩ, the base-emitter junction is connected almost straight across the capacitor and button. About "+fI(d.Ib)+" pours into the base, roughly 100× more than needed. The transistor overheats, and the button's 100 Ω is the only thing stopping a short circuit.":"Released: with nothing to slow it down, the capacitor empties through the base in a few hundredths of a second. The delay is gone. Press and release to see it."):"With the 22 kΩ back in place: base current about 0.2 mA, and the delay lasts several seconds again."};},
 ctl:[{k:"btn",type:"hold",label:"Hold to press the button"},{k:"norb",type:"tog",label:"Base resistor removed",bad:1}],
 scope:function(s){return {panels:timerPanels(s)};},win:6,
 text:`<p>Leaving out the base resistor is one of the most common transistor mistakes. It feels harmless, because the transistor's base is just a control input.</p>
<div class="why bad"><span class="k">What goes wrong</span>Base to emitter behaves like a diode: below about 0.65 V almost nothing flows, and above it the current shoots up. With no resistor to limit it, the base gets far too much current. Two things break:
<ul><li>The transistor's base is overloaded and overheats (a real one would be damaged).</li><li>The timer stops working. The capacitor empties through the base in a few milliseconds instead of a few seconds, because the resistor was what set the time constant.</li></ul></div>
<div class="why fix"><span class="k">The fix</span>Always feed a transistor's base through a resistor. Here the 22 kΩ does two jobs: it limits base current to about 0.2 mA, and together with the capacitor it sets the delay (τ = R × C).</div>
<p>Toggle the resistor back in and compare the delay on the scope.</p>`},

{quiz:true,title:"Final check: RC timing",part:"Final check",qs:[
 {q:"In the delay timer, which pair of parts mainly sets how long the LED stays on?",o:["The 100 Ω and the LED","The 22 kΩ base resistor and the capacitor","The 330 Ω and the battery","The button and the 100 Ω"],c:1,w:"After release, the capacitor discharges through the 22 kΩ and the base, so τ ≈ 22 kΩ × C. The 100 Ω only affects how fast it charges while the button is held."},
 {q:"You want the LED to stay on about twice as long. What's the simplest change?",o:["Double the capacitor (e.g. 220 µF → 470 µF)","Halve the base resistor","Use a brighter LED","Remove the 100 Ω"],c:0,w:"Delay is proportional to R × C. Doubling C (or the base resistor) roughly doubles the delay. Halving the base resistor would halve it."},
 {q:"A 100 µF electrolytic has a stripe with minus signs down one side. Where does that leg go?",o:["Towards the more positive side","Towards the negative (lower-voltage) side","It doesn't matter","Into the transistor's base"],c:1,w:"The stripe marks the negative leg. Backwards, the capacitor leaks, heats and can burst."},
 {q:"What happened to the timer when the base resistor was replaced with a wire?",o:["The delay got much longer","The delay almost vanished and the base current became dangerously high","Nothing changed","The LED got dimmer but the timing was the same"],c:1,w:"The resistor set the discharge time constant and limited base current. Without it the capacitor dumps into the base in milliseconds."},
 {q:"Which of these loops is a short circuit?",o:["+ rail → 330 Ω → LED → − rail","+ rail → switch → − rail","+ rail → 10 kΩ → capacitor → − rail","+ rail → button → 100 Ω → capacitor → − rail"],c:1,w:"Only the switch-only loop has nothing to limit the current. Every other loop includes a resistor."}
]},

{final:true,title:"Explain it back",part:"Finish",
 text:`<p>Answer each one out loud or on paper first, then open it to compare.</p>
<details class="reveal"><summary>1. What happens inside a capacitor while it charges?</summary><p>Charge piles up on one plate and drains off the other, while nothing crosses the insulating gap. As it fills, its voltage rises and opposes the supply, so the charging current falls towards zero.</p></details>
<details class="reveal"><summary>2. What does τ = R × C tell you?</summary><p>The time to reach 63% full (or lose 63% when discharging). After about 5 τ it's practically finished. Bigger R or bigger C means slower.</p></details>
<details class="reveal"><summary>3. How does the delay timer keep the LED on after you let go?</summary><p>The capacitor keeps supplying base current through the 22 kΩ. The transistor multiplies that small current to power the LED. When the capacitor falls below about 0.7 V, the base stops conducting and the LED goes out.</p></details>
<details class="reveal"><summary>4. Name three mistakes from this module and their fixes.</summary><p>A switch across the battery is a short circuit, so put it in series. A backwards electrolytic leaks and heats, so the stripe (−) goes to the lower-voltage side. A missing base resistor overloads the transistor and kills the timing, so always use one.</p></details>
<h3>Build it in VoltSim</h3>
<p>Delay timer: 5 V battery, push button, 100 Ω, 220 µF electrolytic (stripe to the − rail), 22 kΩ, NPN transistor, 330 Ω, LED. Wire it exactly as in step 7. Then try 470 µF and time the difference.</p>`}
]});

/* ======================= MODULE: Astable multivibrator ======================= */
(function(){
var VBE=0.65,VCE=0.1,HI=3.0,RC_=470,ILED=(5-2-VCE)/RC_;

/* ---------- one-shot (monostable) with a hand switch ---------- */
function monoNodes(s){
  var RB=47000,C=22e-6,u=s.u,VB,VL,iC,clamp_=false;
  if(s.pos){VB=(5*RB-u*RB+5*RC_)/(RB+RC_);if(VB>=VBE){VB=VBE;clamp_=true;}VL=u+VB;iC=clamp_?(5-VL)/RC_:-(5-VB)/RB;}
  else{VL=0;VB=-u;if(VB>=VBE){VB=VBE;clamp_=true;iC=0;}else iC=-(5-VB)/RB;}
  return {VB:VB,VL:VL,iC:iC,on:VB>=VBE-0.001};
}
function monoSim(s,dt){
  var C=22e-6,n=Math.max(1,Math.ceil(dt/0.0008));n=Math.min(n,600);var h=dt/n;
  for(var i=0;i<n;i++){var m=monoNodes(s);s.u+=h*m.iC/C;if(!s.pos&&-s.u>VBE)s.u=-VBE;}
  var m2=monoNodes(s);
  if(!s.pos&&s.down!=null&&m2.on&&s.offFor==null)s.offFor=s.t-s.down;
  hpush(s,{vb:m2.VB,vl:m2.VL},4);
}
function monoDiag(s){
  var m=monoNodes(s),o="",on=m.on,kR=clamp((5-m.VB)/9.35,0,1);
  begin(22,300);
  o+=W([268,86,268,98],true)+W([268,138,268,210],on?VCE:HI);
  o+=W([215,116,215,240,226,240],m.VB)+W([164,180,215,180],m.VB)+W([110,160,110,180,150,180],m.VL);
  o+=W([90,120,60,120],false)+GND(60,120,0)+W([130,110,130,120],true);
  if(on)o+=F([268,86,268,98],"b")+F([268,138,268,210],"b");
  if(!on){o+=F([215,116,215,180,164,180],"s",kR)+F([150,180,110,180,110,160,90,120,60,120,60,RB],"s",kR);}
  else o+=F([215,116,215,240,226,240],"s",0.5);
  if(s.pos&&m.iC>2e-5){var kc=clamp(m.iC/0.009,0,1);o+=F([130,110,130,120,110,160,110,180,150,180],"b",kc)+F([164,180,215,180,215,240,226,240],"b",kc);}
  o+=FLAG(268,46,on?1:0,"b")+R(268,46,268,86,"470 Ω")+LED(268,118,on?1:0)+NPN(250,240,false,"Q",on)+GND(268,270,on?1:0,"b");
  o+=FLAG(215,46,on?0.4:kR,"s")+R(215,56,215,116,"47 kΩ",-1)+CAPH(150,164,180,"22 µF",true)+D(215,180,m.VB);
  o+=FLAG(130,62,s.pos&&m.iC>2e-5?clamp(m.iC/0.009,0,1):0,"b")+R(130,62,130,110,"470 Ω",-1)+SPDT(110,160,90,120,130,120,s.pos,"0 V","5 V");
  o+=TAG(215,200,"base "+fx(m.VB,2)+" V","end")+TAG(110,200,fx(m.VL,1)+" V","end")+T(110,226,"hand switch","lbl")+T(110,239,"(stands in for","lbl")+T(110,252,"a transistor)","lbl");
  return {svg:finish(o,340,312,50),m:m};
}

/* ---------- full astable: event model ---------- */
function asInit(s){s.on=1;s.vbOff=-1.5;s.vcOff=HI;s.tph=0;s.half={1:0,2:0};s.t=s.t||0;}
function asSim(s,dt){
  if(s.wrong||s.dead)return asHist(s);
  var guard=0;
  while(dt>1e-9&&guard++<2000){
    var off=s.on===1?2:1,RB=off===2?s.RB2:s.RB1,C=off===2?s.C1:s.C2,Cr=off===2?s.C2:s.C1;
    if(s.rev&&off===2)C*=Math.max(0.35,1-0.06*(s.revT||0));
    var tau=RB*C,tr=RC_*Cr;
    var tc=s.vbOff<VBE?tau*Math.log((5-s.vbOff)/(5-VBE)):0;
    var h=Math.min(dt,tc);
    s.vbOff=5-(5-s.vbOff)*Math.exp(-h/tau);s.vcOff=HI-(HI-s.vcOff)*Math.exp(-h/tr);
    dt-=h;s.tph+=h;
    if(h>=tc-1e-12){ /* the off transistor turns on */
      var swing=s.vcOff-VCE;s.half[s.on]=s.tph;s.tph=0;s.on=off;s.vbOff=VBE-swing;s.vcOff=VCE;
      if(s.noRc){s["burnt"+s.on]=true;s.dead=true;}
    }
  }
  if(s.rev)s.revT=(s.revT||0)+0.03;
  asHist(s);
}
function asHist(s){var n=asNodes(s);hpush(s,{b1:n.B1,b2:n.B2,c1:n.C1,c2:n.C2},s.win||3);}
function asNodes(s){
  if(s.wrong)return {C1:VCE,C2:VCE,B1:VBE,B2:VBE,on1:true,on2:true};
  if(s.on===1)return {C1:VCE,B1:VBE,C2:s.vcOff,B2:s.vbOff,on1:true,on2:false};
  return {C2:VCE,B2:VBE,C1:s.vcOff,B1:s.vbOff,on1:false,on2:true};
}
function blurred(s){var sp=s.speed||1,h1=s.half[1],h2=s.half[2];return !s.wrong&&!s.dead&&h1>0&&h2>0&&(h1/sp<0.05||h2/sp<0.05);}
function asDiag(s,wide){
  var n=asNodes(s),o="",bl=blurred(s);
  begin(22,300);
  var l1=s.burnt1?"burnt":bl?0.55:(n.on1&&!s.dead?1:0),l2=s.burnt2?"burnt":bl?0.55:(n.on2&&!s.dead?1:0);
  if(s.dead){l1=s.burnt1?"burnt":0;l2=s.burnt2?"burnt":0;}
  var k1=(typeof l1==="number"&&l1>0)?l1:0,k2=(typeof l2==="number"&&l2>0)?l2:0;
  /* collector columns */
  o+=W([132,86,132,98],true)+W([132,138,132,210],n.C1)+W([268,86,268,98],true)+W([268,138,268,210],n.C2);
  o+=F([132,86,132,98],"b",k1)+F([132,138,132,210],"b",k1)+F([268,86,268,98],"b",k2)+F([268,138,268,210],"b",k2);
  /* base columns */
  o+=W([185,116,185,240,174,240],n.B1)+W([215,116,215,240,226,240],n.B2);
  /* cross-coupling */
  o+=W([268,150,250,150],n.C2)+W([236,150,185,150],n.B1);
  if(s.wrong)o+=W([132,180,150,180],n.C1)+W([164,180,185,180],n.B1);
  else o+=W([132,180,150,180],n.C1)+W([164,180,215,180],n.B2);
  if(!s.wrong&&!s.dead&&!bl){
    var off=n.on1?2:1,RB=off===2?s.RB2:s.RB1,iR=(5-s.vbOff)/RB,kR=clamp(iR/((5+2.4)/RB),0.15,1),rec=clamp((HI-s.vcOff)/(HI-VCE),0,1);
    if(off===2){ /* Q1 on: RB2 charges C1 into Q1's collector; C2 recharges from LED2 side into Q1's base */
      o+=F([215,116,215,180,164,180],"s",kR)+F([150,180,132,180,132,210],"s",kR)+F([185,116,185,240,174,240],"s",0.45);
      if(rec>0.03)o+=F([268,138,268,150,250,150],"b",rec)+F([236,150,185,150,185,240,174,240],"b",rec);
    }else{
      o+=F([185,116,185,150,236,150],"s",kR)+F([250,150,268,150,268,210],"s",kR)+F([215,116,215,240,226,240],"s",0.45);
      if(rec>0.03)o+=F([132,138,132,180,150,180],"b",rec)+F([164,180,215,180,215,240,226,240],"b",rec);
    }
  }
  if(s.wrong)o+=F([185,116,185,240,174,240],"s",0.45)+F([215,116,215,240,226,240],"s",0.45);
  o+=FLAG(132,46,k1,"b")+R(132,46,132,86,"470 Ω",-1)+LED(132,118,l1)+T(110,122,"LED1","nlbl","end");
  o+=FLAG(268,46,k2,"b")+R(268,46,268,86,"470 Ω")+LED(268,118,l2)+T(292,140,"LED2","nlbl","start");
  o+=FLAG(185,46,0.4)+R(185,56,185,116,"RB1",-1)+FLAG(215,46,0.4)+R(215,56,215,116,"RB2");
  o+=CAPH(250,236,150,"C2",true)+(s.rev?CAPH(164,150,180,"C1 (backwards)",true,false):CAPH(150,164,180,"C1",true,false));
  if(!s.wrong)o+=HOP(215,150,n.B1)+HOP(185,180,n.B2);
  o+=D(185,150,n.B1)+D(s.wrong?185:215,180,s.wrong?n.B1:n.B2)+D(132,180,n.C1)+D(268,150,n.C2);
  o+=NPN(150,240,true,"Q1",s.dead&&s.burnt1?false:n.on1)+NPN(250,240,false,"Q2",n.on2)+GND(132,270,k1,"b")+GND(268,270,k2,"b");
  o+=TAG(176,288,"B1 "+fx(n.B1,2)+" V","end")+TAG(224,288,"B2 "+fx(n.B2,2)+" V","start");
  return finish(o,340,312,50,wide);
}
function asNow(s){
  if(s.dead)return "An LED with no resistor took the full current through the saturated transistor and burnt out. With its LED open, that transistor's collector can't swing any more, so nothing kicks the other side and the whole oscillator stops.";
  if(s.wrong)return "Each capacitor now connects a transistor's collector to its own base. When Q1's collector falls, it pulls Q1's own base down, which turns Q1 back off, so its collector rises again. Each transistor fights itself instead of flipping the other. Both settle half-way into ON, held there by their base resistors. Both LEDs on, no blinking.";
  if(blurred(s))return "It's still flipping, but so fast (each half lasts "+fT(s.half[1])+") that your eye blends it: both LEDs just look half-bright. Small RB or small C means a tiny R × C.";
  var n=asNodes(s),onq=n.on1?1:2,offq=3-onq,vb=n["B"+offq];
  return "Q"+onq+" is ON, so LED"+onq+" is lit and Q"+onq+"'s collector is at 0.1 V. Q"+offq+" is OFF because its base is at "+fx(vb,2)+" V, below the 0.65 V it needs. RB"+offq+" is slowly charging C"+(offq===2?1:2)+", pulling that base up. When it reaches 0.65 V, Q"+offq+" turns on and kicks Q"+onq+" off.";
}
function asMeters(s){var n=asNodes(s),bl=blurred(s);
  return [["Q1",s.wrong?"half on":n.on1?"ON":"off",n.on1],["Q2",s.wrong?"half on":n.on2?"ON":"off",n.on2],["LED1 on for",s.half[1]?fT(s.half[1]):"…",true],["LED2 on for",s.half[2]?fT(s.half[2]):"…",true]].concat(bl?[["Blink rate",(1/(s.half[1]+s.half[2])).toFixed(0)+" per second","warn"]]:[]);}
function asPanels(){return [{title:"Base voltages",unit:"V",min:-3,max:5,ticks:[-3,0,5],series:[{key:"b1",name:"Q1 base",c:1},{key:"b2",name:"Q2 base",c:2}],refs:[{v:0.65,label:"0.65 V: turns on"}]}];}
function asBase(extra){var s={RB1:47000,RB2:47000,C1:22e-6,C2:22e-6,speed:0.5,win:3,wrong:false,rev:false,noRc:false,dead:false,revT:0};for(var k in extra)s[k]=extra[k];return s;}
function asReset(s){asInit(s);s.dead=false;s.burnt1=false;s.burnt2=false;s.revT=0;hclear(s);}
var SPEED={k:"speed",type:"seg",label:"Speed",opts:[[1,"1×"],[0.5,"½×"],[0.15,"slow-mo"]]};

/* ---------- frozen "moments" ---------- */
var MOMENTS={
 1:{on:1,vbOff:-2.25,vcOff:VCE+0.05,txt:"<b>Moment 1: Q1 has just switched ON.</b> LED1 lights. Q1's collector dropped from about 3 V to 0.1 V, a fall of 2.9 V. C1 couldn't change its voltage that fast, so it dragged Q2's base down by the same 2.9 V: from 0.65 V to about −2.25 V. Q2 is now firmly OFF. (C2 is also topping itself up through LED2's 470 Ω: the thick dashes on the right.)"},
 2:{on:1,vbOff:-0.6,vcOff:HI,txt:"<b>Moment 2: waiting.</b> Q1 stays on. RB2 pulls current from the + rail into C1, so Q2's base climbs: −2.25 V … −1 V … −0.6 V. It's an RC charge, so the time this takes depends on RB2 × C1. Nothing else changes yet."},
 3:{on:2,vbOff:-2.25,vcOff:VCE+0.05,txt:"<b>Moment 3: Q2's base reaches 0.65 V, so Q2 turns ON.</b> LED2 lights. Q2's collector falls 2.9 V, and C2 drags Q1's base down by the same amount, to about −2.25 V. Q1 switches OFF and LED1 goes out. This is the mirror image of moment 1."},
 4:{on:2,vbOff:-0.6,vcOff:HI,txt:"<b>Moment 4: waiting again.</b> Now RB1 charges C2, pulling Q1's base up from −2.25 V towards 0.65 V. When it gets there, Q1 turns on and we're back at moment 1. The cycle repeats forever, with no input needed."}
};
function momentState(s){var m=MOMENTS[s.m];s.on=m.on;s.vbOff=m.vbOff;s.vcOff=m.vcOff;s.half={1:0,2:0};}

MODS.push({id:"astable",n:3,title:"Astable multivibrator",blurb:"Two transistors and two capacitors that flip each other forever: the classic LED flasher, explained one idea at a time.",mistakes:"Capacitor to the wrong base, RC too small, backwards capacitors, LEDs without resistors.",
steps:[
{title:"What we're building: a flasher with no input",part:"Start",legendNeg:true,init:asBase({speed:1}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 diag:function(s){return {svg:asDiag(s),meters:asMeters(s),now:"Two LEDs take turns, forever, and nobody is pressing anything. By the end of this module you'll be able to say exactly what flips it each time."};},
 ctl:[SPEED],
 text:`<p>This is an <b>astable multivibrator</b>. The name sounds scarier than the circuit:</p>
<ul><li><b>astable</b> = “not stable”: it never settles in one state.</li><li><b>multivibrator</b> = old name for a circuit that flips between two states.</li></ul>
<p>So it's a <b>flip-flopper that never stops</b>: Q1 on and Q2 off, then Q2 on and Q1 off, again and again.</p>
<h3>Why it's confusing at first</h3>
<p>Everything is symmetrical, there's no input, and it seems like it should just sit still. The secret is a capacitor trick that pushes a transistor's base <b>below 0 V</b> for a while. We'll learn it in three ideas:</p>
<ol><li>A transistor is a switch controlled by its base (you know this from the XOR module).</li><li>A capacitor <b>can't change its voltage instantly</b>, so it can kick a base below 0 V. That's the next step, with a hand switch.</li><li>Put two of these kickers in a ring so each transistor kicks the other.</li></ol>
<p class="hint">Purple wires are <b>below 0 V</b>. You'll see them a lot in this module, because that's where the magic happens.</p>`},

{title:"Idea 1: a capacitor can kick a base below 0 V",part:"Part 1 · The building block",legendNeg:true,init:{pos:1,u:5-0.65,down:null,offFor:null},sim:monoSim,timeScale:0.5,
 onChange:function(s){if(!s.pos){s.down=s.t;s.offFor=null;}},
 diag:function(s){var d=monoDiag(s),m=d.m;return {svg:d.svg,
   meters:[["Base",fV(m.VB),m.VB<0?"warn":true],["Transistor",m.on?"ON":"off",m.on],["LED was off for",s.offFor!=null?fT(s.offFor):(s.down!=null&&!m.on?fT(s.t-s.down)+"…":"…"),true]],
   now:s.pos?(m.on?"Switch at 5 V. The capacitor is charged: about 5 V on the left, 0.65 V on the right (the base). That's roughly 4.35 V across it. The 47 kΩ feeds the base and the LED is on. Now flip the switch to 0 V.":"Switch back at 5 V. The left side rises and the capacitor recharges through the 470 Ω and the base (thick dashes). That gets it ready for the next kick."):(m.on?"The base has climbed back to 0.65 V, so the transistor is on again. One flip of the switch gave one timed off-pulse. Flip back to 5 V to reset, then try again.":"The left side dropped from 5 V to 0 V in an instant. The capacitor still holds its 4.35 V, so the right side had to drop by 5 V too: the base is now about "+fx(m.VB,1)+" V. The transistor is OFF. The 47 kΩ is slowly charging the capacitor the other way, pulling the base back up.")};},
 ctl:[{k:"pos",type:"seg",label:"Hand switch",opts:[[1,"5 V"],[0,"0 V"]]}],
 scope:function(s){return {panels:[{title:"Voltages",unit:"V",min:-5,max:5,ticks:[-5,0,5],series:[{key:"vl",name:"Left side (switch)",c:2},{key:"vb",name:"Base",c:1}],refs:[{v:0.65,label:"0.65 V"}]}],win:4};},
 text:`<p>This is half of the flasher, with a <b>hand switch</b> where the other transistor will eventually go.</p>
<h3>The key fact</h3>
<p>A capacitor's voltage <b>can't change instantly</b>. Changing it means moving charge, and that takes time through a resistor (step 2 of the RC module).</p>
<p>So treat the capacitor as a <b>stiff rod</b> joining its two sides. Yank one end down by 5 V and the other end goes down by 5 V too, right away.</p>
<h3>Try it: flip the switch to 0 V</h3>
<ol><li>Before: left side 5 V, base 0.65 V, so the capacitor holds 4.35 V.</li><li>The left side snaps to 0 V. The capacitor still holds 4.35 V, so the base must drop to <b>0 − 4.35 = −4.35 V</b>.</li><li>A base below 0.65 V can't turn the transistor on: <b>LED off</b>.</li><li>The 47 kΩ now slowly charges the capacitor, pulling the base back up. It's an ordinary RC charge.</li><li>When the base reaches 0.65 V the transistor turns back on: <b>LED on</b>.</li></ol>
<p>One flip of the switch gives one timed “off” pulse, about 0.75 × 47 kΩ × 22 µF ≈ 0.8 s. A circuit like this is called a <b>monostable</b> or <b>one-shot</b>.</p>
<div class="why"><span class="k">Hold on to this</span>A sudden drop on one side of the capacitor makes a sudden drop on the other side. The base resistor then slowly drags it back. That's the entire trick behind the flasher.</div>`},

{title:"Idea 2: let the transistors flip each other",part:"Part 2 · The ring",legendNeg:true,init:asBase({speed:0.15,win:3}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 diag:function(s){return {svg:asDiag(s),meters:asMeters(s),now:asNow(s)};},
 ctl:[SPEED,{k:"paused",type:"tog",label:"Pause"}],
 scope:function(s){return {panels:asPanels(),win:3};},
 text:`<p>Now take <b>two</b> of those one-shots and remove the hand switch. Each transistor's <b>collector</b> becomes the “switch” for the <b>other</b> transistor:</p>
<ul><li><b>C1</b> joins Q1's collector to Q2's base.</li><li><b>C2</b> joins Q2's collector to Q1's base.</li></ul>
<p>A transistor's collector already behaves like the hand switch. When the transistor turns on, its collector drops suddenly from about 3 V to 0.1 V. That sudden drop goes through the capacitor and kicks the <b>other</b> base below 0 V.</p>
<h3>Follow it at slow speed</h3>
<ol><li>Q1 turns on, so its collector drops and C1 kicks Q2's base down. Q2 turns off.</li><li>RB2 slowly pulls Q2's base back up (watch the orange trace climb).</li><li>Q2's base reaches 0.65 V, so Q2 turns on, its collector drops and C2 kicks Q1's base down. Q1 turns off.</li><li>RB1 slowly pulls Q1's base back up (the blue trace)…</li><li>…until Q1 turns on again, and we're back at the start.</li></ol>
<p>On the scope, each base sits flat at 0.65 V while its transistor is on, then gets <b>slammed down</b> and <b>climbs back</b> along an RC curve. The two traces take turns.</p>
<div class="why"><span class="k">Why it never settles</span>Each transistor turning on is exactly what switches the other one on a little later. The ring keeps feeding itself, and the battery supplies the energy.</div>
<p class="hint">How does it start? Real parts are never perfectly matched, so one transistor always switches on a hair sooner, and the ring takes off from there.</p>`},

{title:"One cycle, four moments",part:"Part 2 · The ring",legendNeg:true,init:asBase({m:1}),reset:momentState,onChange:function(s){momentState(s);},
 diag:function(s){return {svg:asDiag(s),meters:asMeters(s).slice(0,2).concat([["Q1 base",fV(asNodes(s).B1),asNodes(s).B1>0],["Q2 base",fV(asNodes(s).B2),asNodes(s).B2>0]]),now:MOMENTS[s.m].txt};},
 ctl:[{k:"m",type:"seg",label:"Moment",opts:[[1,"1"],[2,"2"],[3,"3"],[4,"4"]]}],
 text:`<p>Here's the cycle frozen at four moments. Step through 1 → 2 → 3 → 4 → 1 and read the box under the diagram each time.</p>
<p>Look at the <b>base tags</b> under each transistor:</p>
<ul><li>The <b>ON</b> transistor's base always sits at 0.65 V.</li><li>The <b>OFF</b> transistor's base is negative (purple) and climbing.</li></ul>
<h3>Say it in one breath</h3>
<p>“When one transistor turns on, its collector drops, and the capacitor passes that drop to the other transistor's base, turning it off. That base slowly recharges through its resistor until the other transistor turns on and does the same thing back.”</p>
<div class="why"><span class="k">Common confusion</span>“Which capacitor controls which LED?” Q1 stays on (LED1 lit) while <b>Q2's</b> base climbs, and that's set by RB2 and C1. So <b>LED1's on-time is set by the parts on the other side</b>. The next step lets you test this.</div>`},

{title:"Setting the blink speed",part:"Part 3 · Timing",legendNeg:true,init:asBase({speed:1,win:4}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 onChange:function(s){s.half={1:0,2:0};},
 diag:function(s){var p1=0.511*s.RB2*s.C1,p2=0.511*s.RB1*s.C2;return {svg:asDiag(s),
   meters:[["LED1 on (predicted)",fT(p1),true],["LED1 on (measured)",s.half[1]?fT(s.half[1]):"…",true],["LED2 on (predicted)",fT(p2),true],["LED2 on (measured)",s.half[2]?fT(s.half[2]):"…",true]],
   now:"LED1's on-time is set by RB2 × C1, and LED2's by RB1 × C2. Make one side's parts bigger and the OTHER LED stays on longer. Unequal halves are called an unequal duty cycle."};},
 ctl:[SPEED,{k:"RB2",type:"seg",label:"RB2",opts:[[22000,"22k"],[47000,"47k"],[100000,"100k"]]},{k:"C1",type:"seg",label:"C1",opts:[[10e-6,"10µ"],[22e-6,"22µ"],[47e-6,"47µ"]]},{k:"RB1",type:"seg",label:"RB1",opts:[[22000,"22k"],[47000,"47k"],[100000,"100k"]]},{k:"C2",type:"seg",label:"C2",opts:[[10e-6,"10µ"],[22e-6,"22µ"],[47e-6,"47µ"]]}],
 scope:function(s){return {panels:asPanels(),win:4};},
 text:`<p>Each half of the cycle is one RC charge: the off transistor's base climbing from about −2.25 V to +0.65 V through its base resistor.</p>
<div class="formula">time one LED stays on ≈ 0.5 × RB × C &nbsp;(with LEDs, 5 V supply)</div>
<p>With 47 kΩ and 22 µF: 0.5 × 47 000 × 0.000 022 ≈ 0.53 s.</p>
<div class="why"><span class="k">Why 0.5 and not the textbook 0.69?</span>Most textbooks give <b>0.69 × R × C</b>. That assumes the collector swings the full supply (about 5 V), so the base gets kicked down to about −4.35 V. Here the LEDs keep the collectors near 3 V when off, so the kick is smaller (to about −2.25 V) and the climb back is shorter. Same idea, different number. Your simulator will agree with the measured value.</div>
<p><b>Experiment:</b> set RB2 to 100k and watch which LED stays on longer. Then set C1 to 47µ.</p>`},

{quiz:true,title:"Quick check: how it flips",part:"Check 1",qs:[
 {q:"What makes the OFF transistor's base go below 0 V?",o:["The battery is connected backwards","The other transistor's collector drops suddenly, and the capacitor passes that drop to the base because its voltage can't change instantly","The base resistor pulls it down","The LED pushes it down"],c:1,w:"The capacitor acts like a stiff rod: a sudden 2.9 V fall on the collector side gives a 2.9 V fall on the base side."},
 {q:"While Q2 is off, what pulls Q2's base back up?",o:["RB2, charging C1 from the + rail","LED2","Q1's emitter","C2"],c:0,w:"RB2 connects Q2's base to the + rail, so it charges C1 and drags the base back up from negative towards 0.65 V."},
 {q:"LED1 stays on too long. Which parts set LED1's on-time?",o:["RB1 and C2","RB2 and C1","The two 470 Ω resistors","The battery voltage only"],c:1,w:"LED1 is on while Q1 is on, which lasts until Q2's base climbs back to 0.65 V. That climb is set by RB2 × C1, on the other side of the circuit."},
 {q:"At the moment a transistor is ON, what is its base voltage?",o:["About 0.65 V","About −2 V","5 V","Exactly 0 V"],c:0,w:"A conducting base-emitter junction holds the base at about 0.65 V. The OFF transistor's base is the one that goes negative."}
]},

{title:"Mistake: the capacitor goes to the wrong base",part:"Mistake · Wiring",mist:true,legendNeg:true,init:asBase({speed:0.5,wrong:true}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 onChange:function(s,k){if(k==="wrong")asReset(s);},
 diag:function(s){return {svg:asDiag(s),meters:asMeters(s),now:asNow(s),bad:s.wrong};},
 ctl:[{k:"wrong",type:"seg",label:"C1 goes to",opts:[[true,"Q1's own base ✗",1],[false,"Q2's base ✓"]]},SPEED],
 scope:function(s){return {panels:asPanels(),win:3};},
 text:`<p>The most common astable wiring mistake is joining a transistor's collector to <b>its own</b> base through the capacitor, instead of to the other transistor's base. On a breadboard the two bases are close together, so it's an easy slip.</p>
<div class="why bad"><span class="k">What goes wrong</span>The ring is broken. When Q1's collector drops, the capacitor pushes <b>Q1's own</b> base down, which turns Q1 back off, so the collector rises again. Instead of kicking the other transistor, each one fights itself (<b>negative feedback</b>). Both transistors settle half-on, held by their base resistors. Both LEDs glow steadily and nothing blinks.</div>
<div class="why fix"><span class="k">The fix</span>Cross the capacitors. C1 runs from <b>Q1's collector to Q2's base</b>, and C2 from <b>Q2's collector to Q1's base</b>. On the diagram they form an X. If both LEDs are steadily on, check this first.</div>
<p class="hint">Rule of thumb: an oscillator needs <b>positive feedback</b> (each change pushes the circuit further the same way). Wired to its own base, the change cancels itself, which is negative feedback.</p>`},

{title:"Mistake: R × C too small",part:"Mistake · Timing",mist:true,legendNeg:true,init:asBase({speed:1,RB1:1000,RB2:1000}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 onChange:function(s){s.half={1:0,2:0};},
 diag:function(s){var bl=blurred(s),ib=(5-VBE)/s.RB1;return {svg:asDiag(s),bad:bl,
   meters:asMeters(s).concat([["Base current when on",fI(ib),ib>2e-3?"warn":true]]),
   now:asNow(s)+(s.RB1<5000?" The 1 kΩ base resistors also push about 4 mA into each base, far more than the 6 mA LED current needs. Wasteful, and the LED current is now limited by the 470 Ω.":"")};},
 ctl:[{k:"RB1",type:"seg",label:"Base resistors",opts:[[1000,"1 kΩ ✗",1],[47000,"47 kΩ ✓"]],set:function(s,v){s.RB1=v;s.RB2=v;}},SPEED],
 scope:function(s){return {panels:asPanels(),win:s.RB1<5000?0.2:3};},
 text:`<p>“My flasher doesn't flash, both LEDs are just on.” If the wiring is right, check the <b>values</b>.</p>
<div class="why bad"><span class="k">What goes wrong</span>With 1 kΩ instead of 47 kΩ, R × C is 47 times smaller. Each half lasts about 11 ms, so it flips about 45 times a second. Your eye can't follow anything faster than about 20 flashes a second, so both LEDs look steadily half-bright. The scope shows it's still oscillating, just very fast. Using 100 nF capacitors instead of 22 µF does the same thing.</div>
<div class="why fix"><span class="k">The fix</span>Aim for a half-period of a few tenths of a second: 0.5 × RB × C ≈ 0.3–0.6 s. Typical values are 47 kΩ with 10–22 µF. Read capacitor markings carefully: “104” on a small ceramic means 100 nF, which is 220 times smaller than 22 µF.</div>
<p class="hint">The base resistor also limits base current. Too small a value overdrives the bases (the 1 kΩ pushes about 4 mA into each).</p>`},

{title:"Mistakes: backwards capacitor and LEDs without resistors",part:"Mistake · Parts",mist:true,legendNeg:true,init:asBase({speed:0.5,rev:true}),reset:asInit,sim:asSim,timeScale:function(s){return s.speed;},
 onChange:function(s,k){asReset(s);},
 diag:function(s){var bad=s.dead||(s.rev&&s.revT>3);return {svg:asDiag(s),bad:bad,meters:asMeters(s).concat(s.rev?[["C1","backwards: leaking","warn"]]:[]),
   now:s.dead?asNow(s):s.rev?"C1 is in backwards. Its + side is on Q2's base, which spends half its time negative, so the capacitor is reverse-biased. It still blinks at first, but the leakage grows: watch LED1's on-time creep shorter. A real one heats up and eventually fails.":asNow(s)};},
 ctl:[{k:"rev",type:"tog",label:"C1 backwards",bad:1},{k:"noRc",type:"tog",label:"470 Ω resistors removed",bad:1},SPEED],
 scope:function(s){return {panels:asPanels(),win:3};},
 text:`<h3>1. Electrolytic capacitors backwards</h3>
<p>In this circuit the collector side is always the <b>more positive</b> side: about 0.1 V to 3 V. The base side swings down to −2.25 V. So each capacitor's <b>+ leg goes to a collector</b>.</p>
<div class="why bad"><span class="k">What goes wrong</span>Backwards, the capacitor is reverse-biased for much of every cycle. It leaks, so the timing drifts (usually shorter), and it warms up and can fail. It often blinks at first, which makes the fault hard to spot.</div>
<h3>2. LEDs without their resistors</h3>
<p>Toggle the resistors off and watch the first LED that turns on.</p>
<div class="why bad"><span class="k">What goes wrong</span>When a transistor is fully on, the only thing limiting the LED current is the 470 Ω. Without it, the LED gets the full 5 V minus 0.1 V and burns out. With that LED dead, its transistor's collector can no longer swing, so nothing kicks the other side and the oscillator stops.</div>
<div class="why fix"><span class="k">The fixes</span>+ legs to the collectors (the stripe side towards the bases), and always a resistor in series with each LED (470 Ω gives about 6 mA here).</div>`},

{quiz:true,title:"Final check: the astable",part:"Final check",qs:[
 {q:"Both LEDs are steadily on and nothing blinks. The values are correct. What's the most likely wiring fault?",o:["A capacitor joins a collector to its own base instead of the other transistor's base","The battery is too strong","The LEDs are the wrong colour","The emitters go to the − rail"],c:0,w:"Without the cross-connection there's no ring, so each transistor fights itself and both settle on."},
 {q:"You used 100 nF capacitors instead of 22 µF. What do you see?",o:["Much slower blinking","It flips so fast (hundreds of times a second) that both LEDs look on","Nothing changes","The transistors burn out"],c:1,w:"R × C is 220 times smaller, so each half is about 2 ms. Far too fast to see."},
 {q:"With RB = 47 kΩ and C = 22 µF (and LEDs in the collectors), roughly how long does each LED stay on?",o:["About 5 ms","About 0.5 s","About 5 s","About 50 s"],c:1,w:"≈ 0.5 × 47 000 × 0.000 022 ≈ 0.52 s. The textbook 0.69 × R × C gives 0.71 s for a circuit whose collectors swing the full 5 V."},
 {q:"Which way round do the electrolytic capacitors go?",o:["+ to the collector side","+ to the base side","Either way","+ to the − rail"],c:0,w:"The collector side never goes below about 0.1 V, while the base side swings negative. So + goes to the collector."},
 {q:"In one sentence, what flips the circuit each time?",o:["A transistor turning on drops its collector, and the capacitor passes that drop to the other transistor's base, turning it off until its resistor recharges it","The battery reverses itself","The LEDs take turns because one gets tired","The base resistors switch on and off"],c:0,w:"That sentence is the whole astable."}
]},

{final:true,title:"Explain it back",part:"Finish",
 text:`<p>Answer first, then open each one to compare.</p>
<details class="reveal"><summary>1. Why can a capacitor push a base below 0 V?</summary><p>Its voltage can't change instantly. If one side suddenly falls by 2.9 V, the other side falls by 2.9 V too, even if that takes it below 0 V. The base resistor then slowly recharges it.</p></details>
<details class="reveal"><summary>2. Describe one full cycle.</summary><p>Q1 turns on, its collector drops, and C1 kicks Q2's base to about −2.25 V, so Q2 is off. RB2 recharges C1 until Q2's base reaches 0.65 V. Q2 turns on, its collector drops, and C2 kicks Q1's base down, so Q1 is off. RB1 recharges C2 until Q1 turns on. Repeat.</p></details>
<details class="reveal"><summary>3. What sets each LED's on-time?</summary><p>The RC on the opposite side: LED1's on-time is about 0.5 × RB2 × C1 here (0.69 × R × C in the textbook version without LEDs).</p></details>
<details class="reveal"><summary>4. Three faults and what you'd see.</summary><p>Capacitor to its own base: both LEDs steady, no blink. R × C far too small: blinks too fast to see, so both LEDs look on. A backwards capacitor or LEDs with no resistors: drifting timing and heating, or burnt LEDs and a dead oscillator.</p></details>
<h3>Build it in VoltSim</h3>
<table class="parts"><tr><th>Qty</th><th>Part</th></tr><tr><td>1</td><td>5 V battery</td></tr><tr><td>2</td><td>NPN transistors (Q1, Q2)</td></tr><tr><td>2</td><td>LEDs + 470 Ω resistors (collector side)</td></tr><tr><td>2</td><td>47 kΩ base resistors (RB1, RB2) to the + rail</td></tr><tr><td>2</td><td>22 µF electrolytic: C1 from Q1 collector to Q2 base, C2 from Q2 collector to Q1 base (+ to the collectors)</td></tr></table>
<p>If the simulator sits still at the start, it may be waiting for a mismatch. Use two slightly different capacitors (22 µF and 20 µF), or briefly short one base to the − rail to give it a nudge.</p>`}
]});
})();
/* ======================= MODULE: Inductors ======================= */
(function(){
function LEDU(x,y,b){return '<g transform="matrix(1 0 0 -1 0 '+(2*y)+')">'+LED(x,y,b)+'</g>';}
window.LEDU=LEDU;
var SPARK='<path class="part badp" style="stroke-width:2" d="M0 0 l6 -8 l-2 7 l7 -6 l-3 9 l8 -3"/>';
function spark(x,y){return '<g transform="translate('+x+','+y+')">'+SPARK+'</g>'+T(x+18,y+4,"SPARK","blbl","start");}

/* step 1/2: switch, R, LED, coil in series */
function coilSim(s,dt){
  var L=s.L||0.1,Rt=(s.R||100)+10,n=Math.max(1,Math.ceil(dt/(L/Rt/40)));n=Math.min(n,400);var h=dt/n;
  for(var i=0;i<n;i++){
    if(s.sw){var vl=5-1.9-Rt*s.i;if(s.i<=0&&vl<0)vl=0;s.i+=h*vl/L;s.vl=5-1.9-Rt*s.i;}
    else{if(s.i>1e-4){if(s.spikeT==null||s.t-s.spikeT>0.002)s.spikeT=s.t;}s.i=0;s.vl=0;}
  }
  if(!s.sw&&s.spikeT!=null&&s.t-s.spikeT<0.0004)s.vl=-60;
  hpush(s,{i:s.i*1000,v:s.vl},s.win||0.008);
}
function coilDiag(s){
  var o="",L=s.L||0.1,Rv=s.R||100,Imax=3.1/(Rv+10),k=clamp(s.i/Imax,0,1),b=clamp(s.i/0.02,0,1);
  begin(24,270);
  o+=W([120,95,120,105],s.sw)+W([120,145,120,152],s.sw?"mid":false)+W([120,192,120,200],s.vl>0.05?"mid":false);
  if(k>0.01)o+=F([120,95,120,105],"b",k)+F([120,145,120,152],"b",k)+F([120,192,120,200],"b",k);
  o+=FLAG(120,50,k,"b")+SW(120,50,120,95,s.sw,"switch",-1)+R(120,105,120,145,Rv+" Ω")+LED(120,172,b)+IND(120,200,250,(L*1000)+" mH")+GND(120,250,k,"b");
  if(s.spikeT!=null&&s.t-s.spikeT<0.0005)o+=spark(132,72);
  return finish(o,340,282,50);
}
function coilPanels(s,imax){return [{title:"Coil current",unit:"mA",min:0,max:imax||30,ticks:[0,(imax||30)/2,imax||30],series:[{key:"i",name:"Coil current",c:1}]},{title:"Voltage across coil",unit:"V",min:-10,max:5,ticks:[-10,0,5],series:[{key:"v",name:"Coil voltage",c:2}],refs:[{v:-9.5,label:"spike runs off the chart"}]}];}

/* step 3: LED across the coil (the kick) */
function kickSim(s,dt){
  var L=0.1,n=Math.max(1,Math.ceil(dt/2e-5));n=Math.min(n,600);var h=dt/n;s.il=0;
  for(var i=0;i<n;i++){
    if(s.sw){var v=5-110*s.i;s.i+=h*v/L;s.vp=5-100*s.i;s.il=0;}
    else if(s.i>0){
      if(s.led){var vL=-(1.9+10*s.i);s.i=Math.max(0,s.i+h*vL/L);s.vp=s.i>0?-1.9-0*s.i:0;s.il=s.i;}
      else{if(s.i>1e-4)s.spikeT=s.t;s.i=0;s.vp=-60;}

MODS.push({id:"ind",n:4,title:"Inductors",blurb:"Coils resist changes in current. See the slow start, the voltage kick at switch-off, and why relay circuits need a diode.",mistakes:"No flyback diode, a coil straight across the battery.",

{title:"An inductor resists changes in current",part:"Part 1 · Coils",init:{sw:false,i:0,vl:0,L:0.1,R:100,win:0.008},sim:coilSim,timeScale:0.001,
 diag:function(s){return {svg:coilDiag(s),meters:[["Switch",s.sw?"closed":"open",s.sw],["Coil current",fI(s.i),s.i>1e-4],["Voltage across coil",s.vl<-20?"spike!":fV(s.vl),s.vl<-20?"warn":s.vl>0.05]],
   now:s.sw?(s.i<0.027?"Switch closed. The coil fights the sudden change: it creates a voltage that opposes the battery, so the current has to build up gradually. The LED brightens over a couple of milliseconds (slowed down 1000× here).":"The current has settled at about 28 mA. Once the current stops changing, the coil does nothing at all: it's just a coil of wire. The coil's voltage has dropped to almost 0 V."):"Switch open. Close it and watch the current rise on the scope. Then open it and look at the coil voltage."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"}],
 scope:function(s){return {panels:coilPanels(s)};},win:0.008,
 text:`<p>An <b>inductor</b> is a coil of wire. Current flowing through it builds a magnetic field, and building or collapsing that field takes energy and time.</p>
<p>The result: <b>an inductor resists changes in current.</b> Think of a heavy flywheel. It's hard to get spinning and hard to stop, but easy to keep turning steadily.</p>
<ul><li><b>Switch on:</b> the coil pushes back, so the current rises gradually instead of jumping.</li><li><b>Steady current:</b> the coil acts like plain wire.</li><li><b>Switch off:</b> the coil tries to keep the current going. More on that in step 3, because it's dramatic.</li></ul>
<div class="why"><span class="k">Compare with a capacitor</span>A capacitor resists changes in <b>voltage</b>: its current is biggest at the start. An inductor resists changes in <b>current</b>: its current is smallest at the start. They're mirror images.</div>
<p class="hint">Real coils react in thousandths of a second, so this simulation runs 1000× slower than real life. The scope's time axis shows real time.</p>`},

{title:"The time constant: L ÷ R",part:"Part 1 · Coils",init:{sw:false,i:0,vl:0,L:0.1,R:100,win:0.008},sim:coilSim,timeScale:0.001,
 onChange:function(s){s.sw=false;s.i=0;hclear(s);s.win=clamp(6*s.L/(s.R+10),0.004,0.04);},
 diag:function(s){var tau=s.L/(s.R+10);return {svg:coilDiag(s),meters:[["τ = L ÷ R",fT(tau),true],["Final current",fI(3.1/(s.R+10)),true],["Coil current",fI(s.i),s.i>1e-4]],now:"A bigger coil (L) or a smaller resistance (R) means a slower rise. After 1 τ the current reaches 63% of its final value, and after 5 τ it's basically there: the same rule as the capacitor."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"},{k:"R",type:"seg",label:"R",opts:[[47,"47 Ω"],[100,"100 Ω"],[220,"220 Ω"]]},{k:"L",type:"seg",label:"L",opts:[[0.1,"100 mH"],[0.47,"470 mH"]]}],
 scope:function(s){return {panels:coilPanels(s,70),win:s.win||0.008};},
 text:`<p>Inductance is measured in <b>henries (H)</b>. 100 mH is 0.1 H.</p>
<div class="formula">τ = L ÷ R &nbsp;&nbsp; 0.1 H ÷ 110 Ω ≈ 0.9 ms</div>
<p>(110 Ω = the 100 Ω resistor plus about 10 Ω of wire in the coil itself.)</p>
<p>Notice the difference from RC: for a capacitor, a <b>bigger</b> R makes it slower. For an inductor, a bigger R makes it <b>faster</b>, because the final current is smaller, so there's less to build up.</p>
<div class="why"><span class="k">Where inductors appear</span>Relay and solenoid coils, motors, speakers, transformers, the filters in power supplies, and the boost converters that make 5 V from a single 1.5 V cell. They all store energy in a magnetic field.</div>`},

{title:"Switching off: the kick",part:"Part 2 · The kick",init:{sw:false,i:0,vp:0,led:true},sim:kickSim,timeScale:0.001,
 diag:function(s){var flash=s.led&&!s.sw&&s.i>1e-4;return {svg:kickDiag(s),bad:!s.led&&s.spikeT!=null&&s.t-s.spikeT<0.0005,
   meters:[["Coil current",fI(s.i),s.i>1e-4],["Point P",s.vp<-20?"hundreds of volts below 0!":fV(s.vp),s.vp<-20?"warn":s.vp],["LED",flash?"flashing":"off",flash]],
   now:s.sw?"Switch closed: current flows down through the coil and builds up its magnetic field. The LED is backwards (P is positive), so it stays dark. Now open the switch.":(flash?"Switch opened, but the coil keeps the current flowing in the SAME direction. The only path left is up through the reversed LED and back into the top of the coil. Point P swings below 0 V and the LED flashes while the stored energy drains away.":(s.led?"The energy is used up. Close the switch to store some more.":"No LED: when the switch opens the coil still tries to keep the current going. With no path, the voltage across it shoots up to hundreds of volts, enough to make a spark jump across the switch contacts."))};},
 ctl:[{k:"sw",type:"tog",label:"Switch"},{k:"led",type:"tog",label:"LED across the coil"}],
 scope:function(s){return {panels:[{title:"Coil current",unit:"mA",min:0,max:50,ticks:[0,25,50],series:[{key:"i",name:"Coil current",c:1}]},{title:"Point P",unit:"V",min:-10,max:6,ticks:[-10,0,5],series:[{key:"v",name:"Point P",c:2}],refs:[{v:-9.5,label:"off the chart"}]}]};},win:0.008,
 text:`<p>Here's the surprising part. When you <b>open</b> the switch, the coil's current can't stop instantly, just as a flywheel can't. The coil makes <b>whatever voltage it takes</b> to keep the current flowing in the same direction for a moment.</p>
<ul><li><b>With the reversed LED:</b> the current has a path, up through the LED and back into the coil. P goes about 2 V below 0 and the LED flashes even though the battery is disconnected. The coil's stored energy powers it.</li><li><b>Without the LED:</b> there's no path at all. The voltage climbs until something gives: here a spark jumps across the opening switch contacts. That spike can be hundreds of volts from a 5 V battery.</li></ul>
<div class="why"><span class="k">The rule</span>V = L × (rate of change of current). Stop a current suddenly and the rate of change is enormous, so the voltage is too. This is how car ignition coils make sparks from a 12 V battery.</div>
<p class="hint">Why point the LED backwards? So it does nothing in normal running (P is positive) and only conducts when the kick makes P negative.</p>`},

{title:"Mistake: no flyback diode",part:"Mistake · Inductive kick",mist:true,init:{sw:false,i:0,vc:5,dio:false,dead:false},sim:relaySim,timeScale:0.002,
 diag:function(s){return {svg:relayDiag(s),bad:s.dead,
   meters:[["Coil current",fI(s.i),s.i>1e-4],["Collector",s.vc>20?"spike ≫ 50 V":fV(s.vc),s.vc>20?"warn":s.vc>4],["Transistor",s.dead?"destroyed (shorted)":"OK",s.dead?"warn":true]],
   now:s.dead?"The kick destroyed the transistor. When it switched off, the coil drove its collector to a huge voltage, far above the 40–60 V a small transistor can survive, and it broke down. Small transistors often fail short-circuited, so now the coil is stuck on whatever the switch does. Fit the diode and press Replace.":s.sw?"Switch on: base current turns the transistor on, current builds up in the relay coil and the relay clicks on."+(s.dio?" The diode is reverse-biased, so it does nothing.":" Now switch off and watch."):(s.dio&&s.idio>1e-4?"Switched off: the coil's current now loops round through the diode and back into the coil, fading away harmlessly. The collector only rises to about 5.7 V (5 V + the diode's 0.7 V).":"Off and idle.")};},
 ctl:[{k:"sw",type:"tog",label:"Switch"},{k:"dio",type:"tog",label:"Flyback diode fitted"},{label:"Replace transistor",type:"act",run:function(s){s.dead=false;s.i=0;s.spikeT=null;}}],
 scope:function(s){return {panels:[{title:"Coil current",unit:"mA",min:0,max:100,ticks:[0,50,100],series:[{key:"i",name:"Coil current",c:1}]},{title:"Collector voltage",unit:"V",min:0,max:12,ticks:[0,5,12],series:[{key:"v",name:"Collector",c:2}],refs:[{v:11.5,label:"spike off the chart"}]}]};},win:0.012,
 text:`<p>Relays, motors and solenoids are coils. Driving one from a transistor is very common, and so is this mistake.</p>
<div class="why bad"><span class="k">What goes wrong</span>When the transistor switches off, the coil kicks exactly as in step 3. Now the place where the voltage spikes is the transistor's collector. A small transistor survives perhaps 40–60 V. The spike goes far higher and breaks it down. It may survive a few clicks and then fail, often stuck on.</div>
<div class="why fix"><span class="k">The fix: a flyback diode</span>Put a diode across the coil, pointing <b>towards the + rail</b> (stripe/bar at the + end). In normal running it's reverse-biased and does nothing. At switch-off it gives the coil's current a loop to circulate in, so the collector only rises to about 5.7 V.</div>
<p>Try it: switch on and off without the diode, then fit it, press <b>Replace transistor</b> and repeat.</p>
<p class="hint">The diode makes the relay release a little slower, because the current fades instead of stopping. That's harmless for almost every use.</p>`},
