{title:"Mistake: a coil straight across the battery",part:"Mistake · Short circuit",mist:true,init:{sw:false,i:0,res:false},sim:shortSim,timeScale:0.5,

   now:s.res?"With 100 Ω in series the current settles at about 50 mA. The coil slows the start, then the resistor sets the final current.":s.sw?(big?"The coil delayed the current for a fraction of a second, then stopped resisting. Once the current is steady, the coil is just about 1 Ω of copper wire across the battery: a short circuit. Several amps flow and everything heats up.":"At first the current rises slowly, which can fool you into thinking the coil limits it. Keep watching…"):"Close the switch."};},

 text:`<p>Because a coil slows the current at switch-on, it's tempting to think it limits the current. It doesn't.</p>
<div class="why bad"><span class="k">What goes wrong</span>An inductor only resists <b>changes</b>. Once the current is steady, a coil is just a length of copper with maybe 1 Ω of resistance. Connected straight across a battery, it becomes a short circuit after a moment: amps flow, the coil and battery heat up, and the battery drains. Solenoids and motors connected without any current limit can overheat this way.</div>
<div class="why fix"><span class="k">The fix</span>Something else has to set the steady current: a resistor, a coil designed for that voltage (relay coils are wound with enough wire resistance for their rated voltage), or a driver circuit. Check a coil's resistance with I = V ÷ R before connecting it.</div>`},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. What does an inductor do, in one sentence?</summary><p>It resists changes in current: slow to start, tries to keep going when stopped, and acts like plain wire for steady DC.</p></details>
<details class="reveal"><summary>2. Why is switching off a coil dangerous for a transistor?</summary><p>The coil makes whatever voltage it takes to keep its current flowing. With no path, that's a spike of hundreds of volts at the collector, which breaks the transistor down.</p></details>
<details class="reveal"><summary>3. How does a flyback diode fix it?</summary><p>It sits across the coil, reverse-biased normally. At switch-off it conducts, letting the current circulate through coil and diode and fade away. The collector only sees about 0.7 V above the supply.</p></details>
<details class="reveal"><summary>4. What's τ for an inductor, and how is it different from RC?</summary><p>τ = L ÷ R. A bigger R makes an inductor faster (smaller final current), but makes an RC circuit slower.</p></details>
<h3>Build it in VoltSim</h3>
<p>Relay driver: 5 V battery, switch, 1 kΩ base resistor, 10 kΩ pull-down, NPN transistor, an inductor (100 mH with about 50 Ω series resistance) as the relay coil, and a diode across the coil with its bar at the + rail end. Toggle the diode in and out and compare the collector voltage on the simulator's scope.</p>`}

  return o;
}
function ledCol(o,x,b){ /* + rail -> 330 -> LED -> down to device top at y=170 */

function idOf(vg,vth,k){return vg>vth?k*(vg-vth)*(vg-vth):0;}

/* ---------- BJT on its own (fixed or dialled base resistor), optional MOSFET swapped in ---------- */
function bjtCalc(s){

  if(a&&!c.mos)o+=F([60,200,90,200],"s",kb)+F([155,200,178,200],"s",kb);
  o=ledCol(o,220,c.b);
  o+=(c.mos?NMOS(202,200,"",a):NPN(202,200,false,"",c.Ic>1e-5))+GND(220,230,c.b,"b");
  o+=c.mos?T(186,190,"G","lbl")+T(232,176,"D","lbl","start")+T(232,232,"S","lbl","start"):T(186,190,"B","lbl")+T(232,176,"C","lbl","start")+T(232,232,"E","lbl","start");
  if(c.mos&&a)o+=TAG(150,186,"gate 5.0 V");

function bjtMeters(c,s){

  return [["Base current",fI(c.Ib),c.Ib>0],["Collector (LED) current",fI(c.Ic),c.b>0.05],["Mode",!s.sw?"OFF":c.sat?"fully ON (saturated)":"partly ON (active)",s.sw?(c.sat?true:"warn"):false],["Voltage C→E",fV(c.vce),!s.sw?false:c.vce<0.3]];

MODS.push({id:"mos",n:5,title:"MOSFET vs BJT",blurb:"Each transistor on its own, both states, then what happens when one is swapped in for the other. Design practice included.",mistakes:"MOSFET in a BJT circuit, BJT in a MOSFET circuit, floating gates, too little gate voltage, a MOSFET upside down.",

{title:"The BJT: a switch controlled by current",part:"Part 1 · The BJT on its own",init:{sw:false,rb:10000},
 diag:function(s){var d=bjtDiag(s),c=d.c;return {svg:d.svg,meters:bjtMeters(c,s),
   now:s.sw?"ON state. The switch feeds 0.43 mA through the 10 kΩ into the base: (5 − 0.7) ÷ 10 000. The transistor multiplies that by its gain (about 100), which could allow 43 mA, far more than the LED circuit can draw (8.8 mA). So it's fully on, or saturated: collector to emitter drops to about 0.1 V, like a closed switch.":"OFF state. The switch is open and the 10 kΩ pull-down holds the input at 0 V, so no current flows into the base. With no base current there's no collector current: collector to emitter acts like an open switch. The LED's loop is broken, so the LED is dark."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>Let's look at each transistor properly on its own before comparing them. First the <b>NPN BJT</b> (bipolar junction transistor), the one used in every module so far.</p>
<h3>Its one rule</h3>
<div class="formula">collector current = gain (β) × base current, until the load can't take any more</div>
<ul><li><b>OFF:</b> no base current gives no collector current.</li><li><b>Partly ON (“active”):</b> a little base current gives a proportional collector current. This is how BJTs amplify.</li><li><b>Fully ON (“saturated”):</b> so much base current that the collector current is limited by the load instead. The transistor acts like a closed switch with about 0.1–0.2 V across it.</li></ul>
<p>For switching we always want the two ends: fully off or fully on. Flip the switch and read both states.</p>
<div class="why"><span class="k">Base current really flows</span>The thin dashes into the base are real current: in through the base, out through the emitter, back to the battery. A BJT needs this current for the whole time it's on. It's controlled by <b>current</b>.</div>`},

{title:"Dial the base current, watch the LED follow",part:"Part 1 · The BJT on its own",init:{sw:true,rbv:0.75},
 diag:function(s){var d=bjtDiag(s),c=d.c;return {svg:d.svg,bad:s.sw&&!c.sat&&c.Ic>1e-4,meters:bjtMeters(c,s),
   now:!s.sw?"OFF: no base current, no LED current. The base resistor value doesn't matter when nothing flows.":c.sat?"Fully ON: "+fI(c.Ib)+" × 100 = "+fI(BETA*c.Ib)+" is more than the LED circuit can take, so the LED is at full brightness and the transistor is saturated (0.1 V across it). Making the resistor smaller now changes nothing except wasting base current.":"Partly ON: only "+fI(c.Ib)+" reaches the base, and × 100 = "+fI(c.Ic)+". The transistor limits the LED current. It has "+fV(c.vce)+" across it, so it's acting like a variable resistor, not a switch. Turn the dial towards smaller resistance."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"},{k:"rbv",type:"range",label:"Base resistor",min:0,max:1,step:0.01,fmt:function(v){return fR(RBlog(v));}}],
 text:`<p>The same circuit, but now you choose the base resistor, from 4.7 kΩ up to 2.2 MΩ. A bigger resistor means less base current.</p>
<p>Start at the high end and turn it down slowly. The LED gets brighter and brighter (that's the <b>active</b> region, where current is multiplied) until it stops getting brighter (that's <b>saturation</b>).</p>
<div class="formula">LED current ≈ 100 × (5 − 0.7) ÷ R<sub>base</sub> &nbsp;until it reaches 8.8 mA</div>
<p>Saturation happens when 100 × base current ≥ 8.8 mA, which needs a base current of 88 µA, so R<sub>base</sub> ≤ about 49 kΩ.</p>
<div class="why"><span class="k">Why this matters for switching</span>In the partly-on region the transistor has voltage across it <b>and</b> current through it, so it wastes power as heat. A good switch design gives the base enough current to saturate, usually with a 2× safety margin because real gain varies from part to part.</div>`},

{title:"The MOSFET: a switch controlled by voltage",part:"Part 2 · The MOSFET on its own",init:{sw:false,blip:null},sim:function(){},
 onChange:function(s,k){if(k==="sw")s.blip=s.t;},
 diag:function(s){var d=mosDiag(s);return {svg:d.svg,
   meters:[["Gate voltage",s.sw?"5.0 V":"0 V",s.sw],["Gate current",d.blip?"brief blip (charging the gate)":"0",s.sw],["LED current",fI(d.Id),d.Id>1e-4],["Voltage D→S",s.sw?"≈ 0.0 V":"≈ 3.2 V",s.sw]],
   now:s.sw?(d.blip?"Turning ON: a tiny pulse of current charges the gate, then stops.":"ON state. The gate sits at 5 V, but no current flows into it: the gate is insulated by a thin glass layer. The voltage alone turns the channel on, the LED current flows drain to source, and the MOSFET drops almost nothing."):(d.blip?"Turning OFF: the gate's charge drains out through the switch path and pull-down.":"OFF state. The pull-down holds the gate at 0 V. The channel is off and the LED's loop is broken.")};},
 ctl:[{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>Now the <b>N-channel MOSFET</b>, with the same LED and switch. Its legs are <b>Gate</b>, <b>Drain</b> and <b>Source</b> (G, D, S), in the same places as base, collector and emitter.</p>
<h3>Its one rule</h3>
<div class="formula">gate–source voltage above the threshold → channel conducts</div>
<p>The gate is a metal plate separated from the channel by a very thin layer of glass, so it's really a tiny capacitor. Putting voltage on it pulls charges into the channel and lets current flow from drain to source.</p>
<ul><li><b>OFF:</b> gate at 0 V, so no channel.</li><li><b>ON:</b> gate at 5 V (well above this part's 1.5 V threshold), so the channel is wide open, with only milliohms of resistance.</li></ul>
<p>Flip the switch both ways and watch the gate wire. A brief pulse flows only while the gate charges or discharges, then nothing. No base resistor is needed.</p>
<div class="why"><span class="k">Notice what's missing</span>There's no base resistor, and no steady control current. The MOSFET is controlled by <b>voltage</b>.</div>`},

{title:"Dial the gate voltage, find the threshold",part:"Part 2 · The MOSFET on its own",init:{f:0.3},
 diag:function(s){var d=dialDiag(s),full=d.Id>=ILED-1e-9;return {svg:d.svg,bad:d.Id>1e-4&&!full,
   meters:[["Gate voltage",fV(d.vg),d.vg>2],["Gate current","0, always",true],["LED current",fI(d.Id),d.Id>1e-4],["Mode",d.Id<1e-5?"OFF":full?"fully ON":"partly ON",d.Id<1e-5?false:full?true:"warn"]],
   now:d.vg<2?"Below the 2 V threshold: OFF. The gate has voltage on it, but not enough to form a channel.":!full?"Just above threshold: partly ON. A narrow channel limits the current to "+fI(d.Id)+". Like the BJT's active region, the MOSFET now has voltage across it and wastes power.":"Well above threshold: fully ON. The channel is wide open. Turning the gate voltage up further changes nothing."};},
 ctl:[{k:"f",type:"range",label:"Gate voltage",min:0,max:1,step:0.01,fmt:function(v){return fV(5*v);}}],
 text:`<p>A pot now sets the gate voltage from 0 to 5 V. Slide it up slowly.</p>
<ul><li><b>Below about 2 V:</b> nothing. This part's <b>threshold voltage</b> is 2 V.</li><li><b>2–3 V:</b> the LED fades in. The MOSFET is partly on.</li><li><b>Above about 3 V:</b> fully on.</li></ul>
<div class="why"><span class="k">Compare the two dials</span>The BJT was controlled by how much <b>current</b> you let into the base (set by a resistor). The MOSFET is controlled by what <b>voltage</b> you put on the gate. A resistor in series with the gate wouldn't change anything once the gate is charged, because no current flows through it. Keep that in mind for the swap labs coming up.</div>
<p class="hint">Datasheets give a threshold range (for example 1–2.5 V), and a voltage at which the MOSFET is fully on, written as “R<sub>DS(on)</sub> at V<sub>GS</sub> = …”. The second number is the one that matters for switching.</p>`},

 text:`<p><b>The job:</b> a microcontroller pin (5 V, maximum 20 mA) must switch a <b>100 mA</b> load using an NPN transistor whose gain is <b>at least 50</b> (the datasheet minimum, not the typical 100). Pick the base resistor.</p>
<p>Work it out first, then test your answer with the buttons:</p>
<ol><li>Base current needed = load ÷ minimum gain = 100 mA ÷ 50 = <b>2 mA</b>.</li><li>Add a 2× safety margin: aim for about <b>4 mA</b>.</li><li>R = (5 V − 0.75 V) ÷ 4 mA ≈ <b>1.06 kΩ</b>, so choose the nearest standard value at or below it.</li><li>Check: is that base current under the pin's 20 mA limit?</li></ol>
<p>Then try the wrong answers to see how each one fails: too big leaves the transistor partly on and hot, and too small overloads the pin.</p>
<div class="why"><span class="k">Why use the minimum gain?</span>Gain varies a lot between parts, even in the same bag, and drops at high current and low temperature. Designing for the minimum means every part will work.</div>`},

{title:"Practice: switching from a 3.3 V pin",part:"Practice 2 · MOSFET design",init:{sw:true,pick:"A"},

 text:`<p><b>The job:</b> a 3.3 V microcontroller must switch a <b>5 V, 1 A lamp</b>. The lamp has its own 5 V battery, and the 3.3 V logic battery shares the 0 V rail with it. That shared ground matters: the gate voltage is measured from the source, which sits on the 0 V rail.</p>
<p>Which part would you choose?</p>
<ul><li><b>A:</b> standard MOSFET, threshold 2–4 V, R<sub>DS(on)</sub> specified at V<sub>GS</sub> = 10 V</li><li><b>B:</b> logic-level MOSFET, R<sub>DS(on)</sub> specified at V<sub>GS</sub> = 4.5 V</li><li><b>C:</b> MOSFET with R<sub>DS(on)</sub> specified at V<sub>GS</sub> = 2.5 V</li><li><b>D:</b> NPN BJT with a 1 kΩ base resistor</li></ul>
<p>Decide, then check each one with the pin switched on.</p>
<div class="why"><span class="k">The rule</span>A MOSFET is only guaranteed fully on at the gate voltage its datasheet specifies R<sub>DS(on)</sub> at. That voltage must be <b>at or below</b> your drive voltage. 3.3 V needs a part specified at 2.5 V (or 2.7 V or 3.3 V). “Logic-level” on its own usually means 4.5–5 V.</div>`},

{title:"Swap lab: a MOSFET in a BJT circuit",part:"Mistake · MOSFET used instead of BJT",mist:true,init:{sw:true,rbv:0.85,dev:"mos"},
 diag:function(s){var d=bjtDiag(s),c=d.c;return {svg:d.svg,bad:c.mos&&s.sw,meters:bjtMeters(c,s).concat([["Fitted",c.mos?"MOSFET (wrong part)":"NPN BJT (designed for)",c.mos?"warn":true]]),
   now:!s.sw?(c.mos?"OFF state: this still works. The gate discharges back through the base resistor and the pull-down, so the MOSFET turns off normally. The fault only shows when it's on.":"OFF: no base current, LED off."):c.mos?"ON state: the dimmer is broken. The circuit was designed to set the LED's brightness by limiting base CURRENT with the resistor. A MOSFET draws no gate current, so there's no voltage drop across the resistor and the gate sees the full 5 V. The LED is fully on whatever the dial says.":"With the BJT, the resistor sets the base current, which sets the brightness: "+fI(c.Ic)+" right now. Turn the dial and it follows."};},
 ctl:[{k:"dev",type:"seg",label:"Fitted",opts:[["bjt","NPN BJT ✓"],["mos","MOSFET ✗",1]]},{k:"sw",type:"tog",label:"Switch"},{k:"rbv",type:"range",label:"Base resistor",min:0,max:1,step:0.01,fmt:function(v){return fR(RBlog(v));}}],
 text:`<p>This is the dimmer from step 2. It was designed for a BJT: a large base resistor limits the <b>current</b>, and the BJT multiplies it into a set LED brightness.</p>
<p>Someone swaps in a MOSFET because “MOSFETs are better”. Try both states, and turn the dial with each part fitted.</p>
<div class="why bad"><span class="k">What goes wrong</span><ul><li><b>OFF state:</b> fine. The gate drains through the resistor and pull-down.</li><li><b>ON state:</b> the brightness control is dead. A resistor only drops voltage when current flows through it (V = I × R). The gate draws no current, so it sits at the full 5 V and the MOSFET is simply fully on. Any circuit that relies on a resistor setting the <b>base current</b>, such as dimmers, current sources, amplifier bias and the RC delay timer, stops working with a MOSFET.</li></ul></div>
<div class="why fix"><span class="k">The fix</span>Either keep the BJT, or redesign for voltage control: put the MOSFET's gate on a <b>voltage</b> (a pot or divider, as in step 4), not behind a current-limiting resistor.</div>`},

{title:"Swap lab: a BJT in a MOSFET circuit",part:"Mistake · BJT used instead of MOSFET",mist:true,init:{sw:false,dev:"bjt",gr:false,dead:false},
 onChange:function(s,k){if(s.sw&&s.dev==="bjt"&&!s.gr)s.dead=true;if(k==="dev"&&s.dev==="mos")s.dead=false;},
 diag:function(s){var d=swapBDiag(s),c=d.c;return {svg:d.svg,bad:(c.bjt&&s.sw)||s.dead,
   meters:[["Fitted",c.bjt?"NPN BJT (wrong part)":"logic-level MOSFET ✓",c.bjt?"warn":true],["Control current",c.bjt?(s.dead?"0 (burnt open)":s.sw?(s.gr?fI(c.Ib):"amps!"):"0"):"0",c.bjt&&s.sw?"warn":true],["Lamp current",fI(c.I),c.I>0.9],["Heat in transistor",fx(c.P,2)+" W",c.P>0.3?"warn":true]],
   now:s.dead?"Destroyed. The MOSFET circuit drives the gate straight from the switch, which is fine for an insulated gate. But a BJT's base-emitter is a diode: 5 V straight across it pushes amps through and burns it out in milliseconds. Now the lamp never lights. Add the 1 kΩ, swap parts, or press Replace.":!s.sw?(c.bjt?"OFF state: looks perfectly fine. No current anywhere, nothing to give the mistake away. Switch on…":"OFF: the pull-down holds the gate at 0 V, MOSFET off, lamp off."):c.bjt?(s.gr?"With a 1 kΩ in the gate line, the BJT survives: base current "+fI(c.Ib)+" × 50 = "+fI(c.I)+". But the lamp needs 1 A. The BJT is partly on with "+fV(c.vsw)+" across it, so the lamp is dim and the transistor is burning "+fx(c.P,2)+" W.":""):"ON: the MOSFET is fully on with 5 V on its gate. About 1 A to the lamp, only 0.05 V across the MOSFET, no gate current."};},
 ctl:[{k:"dev",type:"seg",label:"Fitted",opts:[["mos","MOSFET ✓"],["bjt","NPN BJT ✗",1]]},{k:"gr",type:"tog",label:"1 kΩ in gate line"},{k:"sw",type:"tog",label:"Switch"},{label:"Replace transistor",type:"act",run:function(s){s.dead=false;s.sw=false;}}],
 text:`<p>Now the opposite. This lamp circuit was designed for a <b>logic-level MOSFET</b>: the gate goes straight to the switch (no resistor needed), with a pull-down.</p>
<p>Someone fits an NPN BJT because it was in the parts drawer and “has the same three legs”. Leave the 1 kΩ off, switch off first, then on.</p>
<div class="why bad"><span class="k">What goes wrong</span><ul><li><b>OFF state:</b> everything looks normal. That's why this mistake survives until power-up.</li><li><b>ON state, no gate resistor:</b> the base-emitter junction gets 5 V with nothing to limit the current. It's destroyed.</li><li><b>ON state, with a 1 kΩ:</b> the BJT survives but only gets about 4 mA of base current. × 50 ≈ 0.2 A, nowhere near the lamp's 1 A, so the lamp is dim and the BJT runs hot.</li></ul></div>
<div class="why fix"><span class="k">The fix</span>Use the part the circuit was designed for. If you must use a BJT, redesign the drive: base current ≥ 2 × load ÷ minimum gain (here about 40 mA, more than a logic pin can give), which is exactly why big loads use MOSFETs.</div>`},

{title:"Mistake: the floating gate",part:"Mistake · Floating gate",mist:true,init:{sw:false,pd:false,touch:false,vg:0},sim:gateSim,

   now:s.sw?"Switch closed: the gate is charged to 5 V, MOSFET on.":s.pd?"Switch open: the pull-down drains the gate in microseconds, so the MOSFET is off. Reliable in both states.":(s.touch?"Your finger is a noisy, high-resistance connection. The gate voltage wanders and the LED flickers at random.":(s.vg>2?"Switch opened, but the LED stays ON. Nothing drains the gate, so it holds its charge like a tiny capacitor. It will stay on for minutes or switch randomly. Try touching the gate.":"Close the switch, then open it."))};},
 ctl:[{k:"sw",type:"tog",label:"Switch"},{k:"pd",type:"tog",label:"Pull-down fitted"},{k:"touch",type:"hold",label:"Hold: touch the gate"}],
 scope:function(s){return {panels:[{title:"Gate voltage",unit:"V",min:0,max:5,ticks:[0,2,5],series:[{key:"vg",name:"Gate voltage",c:1}],refs:[{v:2,label:"threshold ≈ 2 V"}]}]};},win:4,
 text:`<p>The insulated gate has a catch: because its charge has nowhere to go, <b>it remembers</b>.</p>
<div class="why bad"><span class="k">What goes wrong</span>Without a pull-down, opening the switch leaves the gate charged, so the MOSFET stays ON in what should be the OFF state. An uncharged gate left floating picks up noise and switches at random. A static zap from a finger can even puncture the gate.</div>
<div class="why fix"><span class="k">The fix</span>Always fit a gate pull-down (10–100 kΩ, gate to source). A BJT is more forgiving here, because its base-emitter junction drains itself.</div>`},

   now:!s.sw?"OFF state: all four options are identical. No control signal, no lamp current, no heat. Switch on to see the differences.":s.dev==="bjt10k"?"BJT, 10 kΩ: 0.43 mA × 50 ≈ 21 mA. The lamp needs 1 A, so it stays dark.":s.dev==="bjt220"?"BJT, 220 Ω: 19 mA of base current saturates it and the lamp is bright. But 19 mA is a lot to ask from a control pin.":s.dev==="mstd"?"Standard MOSFET at 5 V: only partly on. The lamp is dim, 1.6 V sits across the MOSFET and it burns over 1 W.":"Logic-level MOSFET: fully on, about 1 A, 0.05 V across it, about 0.05 W, and no control current. The clear winner for big loads."};},

 text:`<p>The same 5 V, 1 A lamp with each option. Compare the OFF state (identical every time) with the ON state.</p>
<div class="why"><span class="k">Heat = voltage across × current through</span>Fully on: almost no voltage across, so little heat. Fully off: no current, so no heat. Partly on: both, so the most heat. That's why the half-on options get hot.</div>`},

{title:"Mistake: MOSFET in upside down",part:"Mistake · Pinout",mist:true,init:{sw:false,flip:true},
 diag:function(s){return {svg:flipDiag(s),bad:s.flip,

   now:s.flip?(s.sw?"ON state: the LED is on, so it looks fine…":"OFF state: the LED is STILL on. Drain and source are swapped, so the body diode inside the MOSFET points from the LED down to the − rail and conducts whatever the gate does."):(s.sw?"Correct way round, ON: the channel conducts.":"Correct way round, OFF: the body diode is reverse-biased and the LED is off.")};},
 ctl:[{k:"flip",type:"tog",label:"Drain and source swapped",bad:1},{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>Every power MOSFET contains a <b>body diode</b> from source to drain.</p>
<div class="why bad"><span class="k">What goes wrong</span>Fit it upside down and the body diode conducts permanently. You only notice in the <b>OFF</b> state, which is why testing both states matters.</div>
<div class="why fix"><span class="k">The fix</span>N-channel low-side switch: source to the − rail, drain to the load. Check the datasheet pinout. For example, the IRLZ44N in TO-220 is Gate–Drain–Source left to right, label facing you.</div>`},

{title:"When to use which",part:"Part 4 · Choosing",
 text:`<table class="cmp"><tr><th>Situation</th><th>Better choice</th><th>Why</th></tr>
<tr><td>LED or small relay from a logic pin</td><td>Either. A BJT is cheap and forgiving</td><td>Small currents. A BJT with a base resistor is simple and static-proof.</td></tr>
<tr><td>Switching amps (motors, lamps, LED strips)</td><td>Logic-level MOSFET</td><td>Tiny voltage drop, so little heat, and zero steady control current.</td></tr>
<tr><td>3.3 V control signal</td><td>MOSFET specified at V<sub>GS</sub> ≤ 2.5–3.3 V</td><td>Standard and 4.5 V logic-level parts may only be partly on.</td></tr>
<tr><td>Brightness or current set by a resistor, amplifiers, RC timers</td><td>BJT</td><td>These rely on current control. A MOSFET ignores a series resistor.</td></tr>
<tr><td>Battery-powered, always on</td><td>MOSFET</td><td>No base current wasted.</td></tr></table>
<div class="why"><span class="k">Checklist for any transistor switch</span><ul><li>BJT: base resistor? Base current ≥ 2 × load ÷ minimum gain? Within the pin's limit?</li><li>MOSFET: gate pull-down? R<sub>DS(on)</sub> specified at or below your drive voltage? Drain and source the right way round?</li><li>Swapping one for the other? Redesign the drive. They aren't drop-in replacements.</li><li>Coil load? Add a flyback diode (Inductors module).</li><li>Test <b>both states</b>. Several faults only show when it's off.</li></ul></div>`},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. Describe a BJT in its OFF, partly-ON and fully-ON states.</summary><p>OFF: no base current, no collector current. Partly ON: collector current = gain × base current, with voltage across the transistor, so it gets hot. Fully ON (saturated): the base current is more than enough, the load limits the current, and there's about 0.1–0.2 V across it.</p></details>
<details class="reveal"><summary>2. Describe a MOSFET in the same three states.</summary><p>OFF: gate below threshold. Partly ON: gate just above threshold, so a narrow channel, current-limited and hot. Fully ON: gate at or above the voltage where R<sub>DS(on)</sub> is specified, almost no voltage across it.</p></details>
<details class="reveal"><summary>3. What happens if you drop a MOSFET into a BJT circuit?</summary><p>Anything that relied on a resistor setting the base current stops working. With no gate current, the resistor drops nothing, so the MOSFET is simply fully on or off.</p></details>
<details class="reveal"><summary>4. What happens if you drop a BJT into a MOSFET circuit?</summary><p>If the gate was driven directly, the base gets unlimited current and the BJT dies. With a resistor, it usually can't get enough base current for a big load, so it's partly on: a dim load and a hot transistor.</p></details>
<details class="reveal"><summary>5. Work it out: base resistor for a 300 mA load, minimum gain 60, 5 V drive.</summary><p>300 ÷ 60 = 5 mA, × 2 margin = 10 mA. R = (5 − 0.75) ÷ 0.01 ≈ 425 Ω, so use 390 Ω. That's 11 mA, more than many pins can give, so a logic-level MOSFET is the better choice.</p></details>
<h3>Build it in VoltSim</h3>
<p>Build steps 1 and 3 side by side. Then try both swap labs: put a MOSFET where the BJT was in the dimmer, and a BJT (no base resistor) where the MOSFET was. Check both switch states each time.</p>`}

(function(){
var ILED=8.8e-3,BETA=100;
function inputAt(o,x,a,k){k=k==null?1:k;o+=W([x,100,x,200],a)+W([x,200,x,215],a);if(a)o+=F([x,100,x,215],"s",k);
  return o+FLAG(x,55,a?k:0)+SW(x,55,x,100,a,"switch",-1)+R(x,215,x,260,"10 kΩ",-1)+GND(x,260,a?k:0)+D(x,200,a);}
function lbl3(x,y,top,bot,base){return T(x-16,y-10,base,"lbl")+T(x+30,y-24,top,"lbl","start")+T(x+30,y+30,bot,"lbl","start");}

/* ---------- low-side socket (designed for NPN). dev: "npn" | "pnp" ---------- */
function lowCalc(s){
  var pnp=s.dev==="pnp",Ic=0,Ib=0,mode;
  if(!pnp){if(s.sw){Ib=(5-0.7)/10000;Ic=Math.min(BETA*Ib,ILED);}mode=s.sw?"ON":"OFF";}
  else{ /* PNP in an NPN socket: emitter at the bottom. Only the collector-base diode can conduct, when the base is pulled low */
    if(!s.sw){Ic=Math.max(0,(5-1.9-0.65)/20330);}mode=Ic>0?"faint (backwards)":"OFF";}
  return {pnp:pnp,Ic:Ic,Ib:Ib,b:ledB(Ic),mode:mode};
}
function lowDiag(s){

  o+=W([60,200,90,200],a)+R(90,200,155,200,"10 kΩ")+W([155,200,178,200],a?(c.pnp?true:0.7):(c.Ic>0?0.65:false));
  if(!c.pnp&&a)o+=F([60,200,90,200])+F([155,200,178,200]);
  if(c.pnp&&!a&&c.Ic>0)o+=F([178,200,155,200],"s",0.6)+F([90,200,60,200,60,215],"s",0.6);
  o+=W([220,90,220,98],true)+W([220,138,220,170],c.Ic>1e-3?"lo":"mid");
  if(c.Ic>1e-6)o+=F([220,90,220,98],c.pnp?"s":"b",c.pnp?0.6:c.b)+F([220,138,220,170],c.pnp?"s":"b",c.pnp?0.6:c.b);
  o+=FLAG(220,48,c.pnp?0:c.b,"b")+R(220,48,220,90,"330 Ω")+LED(220,118,c.b);
  o+=BJT(202,200,{pnp:c.pnp,eTop:false,state:c.pnp?(c.Ic>0?"faint":false):c.Ic>1e-5})+GND(220,230,c.pnp?0:c.b,"b");
  o+=c.pnp?lbl3(202,200,"C","E (arrow in)","B"):lbl3(202,200,"C","E (arrow out)","B");

/* ---------- high-side socket (designed for PNP). dev: "pnp" | "npn" ---------- */
function highCalc(s){
  var npn=s.dev==="npn",Ic=0,Ib=0,mode;
  if(!npn){if(s.sw){Ib=(4.35/10000)-(0.65/10000);Ic=Math.min(BETA*Ib,ILED);}mode=s.sw?"ON":"OFF";}
  else{ /* NPN in a PNP socket: emitter at the top. Only the base-collector diode can conduct, when the base is pulled high */
    if(!s.sw)Ic=Math.max(0,(5-0.65-1.9)/10330);mode=Ic>0?"faint (backwards)":"OFF";}
  return {npn:npn,Ic:Ic,Ib:Ib,b:ledB(Ic),mode:mode};

function highDiag(s){

MODS.push({id:"pnp",n:6,title:"NPN vs PNP",blurb:"Mirror-image transistors: NPN switches the low side, PNP the high side. Why both exist, and what happens when one is fitted in the other's place.",mistakes:"PNP in an NPN socket, NPN in a PNP socket, an NPN on the high side, a PNP that won't turn off.",
steps:[
{title:"NPN: the low-side switch",part:"Part 1 · The two types",init:{sw:false,dev:"npn"},
 diag:function(s){var d=lowDiag(s),c=d.c;return {svg:d.svg,
   meters:[["Base",s.sw?"pulled HIGH (0.7 V above emitter)":"0 V",s.sw],["Base current",fI(c.Ib)+(s.sw?" flowing IN":""),s.sw],["LED",s.sw?"ON":"off",s.sw]],
   now:s.sw?"ON state. The switch pulls the base HIGH. Current flows INTO the base and out of the emitter to the 0 V rail, and the transistor connects the LED's bottom end to ground. Loop: + rail → 330 Ω → LED → collector → emitter → 0 V rail.":"OFF state. The pull-down holds the base at 0 V, the same as the emitter. No base current, so the LED's path to ground is broken."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>You know this one well. An <b>NPN</b> transistor with its <b>emitter on the 0 V rail</b>. The load (LED) sits between the + rail and the collector.</p>
<ul><li>It switches the <b>low side</b> of the load: the connection to ground.</li><li>It turns <b>on when the base is pulled HIGH</b>, about 0.7 V above the emitter.</li><li>Base current flows <b>into</b> the base.</li><li>The emitter arrow points <b>out</b> (“NPN: Not Pointing iN”).</li></ul>
<div class="why"><span class="k">The real rule</span>A transistor doesn't care about “high” or “low” on their own. It cares about the voltage <b>between base and emitter</b>. With the emitter on 0 V, “base 0.7 V above the emitter” means “base high”.</div>`},

{title:"PNP: the high-side switch",part:"Part 1 · The two types",init:{sw:false,dev:"pnp"},
 diag:function(s){var d=highDiag(s),c=d.c;return {svg:d.svg,
   meters:[["Base",s.sw?"pulled LOW (0.65 V below emitter)":"held at 5 V by pull-up",s.sw],["Base current",s.sw?fI(c.Ib)+" flowing OUT":"0",s.sw],["LED",s.sw?"ON":"off",s.sw]],
   now:s.sw?"ON state. Closing the switch pulls the base DOWN through the 10 kΩ. The base sits 0.65 V below the emitter (at 4.35 V), and current flows OUT of the base, through the 10 kΩ and switch to the 0 V rail. The transistor connects the LED's top end to the + rail. Loop: + rail → emitter → collector → 330 Ω → LED → 0 V rail.":"OFF state. The pull-up holds the base at 5 V, the same as the emitter. No base current, so the LED's path to the + rail is broken."};},
 ctl:[{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>The <b>PNP</b> is the NPN's mirror image. Everything flips:</p>
<table class="cmp"><tr><th></th><th>NPN</th><th>PNP</th></tr>
<tr><td>Emitter goes to</td><td>0 V rail</td><td><b>+ rail</b></td></tr>
<tr><td>Load sits</td><td>above it (between + and collector)</td><td><b>below it</b> (between collector and 0 V)</td></tr>
<tr><td>Switches the…</td><td>low side</td><td><b>high side</b></td></tr>
<tr><td>Turns ON when the base is…</td><td>0.7 V <b>above</b> the emitter (high)</td><td>0.7 V <b>below</b> the emitter (low)</td></tr>
<tr><td>Base current flows</td><td>in</td><td><b>out</b></td></tr>
<tr><td>Arrow on the emitter</td><td>points out</td><td>points <b>in</b> (“PNP: Pointing iN Proudly”)</td></tr>
<tr><td>Keeps it OFF</td><td>pull-down (base to 0 V)</td><td><b>pull-up</b> (base to + rail)</td></tr></table>
<p>Flip the switch both ways. Notice the logic is <b>reversed</b>: connecting the base to 0 V turns the PNP <b>on</b>.</p>`},

{title:"Why have both?",part:"Part 1 · The two types",
 text:`<p>If an NPN can switch an LED, why does the PNP exist? Because sometimes the <b>ground side of the load must stay connected</b>, so you have to switch its + side.</p>
<h3>When you need the high side (PNP)</h3>
<ul><li><b>Switching power to a whole sub-circuit</b> (a sensor board, a radio module). Its ground is shared with everything else and must never be broken, or signals between boards go haywire.</li><li><b>Loads already wired to ground</b>, like a car's lights, which are bolted to the chassis (0 V).</li><li><b>Safety</b>: with the + side switched off, the load isn't live while it's off.</li></ul>
<h3>Why NPN is usually preferred otherwise</h3>
<ul><li>Higher gain and faster, for the same size and price, because the charge carriers in an NPN (electrons) move more easily than in a PNP.</li><li>Easy to drive: the base is pulled up from a logic pin that shares the same 0 V.</li></ul>
<h3>Using both together</h3>
<ul><li><b>Push-pull outputs</b>: an NPN pulls up and a PNP pulls down (or the reverse). That's how audio amplifiers and motor drivers push current both ways.</li><li><b>High-side switching at a higher voltage</b>: a small NPN drives the PNP's base. Step 8 shows why that's needed.</li></ul>
<div class="why"><span class="k">The MOSFET versions</span>The same split exists for MOSFETs: N-channel for the low side, P-channel for the high side, with the same mirrored rules. Everything in this module applies to them too.</div>`},

{title:"One dial, both transistors",part:"Part 2 · Both states",init:{f:0.5},
 diag:function(s){var d=dialDiag(s);var non=d.In>1e-5,pon=d.Ip>1e-5;return {svg:d.svg,
   meters:[["Base voltage",fV(d.vb),true],["NPN (emitter at 0 V)",non?(d.In>=ILED-1e-9?"fully ON":"partly ON"):"OFF",non],["PNP (emitter at 5 V)",pon?(d.Ip>=ILED-1e-9?"fully ON":"partly ON"):"OFF",pon]],
   now:d.vb<0.65?"Bases near 0 V: the NPN's base isn't above its emitter (0 V), so it's OFF. The PNP's base is far below its emitter (5 V), so it's fully ON.":d.vb>4.35?"Bases near 5 V: the NPN's base is well above its emitter, so it's fully ON. The PNP's base is level with its emitter, so it's OFF.":"In the middle, both are on, because each one's base is at least 0.65 V from its own emitter in the right direction. Real logic signals don't sit here for long. They're near 0 V or near 5 V."};},
 ctl:[{k:"f",type:"range",label:"Base voltage",min:0,max:1,step:0.01,fmt:function(v){return fV(5*v);}}],
 text:`<p>One pot drives <b>both</b> bases, each through its own 10 kΩ. Sweep it from 0 V to 5 V and watch the two LEDs.</p>
<ul><li><b>0 V:</b> NPN off, PNP on</li><li><b>5 V:</b> NPN on, PNP off</li><li><b>In between:</b> both on, as long as each base is at least 0.65 V from its own emitter in the right direction</li></ul>
<div class="formula">NPN on: V<sub>base</sub> ≥ V<sub>emitter</sub> + 0.65 &nbsp;&nbsp; PNP on: V<sub>base</sub> ≤ V<sub>emitter</sub> − 0.65</div>
<p>That one pair of rules lets you predict any BJT's state: look at its emitter first, then at its base.</p>
<div class="why"><span class="k">Why “high” and “low” can mislead</span>Each transistor's reference point is its own emitter. A PNP with its emitter at 12 V is ON with its base at 5 V, even though 5 V is a logic “high”. That catch is coming up in step 8.</div>`},

{title:"Mistake: a PNP in an NPN circuit",part:"Mistake · Wrong type (low side)",mist:true,init:{sw:false,dev:"pnp"},
 diag:function(s){var d=lowDiag(s),c=d.c;return {svg:d.svg,bad:c.pnp,
   meters:[["Fitted",c.pnp?"PNP (wrong type)":"NPN ✓",c.pnp?"warn":true],["LED with switch ON",c.pnp?"off":"ON",c.pnp?"warn":true],["LED with switch OFF",c.pnp?"faint glow":"off",c.pnp?"warn":true],["Right now",c.mode,c.Ic>0]],
   now:c.pnp?(s.sw?"Switch ON, LED off. The PNP's emitter is on 0 V, and the base is pulled up to 5 V, so the base is ABOVE the emitter, which is exactly the wrong direction for a PNP. Nothing conducts.":"Switch OFF, and the LED glows faintly. The base is pulled to 0 V through the 10 kΩ and the pull-down. The PNP's collector-base junction is a diode, and it's now forward-biased: + rail → LED → collector → base → 10 kΩ → pull-down → 0 V. About "+fI(c.Ic)+". So the output is backwards and weak: the transistor is being used upside down."):(s.sw?"NPN fitted, switch ON: LED on.":"NPN fitted, switch OFF: LED off.")};},
 ctl:[{k:"dev",type:"seg",label:"Fitted",opts:[["npn","NPN ✓"],["pnp","PNP ✗",1]]},{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>NPN and PNP transistors often come in identical packages (a BC547 and a BC557 look the same), and in a simulator the symbols differ only by the direction of one arrow. Fitting the wrong one is very common.</p>
<p>This is the NPN low-side circuit from step 1 with a <b>PNP</b> fitted instead. Check <b>both</b> switch states.</p>
<div class="why bad"><span class="k">What goes wrong</span><ul><li><b>Switch ON:</b> the base goes above the emitter. A PNP needs the opposite, so it's off and the LED stays dark.</li><li><b>Switch OFF:</b> the LED glows faintly. The collector-base junction of any BJT is a diode. Here it's forward-biased, so a small current sneaks through the LED, the collector, the base and the pull-down.</li></ul>The result is backwards and dim. It looks like a bad connection rather than the wrong part, which is what makes it confusing.</div>
<div class="why fix"><span class="k">The fix</span>Read the part number and check the symbol's arrow: <b>out</b> for NPN, <b>in</b> for PNP. On a breadboard, BC54x parts are NPN and BC55x parts are PNP. 2N2222/2N3904 are NPN, 2N2907/2N3906 are PNP.</div>`},

{title:"Mistake: an NPN in a PNP circuit",part:"Mistake · Wrong type (high side)",mist:true,init:{sw:false,dev:"npn"},
 diag:function(s){var d=highDiag(s),c=d.c;return {svg:d.svg,bad:c.npn,
   meters:[["Fitted",c.npn?"NPN (wrong type)":"PNP ✓",c.npn?"warn":true],["LED with switch ON",c.npn?"off":"ON",c.npn?"warn":true],["LED with switch OFF",c.npn?"faint glow":"off",c.npn?"warn":true],["Right now",c.mode,c.Ic>0]],
   now:c.npn?(s.sw?"Switch ON, LED off. Pulling the base down to about 2.5 V puts it far BELOW the NPN's emitter (5 V). An NPN needs its base above its emitter, so it's off.":"Switch OFF, and the LED glows faintly. The pull-up lifts the base to the + rail, which forward-biases the NPN's base-collector diode: + rail → pull-up 10 kΩ → base → collector → 330 Ω → LED → 0 V. About "+fI(c.Ic)+". Again: backwards and weak."):(s.sw?"PNP fitted, switch ON: LED on.":"PNP fitted, switch OFF: LED off.")};},
 ctl:[{k:"dev",type:"seg",label:"Fitted",opts:[["pnp","PNP ✓"],["npn","NPN ✗",1]]},{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>The mirror-image mistake: the PNP high-side circuit from step 2 with an <b>NPN</b> fitted. Again, test both states.</p>
<div class="why bad"><span class="k">What goes wrong</span><ul><li><b>Switch ON:</b> the base is pulled below the emitter. That's the PNP's “on” condition, but it's the NPN's “off”.</li><li><b>Switch OFF:</b> the pull-up drives current through the NPN's base-collector diode and the LED glows faintly.</li></ul></div>
<div class="why fix"><span class="k">How to spot it fast</span>If a transistor switch works <b>backwards and dimly</b> (the load glows when it should be off, and is dark when it should be on), suspect the wrong type, or the transistor fitted the wrong way round. A correct part gives a clean, bright on and a fully dark off.</div>`},

{title:"Mistake: an NPN on the high side",part:"Mistake · Wrong position",mist:true,init:{sw:true,dev:"npn"},
 diag:function(s){var d=lampDiag(s),c=d.c;return {svg:d.svg,bad:c.npn&&s.sw,
   meters:[["Fitted",c.npn?"NPN emitter follower":"PNP high-side ✓",c.npn?"warn":true],["Lamp current",fI(c.I),c.I>0.9],["Voltage across transistor",fV(c.vce),c.vce<0.5?true:"warn"],["Heat",fx(c.P,2)+" W",c.P>0.4?"warn":true]],
   now:!s.sw?"OFF state: both versions are off and identical. Switch on to see the difference.":c.npn?"ON state: dim lamp, hot transistor. An NPN on the high side is an emitter follower: its emitter can only rise to about 0.7 V below its base. The base is fed from 5 V through 1 kΩ, so the more current the lamp draws, the lower the base drops. The lamp only gets about "+fV(5-c.vce)+", and the transistor drops the other "+fV(c.vce)+" as heat.":"ON state with a PNP: the base is pulled low, the transistor saturates and the lamp gets about 4.7 V. Bright, with little heat ("+fx(c.P,2)+" W)."};},
 ctl:[{k:"dev",type:"seg",label:"High-side switch",opts:[["npn","NPN ✗",1],["pnp","PNP ✓"]]},{k:"sw",type:"tog",label:"Switch"}],
 text:`<p>A tempting idea: “I'll use an NPN for the high side too, collector to + and emitter to the lamp, base driven high to turn it on.” The wiring is correct for an NPN. It just doesn't make a good high-side switch.</p>
<div class="why bad"><span class="k">What goes wrong</span>Wired this way, the NPN is an <b>emitter follower</b>: the emitter follows the base, about 0.7 V below it. To put 5 V on the lamp the base would need 5.7 V, above the supply. It's worse in practice, because the base current has to come through a resistor from 5 V, so the base sags under load. The transistor ends up partly on: a dim lamp, several volts wasted, and a hot transistor.</div>
<div class="why fix"><span class="k">The fix</span>High side: use a <b>PNP</b> (or a P-channel MOSFET), with its emitter on the + rail and its base pulled <b>low</b> to switch on. Low side: use an NPN. Matching type to position is what lets the transistor saturate fully.</div>
<p class="hint">Emitter followers aren't wrong in general. They're great as voltage buffers (the OR stage in the XOR module is one). They just can't switch a load fully on from the same supply.</p>`},

{title:"Mistake: a PNP that won't turn off",part:"Mistake · Higher supply",mist:true,init:{hi:true,mode:"direct"},
 diag:function(s){var d=hvCalc(s),dd=hvDiag(s);return {svg:dd.svg,bad:!d.helper,
   meters:[["Logic output",s.hi?"HIGH (5 V)":"LOW (0 V)",s.hi],["PNP",d.on?"ON":"off",d.on],["LED",d.on?"ON":"off",d.on],["Current forced into the 5 V logic",d.back>0?fI(d.back):"0",d.back>0?"warn":true]],
   now:!d.helper?(s.hi?"Logic HIGH is meant to turn the PNP off, but its emitter is on 12 V. The base at 5 V is 7 V below the emitter, so it's fully ON. Worse, about "+fI(d.back)+" is forced backwards from the 12 V rail through the transistor into the 5 V logic pin, which can damage the microcontroller.":"Logic LOW: the PNP is on, as intended. The trouble is that HIGH doesn't turn it off either."):(s.hi?"With the helper: logic HIGH turns the small NPN on, which pulls the PNP's base down through 1 kΩ. PNP on, LED on.":"With the helper: logic LOW turns the NPN off, so the 10 kΩ pull-up holds the PNP's base at 12 V, level with its emitter. PNP fully off. The 5 V logic never touches the 12 V side.")};},
 ctl:[{k:"mode",type:"seg",label:"PNP base driven by",opts:[["direct","logic pin, direct ✗",1],["helper","NPN helper ✓"]]},{k:"hi",type:"seg",label:"Logic",opts:[[false,"LOW"],[true,"HIGH"]]}],
 text:`<p>Now the load runs from a <b>12 V</b> supply (top rail), but the control signal comes from <b>5 V logic</b> (the small battery). Both share the 0 V rail. You want to switch the LED's + side with a PNP.</p>
<div class="why bad"><span class="k">What goes wrong</span>A PNP turns off only when its base is level with its emitter, here 12 V. Logic HIGH is only 5 V, still 7 V below the emitter, so the PNP stays ON in both logic states. Current also flows backwards from 12 V into the 5 V logic pin, which can damage the chip.</div>
<div class="why fix"><span class="k">The fix: an NPN helper</span><ul><li>A 10 kΩ <b>pull-up to 12 V</b> holds the PNP's base level with its emitter, so it's OFF by default.</li><li>A small <b>NPN</b> (its emitter on 0 V, so ordinary 5 V logic drives it) pulls the PNP's base down through 1 kΩ to turn it ON.</li><li>Logic HIGH turns the LED on, logic LOW turns it off, and the 5 V side never touches 12 V.</li></ul></div>
<p>This NPN + PNP pair is the standard way to switch a higher voltage on the high side. The same idea applies to P-channel MOSFETs.</p>`},

{quiz:true,title:"Final check: NPN vs PNP",part:"Final check",qs:[
 {q:"A transistor switch works backwards and dimly: the LED glows faintly when it should be off and is dark when it should be on. Most likely?",o:["The wrong type is fitted (NPN where a PNP belongs, or the reverse), or the transistor is in backwards","The battery is too new","The LED is the wrong colour","The pull-down is too small"],c:0,w:"A correct part gives a bright on and a fully dark off. Backwards-and-dim means a junction is being used the wrong way."},

 {q:"Why does an NPN emitter follower make a poor high-side switch?",o:["Its emitter can only rise to about 0.7 V below its base, so the load never gets the full supply and the transistor wastes the difference as heat","It can't conduct at all","It needs a negative supply","It's too fast"],c:0,w:"Use a PNP (or P-MOSFET) on the high side."},
 {q:"A 12 V PNP high-side switch is driven straight from a 5 V logic pin. What happens?",o:["The PNP never turns off, because 5 V is still well below its 12 V emitter (and current back-feeds the pin)","It works perfectly","It never turns on","The LED doubles in brightness"],c:0,w:"Use a pull-up to 12 V and an NPN helper to pull the base down."},
 {q:"Which pair is matched correctly?",o:["NPN: emitter to 0 V, switches the low side, base pulled HIGH to turn on","PNP: emitter to 0 V, base pulled HIGH to turn on","NPN: emitter to + rail, base LOW to turn on","PNP: switches the low side with a pull-down"],c:0,w:"And the mirror: PNP has its emitter to the + rail, switches the high side, base pulled LOW, with a pull-up to keep it off."}
]},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. State the on-rule for each type.</summary><p>NPN: on when the base is about 0.65 V or more above its emitter. PNP: on when the base is about 0.65 V or more below its emitter. Always compare with the transistor's own emitter.</p></details>
<details class="reveal"><summary>2. Why do PNP (and P-channel) switches exist?</summary><p>To switch a load's + side when its ground must stay connected: shared grounds between boards, loads bolted to a chassis, or keeping a load unpowered when off.</p></details>
<details class="reveal"><summary>3. What do you see if a PNP is fitted in an NPN circuit (or the reverse)?</summary><p>Backwards and weak: off when it should be on, and a faint glow when it should be off, because the collector-base diode conducts the wrong way.</p></details>
<details class="reveal"><summary>4. Why not use an NPN on the high side?</summary><p>As an emitter follower its output is stuck about 0.7 V (or more, under load) below its base, so the load is under-powered and the transistor runs hot.</p></details>
<details class="reveal"><summary>5. How do you switch 12 V on the high side from 5 V logic?</summary><p>PNP with its emitter on 12 V, a pull-up from base to 12 V to keep it off, and a small NPN driven by the logic that pulls the PNP's base down through a resistor to turn it on.</p></details>
<h3>Build it in VoltSim</h3>
<p>Build step 1 (NPN low side) and step 2 (PNP high side) next to each other. Then swap the transistors between them, test both switch states, and compare with the mistake steps. Finally build the 12 V PNP with an NPN helper from step 8.</p>`}

var OPBUILD_STEPS=(function(){
var VT=0.02585,IS=1e-3*Math.exp(-0.65/VT),BETA=100;
function ISRC(x,y1,y2,label){var m=(y1+y2)/2;return '<path class="part" d="M'+x+' '+y1+' V'+(m-11)+' M'+x+' '+(m+11)+' V'+y2+'"/><circle class="part" cx="'+x+'" cy="'+m+'" r="11"/><path class="part" d="M'+x+' '+(m-6)+' V'+(m+4)+'"/><path class="partf" d="M'+(x-4)+' '+(m+2)+' L'+(x+4)+' '+(m+2)+' L'+x+' '+(m+8)+' Z"/>'+(label?T(x+16,m+4,label,"lbl","start"):"");}

function iled(v){return Math.max(0,(v-1.9)/330);}

/* ---------- physics: a differential pair ---------- */
function pair(V1,V2,tail){

  var lo=-1,hi=Math.max(V1,V2);
  for(var k=0;k<60;k++){var ve=(lo+hi)/2,f=IS*(Math.exp(clamp((V1-ve)/VT,-80,80))+Math.exp(clamp((V2-ve)/VT,-80,80)))-Math.max(ve,0)/tail.R;if(f>0)lo=ve;else hi=ve;}
  var Ve=(lo+hi)/2,a=IS*Math.exp(clamp((V1-Ve)/VT,-80,80)),b=IS*Math.exp(clamp((V2-Ve)/VT,-80,80));
  return {I1:a,I2:b,Ve:Ve,It:a+b};
}
/* ---------- physics: the whole three-stage amplifier ---------- */
var RC1=1270,RL=2500,RE=1000;
function amp(Vp,Vm,o){
  o=o||{};var p=pair(Vp+0.002*(o.dT||0),Vm,{I:1e-3}),I1=p.I1;
  /* node C1: (5-V)/RC1 = I1 + PNP base current */
  var ipk=BETA*VT/RC1,vpk=5-VT*Math.log(ipk/IS),f=function(V){return (5-V)/RC1-I1-IS/BETA*Math.exp(clamp((5-V)/VT,-80,80));},Vc1;
  if(f(vpk)<=0)Vc1=vpk;else{var lo=vpk,hi=5;for(var k=0;k<60;k++){var m=(lo+hi)/2;if(f(m)>0)lo=m;else hi=m;}Vc1=(lo+hi)/2;}
  var Icp=IS*Math.exp(clamp((5-Vc1)/VT,-80,80)),sat=false;
  var O2,Vout,Ie5=0;
  if(o.stage3!==false){
    Vout=0;for(var j=0;j<40;j++){Ie5=Vout/RE+(o.led?iled(Vout):0);var Ib5=Ie5/BETA;var o2=(Icp-Ib5)*RL;if(o2>4.9){o2=4.9;sat=true;}else sat=false;O2=Math.max(0,o2);var vbe=Ie5>1e-9?0.65+VT*Math.log(Ie5/1e-3):0.55;var nv=Math.max(0,O2-vbe);Vout=Vout+0.5*(nv-Vout);}
    Ie5=Vout/RE+(o.led?iled(Vout):0);
  }else{
    var g=function(O){return O-(Icp-(o.led?iled(O):0))*RL;},a=0,b2=4.9;
    if(g(4.9)<0){O2=4.9;sat=true;}else{for(var q=0;q<60;q++){var mm=(a+b2)/2;if(g(mm)<0)a=mm;else b2=mm;}O2=(a+b2)/2;}

  return {I1:p.I1,I2:p.I2,Ve:p.Ve,Vc1:Vc1,Icp:Icp,O2:O2,Vout:Vout,Ie5:Ie5,sat:sat};
}
function follower(Vin,o){var lo=0,hi=5;for(var k=0;k<45;k++){var m=(lo+hi)/2;if(amp(Vin,m,o).Vout-m>0)lo=m;else hi=m;}var x=(lo+hi)/2;var r=amp(Vin,x,o);r.Vm=x;return r;}
function gainAt(Vp,Vm,o){var a=amp(Vp+5e-5,Vm,o).Vout,b=amp(Vp-5e-5,Vm,o).Vout;return (a-b)/1e-4;}

/* ---------- diagram: the differential pair alone ---------- */
function dpDiag(s){

  o+=FLAG(330,60,0.2)+P2.svg+GND(330,250,0.2)+W([P2.wx,P2.wy,285,P2.wy,285,200,264,200],V2);
  o+=W([168,108,168,170],Vc1)+W([222,108,222,170],Vc2)+W([168,230,168,245,222,245,222,230],p.Ve)+W([195,245,195,255],p.Ve)+D(195,245,p.Ve);
  o+=F([168,108,168,170],"b",k1)+F([222,108,222,170],"b",k2)+F([168,230,168,245,195,245],"b",k1)+F([222,230,222,245,195,245],"b",k2)+F([195,245,195,255],"b",1);
  o+=FLAG(168,48,k1,"b")+R(168,48,168,108,"2.2 kΩ",-1)+FLAG(222,48,k2,"b")+R(222,48,222,108,"2.2 kΩ");
  o+=BJT(150,200,{state:k1>0.05})+BJT(240,200,{m:true,state:k2>0.05})+T(150,240,"Q1","nlbl","end")+T(240,240,"Q2","nlbl","start");
  o+=(s.tail==="I"?ISRC(195,255,295,"1 mA"):R(195,255,195,295,"1.8 kΩ"))+GND(195,295,1,"b");
  o+=TAG(160,128,fV(Vc1),"end")+TAG(230,128,fV(Vc2),"start")+TAG(94,162,"V+ "+fx(V1,3),"start")+TAG(296,162,"V− "+fx(V2,3),"end");
  o+=T(60,276,"pot (V+)","lbl")+T(320,276,"pot (V−)","lbl")+T(205,312,"tail "+fI(p.It),"lbl","start");
  return {svg:finish(o,370,334,50),p:p,Vc1:Vc1,Vc2:Vc2};

/* ---------- diagram: the full three-stage op-amp ---------- */
function ampDiag(s,cfg){
  var V1=s.vp,o="",r,V2;
  var opt={dT:cfg.dT||0,stage3:cfg.stage3,led:cfg.led};
  if(cfg.follower){r=follower(V1,opt);V2=r.Vm;}else{V2=2.5;r=amp(V1,V2,opt);}
  var k1=clamp(r.I1/1e-3,0,1),k2=clamp(r.I2/1e-3,0,1),kp=clamp(r.Icp/2e-3,0,1),k5=clamp(r.Ie5/5e-3,0,1),il=cfg.led?iled(r.Vout):0,bl=ledB(il);
  begin(22,336);
  /* V+ pot */

  /* stage 1 */
  o+=W([168,100,168,170],r.Vc1)+W([168,110,316,110],r.Vc1)+D(168,110,r.Vc1)+HOP(222,110,r.Vc1);
  o+=W([168,230,168,245,222,245,222,230],r.Ve)+W([195,245,195,255],r.Ve)+D(195,245,r.Ve);
  o+=F([168,100,168,170],"b",k1)+F([168,230,168,245,195,245],"b",k1)+F([222,230,222,245,195,245],"b",k2)+F([195,245,195,255],"b",1);
  o+=FLAG(168,48,k1,"b")+R(168,48,168,100,"1.27 kΩ",-1)+FLAG(222,170,k2,"b");
  o+=BJT(150,200,{state:k1>0.05})+BJT(240,200,{m:true,state:k2>0.05})+T(150,240,"Q1","nlbl","end")+T(240,240,"Q2","nlbl","start");
  o+=ISRC(195,255,295,"1 mA")+GND(195,295,1,"b");

    o+=FLAG(430,115,k5,"b")+BJT(412,145,{state:k5>0.02})+R(430,200,430,250,"1 kΩ")+GND(430,250,clamp(r.Vout/RE/5e-3,0,1),"b")+T(450,128,"Q4","nlbl","start");
    if(k5>0.01)o+=F([430,175,430,200],"b",k5);
    ox=430;oy=190;
  }
  if(cfg.led){
    o+=W(ox===430?[430,190,480,190]:[358,145,480,145,480,190],r.Vout)+R(480,190,480,225,"330 Ω",-1)+W([480,225,480,235],il>0?"mid":false)+LED(480,255,bl)+GND(480,275,bl,"b");
    if(il>0)o+=F(ox===430?[430,190,480,190]:[358,145,480,145,480,190],"b",bl)+F([480,225,480,235],"b",bl);
  }

function dpMeters(d){var p=d.p;return [["Tail current",fI(p.It),true],["Q1 takes",fI(p.I1)+" ("+Math.round(p.I1/p.It*100)+"%)",p.I1>p.I2],["Q2 takes",fI(p.I2)+" ("+Math.round(p.I2/p.It*100)+"%)",p.I2>p.I1],["C2 − C1",(d.Vc2-d.Vc1>=0?"+":"")+fx(d.Vc2-d.Vc1,3)+" V",true]];}

{title:"What's inside an op-amp?",part:"Part 1 · Build one",
 text:`<p>So far you've built gates, timers and switches from single transistors. An <b>op-amp</b> is just a few more transistors arranged so that the output reacts to the <b>difference</b> between two inputs, very strongly.</p>
<p>In this part you'll build a working op-amp from <b>four transistors</b>, the same NPN and PNP parts from earlier modules, in three stages:</p>`+BLOCKS+`
<ol><li><b>Difference stage</b>: a pair of NPNs that share a fixed current between them. Whichever input is higher grabs more of it.</li><li><b>Gain stage</b>: a PNP that turns that small change into a big voltage swing.</li><li><b>Output stage</b>: an emitter follower (from the NPN vs PNP module) that can supply real current without collapsing.</li></ol>
<p>Then you'll connect its output back to its own input and watch the famous op-amp “golden rules” appear by themselves. They aren't magic. They're what happens when you combine big gain with feedback.</p>
<div class="why"><span class="k">What you need from earlier modules</span>An NPN turns on when its base is about 0.65 V above its emitter, and a PNP when its base is about 0.65 V below its emitter (NPN vs PNP module). Collector current is set by the base, not by the collector voltage. And current only flows around complete loops.</div>`},

{title:"Stage 1: the differential pair",part:"Part 1 · Build one",init:{vp:2.5,vm:2.5,tail:"R"},
 diag:function(s){var d=dpDiag(s),p=d.p,dd=s.vp-s.vm;return {svg:d.svg,meters:dpMeters(d),
   now:Math.abs(dd)<0.002?"Inputs equal: the tail current splits 50/50, so both collectors sit at the same voltage. Now nudge V+ up by just 20–50 mV.":"V+ is "+(dd>0?"above":"below")+" V− by "+Math.round(Math.abs(dd)*1000)+" mV, so Q"+(dd>0?1:2)+" takes "+Math.round(Math.max(p.I1,p.I2)/p.It*100)+"% of the tail current. More current through its 2.2 kΩ means a bigger drop, so its collector falls while the other one rises. A tiny input difference has become a much bigger collector difference."};},
 ctl:[{k:"vp",type:"range",label:"V+",min:2.3,max:2.7,step:0.001,fmt:function(v){return fx(v,3)+" V";}},{k:"vm",type:"range",label:"V−",min:2.3,max:2.7,step:0.001,fmt:function(v){return fx(v,3)+" V";}}],
 text:`<p>Two NPN transistors, <b>Q1</b> and <b>Q2</b>, with their <b>emitters joined</b>. A single resistor (the “tail”) connects the joined emitters to the 0 V rail. Each collector has its own 2.2 kΩ to the + rail.</p>
<h3>How it works</h3>
<ol><li>The two emitters are one node, so they share one voltage, sitting about 0.65 V below whichever base is higher.</li><li>The tail sets the <b>total</b> current: about (2.5 − 0.65) ÷ 1.8 kΩ ≈ 1 mA.</li><li>That 1 mA is <b>shared</b> between Q1 and Q2. Each transistor's current depends on how far its base is above the shared emitter.</li><li>Raise V+ a little: Q1's base is further above the emitter, so Q1 takes a bigger share and Q2 gets less.</li></ol>
<p>It's like two people pulling on a rope with a fixed total. One input slightly ahead grabs most of it. The share swings from 50/50 to about 90/10 for just 60 mV of difference.</p>
<div class="why"><span class="k">Why this is the heart of every op-amp</span>The pair responds only to the <b>difference</b> V+ − V−. That's where the names come from: Q1's base is the <b>+ (non-inverting) input</b>, and Q2's base is the <b>− (inverting) input</b>.</div>
<p class="hint">Try it: set both sliders to the same value, then move both together. The split stays 50/50. Next step looks at exactly that.</p>`},

{title:"Why the tail matters: common mode",part:"Part 1 · Build one",init:{cm:2.5,dd:0,tail:"R",vp:2.5,vm:2.5},
 onChange:function(s){s.vp=s.cm+s.dd/2;s.vm=s.cm-s.dd/2;},
 diag:function(s){s.vp=s.cm+s.dd/2;s.vm=s.cm-s.dd/2;var d=dpDiag(s);return {svg:d.svg,meters:dpMeters(d),
   now:s.tail==="I"?"With a current source as the tail, the total is fixed at 1 mA wherever the inputs sit. Move the common level: the collectors don't budge. Only the difference slider moves them. That's ideal: the stage responds to the difference and ignores the average.":"With a resistor tail, raising both inputs together raises the shared emitter, which pushes more current through the 1.8 kΩ, so both collectors drop together. The stage is responding to the average level, not just the difference. An op-amp shouldn't do that."};},
 ctl:[{k:"cm",type:"range",label:"Both inputs",min:1.5,max:3.5,step:0.01,fmt:function(v){return fV(v);}},{k:"dd",type:"range",label:"Difference",min:-0.05,max:0.05,step:0.001,fmt:function(v){return (v>=0?"+":"")+Math.round(v*1000)+" mV";}},{k:"tail",type:"seg",label:"Tail",opts:[["R","1.8 kΩ resistor"],["I","1 mA current source"]]}],
 text:`<p>Two kinds of input change:</p>
<ul><li><b>Difference</b> (differential): V+ and V− move apart. We want to amplify this.</li><li><b>Common mode</b>: both move up or down <b>together</b>. We want to ignore this. Think of noise picked up equally on both wires, or a sensor bridge sitting at 2.5 V.</li></ul>
<p>Move the “Both inputs” slider with the <b>resistor</b> tail: the total tail current changes, so both collectors drift. Now switch to the <b>current source</b> tail and move it again: they stay put.</p>
<div class="why"><span class="k">What is a current source?</span>The circle with an arrow is a circuit that holds its current fixed (here 1 mA) whatever the voltage across it. Inside a real op-amp it's a couple of transistors arranged to do exactly that (a “current mirror”). For us, it fixes the shared total, so only the <b>difference</b> can change the split.</div>
<p>How well an op-amp ignores common mode is listed in datasheets as <b>CMRR</b> (common-mode rejection ratio). Typical values are 80–100 dB, meaning the difference matters 10 000 to 100 000 times more than the average.</p>`},

{quiz:true,title:"Check: the differential pair",part:"Check A",qs:[
 {q:"In a differential pair, what does the tail set?",o:["The total current shared by both transistors","The gain of the second stage","The supply voltage","The LED brightness"],c:0,w:"The tail fixes the total. The inputs only decide how it's split."},
 {q:"V+ rises 30 mV above V−. What happens?",o:["Q1 takes a bigger share of the tail current, so its collector voltage falls and Q2's rises","Both transistors turn off","The tail current doubles","Nothing, 30 mV is too small"],c:0,w:"A small base difference swings the split strongly, because transistor current depends exponentially on base-emitter voltage."},
 {q:"Why replace the tail resistor with a current source?",o:["So the total current stays fixed when both inputs move together, and the stage ignores common-mode changes","To make it louder","To save a transistor","Because resistors can't carry 1 mA"],c:0,w:"A fixed total means only the difference can change the outputs. That's common-mode rejection."},
 {q:"Which base is the op-amp's + (non-inverting) input?",o:["The one whose rise makes the final output rise","Always the left one, by convention","The one connected to the tail","The one with the bigger resistor"],c:0,w:"In our build, raising Q1's base makes the output rise, so Q1's base is V+."}
]},

{title:"Stage 2: a PNP for more gain",part:"Part 1 · Build one",init:{vp:2.5},legendNeg:false,
 diag:function(s){var d=ampDiag(s,{stage3:false,led:false}),r=d.r,g=gainAt(s.vp,2.5,{stage3:false});return {svg:d.svg,bad:r.sat||r.O2<0.05,
   meters:[["V+ − V−",(s.vp-2.5>=0?"+":"")+fx((s.vp-2.5)*1000,2)+" mV",true],["C1",fV(r.Vc1),true],["Q3 current",fI(r.Icp),r.Icp>2e-5],["Output",fV(r.O2),r.O2>0.05&&!r.sat],["Gain here",Math.abs(g)>1?"≈ ×"+Math.round(g):"≈ 0 (stuck at a rail)",Math.abs(g)>1]],
   now:r.sat?"Output pinned at the top: Q3 is fully on. Even a couple of millivolts is enough to slam it. Bring V+ back down.":r.O2<0.05?"Output pinned at 0 V: Q3 is fully off. V+ is a few millivolts too low. Nudge it up.":"Watch the scale: moving V+ by about half a millivolt swings the output by roughly a volt. Q1's collector moves about 20 mV per millivolt of input, and that changes Q3's base-emitter voltage, which changes Q3's current exponentially. The 2.5 kΩ turns that current into a big voltage."};},
 ctl:[{k:"vp",type:"range",label:"V+",min:2.498,max:2.502,step:0.00002,fmt:function(v){return fx(v,5)+" V";}}],
 text:`<p>The pair's collectors only move a few hundred millivolts. To get the huge gain op-amps are known for, add a second stage.</p>
<h3>The gain stage</h3>
<ul><li>V− is held at 2.5 V by a divider for now.</li><li><b>Q1's collector (C1)</b> drives the base of a <b>PNP, Q3</b>. Its emitter is on the + rail and its collector feeds a 2.5 kΩ to 0 V.</li><li>When V+ rises, Q1 takes more current, C1 falls, so Q3's base goes further <b>below</b> its emitter and Q3 turns on harder (the PNP rule).</li><li>More Q3 current through the 2.5 kΩ means a higher output voltage.</li></ul>
<p>Q2's collector simply goes to the + rail. We only need one side's signal.</p>
<div class="formula">stage 1 ≈ ×20 &nbsp; × &nbsp; stage 2 ≈ ×80 &nbsp; = &nbsp; about ×1700 overall</div>
<p>That's why the slider here only covers ±2 mV. About 1.5 mV takes the output from one rail to the other. Look for the “Gain here” reading as you move it.</p>
<div class="why"><span class="k">Why does it rest near the middle?</span>The 1.27 kΩ was chosen so that with an even 0.5 mA split, C1 sits about 0.65 V below the + rail. That's just enough to turn Q3 on to about 1 mA, giving roughly 2.5 V across the 2.5 kΩ. Designing the resting voltages like this is called <b>biasing</b>. Because Q3's base current also flows through the 1.27 kΩ, it actually rests at about 2.1 V with equal inputs. Getting it to 2.5 V needs a few tenths of a millivolt of input difference: a real op-amp's <b>input offset voltage</b> in miniature.</div>`},

{title:"Stage 3: an output that can drive a load",part:"Part 1 · Build one",init:{vp:2.5002,stage3:false},
 diag:function(s){var d=ampDiag(s,{stage3:s.stage3,led:true}),r=d.r;return {svg:d.svg,bad:!s.stage3,
   meters:[["V+ − V−",(s.vp-2.5>=0?"+":"")+fx((s.vp-2.5)*1000,2)+" mV",true],["Stage 2 out",fV(r.O2),true],["Output",fV(r.Vout),true],["LED current",fI(iled(r.Vout)),iled(r.Vout)>1e-4],["Output stage",s.stage3?"fitted":"missing",s.stage3?true:"warn"]],
   now:!s.stage3?"Without an output stage, the LED hangs straight on Q3's collector. Q3 can only supply about 2 mA, and the LED's current comes out of the same 2.5 kΩ node. The output can't rise above about 2.3 V however far you push V+. The gain stage is being loaded, just like the pot in the buffer lesson.":"With the emitter follower (Q4) fitted, the LED's current comes from the + rail through Q4, not from the gain stage. Q4 only needs about 1/100 of that as base current. Move V+ and the LED dims and brightens smoothly."};},
 ctl:[{k:"vp",type:"range",label:"V+",min:2.498,max:2.502,step:0.00002,fmt:function(v){return fx(v,5)+" V";}},{k:"stage3",type:"tog",label:"Output stage (Q4)"}],
 text:`<p>The gain stage makes a big voltage swing, but it's a <b>weak</b> source: its current flows through 2.5 kΩ. Ask it to drive an LED and the voltage collapses. Turn the output stage off to see it.</p>
<h3>The fix: an emitter follower</h3>
<p>Add <b>Q4</b>, an NPN with its collector on the + rail and its emitter as the new output. You met this in the NPN vs PNP module:</p>
<ul><li>The emitter <b>follows</b> the base, about 0.65 V lower.</li><li>The load's current comes from the <b>+ rail</b> through Q4's collector.</li><li>The gain stage only supplies Q4's tiny base current (load ÷ 100).</li></ul>
<p>Its voltage gain is about ×1, but its <b>current</b> gain is ×100. That's the job of an output stage: keep the voltage, add muscle.</p>
<div class="why"><span class="k">What real op-amps do better</span>Our single NPN can only <b>push</b> current out. Pulling the output down relies on the 1 kΩ. Real op-amps use a <b>push-pull</b> pair, an NPN to push and a PNP to pull, so they can drive loads in both directions. That's the NPN + PNP teamwork from the last module.</div>`},

{title:"Close the loop: the golden rules appear",part:"Part 1 · Build one",init:{vp:2.5,fb:true},
 diag:function(s){var d=ampDiag(s,{stage3:true,led:true,follower:s.fb}),r=d.r,err=r.Vout-s.vp;return {svg:d.svg,bad:!s.fb,
   meters:s.fb?[["V+ (pot)",fV(s.vp),true],["V− (= output)",fx(d.V2,4)+" V",true],["Output",fV(r.Vout),true],["Error (out − in)",(err>=0?"+":"")+fx(err*1000,1)+" mV",Math.abs(err)<0.02],["Base split",Math.round(r.I1/1e-3*100)+" / "+Math.round(r.I2/1e-3*100),true]]:[["V+ (pot)",fV(s.vp),true],["V− (divider)",fV(2.5),true],["Output",fV(r.Vout),true]],
   now:s.fb?"The output is wired back to V− (Q2's base). If the output were too low, V− would be below V+, Q1 would take more current, and the output would rise. Too high, and the reverse. It settles where V− is within a few millivolts of V+, which means the output copies the input. The input pair sits very close to 50/50: the op-amp is working to make its two inputs equal.":"Feedback disconnected. V− is back on the fixed 2.5 V divider, so any input more than a few millivolts away from 2.5 V slams the output to a rail. All that gain is useless on its own."};},
 ctl:[{k:"vp",type:"range",label:"V+",min:0.5,max:4.0,step:0.01,fmt:function(v){return fV(v);}},{k:"fb",type:"tog",label:"Feedback wire (out → V−)"}],
 text:`<p>Your op-amp has a gain of about 1700. Open-loop, that's almost unusable: 2 mV of input pins the output. Now connect the <b>output back to the − input</b> (Q2's base). Move V+ anywhere from 0.5 V to 4 V and watch the output follow it closely.</p>
<h3>Why it settles exactly there</h3>
<ul><li>If the output is too low, V− (= output) is below V+, so the pair tips towards Q1, Q3 turns on harder and the output rises.</li><li>If the output is too high, the opposite happens and it falls.</li><li>The only stable point is where V− ≈ V+, within a few millivolts.</li></ul>
<div class="why"><span class="k">The golden rules, explained</span><b>Rule 1, “the output makes V− equal V+”</b>: that's the feedback you just watched. With gain 1700 the error is about out ÷ 1700 plus the small offset: under a millivolt. Real op-amps have gain over 100 000, so the error shrinks to microvolts.<br><b>Rule 2, “the inputs draw no current”</b>: the inputs are transistor bases. They draw only a few microamps here (tail current ÷ 2 ÷ gain of 100). Real op-amps use better transistors, or MOSFET inputs, to make that picoamps.</div>
<p>This circuit is the <b>voltage follower</b> (buffer) you'll meet again on the next steps, now built from parts you understand.</p>`},

{title:"Mistake: mismatched input transistors",part:"Mistake · Offset",mist:true,init:{vp:2.5,dT:5},
 diag:function(s){var d=ampDiag(s,{stage3:true,led:true,follower:true,dT:s.dT}),r=d.r,err=r.Vout-s.vp,ok=Math.abs(err)<0.006;return {svg:d.svg,bad:!ok,
   meters:[["Temperature difference",s.dT+" °C",s.dT===0],["Output error",(err>=0?"+":"")+fx(err*1000,1)+" mV",ok?true:"warn"],["Of which offset ≈","+"+fx(2*s.dT,0)+" mV",s.dT===0]],
   now:s.dT===0?"Matched and at the same temperature: the follower's error is under a millivolt, set by the finite gain and the small built-in imbalance.":"Q1 is "+s.dT+" °C warmer than Q2. A warmer transistor needs about 2 mV less base-emitter voltage for the same current, so the pair is unbalanced even when the inputs are equal. The feedback can only balance the pair by making the inputs unequal, so the output settles about "+(2*s.dT)+" mV high. That's an input offset voltage."};},
 ctl:[{k:"dT",type:"range",label:"Q1 warmer by",min:0,max:10,step:1,fmt:function(v){return v+" °C";}},{k:"vp",type:"range",label:"V+",min:0.5,max:4.0,step:0.01,fmt:function(v){return fV(v);}}],
 text:`<p>The differential pair only works if Q1 and Q2 are <b>identical</b>. Build it from two loose transistors and they won't be: different batches, or one sitting next to a warm resistor.</p>
<div class="why bad"><span class="k">What goes wrong</span>A transistor's base-emitter voltage falls about <b>2 mV for every °C</b> it warms up. If Q1 is 5 °C warmer, it acts as if its input were 10 mV higher. The amplifier can't tell this apart from a real signal. In the follower the output sits 10 mV high. In a high-gain amplifier that error is multiplied along with the signal.</div>
<div class="why fix"><span class="k">How real op-amps fix it</span><ul><li>Both input transistors sit side by side on the same chip, so they match closely and share one temperature.</li><li>Datasheets list the leftover as <b>input offset voltage</b> (V<sub>OS</sub>): about 1 mV for common parts, microvolts for precision ones.</li><li>Some op-amps have offset-null pins for trimming it out.</li></ul>If you ever build a discrete differential pair: use a matched dual transistor, or glue the two together so they share heat.</div>`},

{title:"From your op-amp to a real one",part:"Part 1 · Build one",
 text:`<p>Your four-transistor op-amp really works: difference in, big gain, feedback, follower. Real chips use the same three stages, just refined:</p>
<table class="cmp"><tr><th>Ours</th><th>Real op-amp (e.g. LM358, TL072, MCP6002)</th><th>Why</th></tr>
<tr><td>Collector resistor on Q1, Q2 to the rail</td><td><b>Current-mirror load</b> (two PNPs)</td><td>Uses both sides' signal and gives far more gain from stage 1.</td></tr>
<tr><td>Gain ≈ 1700</td><td>Gain 100 000 – 1 000 000</td><td>Feedback errors become microvolts, so the golden rules are almost exact.</td></tr>
<tr><td>Output: one NPN follower</td><td><b>Push-pull</b> NPN + PNP (or MOSFET) output</td><td>Can source and sink current. Rail-to-rail parts get within millivolts of each rail.</td></tr>
<tr><td>Nothing to stop oscillation</td><td>A small <b>compensation capacitor</b> (about 30 pF)</td><td>Slows the gain stage at high frequency so feedback can't turn into oscillation.</td></tr>
<tr><td>Inputs draw µA</td><td>nA (BJT) to pA (MOSFET inputs)</td><td>Better transistors, so rule 2 is nearly exact.</td></tr>
<tr><td>Output range about 0–4.2 V</td><td>LM358: 0 to about 3.5 V on 5 V. Rail-to-rail: almost 0–5 V</td><td>Output stage design. That's why the earlier step's LM358 clipped.</td></tr></table>
<p>From the next step on, we draw the whole thing as a <b>triangle</b>: + and − inputs, an output, and the power pins. But now you know what's inside: a pair sharing a current, a gain transistor, and a follower.</p>
<div class="why"><span class="k">Keep this picture in mind</span>Every op-amp rule and mistake that follows has a reason inside the triangle. The power pins feed the tail, the gain stage and the follower: no power, no op-amp. Feedback to + makes the pair tip further the same way. The output can't exceed the rails because the follower's transistor can't.</div>`}
];
})();

(function(){
function ledI(v){return Math.max(0,(v-1.9)/330);}
/* comparator / night light layout. topR: "r10k" | "ldr" ; refs: left divider gives V− ; pot gives V+ */
function compDiag(s,opt){
  var o="",vm=opt.vm,vp=opt.vp,out=opt.out,pw=opt.power!==false,il=ledI(out),b=clamp(il/9e-3,0,1);
  begin(22,270);
  /* left divider -> V− */
  o+=W([60,100,60,124],vm)+W([60,112,180,112,180,135,190,135],vm)+D(60,112,vm);
  o+=FLAG(60,50,0.25)+(opt.ldr?LDR(60,50,100,"LDR"):R(60,50,60,100,"10 kΩ"))+R(60,124,60,170,"10 kΩ")+GND(60,170,0.25);
  o+=T(48,108,opt.ldr?"Vs":"V−","nlbl","end");
  /* pot -> V+ */
  var p=POT(140,120,210,opt.f,opt.potLabel||"10 kΩ pot");
  o+=FLAG(140,120,0.25)+p.svg+GND(140,210,0.25)+W([p.wx,p.wy,172,p.wy,172,165,190,165],vp);
  o+=HOP(140,112,vm);
  /* op-amp + power */
  o+=OPAMP(200,150,"",!pw);
  if(pw){o+=FLAG(230,115,0.2+0.8*b,"b");o+=GND(230,185,0.2,"s");}
  else{o+=T(238,98,"V+ not connected","blbl","start")+GND(230,185,0);}
  /* output LED */
  o+=W([270,150,300,150],out)+W([300,195,300,205],il>0?"mid":false);
  if(il>0)o+=F([230,128,230,140,262,150,300,150],"b",b)+F([300,195,300,205],"b",b);
  o+=R(300,150,300,195,"330 Ω")+LED(300,225,b)+GND(300,245,b,"b");
  o+=TAG(186,128,fV(vm),"end")+TAG(186,184,fV(vp),"end")+TAG(268,138,fV(out),"start");
  return finish(o,350,284,50);
}
/* follower / buffer / positive-feedback demo */
function bufDiag(s,opt){
  var o="",f=s.f,p=POT(60,60,200,f,"10 kΩ pot"),vth=5*f,rth=10000*f*(1-f),buf=opt.buf,vout,vw,il;
  begin(22,270);
  if(buf){vout=opt.vout;vw=vth;il=ledI(vout);}
  else{il=Math.max(0,(vth-1.9)/(rth+330));vw=vth-il*rth;vout=vw;}
  var b=clamp(il/9e-3,0,1);
  o+=FLAG(60,50,buf?0.25:b,buf?"s":"b")+p.svg+GND(60,200,0.25);
  if(buf){
    o+=W([p.wx,p.wy,120,p.wy,120,165,150,165],vw);
    o+=W([230,150,280,150],vout)+W([240,150,240,95,140,95,140,135,150,135],vout)+D(240,150,vout);
    o+=OPAMP(160,150,"",false,opt.swap)+FLAG(190,115,0.2+0.8*b,"b")+GND(190,185,0.2)+HOP(190,95,vout);
    if(il>0)o+=F([190,128,190,140,222,150,280,150],"b",b);
  }else{
    o+=W([p.wx,p.wy,120,p.wy,120,150,280,150],vw);
    if(il>0)o+=F([60,60,60,100],"b",b)+F([p.wx,p.wy,120,p.wy,120,150,280,150],"b",b);
  }
  o+=W([280,195,280,205],il>0?"mid":false);if(il>0)o+=F([280,195,280,205],"b",b);
  o+=R(280,150,280,195,"330 Ω")+LED(280,225,b)+GND(280,245,b,"b");
  o+=TAG(100,p.wy-10,"wiper "+fV(vw),"end");if(buf)o+=TAG(250,140,"out "+fV(vout),"start");
  return {svg:finish(o,340,284,50),vw:vw,vout:vout,il:il,vth:vth};
}
/* non-inverting amplifier */
var GAINS={2:[10000,10000],3:[20000,10000],11:[100000,10000]};
function ampDiag(s){
  var o="",f=s.f,p=POT(60,60,200,f,"pot"),vin=5*f,g=s.g,rf=GAINS[g][0],rg=GAINS[g][1],ideal=vin*g,vmax=s.type==="lm358"?3.5:4.95,vout=clamp(ideal,0,vmax),il=ledI(vout),b=clamp(il/9e-3,0,1),vn=vout/g;
  begin(22,270);
  o+=FLAG(60,50,0.25)+p.svg+GND(60,200,0.25);
  o+=W([p.wx,p.wy,100,p.wy,100,165,150,165],vin);
  o+=W([230,150,290,150],vout)+W([245,150,245,90,215,90],vout)+W([160,90,120,90,120,105],vn)+W([140,90,140,135,150,135],vn)+D(140,90,vn)+D(245,150,vout);
  o+=R(215,90,160,90,"Rf "+fR(rf),-1)+R(120,105,120,150,"Rg "+fR(rg),-1)+GND(120,150,0.3);
  o+=OPAMP(160,150,"")+FLAG(190,115,0.2+0.8*b,"b")+GND(190,185,0.2)+HOP(190,90,vout)+HOP(120,165,vin);
  if(il>0)o+=F([190,128,190,140,222,150,290,150],"b",b);
  o+=W([290,195,290,205],il>0?"mid":false);if(il>0)o+=F([290,195,290,205],"b",b);
  o+=R(290,150,290,195,"330 Ω")+LED(290,225,b)+GND(290,245,b,"b");
  o+=TAG(146,182,"in "+fV(vin),"end")+TAG(258,140,"out "+fV(vout),"start");
  return {svg:finish(o,340,284,50),vin:vin,ideal:ideal,vout:vout,clip:ideal>vmax+0.01,vmax:vmax};
}
