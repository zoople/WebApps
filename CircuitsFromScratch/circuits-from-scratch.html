steps:OPBUILD_STEPS.concat([
{title:"An op-amp compares two voltages",part:"Part 2 · Comparator",init:{f:0.4},
 diag:function(s){var vp=5*(0.15+0.7*s.f),out=vp>2.5?4.95:0.05;return {svg:compDiag(s,{vm:2.5,vp:vp,out:out,f:s.f}),
   meters:[["V+ (pot)",fV(vp),vp>2.5],["V− (divider)",fV(2.5),false],["Output",out>2.5?"high (≈5 V)":"low (≈0 V)",out>2.5]],
   now:vp>2.5?"V+ is higher than V−, so the output slams up to the top rail and the LED lights. The output current comes from the op-amp's own power pin (V+ → output), not from the inputs.":"V+ is lower than V−, so the output sits at the bottom rail and the LED is off. Move the pot past 2.5 V and watch it flip."};},
 ctl:[{k:"f",type:"range",label:"Pot",min:0,max:1,step:0.01,fmt:function(v){return fV(5*(0.15+0.7*v));}}],
 text:`<p>From here on, the op-amp you just built is drawn as a <b>triangle</b>. Real ones come as chips, but the pins are the same:</p>
<ul><li><b>+ input</b> (non-inverting) and <b>− input</b> (inverting). These are just names, not voltages.</li><li>The <b>output</b> is the difference between them multiplied by a huge number: about 100 000 or more.</li><li>Two <b>power pins</b>, V+ and V−, connect to the rails. The output can't go beyond them.</li></ul>
<div class="formula">output = huge × (V+ − V−), stuck between the rails</div>
<p>Even a millivolt of difference, × 100 000, wants 100 V, so the output just slams into a rail. Used like this, with no feedback, an op-amp is a <b>comparator</b>:</p>
<ul><li>V+ above V− → output high</li><li>V+ below V− → output low</li></ul>
<div class="why"><span class="k">Inputs draw almost no current</span>Notice there are no current dashes into the inputs. An op-amp only <b>looks at</b> its input voltages. The current for the LED comes from the power pin. That's why it's drawn wired to both rails: a full loop, battery → V+ pin → output → LED → − rail.</div>
<p class="hint">The diagram uses a rail-to-rail op-amp, whose output reaches within a few millivolts of each rail. Older types like the LM358 can't, as you'll see in step 3.</p>`},

{title:"Feedback and the golden rules: the buffer",part:"Part 3 · Feedback",init:{f:0.6,buf:false},
 diag:function(s){var d=bufDiag(s,{buf:s.buf,vout:5*s.f});return {svg:d.svg,
   meters:[["Pot setting",fV(d.vth),true],["Wiper actually",fV(d.vw),Math.abs(d.vw-d.vth)>0.1?"warn":true],["LED current",fI(d.il),d.il>1e-4]],
   now:s.buf?"Buffered: the op-amp's output follows the wiper exactly (golden rule 1), and it draws no current from the pot (golden rule 2). The LED's current comes from the op-amp's power pin, so the pot's voltage doesn't sag at all.":"Unbuffered: the LED is connected straight to the pot's wiper. Its current has to flow through several kΩ of pot track, which drops voltage, so the wiper sags well below its setting and the LED is dim. This is called loading the divider."};},
 ctl:[{k:"f",type:"range",label:"Pot",min:0,max:1,step:0.01,fmt:function(v){return fV(5*v);}},{k:"buf",type:"tog",label:"Op-amp buffer"}],
 text:`<p>Now connect the output back to the <b>− input</b>. That's <b>negative feedback</b>, and it tames the huge gain.</p>
<p>If the output is too high, V− rises above V+ and the op-amp pushes the output down. If it's too low, it pushes it up. It settles where V− equals V+, so the output simply <b>copies</b> the input. This circuit is called a <b>voltage follower</b> or <b>buffer</b>.</p>
<div class="why"><span class="k">The two golden rules (with negative feedback)</span><ol><li>The output does whatever it takes to make V− equal V+.</li><li>The inputs draw no current.</li></ol>Nearly every op-amp circuit can be worked out from these two rules.</div>
<h3>Why bother copying a voltage?</h3>
<p>Turn the buffer off. The LED now draws its current straight from the pot, through the pot's own resistance, and the voltage sags. Turn the buffer on: the op-amp reads the voltage without loading it and supplies the LED's current from its own power pin.</p>
<div class="why bad"><span class="k">Common mistake: loading a divider</span>A voltage divider (or pot, or sensor) only gives its calculated voltage if almost nothing draws current from it. Hang an LED, motor or low-value resistor on it and the voltage collapses. Buffer it, or feed it into something with high input resistance, like a transistor base resistor or an op-amp.</div>`},

{title:"The non-inverting amplifier",part:"Part 3 · Feedback",init:{f:0.2,g:2,type:"rr"},
 diag:function(s){var d=ampDiag(s);return {svg:d.svg,bad:d.clip,
   meters:[["In",fV(d.vin),true],["Gain",s.g+"×",true],["Out should be",fV(d.ideal),true],["Out actually",fV(d.vout),d.clip?"warn":true]],
   now:d.clip?"Clipped. The input × "+s.g+" wants "+fV(d.ideal)+", but the output can't go above "+fV(d.vmax)+(s.type==="lm358"?". An LM358's output only reaches about 1.5 V below its top rail.":", just under the top rail.")+" No amplifier can output more than its supply.":"Rf and Rg feed back a fraction of the output to V−. The op-amp makes V− equal V+, so the output must be "+s.g+"× the input."};},
 ctl:[{k:"f",type:"range",label:"Input",min:0,max:1,step:0.01,fmt:function(v){return fV(5*v);}},{k:"g",type:"seg",label:"Gain",opts:[[2,"×2"],[3,"×3"],[11,"×11"]]},{k:"type",type:"seg",label:"Op-amp",opts:[["rr","rail-to-rail"],["lm358","LM358"]]}],
 text:`<p>Instead of feeding all of the output back, feed back only a <b>fraction</b> using two resistors, Rf and Rg.</p>
<p>Rf and Rg form a divider, so V− = output × Rg ÷ (Rf + Rg). The op-amp forces V− to equal V+ (the input), so:</p>
<div class="formula">gain = 1 + Rf ÷ Rg &nbsp;&nbsp; 10k and 10k → ×2</div>
<p>Try an input of 0.5 V at ×3: out = 1.5 V. Now push the input up until the output hits the rail.</p>
<div class="why bad"><span class="k">Common mistake: expecting more than the supply</span>An op-amp's output can never go beyond its power rails. With a 5 V supply, “2 V × 3 = 6 V” really gives about 5 V: the signal <b>clips</b>. Older op-amps like the <b>LM358</b> are worse, only reaching about 3.5 V from a 5 V supply. If your output seems stuck below the top rail, check whether your op-amp is rail-to-rail.</div>`},

{title:"Mistake: feedback to the wrong input",part:"Mistake · Positive feedback",mist:true,init:{f:0.5,swap:true},
 diag:function(s){var vin=5*s.f,vout=s.swap?4.95:vin,d=bufDiag(s,{buf:true,vout:vout,swap:s.swap});return {svg:d.svg,bad:s.swap,
   meters:[["Input",fV(vin),true],["Output",fV(vout),s.swap?"warn":true],["Follows input?",s.swap?"no, stuck":"yes",s.swap?"warn":true]],
   now:s.swap?"The feedback goes to the + input and the pot to the − input. Now if the output rises a little, V+ rises, so the output rises more. It runs away to the top rail and stays there (it latched high at power-up). Moving the pot does nothing.":"Feedback to the − input: the output corrects itself and follows the pot smoothly."};},
 ctl:[{k:"f",type:"range",label:"Pot",min:0,max:1,step:0.01,fmt:function(v){return fV(5*v);}},{k:"swap",type:"seg",label:"Feedback to",opts:[[true,"+ input ✗",1],[false,"− input ✓"]]}],
 text:`<p>The + and − pins are often drawn swapped between diagrams, chips and simulators. Wiring the feedback to the <b>+</b> pin is a classic mistake.</p>
<div class="why bad"><span class="k">What goes wrong</span>Feedback to + is <b>positive feedback</b>: any change pushes itself further. The output runs to a rail and latches there. The circuit becomes a comparator stuck in one state, and the input barely matters. (This is the same idea as the astable, where positive feedback is exactly what's wanted.)</div>
<div class="why fix"><span class="k">The fix</span>For an amplifier or buffer, the feedback always goes to the <b>− (inverting)</b> input. Check the chip's pinout: on the common 8-pin dual op-amp, pin 2 is −, pin 3 is +, and pin 1 is the output.</div>
<p class="hint">Deliberate positive feedback through a large resistor gives a comparator <b>hysteresis</b>: a small gap between its on and off points that stops it chattering. That's useful in the night light, but not by accident.</p>`},

{title:"Mistake: the forgotten power pins",part:"Mistake · Power",mist:true,init:{f:0.7,power:false},
 diag:function(s){var vp=5*(0.15+0.7*s.f),out=s.power?(vp>2.5?4.95:0.05):0;return {svg:compDiag(s,{vm:2.5,vp:vp,out:out,f:s.f,power:s.power}),bad:!s.power,
   meters:[["V+ (pot)",fV(vp),vp>2.5],["Output",s.power?(out>2.5?"high":"low"):"dead",s.power?out>2.5:"warn"]],
   now:s.power?"Powered: the comparator works.":"The op-amp has no supply, so it has nothing to make an output from. The output sits near 0 V whatever the inputs do. On a breadboard, a chip like this can also feed power in through its input pins and behave strangely."};},
 ctl:[{k:"f",type:"range",label:"Pot",min:0,max:1,step:0.01,fmt:function(v){return fV(5*(0.15+0.7*v));}},{k:"power",type:"tog",label:"V+ pin connected"}],
 text:`<p>Many diagrams, and many simulators, leave the op-amp's power pins <b>off the drawing</b>, assuming you know they're there. On a real chip they must be wired.</p>
<div class="why bad"><span class="k">What goes wrong</span>With no supply the op-amp is dead: its output can't go anywhere. Worse, signals on the inputs can partly power the chip through its internal protection diodes, so you get weird half-working behaviour that's hard to diagnose.</div>
<div class="why fix"><span class="k">The fix</span>Wire <b>V+ to the + rail</b> and <b>V− to the − rail</b> (or to the negative supply in a dual-supply circuit). On the 8-pin dual op-amp: pin 8 = V+, pin 4 = V−. Add a 100 nF capacitor from V+ to V− close to the chip. It's a standard habit that stops noise and oscillation.</div>
<div class="why"><span class="k">Also watch: inputs beyond the rails</span>Most op-amps misbehave if an input goes below the − rail or above the + rail (check “input common-mode range” in the datasheet). With a single 5 V supply, keep inputs between 0 and about 3.5–5 V depending on the part.</div>`},

{quiz:true,title:"Quick check: op-amps",part:"Check 1",qs:[
 {q:"With no feedback, V+ = 2.6 V and V− = 2.5 V. What does the output do?",o:["Outputs 0.1 V","Slams to the top rail","Outputs 2.55 V","Nothing, the inputs are too close"],c:1,w:"0.1 V × 100 000 is far more than the supply, so the output hits the top rail."},
 {q:"With negative feedback, what does an op-amp try to do?",o:["Make its output as big as possible","Make V− equal to V+","Draw current from its inputs","Turn itself off"],c:1,w:"That's golden rule 1. Rule 2: the inputs draw no current."},
 {q:"A non-inverting amplifier has Rf = 20 kΩ and Rg = 10 kΩ. Its gain is…",o:["×2","×3","×0.5","×30"],c:1,w:"1 + Rf ÷ Rg = 1 + 2 = 3."},
 {q:"Gain ×3, input 2 V, 5 V supply, rail-to-rail op-amp. The output is about…",o:["6 V","5 V (clipped at the rail)","2 V","0 V"],c:1,w:"It wants 6 V but can't exceed its supply."}
]},

{title:"Project: a night light",part:"Part 4 · Project",init:{light:0.7,f:0.5},
 diag:function(s){var Rl=100000*Math.pow(0.01,s.light),vl=5*10000/(Rl+10000),vp=5*(0.15+0.7*s.f),out=vp>vl?4.95:0.05;
   return {svg:compDiag(s,{vm:vl,vp:vp,out:out,f:s.f,ldr:true,potLabel:"set point"}),
   meters:[["Light level",Math.round(s.light*100)+"%",true],["LDR",fR(Math.round(Rl/100)*100),true],["Sensor voltage",fV(vl),vl>2.5],["Night light",out>2.5?"ON":"off",out>2.5]],
   now:out>2.5?"It's dark: the LDR's resistance is high, so the sensor voltage (V−) has fallen below the set point (V+). The output goes high and the LED lights.":"It's bright: the LDR's resistance is low, so the sensor voltage is above the set point. The output stays low and the LED is off."};},
 ctl:[{k:"light",type:"range",label:"Light",min:0,max:1,step:0.01,fmt:function(v){return Math.round(v*100)+"%";}},{k:"f",type:"range",label:"Set point",min:0,max:1,step:0.01,fmt:function(v){return fV(5*(0.15+0.7*v));}}],
 text:`<p>Everything together: a light that switches on when it gets dark.</p>
<ul><li>An <b>LDR</b> (light-dependent resistor) is about 1 kΩ in bright light and 100 kΩ or more in the dark.</li><li>The LDR and a 10 kΩ form a <b>divider</b>. Bright gives a high voltage, dark gives a low one. That goes to the − input.</li><li>The <b>pot</b> sets the switching point on the + input.</li><li>The op-amp <b>compares</b> them: when the sensor voltage drops below the set point, the output goes high and the LED lights.</li></ul>
<p>Slide the light level down slowly and find where it switches. Then move the set point and watch the switching light level change.</p>
<div class="why"><span class="k">Real-world snag</span>Right at the threshold, flickering light or noise can make the output chatter on and off. The cure is a little positive feedback (hysteresis), such as a 1 MΩ resistor from the output to the + input, so it switches on and off at slightly different levels.</div>`},

{quiz:true,title:"Final check: op-amps",part:"Final check",qs:[
 {q:"Your buffer's output is stuck at the top rail no matter what the input does. First thing to check?",o:["Whether the feedback goes to the + input instead of −","Whether the LED is red","The battery is too new","The pot is too big"],c:0,w:"Feedback to + is positive feedback, which latches the output at a rail."},
 {q:"Why did the LED dim the pot's voltage when connected straight to the wiper?",o:["Its current flowed through the pot's resistance and dropped voltage (loading)","LEDs make voltage","The pot was broken","Op-amps were missing"],c:0,w:"A divider only holds its voltage when almost no current is taken from it. Buffer it."},
 {q:"In the night light, what makes the output go high?",o:["The sensor voltage (V−) falling below the set point (V+) as it gets dark","The LDR getting hot","The pot turning off","Bright light"],c:0,w:"Dark → LDR resistance up → divider voltage down → below the set point → output high."},
 {q:"An LM358 on 5 V gives only about 3.5 V maximum out. Why?",o:["Its output can't get closer than about 1.5 V to its top rail","It's broken","Op-amps always lose half","The gain is too low"],c:0,w:"It's not a rail-to-rail part. Choose a rail-to-rail op-amp if you need the full range."},
 {q:"Which pins of an op-amp must always be wired, even if the diagram leaves them out?",o:["The power pins (V+ and V−)","Only the output","Only the + input","None"],c:0,w:"No power, no output."}
]},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>What are the three stages inside an op-amp, and what does each do?</summary><p>① A differential pair: two transistors share a fixed tail current, and the input difference decides the split. ② A gain stage: a transistor that turns that small change into a big voltage swing. ③ An output stage: an emitter follower (push-pull in real chips) that supplies load current without collapsing the gain stage.</p></details>
<details class="reveal"><summary>Why does feedback make the inputs equal?</summary><p>With huge gain, any difference between the inputs drives the output hard in the direction that removes it. The only resting point is where the difference is nearly zero. The bigger the gain, the closer to zero.</p></details>
<details class="reveal"><summary>1. What does an op-amp do with no feedback?</summary><p>It compares its inputs and slams the output to the top rail if V+ > V−, or to the bottom rail otherwise. That's a comparator.</p></details>
<details class="reveal"><summary>2. State the golden rules.</summary><p>With negative feedback, the output does whatever makes V− equal V+, and the inputs draw no current.</p></details>
<details class="reveal"><summary>3. Why does a buffer help?</summary><p>It copies a voltage without drawing current from the source, and supplies the load's current from its own power pins, so the source voltage doesn't sag.</p></details>
<details class="reveal"><summary>4. Four op-amp mistakes.</summary><p>Feedback to the + input (latches). Power pins not connected (dead or weird). Expecting output beyond the supply, or using a non-rail-to-rail part (clipping). Loading a divider directly.</p></details>
<h3>Build it in VoltSim</h3>
<p>Night light: 5 V battery, LDR + 10 kΩ divider into the op-amp's − input, a 10 kΩ pot (ends to the rails, wiper to the + input), op-amp power pins to both rails, output → 330 Ω → LED → − rail.</p>`}
])});
})();

/* ======================= MODULE: Wheatstone bridge ======================= */
(function(){
function ARROWLINE(x1,x2,y,txt){return '<path class="ref" style="stroke-width:1.4" d="M'+(x1+6)+' '+y+' H'+(x2-6)+'"/><path class="partf" style="fill:var(--muted)" d="M'+(x1+6)+' '+y+' l7 -4 v8 z M'+(x2-6)+' '+y+' l-7 -4 v8 z"/>'+TAG((x1+x2)/2,y-12,txt);}
function LEDR(x,y,b){return '<g transform="rotate(90 '+x+' '+y+')">'+LED(x,y,b)+'</g>';}
/* single divider with optional LED load */
function divDiag(s){
  var o="",R1=10000,R2=s.r2,vth=5*R2/(R1+R2),rth=R1*R2/(R1+R2),il=s.led?Math.max(0,(vth-1.9)/(rth+330)):0,v=vth-il*rth,b=clamp(il/9e-3,0,1),i1=(5-v)/R1;
  begin(22,262);
  o+=FLAG(160,50,clamp(i1/0.5e-3,0.2,1))+R(160,50,160,110,"R1 10 kΩ",-1)+W([160,110,160,150],v)+D(160,130,v)+R(160,150,160,210,"R2 "+fR(R2),-1)+GND(160,210,clamp((v/R2)/0.5e-3,0.2,1));
  if(s.led){o+=W([160,130,240,130,240,140],v)+R(240,140,240,180,"330 Ω")+W([240,180,240,190],il>0?"mid":false)+LED(240,210,b)+GND(240,230,b,"b");if(il>0)o+=F([160,130,240,130,240,140],"b",b)+F([240,180,240,190],"b",b);}
  o+=TAG(152,124,"Vout "+fV(v),"end");
  return {svg:finish(o,340,262,50),v:v,vth:vth,il:il};
}
/* bridge (no detector) */
function bridgeDiag(s,opt){
  var o="",V=opt.V||5,R1=10000,R2=10000,R3=opt.R3||10000,Rx=opt.Rx,va=V*R2/(R1+R2),vb=V*Rx/(R3+Rx),dv=vb-va;
  begin(22,262,V);
  var led=opt.led,il=0;
  o+=FLAG(110,50,0.3)+R(110,50,110,115,"R1 10k",-1)+W([110,115,110,155],va)+D(110,140,va)+R(110,155,110,215,"R2 10k",-1)+GND(110,215,0.3);
  o+=FLAG(250,50,0.3)+R(250,50,250,115,"R3 "+fR(R3))+W([250,115,250,155],vb)+D(250,140,vb)+R(250,155,250,215,"Rx "+fR(Math.round(Rx/100)*100))+GND(250,215,0.3);
  o+=T(98,144,"A","nlbl","end")+T(262,144,"B","nlbl","start");
  if(led){o+=W([110,140,125,140],va)+R(125,140,160,140,"")+W([160,140,165,140],va)+LEDR(185,140,0)+W([205,140,250,140],vb)+T(180,172,"LED + 330 Ω across A–B","blbl");}
  else o+=ARROWLINE(110,250,140,"ΔV = "+(dv>=0?"+":"")+fx(dv,3)+" V");
  o+=TAG(98,124,fV(va),"end")+TAG(262,124,fV(vb),"start");
  return {svg:finish(o,340,262,50),va:va,vb:vb,dv:dv};
}
/* thermostat */
function ntc(T){return 10000*Math.exp(3950*(1/(T+273.15)-1/298.15));}
function thermoDiag(s){
  var o="",Rt=ntc(s.T),va=2.5,vb=5*10000/(Rt+10000),swap=s.swap,hot=swap?(va>vb):(vb>va),out=hot?4.95:0.05,ih=hot?(out-1.9)/330:0,ic=hot?0:(5-1.9-out)/330,bh=clamp(ih/9e-3,0,1),bc=clamp(ic/9e-3,0,1);
  begin(22,262);
  o+=FLAG(100,50,0.3)+R(100,50,100,110,"R1 10k",-1)+W([100,110,100,150],va)+D(100,130,va)+R(100,150,100,210,"R2 10k",-1)+GND(100,210,0.3);
  o+=FLAG(200,50,0.3)+THERM(200,50,110,"NTC")+W([200,110,200,170],vb)+D(200,165,vb)+R(200,170,200,215,"R4 10k",-1)+GND(200,215,0.3);
  o+=W([100,130,270,130,270,135,280,135],va)+HOP(200,130,va);
  o+=W([200,165,280,165],vb);
  o+=OPAMP(290,150,"",false,swap)+FLAG(320,115,0.3,"b")+GND(320,185,0.3);
  o+=W([360,150,430,150],out)+D(380,150,out)+W([430,145,430,150],out);
  o+=R(380,150,380,190,"330 Ω",-1)+W([380,190,380,200],ih>0?"mid":false)+LED(380,220,bh)+GND(380,240,bh,"b")+T(392,252,"HOT","nlbl","start");
  o+=FLAG(430,50,bc,"b")+R(430,50,430,95,"330 Ω")+W([430,95,430,105],true)+LED(430,125,bc,true)+T(452,110,"COLD","nlbl","start");
  if(ih>0)o+=F([320,128,320,140,352,150,380,150,380,190],"b",bh)+F([380,190,380,200],"b",bh);
  if(ic>0)o+=F([430,95,430,105],"b",bc)+F([430,145,430,150,362,150],"b",bc)+F([320,172,320,185],"b",bc);
  o+=TAG(92,124,fV(va),"end")+TAG(212,180,fV(vb),"start")+T(90,148,"A","nlbl","end")+T(212,160,"B","nlbl","start");
  return {svg:finish(o,470,262,50,true),va:va,vb:vb,hot:hot,Rt:Rt};
}

MODS.push({id:"bridge",n:8,title:"Wheatstone bridge",blurb:"Two voltage dividers side by side measure tiny changes. Build a thermostat that lights HOT or COLD.",mistakes:"Loading a divider, an LED across the bridge, mismatched ratios, swapped comparator inputs.",
steps:[
{title:"The voltage divider",part:"Part 1 · Dividers",init:{r2:10000,led:false},
 diag:function(s){var d=divDiag(s);return {svg:d.svg,meters:[["Vout (calculated)",fV(d.vth),true],["Vout (actual)",fV(d.v),Math.abs(d.v-d.vth)>0.05?"warn":true],["LED current",fI(d.il),d.il>1e-4]],
   now:s.led?"With the LED connected, current is drawn from the middle point. That current flows through R1, which drops extra voltage, so Vout sags below the formula's value. The divider is being loaded.":"Two resistors in series share the 5 V in proportion to their resistance. Equal resistors give exactly half: 2.5 V."};},
 ctl:[{k:"r2",type:"seg",label:"R2",opts:[[4700,"4.7k"],[10000,"10k"],[22000,"22k"],[47000,"47k"]]},{k:"led",type:"tog",label:"LED load on Vout"}],
 text:`<p>Two resistors in series across a supply make a <b>voltage divider</b>. The middle point sits at a fixed fraction of the supply:</p>
<div class="formula">Vout = V × R2 ÷ (R1 + R2)</div>
<p>R1 = R2 gives half. Make R2 bigger and Vout rises.</p>
<p>Dividers are everywhere: a pot is an adjustable divider, and most sensors (LDRs, thermistors) are used as one half of a divider, turning a change in resistance into a change in voltage.</p>
<div class="why bad"><span class="k">Common mistake: loading the divider</span>The formula assumes <b>no current is taken from the middle</b>. Switch on the LED load and watch Vout drop below its calculated value. Connect dividers only to inputs that draw almost nothing, like an op-amp input or a large base resistor (see the Op-amps module).</div>`},

{title:"Two dividers make a bridge",part:"Part 2 · The bridge",init:{rx:10000},
 diag:function(s){var d=bridgeDiag(s,{Rx:s.rx});var bal=Math.abs(d.dv)<0.005;return {svg:d.svg,
   meters:[["A",fV(d.va),true],["B",fV(d.vb),true],["Difference B − A",(d.dv>=0?"+":"")+fx(d.dv,3)+" V",bal?true:"warn"],["Bridge",bal?"balanced":"out of balance",bal]],
   now:bal?"Balanced: R1/R2 equals R3/Rx, so A and B are at exactly the same voltage and the difference is zero.":"Out of balance. Rx is "+(d.dv>0?"bigger":"smaller")+" than R3, so B is "+(d.dv>0?"above":"below")+" A. The sign tells you which way, and the size tells you how far."};},
 ctl:[{k:"rx",type:"range",label:"Rx",min:5000,max:20000,step:100,fmt:function(v){return fR(Math.round(v/100)*100);}}],
 text:`<p>A <b>Wheatstone bridge</b> is two dividers side by side, sharing the same supply. We don't watch each middle voltage on its own. We watch the <b>difference</b> between them.</p>
<ul><li>The left divider (R1, R2) is the <b>reference</b>: point A sits at 2.5 V.</li><li>The right divider has the unknown or sensing resistor <b>Rx</b>: point B moves as Rx changes.</li></ul>
<div class="formula">Balanced (difference = 0) when R1 ÷ R2 = R3 ÷ Rx</div>
<p>Move Rx through 10 kΩ. At balance the difference is exactly zero. Either side of it, the difference grows, and it changes sign.</p>
<div class="why"><span class="k">Why measure a difference?</span>Spotting a change from 0 V to 0.01 V is easy. Spotting a change from 2.500 V to 2.510 V is hard. The bridge cancels out the big, boring 2.5 V and leaves only the small, interesting change. Strain gauges, load cells (kitchen scales) and precise temperature sensors all use bridges.</div>
<p class="hint">The arrow between A and B is not a wire. It just shows the voltage difference you'd measure.</p>`},

{title:"Why a bridge ignores the battery voltage",part:"Part 2 · The bridge",init:{rx:10000,V:5},
 diag:function(s){var d=bridgeDiag(s,{Rx:s.rx,V:s.V});var bal=Math.abs(d.dv)<0.005;return {svg:d.svg,
   meters:[["Battery",s.V+" V",true],["A",fV(d.va),true],["B",fV(d.vb),true],["Balanced at Rx =","10 kΩ (any battery voltage)",true]],
   now:"Drop the battery from 5 V to 4 V (as if it's running down). A and B both shift, but they shift together, so the balance point stays at Rx = 10 kΩ. A single divider compared against a fixed 2.5 V reference would drift with the battery."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:[[5,"5 V"],[4,"4 V (running down)"]]},{k:"rx",type:"range",label:"Rx",min:5000,max:20000,step:100,fmt:function(v){return fR(Math.round(v/100)*100);}}],
 text:`<p>Here's the bridge's second big advantage. Both dividers are fed from the <b>same supply</b>, so if the supply changes, both middle points change by the same proportion.</p>
<p>At balance, A and B are both exactly half the supply, whatever the supply is. So the <b>balance point doesn't move</b> when the battery runs down.</p>
<div class="why"><span class="k">Compare</span>A thermostat built from one divider and a fixed “switch at 2.5 V” threshold would change its switching temperature as the battery drained. Built as a bridge, the reference drifts along with the sensor, and the error cancels out.</div>`},

{quiz:true,title:"Quick check: dividers and bridges",part:"Check 1",qs:[
 {q:"R1 = 10 kΩ on top, R2 = 30 kΩ on the bottom, 4 V supply. Vout =",o:["1 V","3 V","2 V","4 V"],c:1,w:"4 × 30 ÷ (10 + 30) = 3 V."},
 {q:"When is a Wheatstone bridge balanced?",o:["When R1 ÷ R2 = R3 ÷ Rx, so A and B are at the same voltage","When all resistors are 10 kΩ, and only then","When the battery is full","When the difference is 2.5 V"],c:0,w:"Equal ratios give equal middle voltages. That's a zero difference."},
 {q:"Why did connecting an LED to the divider's middle lower its voltage?",o:["It drew current through R1, adding an extra voltage drop (loading)","LEDs absorb voltage","The formula changed","R2 got hotter"],c:0,w:"The divider formula only holds when nothing draws current from the middle."},
 {q:"The battery drops from 5 V to 4 V. What happens to the bridge's balance point?",o:["It stays at the same Rx","It moves to a 20% smaller Rx","It moves to a 20% bigger Rx","The bridge stops working"],c:0,w:"Both sides scale together, so the balance point is independent of supply voltage."}
]},

{title:"Project: a HOT/COLD thermostat",part:"Part 3 · Project",init:{T:20,swap:false},
 diag:function(s){var d=thermoDiag(s);return {svg:d.svg,
   meters:[["Temperature",s.T+" °C",true],["Thermistor",fR(Math.round(d.Rt/10)*10),true],["B − A",(d.vb-d.va>=0?"+":"")+fx(d.vb-d.va,3)+" V",d.vb>d.va],["Indicator",d.hot?"HOT":"COLD",d.hot?"warn":true]],
   now:d.hot?"Above 25 °C: the thermistor's resistance has dropped below 10 kΩ, so B rises above A. The op-amp compares them: + (B) is higher, so the output goes high. Current flows output → 330 Ω → HOT LED → − rail.":"Below 25 °C: the thermistor is above 10 kΩ, so B is below A. The output is low. Now current flows + rail → 330 Ω → COLD LED → into the output, which sinks it to the − rail."};},
 ctl:[{k:"T",type:"range",label:"Temperature",min:0,max:50,step:1,fmt:function(v){return v+" °C";}}],
 text:`<p>Now a real sensor: an <b>NTC thermistor</b>, a resistor whose resistance <b>drops</b> as it warms up (NTC = negative temperature coefficient). This one is 10 kΩ at 25 °C.</p>
<ul><li>Left divider: R1 and R2, both 10 kΩ, so A = 2.5 V. This is the set point.</li><li>Right divider: thermistor on top, 10 kΩ below. Warmer means lower thermistor resistance, so B rises.</li><li>The <b>op-amp comparator</b> watches B (+) against A (−).</li></ul>
<p>The output drives <b>two</b> LEDs:</p>
<ul><li><b>HOT</b> (red) from the output down to the − rail. It lights when the output is high.</li><li><b>COLD</b> (green) from the + rail down into the output. It lights when the output is low, because the output then sinks its current to the − rail.</li></ul>
<p>Slide the temperature through 25 °C and watch the indicator swap. At exactly balance, a real comparator would flicker. The night light's hysteresis tip applies here too.</p>
<div class="why"><span class="k">Changing the set point</span>Replace R2 with a 10 kΩ pot plus a resistor and you can tune the switching temperature. You're changing the reference side's ratio.</div>`},

{title:"Mistakes: an LED across the bridge, and mismatched ratios",part:"Mistake · Bridge",mist:true,init:{rx:15000,led:true,R3:10000},
 diag:function(s){var d=bridgeDiag(s,{Rx:s.rx,led:s.led,R3:s.R3});var bal=Math.abs(d.dv)<0.005,canBal=s.R3===10000;return {svg:d.svg,bad:s.led||!canBal,
   meters:[["B − A",(d.dv>=0?"+":"")+fx(d.dv,3)+" V",bal?true:"warn"],["LED",s.led?"never lights":"not fitted",s.led?"warn":true],["Can balance?",canBal?"yes, at Rx = 10 kΩ":"no, it needs Rx = 1 kΩ (off the scale)",canBal?true:"warn"]],
   now:s.led?"The LED between A and B never lights. The biggest difference this bridge can make is about 1 V, and an LED needs about 2 V before it conducts. Even if it did light, its current would load both dividers and wreck the measurement.":!canBal?"R3 is 1 kΩ while R1 and R2 are 10 kΩ. Balance now needs Rx = 1 kΩ, outside the sensor's range, so the difference never crosses zero and the indicator would be stuck on one side.":"With matched ratios the bridge balances at 10 kΩ."};},
 ctl:[{k:"led",type:"tog",label:"LED across A–B",bad:1},{k:"R3",type:"seg",label:"R3",opts:[[10000,"10 kΩ ✓"],[1000,"1 kΩ ✗",1]]},{k:"rx",type:"range",label:"Rx",min:5000,max:20000,step:100,fmt:function(v){return fR(Math.round(v/100)*100);}}],
 text:`<h3>1. An LED straight across the bridge</h3>
<div class="why bad"><span class="k">What goes wrong</span>It seems natural: “light up when out of balance”. But the bridge's difference voltage is small (here at most about 1 V), and an LED needs about 2 V to conduct, so it never lights. A bridge's output is a <b>signal</b>, not a power source. Taking current from it loads both dividers.</div>
<div class="why fix"><span class="k">The fix</span>Feed A and B into something that draws almost no current: an op-amp comparator (previous step) or an amplifier, and let that drive the LEDs.</div>
<h3>2. Ratios that can't balance</h3>
<div class="why bad"><span class="k">What goes wrong</span>If R3 is 1 kΩ while the others are 10 kΩ, balance needs Rx = 1 kΩ. If the sensor never gets that low, the difference never crosses zero. The output is stuck and it looks like a dead sensor.</div>
<div class="why fix"><span class="k">The fix</span>Choose the fixed resistors so balance happens in the middle of the sensor's range. Usually R3 equals the sensor's resistance at the set point (10 kΩ at 25 °C for this thermistor).</div>`},

 diag:function(s){var d=thermoDiag(s);return {svg:d.svg,bad:s.swap,
   meters:[["Temperature",s.T+" °C",true],["Indicator",d.hot?"HOT":"COLD",s.swap?"warn":true],["Correct?",s.swap?"no, backwards":"yes",s.swap?"warn":true]],
   now:s.swap?"A goes to + and B to −, so the comparison is backwards. At "+s.T+" °C it shows "+(d.hot?"HOT":"COLD")+", the opposite of the truth. Nothing is broken, which makes it easy to miss.":"Correct: B (the sensor side) on +, A (the reference) on −."};},
 ctl:[{k:"T",type:"range",label:"Temperature",min:0,max:50,step:1,fmt:function(v){return v+" °C";}},{k:"swap",type:"seg",label:"Inputs",opts:[[true,"swapped ✗",1],[false,"correct ✓"]]}],
 text:`<div class="why bad"><span class="k">What goes wrong</span>Swap the op-amp's + and − inputs and every decision flips: HOT when it's cold, COLD when it's hot. Everything works, just backwards. In a heater controller that means heating when it's already hot.</div>
<div class="why fix"><span class="k">The fix</span>Work out one case by hand before you build. “When it's hot, B is higher. I want the output high when hot, so B must go to the + input.” Then test both extremes (0 °C and 50 °C) and confirm each indicator.</div>
<p class="hint">Swapping the thermistor and R4 has the same effect, because B would then fall when it's hot. Either fix works, as long as you reason it through.</p>`},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. What is a voltage divider and when does its formula fail?</summary><p>Two resistors in series. Vout = V × R2 ÷ (R1 + R2). It fails when something draws significant current from the middle point (loading).</p></details>
<details class="reveal"><summary>2. What is a Wheatstone bridge?</summary><p>Two dividers fed from the same supply. You measure the difference between their middle points: zero at balance (R1/R2 = R3/Rx), with the sign showing which way it's out.</p></details>
<details class="reveal"><summary>3. Two advantages of a bridge.</summary><p>It cancels the large common voltage so tiny changes stand out, and the balance point doesn't depend on the supply voltage.</p></details>
<details class="reveal"><summary>4. How does the thermostat decide HOT or COLD?</summary><p>Warmer means lower NTC resistance, so B rises. The comparator outputs high when B (+) is above A (−), lighting HOT. When low, the output sinks current from the COLD LED.</p></details>
<h3>Build it in VoltSim</h3>
<p>5 V battery. R1 = R2 = 10 kΩ (point A). NTC thermistor (10 kΩ at 25 °C) on top with 10 kΩ below (point B). Op-amp with power pins to both rails, B → +, A → −. Output → 330 Ω → red LED → − rail, and + rail → 330 Ω → green LED → output. If your simulator has no thermistor, use a pot in its place and turn it.</p>`}

  if(t.id==="retry"){step().qs.forEach(function(q,j){delete QA[qkey(cur,j)];delete ORDER[qkey(cur,j)];});save("answers",QA);renderStep(false);return;}

  if(!MOD)return;var st=step(),s=S(cur);
  if(t.dataset.k){s[t.dataset.k]=!s[t.dataset.k];changed(t.dataset.k);return;}
  if(t.dataset.seg!=null){var c=st.ctl[+t.dataset.seg],v=JSON.parse(t.dataset.v);if(c.set)c.set(s,v);else s[c.k]=v;changed(c.k);return;}
  if(t.dataset.act!=null){st.ctl[+t.dataset.act].run(s);refreshCtl();updateLive();return;}
});
document.getElementById("home").addEventListener("click",renderHome);
document.addEventListener("input",function(e){var t=e.target;if(t.dataset.rng==null||!MOD)return;var c=step().ctl[+t.dataset.rng],s=S(cur);s[c.k]=+t.value;t.nextElementSibling.textContent=c.fmt(s[c.k]);var st=step();if(st.onChange)st.onChange(s,c.k);updateLive();});
function holdSet(t,v){if(!MOD)return;var s=S(cur);s[t.dataset.hold]=v;t.classList.toggle("down",v);var st=step();if(st.onChange)st.onChange(s,t.dataset.hold);}
document.addEventListener("pointerdown",function(e){var t=e.target.closest("[data-hold]");if(!t)return;e.preventDefault();try{t.setPointerCapture(e.pointerId);}catch(_){}holdSet(t,true);});
["pointerup","pointercancel"].forEach(function(ev){document.addEventListener(ev,function(e){var t=e.target.closest("[data-hold]");if(t)holdSet(t,false);else{var d=document.querySelector(".hold.down");if(d)holdSet(d,false);}});});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.hold&&(e.key===" "||e.key==="Enter")){e.preventDefault();if(!e.repeat)holdSet(t,true);return;}
  if(t.closest&&t.closest("input,textarea"))return;
  if(!MOD)return;
  if(e.key==="ArrowRight"){var st=step();if(cur<MOD.steps.length-1&&(!st.quiz||quizDone(cur)))go(cur+1);}
  if(e.key==="ArrowLeft")go(cur-1);
});
document.addEventListener("keyup",function(e){var t=e.target;if(t.dataset&&t.dataset.hold&&(e.key===" "||e.key==="Enter"))holdSet(t,false);});
document.addEventListener("pointermove",function(e){var sv=e.target.closest&&e.target.closest("#scopesvg");if(!sv){if(HOVER!=null&&!e.target.closest(".scope"))HOVER=null;return;}var r=sv.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width;HOVER=clamp((x-40)/(360-52),0,1);});
document.addEventListener("pointerleave",function(){HOVER=null;},true);

/* ---------- animation loop ---------- */
var lastTs=0,frame=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=lastTs?Math.min(0.05,(ts-lastTs)/1000):0.016;lastTs=ts;
  if(!MOD)return;var st=step();if(!st||!st.diag||st.quiz||st.final)return;
  if(!REDUCED)PH+=dt*26;
  var s=S(cur);
  if(st.sim&&!s.paused){var k=typeof st.timeScale==="function"?st.timeScale(s):(st.timeScale||1);var sd=dt*k;s.t+=sd;st.sim(s,sd);}
  frame++;if(frame%2===0)updateLive();
}
var v0=load("view",null);if(v0&&modById(v0))openMod(v0);else renderHome();
requestAnimationFrame(loop);
/* ======================= GitHub Pages extras: version, menu, full screen, self-update ======================= */
const VERSION='v1 · 11 Oct 2026';
XOR_URL="xor-from-scratch.html";
(function(){
  var css=document.createElement("style");
  css.textContent=".pbar{display:flex;gap:8px;align-items:center}.mbtn{font:600 15px var(--mono);border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer}"+
  ".ver{font:500 13px var(--mono);color:var(--muted)}.ios,.upd{font-size:14px;background:var(--note-bg);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}"+
  ".upd{border-left:3px solid var(--hi)}.menu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) 16px 16px}"+
  ".sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%;display:grid;gap:10px;box-shadow:var(--shadow)}.sheet h2{margin:0;font-size:22px}";
  document.head.appendChild(css);
  var fsRoot=document.documentElement,fsReq=fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  function goFs(){if(!fsReq||isFs())return;try{var p=fsReq.call(fsRoot,{navigationUI:"hide"});if(p&&p.catch)p.catch(function(){});}catch(e){}}
  function toggleFs(){if(isFs()){try{var p=fsExit.call(document);if(p&&p.catch)p.catch(function(){});}catch(e){}}else goFs();}
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var standalone=window.navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: fullscreen)").matches);
  var newVersion=null;

  /* header: menu button */
  var brand=document.querySelector(".brand"),cnt=document.getElementById("count"),bar=document.createElement("div");bar.className="pbar";
  brand.insertBefore(bar,cnt);bar.appendChild(cnt);
  var mb=document.createElement("button");mb.className="mbtn";mb.textContent="☰";mb.setAttribute("aria-label","Menu");bar.appendChild(mb);
  mb.addEventListener("click",openMenu);
  function openMenu(){

    m.innerHTML='<div class="sheet" role="dialog" aria-label="Menu"><h2>☰ Menu</h2><div class="ver">Circuits from Scratch · version '+VERSION+'</div>'+
      (fsReq?'<button class="btn primary" id="mFs">'+(isFs()?"Exit full screen":"Full screen")+'</button>':'<div class="hint">Full screen: Share → Add to Home Screen.</div>')+
      '<button class="btn" id="mHome">All modules</button><button class="btn" id="mUpd">Check for updates</button><button class="btn" id="mClose">Close</button><div class="hint" id="mMsg"></div></div>';
    document.body.appendChild(m);

      else if(t.id==="mUpd"){document.getElementById("mMsg").textContent="Checking…";check().then(function(){document.getElementById("mMsg").textContent=newVersion?"Version "+newVersion+" is available.":"You're on the latest version.";});}});
  }
  /* full screen on the first module tap */
  document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-mod]");if(t)goFs();},true);

  /* front screen: version, iOS hint, update banner */

    var d=document.createElement("div");d.style.cssText="display:grid;gap:8px;margin-top:10px";

  document.addEventListener("click",function(e){if(e.target.id==="updGo")location.href=location.pathname+"?v="+encodeURIComponent((newVersion||"").split(" ")[0]);});
  function check(){return fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){var m=t.match(/const VERSION='([^']+)'/);if(m&&m[1]!==VERSION){newVersion=m[1];banner();}}).catch(function(){});}
  check();setInterval(check,4*60*1000);
  if(!MOD)renderHome();
})();

})();
