<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circuits from Scratch</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="circuits-from-scratch.webmanifest">
<meta name="theme-color" content="#0E1317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circuits">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --canvas:#F6F8F9; --grid:#E1E6EA;
  --ink:#16212B; --muted:#56646F; --line:#CCD4DA;
  --wire:#9AA6B0; --hi:#16935F; --mid:#7DBFA2; --neg:#7A5BD0; --flow:#E09A12;
  --led:#E0433F; --glow:#FF6A5C; --ledg:#1FA463; --glowg:#3BD48A; --accent:#1C5D7A; --accent-ink:#FFFFFF;
  --good:#16935F; --good-bg:#E3F4EC; --bad:#C23B35; --bad-bg:#FBE9E7; --note-bg:#EEF4F7;
  --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(22,33,43,.06),0 6px 24px rgba(22,33,43,.06);
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1317; --panel:#161E24; --canvas:#11181D; --grid:#1C262D;
  --ink:#E3E9ED; --muted:#93A2AD; --line:#2A3740;
  --wire:#56656F; --hi:#35C98A; --mid:#2F7F5E; --neg:#9C84F0; --flow:#F5B53A;
  --led:#FF5A52; --glow:#FF6A5C; --ledg:#2FD07E; --glowg:#3BD48A; --accent:#5DB0D2; --accent-ink:#0C1216;
  --good:#35C98A; --good-bg:#15302A; --bad:#FF6E66; --bad-bg:#3A1C1C; --note-bg:#172731;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1317; --panel:#161E24; --canvas:#11181D; --grid:#1C262D;
  --ink:#E3E9ED; --muted:#93A2AD; --line:#2A3740;
  --wire:#56656F; --hi:#35C98A; --mid:#2F7F5E; --neg:#9C84F0; --flow:#F5B53A;
  --led:#FF5A52; --glow:#FF6A5C; --ledg:#2FD07E; --glowg:#3BD48A; --accent:#5DB0D2; --accent-ink:#0C1216;
  --good:#35C98A; --good-bg:#15302A; --bad:#FF6E66; --bad-bg:#3A1C1C; --note-bg:#172731;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1140px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 22px/1.1 var(--display);letter-spacing:.01em;margin:0;cursor:pointer}
.brand h1 span{color:var(--hi)}
.brand .crumb{font:600 15px var(--display);color:var(--muted)}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots button{flex:1 1 0;min-width:4px;height:28px;border:0;background:none;padding:0;cursor:pointer;position:relative}
.dots button::after{content:"";position:absolute;left:0;right:0;top:10px;height:8px;border-radius:2px;background:var(--line)}
.dots button.done::after{background:var(--mid)}
.dots button.quiz::after{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.dots button.quiz.done::after{background:var(--mid);box-shadow:none}
.dots button.mist::after{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px var(--bad)}
.dots button.mist.done::after{background:var(--bad)}
.dots button.cur::after{background:var(--accent);box-shadow:none}
.dots button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
main.step.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow.mist{color:var(--bad)}
h2{font:600 clamp(22px,3.2vw,30px)/1.15 var(--display);margin:4px 0 0;text-wrap:balance}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.cols .text{order:-1}}
.lab{display:grid;gap:12px;position:sticky;top:110px}
@media (max-width:860px){.lab{position:static}}
.canvas{background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.canvas svg{display:block;width:100%;height:auto}
.canvas svg.wide{min-width:540px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{font:600 14px var(--mono);display:inline-flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tog .knob{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s;flex:none}
.tog .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tog[aria-pressed="true"]{border-color:var(--hi)}
.tog[aria-pressed="true"] .knob{background:var(--hi)}
.tog[aria-pressed="true"] .knob::after{transform:translateX(16px)}
.tog.bad[aria-pressed="true"]{border-color:var(--bad)}
.tog.bad[aria-pressed="true"] .knob{background:var(--bad)}
.tog .st{font-size:12px;color:var(--muted);min-width:2.2em}
.hold{font:600 14px var(--mono);padding:9px 16px;border-radius:8px;border:1.5px dashed var(--accent);background:var(--panel);color:var(--accent);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold.down{background:var(--accent);color:var(--accent-ink);border-style:solid}
.seg{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;font:500 13px var(--mono)}
.seg .sl{padding:0 10px;color:var(--muted)}
.seg button{font:600 13px var(--mono);border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.bad[aria-pressed="true"]{background:var(--bad);color:#fff}
.rng{display:flex;align-items:center;gap:10px;font:500 13px var(--mono);flex:1 1 260px;min-width:0}
.rng input{flex:1;min-width:80px;accent-color:var(--accent)}
.rng output{min-width:6.5em;font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--body);padding:9px 16px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tog:focus-visible,.opt:focus-visible,.seg button:focus-visible,.hold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meters{display:flex;flex-wrap:wrap;gap:6px}
.meter{font:500 13px var(--mono);padding:5px 9px;border-radius:6px;background:var(--canvas);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.meter b{color:var(--muted);font-weight:500;margin-right:6px}
.meter.hi{border-color:var(--hi);color:var(--hi)}
.meter.warn{border-color:var(--bad);color:var(--bad)}
.now{font-size:15px;background:var(--note-bg);border-radius:8px;padding:10px 12px;border-left:3px solid var(--flow);min-height:4.5em}
.now.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.now strong{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--muted);margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend .l-hi{background:var(--hi)} .legend .l-lo{background:var(--wire)} .legend .l-neg{background:var(--neg)}
.legend .l-fl{background:repeating-linear-gradient(90deg,var(--flow) 0 3px,transparent 3px 7px)}
.scope{border:1px solid var(--line);border-radius:8px;background:var(--canvas);padding:8px 6px 4px}
.scope svg{display:block;width:100%;height:auto;touch-action:pan-y}
.scope .sk{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.sleg{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);padding:2px 6px}
.sleg i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px}
.text{max-width:64ch}
.text p{margin:0 0 12px}
.text h3{font:600 17px/1.3 var(--display);margin:18px 0 6px}
.text ul,.text ol{margin:0 0 12px;padding-left:22px}
.text li{margin-bottom:5px}
.why{background:var(--note-bg);border-radius:8px;padding:12px 14px;margin:14px 0}
.why .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.why.bad{background:var(--bad-bg)} .why.bad .k{color:var(--bad)}
.why.fix{background:var(--good-bg)} .why.fix .k{color:var(--good)}
.formula{font:500 15px var(--mono);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:inline-block;margin:2px 0 12px}
table.tt{border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
table.tt th,table.tt td{padding:4px 12px;text-align:center;border-bottom:1px solid var(--line)}
table.tt th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.05em}
table.tt tr.on td{background:var(--good-bg);color:var(--good);font-weight:600}
table.cmp{border-collapse:collapse;font-size:14px;margin-bottom:12px;width:100%;display:block;overflow-x:auto}
table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{font:600 12px var(--mono);color:var(--muted)}
.ttwrap{overflow-x:auto}
nav.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.hint{font-size:13px;color:var(--muted)}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.quiz{display:grid;gap:16px;max-width:760px}
.q{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.q .qn{font:600 12px var(--mono);color:var(--muted)}
.q .qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:6px}
.opt{text-align:left;font:15px/1.45 var(--body);padding:9px 12px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:14px;padding:8px 12px;border-radius:6px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.score{font:600 15px var(--mono)}
.mod .needs{font-size:13px;color:var(--muted);display:block;margin-top:4px}
.pf{font-weight:700;padding:2px 8px;border-radius:5px;margin-right:6px}.pf.pass{background:var(--good-bg);color:var(--good)}.pf.fail{background:var(--bad-bg);color:var(--bad)}
details.reveal{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}
details.reveal summary{cursor:pointer;font-weight:600}
details.reveal p{margin:8px 0 0}
table.parts{border-collapse:collapse;font-size:14px;margin-bottom:12px}
table.parts td,table.parts th{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left}
table.parts th{font:600 12px var(--mono);color:var(--muted)}
/* home */
.home{display:grid;gap:18px}
.intro{max-width:70ch}
.intro h2{margin-bottom:8px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod{display:grid;gap:8px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.mod:hover{border-color:var(--accent)}
.mod .n{font:600 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.mod h3{font:600 19px/1.2 var(--display);margin:0}
.mod p{margin:0;font-size:14px;color:var(--muted)}
.mod .mistakes{font-size:13px;color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi)}
.mod .meta{font:500 12px var(--mono);color:var(--muted);display:flex;justify-content:space-between}
/* svg */
svg text{font-family:var(--mono)}
.w{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.w.hi{stroke:var(--hi)} .w.mid{stroke:var(--mid)} .w.neg{stroke:var(--neg)} .w.bad{stroke:var(--bad)}
.dot{fill:var(--wire)} .dot.hi{fill:var(--hi)} .dot.mid{fill:var(--mid)} .dot.neg{fill:var(--neg)} .dot.bad{fill:var(--bad)}
.part{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.part.badp{stroke:var(--bad)}
.partf{fill:var(--ink)}
.body{fill:var(--canvas);stroke:var(--muted);stroke-width:1.2}
.body.on{fill:var(--good-bg);stroke:var(--hi)}
.body.dead{fill:var(--bad-bg);stroke:var(--bad)}
.bg{stroke:var(--canvas);stroke-width:7;fill:none}
.flow{fill:none;stroke:var(--flow);stroke-linecap:round;stroke-linejoin:round}
.flow.s{stroke-width:2.2;stroke-dasharray:2 10}
.flow.b{stroke-width:3.6;stroke-dasharray:4 8}
.flow.x{stroke-width:5;stroke-dasharray:6 6;stroke:var(--bad)}
.lbl{fill:var(--muted);font-size:11px}
.nlbl{fill:var(--ink);font-size:12px;font-weight:600}
.blbl{fill:var(--bad);font-size:12px;font-weight:600}
.tag{fill:var(--panel);stroke:var(--line)}
.tagt{fill:var(--ink);font-size:11px;font-weight:600}
.ledtri{stroke:var(--ink);stroke-width:1.8;fill:var(--canvas)}
.glow{fill:var(--glow)} .glow.g{fill:var(--glowg)}
.burn{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.float{animation:flick .35s steps(2) infinite}
@keyframes flick{50%{opacity:.25}}
.grid{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--muted);font-size:10px}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.trace{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.t1{stroke:var(--s1)} .t2{stroke:var(--s2)} .f1{fill:var(--s1)} .f2{fill:var(--s2)}
.cross{stroke:var(--ink);stroke-width:1;opacity:.5}
/* phones: compact header, big tap targets, diagrams fit the width (tap to zoom) */
.zoomhint{display:none}
@media (pointer:coarse){.tog,.seg button,.btn,.hold,.opt,.mbtn{min-height:44px}.seg{flex-wrap:wrap}.seg button{padding:8px 13px}.rng input{min-height:36px}}
@media (max-width:700px){
  .brand h1{font-size:18px}
  header.top{padding-block:8px 4px;gap:4px}
  .crumb{font-size:13px}
  main.step{padding:16px;gap:14px}
  h2{font-size:21px}
  .canvas svg.wide{min-width:0}
  .canvas.zoom svg.wide{min-width:600px}
  .lab:has(svg.wide) .zoomhint{display:block}
}
main.step>*,.cols>*,.lab>*{min-width:0}
@media (max-width:420px){.brand h1 span{display:none}.rng{flex-wrap:wrap;gap:4px 10px}.rng input{flex:1 1 100%;order:3}.rng output{min-width:0}}
@media (max-height:520px){header.top{position:static}}
@media (prefers-reduced-motion:reduce){
  .float{animation:none} main.step.enter{animation:none}
  .tog .knob,.tog .knob::after{transition:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="home" title="All modules">Circuits <span>from scratch</span></h1><div class="count" id="count"></div></div>
    <div class="crumb" id="crumb"></div>
    <div class="dots" id="dots" aria-label="Steps"></div>
  </header>
  <main class="step" id="step" aria-live="polite"></main>
</div>

<script>
(function(){
"use strict";
/* ================= storage ================= */
function load(k,d){try{var v=localStorage.getItem("cfs-"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("cfs-"+k,JSON.stringify(v));}catch(e){}}
var REDUCED=false;try{REDUCED=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
var PH=0; /* global flow phase, advanced by the animation loop */

/* ================= tiny helpers ================= */
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function fx(v,d){return (Math.abs(v)<5e-4?0:v).toFixed(d==null?2:d);}
function fV(v){return fx(v,2)+" V";}
function fI(a){a=Math.abs(a);if(a>=1)return fx(a,2)+" A";if(a>=1e-3)return (a*1e3).toFixed(a>=0.01?0:1)+" mA";if(a>=1e-6)return Math.round(a*1e6)+" µA";return "0";}
function fR(r){return r>=1e6?(r/1e6)+" MΩ":r>=1000?(r/1000)+" kΩ":r+" Ω";}
function fC(c){return c>=1e-6?Math.round(c*1e6)+" µF":c>=1e-9?Math.round(c*1e9)+" nF":Math.round(c*1e12)+" pF";}
function fT(t){return t>=1?fx(t,2)+" s":t>=1e-3?(t*1e3).toFixed(t>=0.01?0:1)+" ms":Math.round(t*1e6)+" µs";}
function b01(x){return x?1:0;}

/* ================= SVG primitives ================= */
function pl(a){var s="";for(var i=0;i<a.length;i+=2)s+=a[i]+","+a[i+1]+" ";return s;}
/* voltage -> wire class. true/false = logic; numbers are real volts */
function vc(v){if(v===true)return "hi";if(v===false||v==null)return "lo";if(v==="mid"||v==="neg"||v==="bad"||v==="hi"||v==="lo")return v;
  if(typeof v==="number"){if(v<-0.05)return "neg";if(v>=2.5)return "hi";if(v>=0.9)return "mid";return "lo";}return "lo";}
function W(a,v){return '<polyline class="w '+vc(v)+'" points="'+pl(a)+'"/>';}
/* current flow: sz s|b|x, k = strength 0..1 (fades the dashes) */
function F(a,sz,k){if(k===false||k===0||(typeof k==="number"&&k<0.015))return "";k=(k==null||k===true)?1:clamp(k,0,1);sz=sz||"s";
  var off=-(PH*(sz==="s"?1:1.6))%12;
  return '<polyline class="flow '+sz+'" style="stroke-dashoffset:'+off.toFixed(2)+';opacity:'+(0.3+0.7*k).toFixed(2)+'" points="'+pl(a)+'"/>';}
function D(x,y,v){return '<circle class="dot '+vc(v)+'" cx="'+x+'" cy="'+y+'" r="3.4"/>';}
function T(x,y,s,c,a){return '<text class="'+(c||"lbl")+'" x="'+x+'" y="'+y+'" text-anchor="'+(a||"middle")+'">'+s+'</text>';}
function TAG(x,y,s,a){var w=s.length*6.6+10,x0=a==="end"?x-w:a==="start"?x:x-w/2;
  return '<rect class="tag" x="'+x0.toFixed(1)+'" y="'+(y-10)+'" width="'+w.toFixed(1)+'" height="16" rx="4"/>'+T(x0+w/2,y+2,s,"tagt");}
function R(x1,y1,x2,y2,label,side,cls){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
  var z=Math.min(36,L-8),s=(L-z)/2,n=6,amp=6,p="M"+x1+" "+y1+" L"+(x1+ux*s)+" "+(y1+uy*s);
  for(var i=1;i<=n;i++){var t=s+z*(i-.5)/n,g=i%2?1:-1;p+=" L"+(x1+ux*t+px*amp*g).toFixed(1)+" "+(y1+uy*t+py*amp*g).toFixed(1);}
  p+=" L"+(x1+ux*(s+z))+" "+(y1+uy*(s+z))+" L"+x2+" "+y2;
  var out='<path class="part'+(cls?" "+cls:"")+'" d="'+p+'"/>';
  if(label){var mx=(x1+x2)/2,my=(y1+y2)/2;side=side||1;
    if(Math.abs(dx)>Math.abs(dy))out+=T(mx,side>0?my-11:my+19,label);
    else out+=T(mx+11*side,my+4,label,"lbl",side>0?"start":"end");}
  return out;
}
/* LED pointing down (anode top). b = brightness 0..1, or "burnt". y = centre, leads span y±20 */
function LED(x,y,b,green){
  var o="",on=typeof b==="number"&&b>0.02;
  if(on)o+='<circle class="glow'+(green?" g":"")+'" cx="'+x+'" cy="'+y+'" r="'+(10+12*b).toFixed(1)+'" opacity="'+(0.15+0.5*b).toFixed(2)+'" filter="url(#blur)"/>';
  o+='<path class="part" d="M'+x+' '+(y-20)+' V'+(y-8)+' M'+x+' '+(y+7)+' V'+(y+20)+'"/>';
  var fill=on?(green?"var(--ledg)":"var(--led)"):"var(--canvas)";
  o+='<path class="ledtri" style="fill:'+fill+';fill-opacity:'+(on?(0.35+0.65*b).toFixed(2):1)+(on?';stroke:'+fill:'')+'" d="M'+(x-9)+' '+(y-8)+' L'+(x+9)+' '+(y-8)+' L'+x+' '+(y+7)+' Z"/>';
  o+='<path class="part" d="M'+(x-10)+' '+(y+7)+' H'+(x+10)+'"/>';
  o+='<path class="part" d="M'+(x+12)+' '+(y-1)+' l7 -7 M'+(x+15)+' '+(y+5)+' l7 -7"/>';
  o+='<path class="partf" d="M'+(x+21)+' '+(y-10)+' l-5 1 l4 4 z M'+(x+24)+' '+(y-4)+' l-5 1 l4 4 z"/>';
  if(b==="burnt")o+='<path class="burn" d="M'+(x-12)+' '+(y-12)+' L'+(x+12)+' '+(y+12)+' M'+(x+12)+' '+(y-12)+' L'+(x-12)+' '+(y+12)+'"/>';
  return o;
}
/* diode: from (x,y1) to (x,y2), conducts in the direction y1 -> y2 */
function DIODE(x,y1,y2,cls){
  var m=(y1+y2)/2,s=y2>y1?1:-1,o="";
  o+='<path class="part" d="M'+x+' '+y1+' V'+(m-7*s)+' M'+x+' '+(m+7*s)+' V'+y2+'"/>';

  o+='<path class="part" d="M'+(x-9)+' '+(m+7*s)+' H'+(x+9)+'"/>';
  return o;
}
/* NPN: B=(x-24s,y) C=(x+18s,y-30) E=(x+18s,y+30) */
function NPN(x,y,m,label,state){
  var s=m?-1:1,o="";
  o+='<circle class="body'+(state==="dead"?" dead":state?" on":"")+'" cx="'+(x+8*s)+'" cy="'+y+'" r="22"/>';
  o+='<path class="part" d="M'+(x-24*s)+' '+y+' H'+x+'"/>';

  var tx=x+14.4*s,ty=y+15.6,ux=0.832*s,uy=0.555,px=-uy,py=ux;
  o+='<path class="partf" d="M'+tx+' '+ty+' L'+(tx-ux*8+px*4).toFixed(1)+' '+(ty-uy*8+py*4).toFixed(1)+' L'+(tx-ux*8-px*4).toFixed(1)+' '+(ty-uy*8-py*4).toFixed(1)+' Z"/>';
  if(state==="dead")o+='<path class="burn" d="M'+(x-6*s)+' '+(y-14)+' l28 28 M'+(x+22*s)+' '+(y-14)+' l-28 28"/>';
  if(label)o+=T(x+8*s+(m?-28:28),y+4,label,"nlbl",m?"end":"start");
  return o;
}
/* N-channel MOSFET: G=(x-24,y) D=(x+18,y-30) S=(x+18,y+30); body diode drawn S->D */
function NMOS(x,y,label,state){
  var o='<circle class="body'+(state==="dead"?" dead":state?" on":"")+'" cx="'+(x+10)+'" cy="'+y+'" r="23"/>';
  o+='<path class="part" d="M'+(x-24)+' '+y+' H'+x+' M'+x+' '+(y-13)+' V'+(y+13)+'"/>';
  o+='<path class="part" style="stroke-width:3" d="M'+(x+6)+' '+(y-15)+' V'+(y-6)+' M'+(x+6)+' '+(y-4)+' V'+(y+4)+' M'+(x+6)+' '+(y+6)+' V'+(y+15)+'"/>';
  o+='<path class="part" d="M'+(x+6)+' '+(y-10)+' H'+(x+18)+' V'+(y-30)+' M'+(x+6)+' '+(y+10)+' H'+(x+18)+' V'+(y+30)+' M'+(x+6)+' '+y+' H'+(x+18)+' V'+(y+10)+'"/>';
  o+='<path class="partf" d="M'+(x+7)+' '+y+' l7 -4 v8 z"/>';
  /* body diode */
  o+='<path class="part" style="stroke-width:1.3" d="M'+(x+18)+' '+(y+22)+' H'+(x+28)+' V'+(y+5)+' M'+(x+28)+' '+(y-5)+' V'+(y-22)+' H'+(x+18)+' M'+(x+23)+' '+(y-5)+' H'+(x+33)+'"/><path class="partf" d="M'+(x+23)+' '+(y+5)+' H'+(x+33)+' L'+(x+28)+' '+(y-5)+' Z"/>';
  if(state==="dead")o+='<path class="burn" d="M'+(x-4)+' '+(y-14)+' l28 28 M'+(x+24)+' '+(y-14)+' l-28 28"/>';
  if(label)o+=T(x+40,y+4,label,"nlbl","start");

}
function SW(x1,y1,x2,y2,closed,label,side){
  var dx=x2-x1,dy=y2-y1,a=closed?0:-0.5,ex=x1+dx*Math.cos(a)-dy*Math.sin(a),ey=y1+dx*Math.sin(a)+dy*Math.cos(a);

  if(label){var vert=Math.abs(dy)>Math.abs(dx);o+=vert?(side>0?T(x1+12,(y1+y2)/2+5,label,"nlbl","start"):T(x1-10,(y1+y2)/2+5,label,"nlbl","end")):T((x1+x2)/2,y1+20,label,"nlbl");}

/* push button between (x,y1) and (x,y2), vertical */

/* single-pole double-throw: pivot p, two contacts; pos 0 -> c0, 1 -> c1 */
function SPDT(px,py,c0x,c0y,c1x,c1y,pos,l0,l1){
  var ex=pos?c1x:c0x,ey=pos?c1y:c0y,o="";

  if(l0)o+=T(c0x,c0y-9,l0,"lbl");if(l1)o+=T(c1x,c1y-9,l1,"lbl");

/* capacitor between (x,y1) and (x,y2) (vertical) or (x1..x2,y) horizontal. polar: + plate first end. rev = drawn reversed */

  else o+='<path class="part'+(cls?" "+cls:"")+'" style="stroke-width:2.6" d="M'+(x-12)+' '+(m+4*s)+' H'+(x+12)+'"/>';

function CAPH(x1,x2,y,label,polar,above){

  else o+='<path class="part" style="stroke-width:2.6" d="M'+(m+4*s)+' '+(y-12)+' V'+(y+12)+'"/>';
  if(label)o+=above===false?T(m,y+26,label,"lbl"):T(m,y-17,label,"lbl");

}
/* inductor (coil), vertical between y1 and y2 */
function IND(x,y1,y2,label,side){
  var L=y2-y1,z=Math.min(48,L-8),s=(L-z)/2,n=4,h=z/n,p="M"+x+" "+y1+" V"+(y1+s);
  for(var i=0;i<n;i++){var a=y1+s+i*h;p+=" A"+(h/2)+" "+(h/2)+" 0 0 1 "+x+" "+(a+h);}

  return '<path class="part" d="'+p.replace(/A([\d.]+) ([\d.]+) 0 0 1/g,"A$1 $2 0 0 1")+'"/>'+(label?(side<0?T(x-14,(y1+y2)/2+4,label,"lbl","end"):T(x+16,(y1+y2)/2+4,label,"lbl","start")):"");
}
function LAMP(x,y,b,label){
  var o="";if(b>0.02)o+='<circle class="glow" style="fill:#FFC94D" cx="'+x+'" cy="'+y+'" r="'+(12+14*b).toFixed(1)+'" opacity="'+(0.2+0.6*b).toFixed(2)+'" filter="url(#blur)"/>';
  o+='<circle class="body" style="stroke:var(--ink);stroke-width:1.8" cx="'+x+'" cy="'+y+'" r="13"/><path class="part" d="M'+(x-9)+' '+(y-9)+' L'+(x+9)+' '+(y+9)+' M'+(x+9)+' '+(y-9)+' L'+(x-9)+' '+(y+9)+' M'+x+' '+(y-24)+' V'+(y-13)+' M'+x+' '+(y+13)+' V'+(y+24)+'"/>';

/* potentiometer: track from (x,y1) to (x,y2), wiper arrow from the right at fraction f (0 bottom..1 top). returns {svg,wx,wy} */
function POT(x,y1,y2,f,label){

function LDR(x,y1,y2,label){var m=(y1+y2)/2;return R(x,y1,x,y2,label,-1)+'<circle class="part" style="stroke-width:1.2" cx="'+x+'" cy="'+m+'" r="16"/><path class="part" style="stroke-width:1.3" d="M'+(x+30)+' '+(m-16)+' l-11 9 M'+(x+32)+' '+(m-6)+' l-11 9"/><path class="partf" d="M'+(x+19)+' '+(m-7)+' l2 -5 l3 4 z M'+(x+21)+' '+(m+3)+' l2 -5 l3 4 z"/>';}
function THERM(x,y1,y2,label){var m=(y1+y2)/2;return R(x,y1,x,y2,label,-1)+'<path class="part" style="stroke-width:1.3" d="M'+(x-13)+' '+(m+14)+' L'+(x+11)+' '+(m-12)+' H'+(x+17)+'"/>'+T(x+13,m+16,"−t°","lbl","start");}
/* op-amp: pins inm=(x-10,y-15) inp=(x-10,y+15) out=(x+70,y) vp=(x+30,y-35) vn=(x+30,y+35) */
function OPAMP(x,y,label,dead,swap){
  var o='<path class="body'+(dead?" dead":"")+'" style="stroke:var(--ink);stroke-width:1.8" d="M'+x+' '+(y-30)+' L'+x+' '+(y+30)+' L'+(x+60)+' '+y+' Z"/>';
  o+='<path class="part" d="M'+(x-10)+' '+(y-15)+' H'+x+' M'+(x-10)+' '+(y+15)+' H'+x+' M'+(x+60)+' '+y+' H'+(x+70)+' M'+(x+30)+' '+(y-15)+' V'+(y-35)+' M'+(x+30)+' '+(y+15)+' V'+(y+35)+'"/>';
  o+=T(x+8,y-11,swap?"+":"−","nlbl")+T(x+8,y+19,swap?"−":"+","nlbl");

function BAT(x,y,hot){return (hot?'<circle class="glow" cx="'+x+'" cy="'+y+'" r="26" opacity=".5" filter="url(#blur)"/>':'')+'<path class="part" d="M'+x+' '+(y-20)+' V'+(y-5)+' M'+(x-14)+' '+(y-5)+' H'+(x+14)+' M'+x+' '+(y+5)+' V'+(y+20)+'"/><path class="part" style="stroke-width:4" d="M'+(x-7)+' '+(y+5)+' H'+(x+7)+'"/>'+T(x-20,y-6,"+","nlbl")+T(x-20,y+14,"−","nlbl")+T(x+20,y+4,BATV+" V","nlbl","start")+(hot?T(x+20,y+20,"HOT","blbl","start"):"");}
function HOP(x,y,v){return '<path class="bg" d="M'+(x-7)+' '+y+' H'+(x-2)+' M'+(x+2)+' '+y+' H'+(x+7)+'"/><path class="w '+vc(v)+'" d="M'+(x-7)+' '+y+' A7 7 0 0 1 '+(x+7)+' '+y+'"/>';}
function svg(w,h,inner,wide){return '<svg viewBox="0 0 '+w+' '+h+'" '+(wide?'class="wide" ':'')+'role="img"><defs><filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="5"/></filter></defs>'+inner+'</svg>';}

/* ================= rails: battery on the left, + top rail, − bottom rail ================= */
var RT=20,RB=280,UPS=[],DNS=[],BATV=5,TOPV=true;
function begin(rt,rb,batv){RT=rt;RB=rb;UPS=[];DNS=[];BATV=batv||5;TOPV=true;}
function kk(k){return k===true?1:(typeof k==="number"?k:0);}
function FLAG(x,y,k,sz){k=kk(k);UPS.push([x,k,sz||"s"]);return W([x,RT,x,y],TOPV)+F([x,RT,x,y],sz,k)+D(x,RT,TOPV);}
function GND(x,y,k,sz){k=kk(k);DNS.push([x,k,sz||"s"]);return W([x,y,x,RB],false)+F([x,y,x,RB],sz,k)+D(x,RB,false);}
function finish(o,w,h,dx,wide,hot){
  h=Math.max(h,RB+22);
  var bx=-dx+26,mid=(RT+RB)/2,mu=bx,md=bx,au=null,ad=null,ku=0,kd=0,su="s",sd="s",r="";
  UPS.forEach(function(u){mu=Math.max(mu,u[0]);if(u[1]>0.015){au=Math.max(au==null?-1e9:au,u[0]);ku=Math.max(ku,u[1]);if(u[2]!=="s")su=u[2];}});
  DNS.forEach(function(u){md=Math.max(md,u[0]);if(u[1]>0.015){ad=Math.max(ad==null?-1e9:ad,u[0]);kd=Math.max(kd,u[1]);if(u[2]!=="s")sd=u[2];}});
  r+=W([bx,mid-20,bx,RT,mu,RT],TOPV)+W([md,RB,bx,RB,bx,mid+20],false);
  if(ad!=null)r+=F([ad,RB,bx,RB,bx,mid+20],sd,kd);
  if(au!=null)r+=F([bx,mid-20,bx,RT,au,RT],su,ku);
  r+=BAT(bx,mid,hot)+T(bx+6,RT-6,"+"+BATV+" V rail (battery +)","lbl","start")+T(bx+6,RB+14,"0 V rail (battery −)","lbl","start");
  return svg(w+dx,h,'<g transform="translate('+dx+',0)">'+r+o+'</g>',wide);
}

/* ================= scope (voltage/current vs time) ================= */
/* hist: {t:[...], a:[...], b:[...]} ; panels: [{title, unit, min, max, ticks, series:[{key,name,c:1|2}], refs:[{v,label}]}] */
function hpush(s,vals,win){
  if(!s.h){s.h={t:[]};}
  var h=s.h;h.t.push(s.t);for(var k in vals){if(!h[k])h[k]=[];if(!isFinite(vals[k]))vals[k]=0;h[k].push(vals[k]);}
  var cut=s.t-win*1.05;while(h.t.length>2&&h.t[1]<cut){h.t.shift();for(var k2 in h)if(k2!=="t")h[k2].shift();}
  if(h.t.length>900){var keep=function(a){return a.filter(function(_,i){return i%2===0;});};for(var k3 in h)h[k3]=keep(h[k3]);}
}
function hclear(s){s.h={t:[]};}
var HOVER=null; /* 0..1 across plot width */
function SCOPE(s,panels,win,tlabel){
  var W0=360,PL=40,PR=12,ph=96,gap=34,H=panels.length*(ph+gap)+8,o="",h=s.h||{t:[]},t1=s.t,t0=t1-win;
  function X(t){return PL+(t-t0)/win*(W0-PL-PR);}
  panels.forEach(function(p,i){
    var top=i*(ph+gap)+22;function Y(v){return top+ph-(clamp(v,p.min,p.max)-p.min)/(p.max-p.min)*ph;}
    o+=T(PL,top-8,p.title+" ("+p.unit+")","axis","start");
    (p.ticks||[p.min,p.max]).forEach(function(v){o+='<line class="grid" x1="'+PL+'" x2="'+(W0-PR)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>'+T(PL-5,Y(v)+3,(Math.abs(v)<1e-9?"0":(+v.toFixed(2))),"axis","end");});
    (p.refs||[]).forEach(function(r){o+='<line class="ref" x1="'+PL+'" x2="'+(W0-PR)+'" y1="'+Y(r.v).toFixed(1)+'" y2="'+Y(r.v).toFixed(1)+'"/>'+T(W0-PR-2,Y(r.v)-4,r.label,"axis","end");});
    p.series.forEach(function(se){
      var d=h[se.key];if(!d||d.length<2)return;var pts=[];
      for(var j=0;j<d.length;j++){if(h.t[j]<t0)continue;pts.push(X(h.t[j]).toFixed(1)+","+Y(d[j]*(se.scale||1)).toFixed(1));}
      if(pts.length>1)o+='<polyline class="trace t'+se.c+'" points="'+pts.join(" ")+'"/>';
      var last=d[d.length-1]*(se.scale||1);o+='<circle class="f'+se.c+'" cx="'+X(t1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="3"/>';
    });
    if(HOVER!=null&&h.t.length>1){
      var hx=PL+HOVER*(W0-PL-PR),ht=t0+HOVER*win,j=0,best=1e9;for(var q=0;q<h.t.length;q++){var dd=Math.abs(h.t[q]-ht);if(dd<best){best=dd;j=q;}}
      o+='<line class="cross" x1="'+hx.toFixed(1)+'" x2="'+hx.toFixed(1)+'" y1="'+top+'" y2="'+(top+ph)+'"/>';
      var lab=p.series.map(function(se){var d=h[se.key];return d?se.name+" "+(d[j]*(se.scale||1)).toFixed(2)+" "+p.unit:"";}).join("  ");
      o+=TAG(clamp(hx,PL+60,W0-PR-60),top+12,lab);
    }
  });

steps:[

 diag:function(s){var d=waterDiag(s);return {svg:d.svg,meters:[["Pressure (voltage)",fV(s.V),true],["Pipe (resistance)",fR(s.R),false],["Flow (current)",fI(d.I),d.I>1e-6]],

 ctl:[{k:"V",type:"seg",label:"Pump / battery",opts:VS},{k:"R",type:"seg",label:"Pipe / resistor",opts:RSEL}],
 text:`<p>You can't see electricity, so use a picture you can: <b>water in a closed loop of pipe</b>. Every circuit idea in this course has a water version.</p>
<table class="cmp"><tr><th>Water</th><th>Electricity</th><th>Unit</th></tr>
<tr><td>Pump pressure</td><td><b>Voltage</b> (the push)</td><td>volts, V</td></tr>
<tr><td>Flow rate</td><td><b>Current</b> (how much moves per second)</td><td>amps, A (mA = thousandth)</td></tr>
<tr><td>Narrow pipe</td><td><b>Resistance</b> (holds the flow back)</td><td>ohms, Ω (kΩ = thousand)</td></tr>
<tr><td>Pump</td><td><b>Battery</b></td><td></td></tr>
<tr><td>Pipe</td><td><b>Wire</b></td><td></td></tr></table>
<ul><li>Try the buttons. A stronger pump gives more flow.</li><li>A narrower pipe gives less flow.</li><li>Nothing flows unless the loop is complete.</li></ul>
<div class="why"><span class="k">Say it with the real words</span><b>Voltage</b> pushes, <b>resistance</b> resists, and <b>current</b> is what results. More voltage means more current. More resistance means less current.</div>
<details class="reveal"><summary>Where the picture stops being accurate</summary><ul><li>Wires have almost no resistance, like a huge pipe.</li><li>What moves is electric charge (tiny electrons), and the loop is always full of it already. Nothing is used up. The battery just pushes it around.</li><li>Pipes can leak. A wire only carries current if the loop is complete.</li></ul></details>`},

{title:"Ohm's law",part:"Part 1 · The big picture",init:{V:5,R:1000},

   now:"I = V ÷ R = "+s.V+" ÷ "+s.R+" = "+d.I.toFixed(5).replace(/0+$/,"")+" A, which is "+fI(d.I)+". Double the voltage and the current doubles. Double the resistance and the current halves."};},
 ctl:[{k:"V",type:"seg",label:"Voltage",opts:VS},{k:"R",type:"seg",label:"Resistance",opts:[[100,"100 Ω"],[330,"330 Ω"],[1000,"1 kΩ"],[4700,"4.7 kΩ"],[10000,"10 kΩ"]]}],
 text:`<p>One rule joins all three. It's called <b>Ohm's law</b>:</p>
<div class="formula">V = I × R</div>
<ul><li><b>Current:</b> I = V ÷ R</li><li><b>Voltage:</b> V = I × R</li><li><b>Resistance:</b> R = V ÷ I</li></ul>
<p>Use volts, amps and ohms. Convert first: <b>5 mA = 0.005 A</b> and <b>2.2 kΩ = 2200 Ω</b>.</p>
<h3>Worked example</h3>
<ul><li>9 V across 4.7 kΩ.</li><li>I = 9 ÷ 4700 = 0.0019 A.</li><li>That's <b>1.9 mA</b>.</li></ul>
<div class="why"><span class="k">Water version</span>Same pump, half-width pipe: half the flow. Ohm's law just says exactly how much.</div>
<p class="hint">Try: 12 V and 330 Ω. Predict the current, then check the meter.</p>`},

 text:`<p>Small resistors are too tiny to print numbers on, so they wear <b>coloured bands</b>.</p>

<p>Example: <b>brown, black, red</b> is 1, 0, then 2 zeros: <b>1000 Ω = 1 kΩ</b>.</p>

 text:`<p>Current through resistance makes <b>heat</b>. The energy per second is <b>power</b>, measured in <b>watts (W)</b>:</p>
<div class="formula">P = V × I &nbsp;&nbsp; or &nbsp;&nbsp; P = V² ÷ R</div>
<p>Typical hobby resistors are rated <b>¼ W (0.25 W)</b>. Go over that and they overheat.</p>
<div class="why bad"><span class="k">The mistake</span>Choosing a resistor only by its ohms. A 100 Ω across 9 V is "correct" in value, but it makes 0.81 W: over three times the rating.</div>
<div class="why fix"><span class="k">The fix</span>Work out P = V² ÷ R first. Stay under about half the rating. If it's too much, raise the resistance, or use a ½ W, 1 W or bigger part.</div>
<div class="why"><span class="k">Water version</span>Pushing lots of water through a narrow pipe makes the pipe work hard (friction). The wattage rating is how much of that the pipe can stand.</div>`},

 text:`<p>An LED isn't like a resistor. Once it conducts, it keeps a <b>roughly fixed voltage across it</b> (about 2 V for red) and will take <b>as much current as you let it</b>. Too much and it dies.</p>
<p>So a <b>series resistor</b> sets the current. It gets whatever voltage the LED doesn't:</p>
<div class="formula">R = (supply − LED drop) ÷ current</div>
<ul><li>5 V supply, red LED, 10 mA wanted.</li><li>Resistor gets 5 − 2 = 3 V.</li><li>R = 3 ÷ 0.01 = <b>300 Ω</b>. Round to the next standard value, 330 Ω.</li></ul>
<p>Most small LEDs are happy at <b>5 to 20 mA</b>.</p>
<div class="why bad"><span class="k">Try the mistake</span>Choose "none". The LED has nothing to hold the current back.</div>
<div class="why"><span class="k">Water version</span>The LED is a valve that opens fully once there's enough push. The resistor is the narrow pipe that stops it flooding.</div>`},

 text:`<details class="reveal"><summary>1. What do voltage, current and resistance mean, in water terms and electrical terms?</summary><p>Voltage is the push (pump pressure). Current is the flow (how much moves per second). Resistance is how hard it is to push through (a narrow pipe).</p></details>
<details class="reveal"><summary>2. State Ohm's law three ways.</summary><p>V = I × R, I = V ÷ R, R = V ÷ I. Use volts, amps, ohms.</p></details>
<details class="reveal"><summary>3. How do you read a 3-band resistor?</summary><p>Two digits, then that many zeros. Brown, black, red is 10 followed by two zeros: 1000 Ω.</p></details>
<details class="reveal"><summary>4. Why does a resistor have a power rating?</summary><p>Current through it makes heat, P = V × I. A ¼ W resistor can only shed 0.25 W before it overheats.</p></details>
<details class="reveal"><summary>5. How do you pick the resistor for an LED?</summary><p>R = (supply − LED drop) ÷ wanted current. The resistor takes the voltage the LED doesn't.</p></details>
<h3>Build it yourself</h3>
<p>In a simulator (VoltSim or any other) or on a breadboard: 5 V supply, 330 Ω resistor, red LED, back to 0 V. Then swap in 1 kΩ and watch the LED dim.</p>`}

 text:`<p>A <b>capacitor</b> stores electric charge. Picture a <b>water tank split in half by a stretchy rubber sheet</b>. Water can't pass through the sheet. But push water into one side and the sheet stretches, which shoves the same amount of water out of the other side.</p>
<ul><li>While the sheet is stretching, water flows round the loop.</li><li>The more it stretches, the harder it pushes back.</li><li>Once the sheet pushes back as hard as the pump pushes, <b>the flow stops</b>. The tank is full.</li></ul>
<p>In the circuit, that rubber sheet is the thin gap between the capacitor's two plates. Watch the LED and the current.</p>
<div class="why"><span class="k">The real words</span><b>Charging current</b> flows only while the capacitor's voltage is still changing. When its voltage equals the supply (here, supply minus the LED's drop), the current is <b>zero</b>. So a full capacitor <b>blocks steady DC</b>.</div>
<ul><li>Press <b>Reset</b>, then watch the LED fade as the capacitor fills.</li><li>Hold <b>empty it</b> and see the LED flash back to life.</li><li>Try a bigger capacitor: it takes longer, like a bigger tank.</li></ul>`},

 text:`<p>How fast does the tank fill? Two things set it:</p>
<ul><li><b>Pipe width:</b> a narrower pipe (more resistance R) is slower.</li><li><b>Tank size:</b> a bigger tank (more capacitance C) is slower.</li></ul>
<div class="formula">τ = R × C</div>
<p>τ (the Greek letter tau, "time constant") is measured in <b>seconds</b> when R is in ohms and C in farads.</p>
<ul><li>After <b>1τ</b>: about 63% charged.</li><li>After <b>5τ</b>: about 99%, "full" for practical purposes.</li></ul>
<p>It fills fast at first, when the voltage gap is big, and slows as it nears full. The same shape appears in every RC circuit.</p>
<p class="hint">Example: 10 kΩ × 100 µF = 10 000 Ω × 0.0001 F = 1 s.</p>`},

 ctl:[{k:"cap",type:"seg",label:"Mystery capacitor",opts:[["a","A"],["b","B"],["c","C"]]},{k:"ans",type:"tog",label:"Show the answer"},{type:"act",label:"Empty it and start the stopwatch",run:function(s){s.v=0;s.t=0;s.t63=null;hclear(s);}}],
 scope:function(s){return {panels:[{title:"Voltage across the capacitor",unit:"V",min:0,max:5,ticks:[0,2.5,5],series:[{key:"v",name:"Voltage",c:1}],refs:[{v:3.16,label:"63%"}]}],win:100000*MYS[s.cap]*5.5};},
 text:`<p>Two ways to find an unknown capacitor's value.</p>
<h3>1. The capacitance setting on a multimeter</h3>
<ul><li><b>Discharge it first</b>: short its legs through a resistor.</li><li>Switch the meter to the capacitor symbol (⊣⊢) mode.</li><li>Touch the probes to the legs. Electrolytics: red probe on the + leg.</li><li>The Multimeter module has the full steps.</li></ul>
<h3>2. Time it (this step)</h3>
<ul><li>Charge it through a known resistor (100 kΩ here).</li><li>Watch a voltmeter across it. Note when it reaches <b>63% of the supply</b>.</li><li>That time is τ. So <b>C = τ ÷ R</b>.</li></ul>
<p>Press the buttons, wait, and work out each capacitor before revealing the answer.</p>
<div class="why"><span class="k">Why 63%?</span>It's where the exponential curve of charging is after exactly one τ. It's easy to spot on a graph and gives you C directly.</div>`},

   now:s.btn?"Button down: the battery tops up the capacitor (through 47 Ω) and powers the LED.":(d.Il>2e-4?"Button released. The battery is out of the loop. The capacitor is now the power source: it pushes current through the 330 Ω and the LED, and its voltage slowly drops. The LED fades as the current shrinks.":(s.rel!=null?"The LED has gone out, though the capacitor still holds about 2 V. An LED needs about 1.9 V across it to conduct, so below that there's no current.":"Press and hold the button, then release."))};},
 ctl:[{k:"btn",type:"hold",label:"Hold the button"},{k:"C",type:"seg",label:"Capacitor",opts:CSEL,set:function(s,v){s.C=v;}}],
 scope:function(s){return {panels:[{title:"Capacitor voltage",unit:"V",min:0,max:5,ticks:[0,2.5,5],series:[{key:"v",name:"Capacitor voltage",c:1}],refs:[{v:1.9,label:"LED needs 1.9 V"}]},{title:"LED current",unit:"mA",min:0,max:10,ticks:[0,5,10],series:[{key:"i",name:"LED current",c:2}]}],win:10};},
 text:`<p>Here the capacitor sits <b>beside</b> the LED instead of in series. The button charges it. When you let go, the capacitor is a small battery: it keeps the LED going until it runs out.</p>
<ul><li>Hold the button for a second. The capacitor fills.</li><li>Release. The LED slowly fades.</li><li>Pick a bigger capacitor: it stays lit longer.</li></ul>
<p>The fade time is roughly <b>R × C</b> times a few. Bigger C or bigger R makes it last longer. That's how <b>delay-off lights, fade effects and simple timers</b> work.</p>
<div class="why"><span class="k">Why does it stop at 2 V, not 0 V?</span>An LED only conducts when it has about 1.9 V across it. When the capacitor falls to that, the LED goes out even though the capacitor isn't empty.</div>
<div class="why"><span class="k">Water version</span>A tank with a small tap on the bottom. Fill it, then let it dribble out through the tap. A bigger tank or narrower tap lasts longer. The LED is a sprinkler that only works above a minimum pressure.</div>`},

 ctl:[{k:"ci",type:"seg",label:"Marking",opts:CODES.map(function(c,i){return [i,c[0]];})}],
 text:`<h3>Units</h3>
<ul><li>The farad (F) is huge, so we use small parts.</li><li><b>1 µF</b> (microfarad) = 1/1,000,000 F.</li><li><b>1 µF = 1000 nF</b> (nanofarads).</li><li><b>1 nF = 1000 pF</b> (picofarads).</li></ul>
<h3>Two common types</h3>
<ul><li><b>Ceramic discs:</b> small, no polarity. Often a 3-digit code: two digits then zeros, in <b>pF</b>. So <b>104</b> = 100 000 pF = <b>100 nF</b>.</li><li><b>Electrolytic cans:</b> bigger values (1 µF and up). <b>They have a + and a − leg.</b> The stripe marks −. Connect them the right way round.</li></ul>
<h3>Voltage rating</h3>
<ul><li>Every capacitor has a maximum voltage printed on it. Pick one with <b>at least double</b> your supply.</li></ul>
<div class="why bad"><span class="k">Handle with care</span>A charged capacitor can hold its voltage for a long time. Big ones in mains equipment can hurt you. Always discharge first through a resistor (never a bare screwdriver).</div>`},

 text:`<details class="reveal"><summary>1. Why does current stop flowing when a capacitor is full?</summary><p>The capacitor's voltage rises until it equals the supply, so nothing pushes any more. There is no current once its voltage stops changing: it blocks steady DC.</p></details>
<details class="reveal"><summary>2. What sets how long a capacitor takes to charge?</summary><p>The time constant τ = R × C. After 1τ it's at 63%, after 5τ about 99%.</p></details>
<details class="reveal"><summary>3. Why does an LED in series with a capacitor go out before the capacitor reaches the supply voltage?</summary><p>The LED needs about 2 V across it to conduct, so the capacitor stops charging when its voltage reaches supply − 2 V.</p></details>
<details class="reveal"><summary>4. How can you find an unknown capacitor's value without a capacitance meter?</summary><p>Charge it through a known resistor and time how long it takes to reach 63%. C = τ ÷ R.</p></details>
<details class="reveal"><summary>5. What does a marking of 473 mean?</summary><p>47 followed by 3 zeros, in picofarads: 47 000 pF = 47 nF.</p></details>
<h3>Build it yourself</h3>
<p>5 V, 330 Ω, LED and a 1000 µF capacitor in series, back to 0 V. Watch the LED fade as it fills. Then parallel version: capacitor beside the LED, button on the supply.</p>`}

 ctl:[{k:"dev",type:"seg",label:"Part",opts:[["diode","silicon diode"],["led","red LED"]]},{k:"dir",type:"seg",label:"Fitted",opts:[["fwd","the right way"],["rev","backwards ✗",1]]}],
 text:`<p>A <b>diode</b> lets current through <b>one way only</b>: in at the <b>anode</b> (the flat side of the triangle), out at the <b>cathode</b> (the bar).</p>
<ul><li>Right way: it conducts and drops about <b>0.7 V</b> (silicon diode) or <b>1.8 to 3 V</b> (LED, depending on colour).</li><li>Backwards: it blocks.</li></ul>
<p>An <b>LED</b> is a diode that gives off light when current flows.</p>
<ul><li><b>Longer leg</b> is the anode (+).</li><li><b>Flat edge</b> on the case is the cathode (−).</li></ul>
<div class="why bad"><span class="k">The mistake</span>Fitting an LED backwards. Nothing breaks. It just never lights, which is easy to blame on something else.</div>
<div class="why"><span class="k">Water version</span>A one-way (check) valve. The "drop" is the little push needed to open the valve.</div>`},

 text:`<p>A <b>potentiometer</b> ("pot") is a resistor track with a <b>sliding contact (the wiper)</b>. Turn the knob and the wiper moves along.</p>
<h3>Three legs: a voltage divider</h3>
<ul><li>Ends go to 5 V and 0 V.</li><li>The wiper (middle leg) gives <b>any voltage in between</b>.</li><li>Halfway gives half.</li></ul>
<h3>Two legs: a variable resistor</h3>
<ul><li>Use one end and the wiper.</li><li>Turning the knob changes the resistance in the loop. Handy for dimming.</li></ul>
<div class="why"><span class="k">Water version</span>A long pipe with a movable outlet. The further along the outlet, the lower the pressure it gives. Real name: a <b>voltage divider</b>, covered properly in the series and parallel module.</div>`},

 text:`<p>Some resistors change value with the world around them.</p>
<ul><li><b>LDR</b> (light-dependent resistor): about <b>1 kΩ in bright light</b>, 100 kΩ or more in the dark.</li><li><b>NTC thermistor:</b> resistance <b>falls as it warms</b>. (NTC means negative temperature coefficient.) A common one is 10 kΩ at 25 °C.</li></ul>
<p>A chip can't read resistance directly. So put the sensor over a fixed resistor and read the voltage in the middle. That's a divider, and the voltage moves as the sensor changes.</p>
<p class="hint">Move the sliders and watch the output voltage. Swap sensors with the buttons.</p>
<div class="why"><span class="k">Water version</span>A valve that opens as light or heat increases. The Op-amps and Wheatstone modules turn this into a night light and a thermostat.</div>`},

{title:"Meet the multimeter",part:"Part 1 · The tool",init:{mode:0},
 diag:function(s){var m=MODES[s.mode];return {svg:dmmDiag(s),meters:[["Dial",m.name,true],["Sockets",jackText(s),false]],now:"<b>"+m.name+".</b> "+m.how+". Sockets: "+jackText(s)+"."};},
 ctl:[{k:"mode",type:"seg",label:"Dial",opts:MODES.map(function(m,i){return [i,m.lab+" "+m.name.split(" ")[0]];})}],
 text:`<p>A <b>multimeter</b> measures voltage, current and resistance with one box and two leads. Turn the dial and the meter becomes a different instrument.</p>
<ul><li><b>Black lead:</b> always in <b>COM</b> (common).</li><li><b>Red lead:</b> in <b>V Ω</b> for volts, ohms, continuity, diode and capacitance.</li><li><b>Red lead for current:</b> in <b>mA</b> (small currents) or <b>10A</b> (large). These sockets are fused.</li></ul>
<div class="why bad"><span class="k">The classic mistake</span>Leaving the red lead in the <b>current</b> socket and then measuring voltage across something. The meter becomes a short circuit and blows its fuse.</div>
<p>Try each dial position and see where the leads go and how the meter must be connected.</p>
<div class="why"><span class="k">Water version</span>A voltmeter is a pressure gauge: connect it <b>across</b> two points. An ammeter is a flow meter: it has to sit <b>inside</b> the pipe.</div>`},

{title:"Measuring voltage: across the part",part:"Part 2 · Voltage and current",init:{V:9,at:"R1"},
 diag:function(s){var d=voltDiag(s);return {svg:d.svg,meters:[["Reads",(d.reading<0?"−":"")+fx(Math.abs(d.reading),2)+" V",d.reading>=0],["Battery",fV(s.V),false],["R1 + R2 =",fx(d.v1,2)+" + "+fx(d.v2,2)+" = "+fx(d.v1+d.v2,2)+" V",true]],
   now:s.at==="rev"?"The leads are on the same two points as R2, but swapped (red on the lower side). The size is the same and the sign flips. Nothing is wrong.":s.at==="all"?"Across both resistors, which is the whole battery: the readings add up (3 V + 6 V = 9 V).":"The meter is connected in parallel with "+s.at+", touching each end. It reads the voltage dropped across just that resistor."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:[[5,"5 V"],[9,"9 V"],[12,"12 V"]]},{k:"at",type:"seg",label:"Probes across",opts:[["R1","R1"],["R2","R2"],["all","both"],["rev","R2, probes swapped"]]}],
 text:`<p>To measure voltage, touch the probes <b>across</b> the part, one on each side. The meter connects <b>in parallel</b>. You don't have to break the circuit.</p>
<ul><li>Dial to <b>V</b> (DC volts, the straight line symbol).</li><li>Red probe on the more positive side, black on the other.</li><li>Read the display.</li></ul>
<p>A voltmeter has a huge resistance (about 10 MΩ), so it takes almost no current and leaves the circuit alone.</p>
<div class="why"><span class="k">Water version</span>A pressure gauge clipped across a narrow section of pipe: it tells you how much pressure is lost there, without letting any water out.</div>
<p class="hint">The ground rule: voltage is always measured <i>between two points</i>. "5 V" on its own means 5 V compared with 0 V.</p>`},

{title:"Measuring current: in series",part:"Part 2 · Voltage and current",init:{V:9,R:1000},
 diag:function(s){var d=ampDiag(s);return {svg:d.svg,meters:[["Reads",fI(d.I),true],["Check: V ÷ R",fI(s.V/s.R),false]],
   now:"The wire was cut and the meter put in the gap, so <b>all the current goes through the meter</b>. It reads "+fI(d.I)+", which matches V ÷ R = "+fx(s.V,0)+" ÷ "+s.R+"."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:[[5,"5 V"],[9,"9 V"],[12,"12 V"]]},{k:"R",type:"seg",label:"Resistor",opts:[[330,"330 Ω"],[1000,"1 kΩ"],[4700,"4.7 kΩ"]]}],
 text:`<p>Current is a flow <b>through</b> something, so the meter must become <b>part of the loop</b>. That's <b>in series</b>.</p>
<ul><li>Switch the circuit off.</li><li>Move the red lead to the <b>mA</b> socket and the dial to <b>A</b>.</li><li>Break the loop and connect the meter into the gap.</li><li>Switch on and read.</li><li>Afterwards, move the lead back to the <b>V Ω</b> socket.</li></ul>
<p>An ammeter has almost <b>zero resistance</b>, so it doesn't disturb the current.</p>
<div class="why"><span class="k">Water version</span>A flow meter (a little paddle wheel) fitted into the pipe. To fit it, you have to cut the pipe.</div>`},

{title:"Mistake: an ammeter across the supply",part:"Mistake · Blowing the fuse",mist:true,init:{V:9,at:"res"},
 diag:function(s){var d=shortDiag(s);return {svg:d.svg,bad:d.blown,meters:[["Meter placed",s.at==="series"?"in series ✓":s.at==="res"?"across the resistor ✗":"across the battery ✗",d.blown?"warn":true],["Current",d.blown?"≈ "+Math.round(s.V/0.5)+" A":fI(d.I),d.blown?"warn":true],["Fuse",d.blown?"blown":"fine",d.blown?"warn":true]],
   now:d.blown?"In amps mode the meter is nearly a plain wire (under 1 Ω). Placed across a part, it short-circuits it: the current is limited only by the wires and battery, about "+Math.round(s.V/0.5)+" A. The meter's fuse blows, or worse, the battery overheats.":"In series, the 330 Ω still limits the current. The meter reads it safely."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:[[5,"5 V"],[9,"9 V"],[12,"12 V"]]},{k:"at",type:"seg",label:"Meter (amps mode)",opts:[["series","in series ✓"],["res","across the resistor ✗",1],["bat","across the battery ✗",1]]}],
 text:`<div class="why bad"><span class="k">What goes wrong</span>Amps mode is a near-zero-resistance path. Put it across a resistor or battery, the way you would a voltmeter, and it's a <b>short circuit</b>. Big current flows. The meter's fuse blows (that's what it's for). A cheap meter without a fuse can fail or burn out.</div>
<div class="why fix"><span class="k">The fix</span><ul><li><b>Current: in series only.</b></li><li><b>Voltage: across only.</b></li><li>When in doubt, start with the dial on <b>V</b> and the red lead in <b>V Ω</b>.</li></ul></div>
<p class="hint">If the meter suddenly reads 0 A in a circuit that obviously works, check its fuse first.</p>`},

{title:"Measuring resistance (and why not in the circuit)",part:"Part 3 · Resistance and continuity",mist:true,init:{where:"in",power:false},
 diag:function(s){var d=inDiag(s);return {svg:d.svg,bad:s.where==="in"||s.power,meters:[["Meter reads",s.power?"unreliable":fR(Math.round(d.rd)),s.where==="in"||s.power?"warn":true],["R1 is really","1 kΩ",false]],
   now:s.power?"The circuit is powered, so the meter's tiny test current is swamped by the circuit's own voltage. The reading is meaningless, and may damage the meter.":s.where==="in"?"R1 is still connected. The meter's test current also finds a second route through R2, so it measures R1 in parallel with R2: "+fR(Math.round(d.rd))+", not 1 kΩ.":"With one leg of R1 lifted out of the circuit, the meter measures R1 alone: 1 kΩ."};},
 ctl:[{k:"where",type:"seg",label:"R1",opts:[["in","left in circuit ✗",1],["out","one leg lifted ✓"]]},{k:"power",type:"seg",label:"Power",opts:[[false,"off ✓"],[true,"on ✗",1]]}],
 text:`<p>In <b>ohms mode</b> the meter sends a tiny current through the part and works out the resistance from the voltage it sees.</p>
<div class="why bad"><span class="k">Two classic mistakes</span><ul><li><b>Power on:</b> the circuit's own voltage ruins the reading.</li><li><b>Part still wired in:</b> other parts give the current a second route, so the reading is lower than the real value.</li></ul></div>
<div class="why fix"><span class="k">The fix</span><ul><li>Power <b>off</b>.</li><li>Lift <b>one leg</b> of the part out of the circuit (or remove it).</li><li>Dial to Ω, probes on each leg. Polarity doesn't matter for a resistor.</li></ul></div>
<p class="hint">Reading "OL" (over limit) means a resistance too big for the range: an open circuit.</p>`},

{title:"Resistance and continuity: wires, switches, resistors",part:"Part 3 · Resistance and continuity",init:{dut:"res",m:"ohm"},
 diag:function(s){var d=dutDiag(s);return {svg:d.svg,meters:[["Reads",d.read,d.beep],["Beeps?",d.beep?"yes":"no",d.beep]],
   now:d.beep?"A complete, low-resistance path: the continuity beeper sounds.":!isFinite(d.d.r)?"No complete path: the meter shows OL (open loop), and there's no beep.":"Reads the part's resistance."};},
 ctl:[{k:"dut",type:"seg",label:"Part under test",opts:[["res","4.7 kΩ resistor"],["good","good wire"],["cut","broken wire"],["swo","switch open"],["swc","switch closed"]]},{k:"m",type:"seg",label:"Dial",opts:[["ohm","Ω ohms"],["cont","•)) continuity"]]}],
 text:`<p><b>Continuity mode</b> is ohms mode with a beeper: it beeps if the resistance is under about 30 Ω.</p>
<ul><li>Is this wire really connected at both ends?</li><li>Does this switch actually close?</li><li>Is the fuse intact?</li></ul>
<p>Open (no path) reads <b>OL</b>. A good wire reads close to 0 Ω.</p>
<div class="why bad"><span class="k">Remember</span>Power off first, always.</div>
<p class="hint">Try each part in each mode, and note which ones beep.</p>`},

{title:"Measuring a capacitor",part:"Part 4 · Capacitors and diodes",init:{mm:"res",C:100e-6,vc:0,vcharged:4.98},sim:capmSim,
 diag:function(s){var d=capmDiag(s);return {svg:d.svg,meters:[["Reads",d.read,true],["Mode",s.mm==="volt"?"volts":s.mm==="res"?"ohms":"capacitance",false]],
   now:s.mm==="res"?"In ohms mode the meter's test current charges the capacitor. The resistance reading <b>climbs from near zero up to OL</b>. That's normal: it's the capacitor filling. A short circuit would stay near 0, and a broken one would show OL straight away.":s.mm==="volt"?"A charged capacitor reads its stored voltage. It can hold that for minutes or hours, so discharge it before you handle it.":"Capacitance mode reads the value directly. Discharge the capacitor first and take it out of the circuit."};},
 ctl:[{k:"mm",type:"seg",label:"Meter mode",opts:[["volt","volts (charged)"],["res","ohms (watch it climb)"],["cap","capacitance"]]},{k:"C",type:"seg",label:"Capacitor",opts:[[10e-6,"10 µF"],[100e-6,"100 µF"],[1000e-6,"1000 µF"]]},{type:"act",label:"Discharge it (empty)",run:function(s){s.vc=0;hclear(s);}}],
 scope:function(s){return {panels:[{title:"Voltage on the capacitor from the meter's test",unit:"V",min:0,max:3,ticks:[0,1.5,3],series:[{key:"v",name:"Capacitor",c:1}]}],win:12};},
 text:`<p>Three ways to check a capacitor with a multimeter:</p>
<ol><li><b>Capacitance mode (⊣⊢):</b> discharge it, take it out, touch the leads (red on + for electrolytics). Read the value. Real values can be 20% off, which is normal.</li><li><b>Ohms mode:</b> the reading should <b>start low and climb</b> towards OL as the capacitor charges. Bigger capacitor, slower climb. Swap the leads and it climbs again.</li><li><b>Volts mode:</b> checks whether it still holds a charge.</li></ol>
<div class="why bad"><span class="k">Safety</span>A charged capacitor can keep its voltage after the power is off. <b>Discharge through a resistor</b> (1 kΩ for small ones) before touching or measuring. A bare screwdriver makes a spark and can damage the part.</div>
<p class="hint">Try ohms mode with 10 µF and then 1000 µF. Press Discharge between tries.</p>`},

{title:"Testing a diode or LED",part:"Part 4 · Capacitors and diodes",init:{dev:"diode",dir:"fwd"},
 diag:function(s){var d=dtDiag(s);return {svg:d.svg,meters:[["Reads",d.read,d.read!=="OL"]],
   now:s.dir==="fwd"?"Red probe on the anode, black on the cathode: the meter pushes a small current through, and shows the voltage the diode drops"+(s.dev==="led"?". An LED may glow faintly while you test it.":"."):"Reversed: nothing conducts, so the meter shows OL. A good diode reads OL one way and about 0.5 to 0.7 V the other."};},
 ctl:[{k:"dev",type:"seg",label:"Part",opts:[["diode","silicon diode"],["led","LED"]]},{k:"dir",type:"seg",label:"Probes",opts:[["fwd","red on anode"],["rev","reversed"]]}],
 text:`<p><b>Diode-test mode</b> (the triangle and bar) checks the one-way behaviour.</p>
<ul><li><b>Red on the anode, black on the cathode:</b> reads the forward drop (about 0.6 V for silicon, 1.7 V or more for LEDs).</li><li><b>Reverse:</b> OL.</li></ul>
<p>Readings the same both ways mean it's faulty:</p>
<ul><li>Close to 0 both ways: shorted.</li><li>OL both ways: open.</li></ul>
<p class="hint">Use it to find which end of an unmarked diode is the cathode.</p>`},

{quiz:true,gen:true,count:5,title:"Check: measuring",part:"Check",bank:bank},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. How do you connect a meter to measure voltage, and to measure current?</summary><p>Voltage: across the part (parallel), no break needed. Current: in series, so the loop has to be broken and the meter put in the gap.</p></details>
<details class="reveal"><summary>2. Why can't you measure resistance in a powered circuit?</summary><p>The meter sends its own tiny test current. The circuit's voltage corrupts the reading and may damage the meter.</p></details>
<details class="reveal"><summary>3. Why does a resistor measured in the circuit read low?</summary><p>Other parts give the test current parallel paths. Lift one leg first.</p></details>
<details class="reveal"><summary>4. What happens if you use amps mode across a battery?</summary><p>It's a short circuit through the meter: huge current, a blown fuse or a damaged meter.</p></details>
<details class="reveal"><summary>5. How do you check a capacitor safely?</summary><p>Discharge it through a resistor, remove it, then use capacitance mode (or watch the ohms reading climb).</p></details>
<h3>Practise</h3>
<p>With a real meter: measure a 9 V battery in volts mode, then a resistor (out of circuit) in ohms mode, then an LED in diode-test mode.</p>`}
]});

 ctl:[{k:"V",type:"seg",label:"Battery",opts:VSEL},{k:"R1",type:"seg",label:"R1",opts:RSEL},{k:"R2",type:"seg",label:"R2",opts:RSEL}],
 text:`<p>Resistors <b>in series</b> are joined end to end, one after another. There's only <b>one path</b> for the current.</p>
<ul><li><b>Same current</b> through all of them.</li><li>The <b>voltages add up</b> to the supply.</li><li><b>Total resistance</b> is the sum: R<sub>total</sub> = R1 + R2.</li></ul>
<div class="formula">V<sub>R2</sub> = V × R2 ÷ (R1 + R2)</div>
<p>That last one is the <b>voltage divider</b>: each resistor takes a share of the voltage equal to its share of the resistance.</p>
<div class="why"><span class="k">Water version</span>Two narrow pipes in a row. Same flow through both. The pump's push is shared: the narrower pipe uses up more of the pressure.</div>
<p class="hint">Change R1 and R2 and watch the two drops. Do they always add up to the battery?</p>`},

{title:"Parallel: shared voltage, split current",part:"Part 1 · Series and parallel",init:{V:9,R1:1000,R2:2200,R3:1000},
 diag:function(s){var d=parDiag(s,2);return {svg:d.svg,meters:[["Voltage on every branch",fV(s.V),true],["I1",fI(d.Is[0]),false],["I2",fI(d.Is[1]),false],["Total from battery",fI(d.It),true],["Total resistance",fR(Math.round(d.Rt*10)/10),false]],
   now:"Each branch is wired straight across the battery, so <b>each gets the full "+s.V+" V</b>. The currents add: "+fI(d.Is[0])+" + "+fI(d.Is[1])+" = "+fI(d.It)+". The combined resistance ("+fR(Math.round(d.Rt))+") is <b>smaller than either resistor</b>, because there are now two paths."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:VSEL},{k:"R1",type:"seg",label:"R1",opts:RSEL},{k:"R2",type:"seg",label:"R2",opts:RSEL}],
 text:`<p>Resistors <b>in parallel</b> are side by side, each connected across the same two points.</p>
<ul><li><b>Same voltage</b> across every branch.</li><li>The <b>currents add</b> up.</li><li>Total resistance is <b>smaller than the smallest</b>.</li></ul>
<div class="formula">1/R<sub>total</sub> = 1/R1 + 1/R2 &nbsp;&nbsp; or &nbsp;&nbsp; R<sub>total</sub> = R1 × R2 ÷ (R1 + R2)</div>
<p>Two equal resistors in parallel give <b>half</b> of one. For two, "product over sum" is the quick way.</p>
<div class="why"><span class="k">Water version</span>Two pipes side by side between the same two tanks. Both get the same pressure difference, and together they carry more water than either alone.</div>`},

{title:"Three branches, and the shortcut",part:"Part 1 · Series and parallel",init:{V:9,R1:1000,R2:2200,R3:470},

 ctl:[{k:"V",type:"seg",label:"Battery",opts:VSEL},{k:"R1",type:"seg",label:"R1",opts:RSEL},{k:"R2",type:"seg",label:"R2",opts:RSEL},{k:"R3",type:"seg",label:"R3",opts:RSEL}],
 text:`<p>For three or more, use the reciprocal form: <b>1/R<sub>total</sub> = 1/R1 + 1/R2 + 1/R3</b>.</p>
<h3>Quick shortcuts</h3>
<ul><li><b>Equal resistors:</b> R ÷ number of them. Three 3 kΩ in parallel = 1 kΩ.</li><li><b>Two:</b> product ÷ sum.</li><li><b>Sanity check:</b> the answer must be <b>less than the smallest</b> branch.</li></ul>
<p class="hint">Make one branch much smaller than the others: it dominates the total. A very large one barely matters.</p>`},

{title:"Kirchhoff's current law: in equals out",part:"Part 2 · Kirchhoff's laws",init:{V:9,R1:1000,R2:2200,R3:470,hide:0,ans:false},
 diag:function(s){var d=parDiag(s,3);var h=s.hide,sum=d.Is[0]+d.Is[1]+d.Is[2];

   return {svg:d.svg,meters:[["Current into the junction",fI(sum),true],["I1",sh(0),h!==1],["I2",sh(1),h!==2],["I3",sh(2),h!==3],["I1 + I2 + I3",s.ans||h===0?fI(sum):"?",s.ans||h===0]],

 ctl:[{k:"hide",type:"seg",label:"Hide a branch",opts:[[0,"none"],[1,"I1"],[2,"I2"],[3,"I3"]]},{k:"ans",type:"tog",label:"Show the answer"},{k:"R1",type:"seg",label:"R1",opts:RSEL},{k:"R2",type:"seg",label:"R2",opts:RSEL},{k:"R3",type:"seg",label:"R3",opts:RSEL}],
 text:`<p><b>Kirchhoff's current law (KCL):</b></p>
<div class="formula">current in = current out (at any junction)</div>
<p>Charge isn't created or destroyed, so whatever flows into a junction must flow out.</p>
<ul><li>Total current from the battery = I1 + I2 + I3.</li><li>If you know all but one, subtract to find it.</li></ul>
<div class="why"><span class="k">Water version</span>A pipe splitting into three. Whatever flows into the junction flows out again. Water can't vanish or appear.</div>
<p class="hint">Hide one branch, work it out, then check.</p>`},

{title:"Kirchhoff's voltage law: a walk round the loop",part:"Part 2 · Kirchhoff's laws",init:{V:12,set:1,p:0},
 diag:function(s){var d=kvlDiag(s),p=s.p;var ch=p===0?0:p===1?s.V:-d.d[p-2];
   return {svg:d.svg,meters:[["You are",STN[p],true],["Height (voltage) now",fx(d.h[p],2)+" V",true],["Last change",p===0?"–":(ch>=0?"+":"−")+fx(Math.abs(ch),2)+" V",false],["Total so far",p===4?"0.00 V: back at the start ✓":fx(d.h[p],2)+" V",p===4]],
   now:p===4?"The climb of +"+s.V+" V and the three drops add up to zero: "+s.V+" − "+fx(d.d[0],2)+" − "+fx(d.d[1],2)+" − "+fx(d.d[2],2)+" = 0. You're back where you started, so the net change has to be zero.":"Slide along the loop. The battery lifts you up by "+s.V+" V. Each resistor drops you down by its share."};},
 ctl:[{k:"p",type:"range",label:"Walk round the loop",min:0,max:4,step:1,fmt:function(v){return ["start","after battery","after R1","after R2","after R3"][v];}},{k:"set",type:"seg",label:"Resistors",opts:[[1,"1k, 2k, 3k"],[2,"all 2k"],[3,"3k, 1k, 2k"]]},{k:"V",type:"seg",label:"Battery",opts:VSEL.concat([[12,"12 V"]]).slice(0,3)}],
 text:`<p><b>Kirchhoff's voltage law (KVL):</b></p>
<div class="formula">going all the way round any loop, the voltage changes add up to zero</div>
<ul><li>The battery <b>raises</b> you by its voltage.</li><li>Each resistor <b>drops</b> you by I × R.</li><li>Back where you started, you're at the same level. So the rises equal the falls.</li></ul>
<p>That's why in the series step the drops added up to the battery voltage. KVL is that fact stated as a rule.</p>
<div class="why"><span class="k">Water version</span>Walk a closed track with hills. You can climb and drop as much as you like, but when you get back to the start, your total change in height is zero. The pump is the lift, the resistors are the slopes down.</div>
<p class="hint">Drag the slider and read off the running total.</p>`},

{title:"Series and parallel together",part:"Part 3 · Putting it together",init:{V:12,R1:1000,R2:2200,R3:2200},
 diag:function(s){var d=mixDiag(s);return {svg:d.svg,meters:[["Total resistance",fR(Math.round(d.Rt)),true],["Total current",fI(d.It),true],["R1 drop",fV(d.v1),false],["Parallel pair",fV(d.vp),false],["I2 + I3",fI(d.i2)+" + "+fI(d.i3),false],["KCL: I2 + I3 =",fI(d.i2+d.i3)+" ✓ = total",true],["KVL: R1 + pair =",fx(d.v1+d.vp,2)+" V ✓ = battery",true]],
   now:"Step by step: the parallel pair is "+fR(Math.round(d.Rp))+". Add R1 in series: "+fR(Math.round(d.Rt))+". Total current "+fI(d.It)+" = "+s.V+" ÷ "+Math.round(d.Rt)+". R1 drops "+fV(d.v1)+", leaving "+fV(d.vp)+" across the pair. Each branch gets that: "+fI(d.i2)+" and "+fI(d.i3)+"."};},
 ctl:[{k:"V",type:"seg",label:"Battery",opts:VSEL},{k:"R1",type:"seg",label:"R1 (series)",opts:RSEL},{k:"R2",type:"seg",label:"R2",opts:RSEL},{k:"R3",type:"seg",label:"R3",opts:RSEL}],
 text:`<p>Real circuits mix both. The method works from the outside in.</p>
<ol><li><b>Combine the parallel part</b> into one equivalent resistor.</li><li><b>Add the series parts.</b> That's the total resistance.</li><li><b>I = V ÷ R<sub>total</sub></b> gives the battery current.</li><li><b>R1's drop</b> = I × R1. The rest of the battery voltage is across the pair.</li><li>Each parallel branch current = (voltage across the pair) ÷ its resistance.</li><li>Check: branch currents add to the total (KCL). Drops add to the battery (KVL).</li></ol>
<p>The two meters at the bottom run both checks for you. They should always agree.</p>
<p class="hint">Try to work out the numbers yourself before reading the meters.</p>`},

{title:"Mistake: too many loads in parallel",part:"Mistake · Overload",mist:true,init:{n:2},

   now:d.blown?"Each lamp is a 24 Ω load across the 12 V supply and draws 0.5 A. "+s.n+" lamps in parallel need "+fx(d.I,1)+" A, over the 3 A fuse. It blows, and everything goes dark.":"Each lamp has the full 12 V across it and draws 0.5 A. "+s.n+" lamps draw "+fx(d.I,1)+" A in total. Adding more makes total resistance fall and total current climb."};},
 ctl:[{k:"n",type:"range",label:"Lamps in parallel",min:1,max:6,step:1,fmt:function(v){return v+" lamp"+(v>1?"s":"");}}],
 text:`<p>Every lamp added in parallel gets the full supply voltage, so each one still draws its own current. The supply has to provide <b>all of them together</b>.</p>
<div class="why bad"><span class="k">The mistake</span>"Parallel is free: each thing works the same." True for the lamps, but the <b>total current</b> keeps growing as total resistance falls. Overload the supply and the fuse blows, wires heat up, or a battery dies quickly.</div>
<div class="why fix"><span class="k">The fix</span>Add up the currents of all the loads (KCL). Make sure the supply, wires and fuse can handle the total.</div>
<p>Here a 3 A fuse allows five lamps. A sixth blows it.</p>`},

{final:true,title:"Explain it back",part:"Finish",
 text:`<details class="reveal"><summary>1. What stays the same in series, and what in parallel?</summary><p>Series: the current is the same, the voltage is shared. Parallel: the voltage is the same, the current is shared.</p></details>
<details class="reveal"><summary>2. How do you find total resistance in series and in parallel?</summary><p>Series: add them. Parallel: 1/R = 1/R1 + 1/R2 + … (product ÷ sum for two). Parallel is always smaller than the smallest.</p></details>
<details class="reveal"><summary>3. State KCL and KVL in plain words.</summary><p>KCL: current in = current out at any junction. KVL: the voltage changes around any closed loop add up to zero (the battery's rise equals the resistors' drops).</p></details>
<details class="reveal"><summary>4. How do you tackle a series-parallel circuit?</summary><p>Combine parallel parts, add series parts, find the total current, then work back outwards for each drop and branch current. Check with KCL and KVL.</p></details>
<details class="reveal"><summary>5. Why can adding more loads in parallel be dangerous?</summary><p>Each load still draws its full current, so the total current climbs. The supply or fuse can overload.</p></details>
<h3>Build it yourself</h3>
<p>In a simulator or on a breadboard: 9 V, 1 kΩ and 2.2 kΩ in series. Measure each drop and the current (see the Multimeter module). Then put them in parallel and compare.</p>`}

  if(!s.rev){s.v=5+(s.v-5)*Math.exp(-dt/0.1);s.i=(5-s.v)/1000;s.heat=Math.max(0,s.heat-dt*0.2);}
  else{s.heat=Math.min(1.4,s.heat+dt*0.25);var leak=2.5e-3*clamp(s.heat,0,1)+0.4e-3;var tgt=5-leak*1000;s.v=tgt+(s.v-tgt)*Math.exp(-dt/0.1);s.i=Math.max(leak,(5-s.v)/1000);}
  hpush(s,{i:s.i*1000},8);
}
/* delay-off timer */
function timerDiag(s){
  var v=s.v,p=s.btn,o="",Rb=s.norb?50:22000,Ib=v>0.65?(v-0.65)/Rb:0,Ic=Math.min(100*Ib,8.8e-3),b=Ic/8.8e-3;
  var Ibtn=p?(5-v)/100:0,Icap=Ibtn-Ib; /* + = charging */
  begin(24,262);
  var kb=clamp(Ib/0.2e-3,0,1),kbt=clamp(Ibtn/0.02,0,1),kcap=clamp(Math.abs(Icap)/0.02,0,1)||clamp(Math.abs(Icap)/0.2e-3,0,1)*0.6;
  o+=W([60,95,60,105],p?true:v)+W([60,145,60,185],v)+W([60,170,90,170],v)+W([160,170,176,170],v>0.65?0.7:v)+W([218,90,218,98],true)+W([218,138,218,140],Ic>1e-4?"lo":"mid");
  if(p)o+=F([60,95,60,105],"b",kbt)+F([60,145,60,170],"b",kbt);
  if(Icap>0)o+=F([60,170,60,185],"b",kcap);else if(Icap<0)o+=F([60,185,60,170],"s",kcap)+F([60,RB,60,215],"s",kcap);
  if(Ib>0)o+=F([60,170,90,170],s.norb?"x":"s",kb)+F([160,170,176,170],s.norb?"x":"s",kb);
  if(Ic>1e-5)o+=F([218,90,218,98],"b",b)+F([218,138,218,140],"b",b);
  o+=FLAG(60,50,p?kbt:0,"b")+PUSH(60,50,95,p,"button")+R(60,105,60,145,"100 Ω",-1)+D(60,170,v)+CAP(60,185,215,fC(s.C),true,-1)+GND(60,215,Icap>0?kcap:0,"b");
  if(s.norb)o+=W([90,170,160,170],"bad")+T(125,160,"wire (no resistor!)","blbl");else o+=R(90,170,160,170,"22 kΩ");
  o+=NPN(200,170,false,"",Ic>1e-4?(s.dead?"dead":true):(s.dead?"dead":false))+GND(218,200,Math.max(b,kb*0.4),Ic>1e-4?"b":"s");
  o+=FLAG(218,48,b,"b")+R(218,48,218,90,"330 Ω")+LED(218,118,b)+T(72,182,"X","nlbl","start");

function timerSim(s,dt){
  var Rb=s.norb?50:22000,n=Math.max(1,Math.ceil(dt/(Math.min(100,Rb)*s.C/4)));n=Math.min(n,400);var h=dt/n;
  for(var i=0;i<n;i++){var Ib=s.v>0.65?(s.v-0.65)/Rb:0,Ibtn=s.btn?(5-s.v)/100:0;s.v+=h*(Ibtn-Ib)/s.C;if(s.v<0)s.v=0;}
  if(s.btn){s.rel=null;}else if(s.rel==null&&s.wasp){s.rel=s.t;}
  s.wasp=s.btn;
  var Ib2=s.v>0.65?(s.v-0.65)/Rb:0,Ic=Math.min(100*Ib2,8.8e-3);
  if(s.rel!=null&&Ic<1e-4&&s.off==null)s.off=s.t-s.rel;
  if(s.btn)s.off=null;
  hpush(s,{v:s.v,ic:Ic*1000},s.norb?6:20);
}
function timerMeters(s,d){

  if(s.rel!=null)m.push(["LED stayed on after release",s.off!=null?fT(s.off):fT(s.t-s.rel)+"…",true]);

}
function timerPanels(s){return [{title:"Capacitor voltage (point X)",unit:"V",min:0,max:5,ticks:[0,2.5,5],series:[{key:"v",name:"Capacitor voltage",c:1}],refs:[{v:0.65,label:"≈0.65 V: transistor off below this"}]},
