name: Grace 3DS
on:
  push:
    paths: ['Grace3DS/**', '.github/workflows/grace3ds.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
        working-directory: Grace3DS
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          make all 2>&1 | tee out/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elf
          path: Grace3DS/out/
  cia:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Grace3DS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: Grace3DS/out/
      - name: CIA tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a out/tools.log) 2>&1
          mkdir -p /tmp/t && cd /tmp/t
          api() { curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases"; }
          mr=$(api 3DSGuy/Project_CTR | jq -r '[.[] | .assets[] | select(.name|test("makerom.*ubuntu.*x86_64.*zip";"i"))][0].browser_download_url')
          bt=$(api Epicpkmn11/bannertool | jq -r '[.[] | .assets[] | select(.name|test("bannertool.*zip";"i"))][0].browser_download_url')
          echo "makerom: $mr"; echo "bannertool: $bt"
          curl -sSL "$mr" -o mr.zip && unzip -oq mr.zip -d mr
          curl -sSL "$bt" -o bt.zip && unzip -oq bt.zip -d bt
          sudo install -m755 "$(find mr -type f -name makerom | head -1)" /usr/local/bin/makerom
          sudo install -m755 bt/linux-x86_64/bannertool /usr/local/bin/bannertool
          (makerom 2>&1 | head -2; bannertool 2>&1 | head -2) || true
      - name: Package CIA
        run: |
          set -o pipefail
          make cia 2>&1 | tee -a out/build.log
          ls -la out
      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grace3ds-ci-${{ github.run_number }}
          name: Grace 3DS build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            Grace3DS/out/Grace.cia
            Grace3DS/out/grace.3dsx
            Grace3DS/out/build.log
            Grace3DS/out/tools.log
  emu:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: out/
      - name: Emulator screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots; exec > >(tee shots/emu.log) 2>&1
          set +e +o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick libfuse2 mesa-utils libgl1-mesa-dri libegl1 libopengl0 libglx-mesa0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libpulse0 libsdl2-2.0-0 > /dev/null 2>&1 || true
          rel=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/azahar-emu/azahar/releases/latest)
          echo "$rel" | jq -r '.tag_name, (.assets[].name)'
          url=$(echo "$rel" | jq -r '[.assets[] | select(.name|test("\\.appimage$";"i"))][0].browser_download_url')
          echo "asset: $url"
          curl -sSL "$url" -o emu.dl
          file emu.dl
          case "$url" in *.tar.gz|*.tgz) mkdir -p ex && tar -xzf emu.dl -C ex && APP=$(find ex -iname '*.AppImage' | head -1);; *.zip) mkdir -p ex && unzip -q emu.dl -d ex && APP=$(find ex -iname '*.AppImage' | head -1);; *) APP=./emu.dl;; esac
          chmod +x "$APP"; "$APP" --appimage-extract > /dev/null; ls squashfs-root | head
          BIN=$(find squashfs-root -type f -name "azahar*" -perm -u+x | grep -v -i "room\|\.so" | head -1); BIN=squashfs-root/AppRun; find squashfs-root -maxdepth 2 | head -20; echo "BIN=$BIN"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & sleep 2; export DISPLAY=:99
          "$BIN" out/grace.3dsx > shots/azahar.log 2>&1 &
          sleep 30; import -window root shots/01-title.png
          key() { xdotool search --onlyvisible --name . windowactivate --sync 2>/dev/null; xdotool keydown "$1"; sleep 0.25; xdotool keyup "$1"; }
          key a; sleep 3; import -window root shots/02-story.png
          for i in 1 2 3 4; do key a; sleep 1; done; sleep 4; import -window root shots/03-play.png
          xdotool keydown Up; sleep 2; xdotool keyup Up; sleep 6; import -window root shots/04-play.png
          sleep 14; import -window root shots/05-play.png
          sleep 16; import -window root shots/06-later.png
          sleep 16; import -window root shots/07-later.png
          xdotool search --name . getwindowname %@ 2>/dev/null | head; tail -40 shots/azahar.log; exit 0
      - name: Publish shots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grace3ds-ci-${{ github.run_number }}
          name: Grace 3DS build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: shots/*
