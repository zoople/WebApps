name: Grace 3DS
on:
  push:
    paths: ['Grace3DS/**', '.github/workflows/grace3ds.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
        working-directory: Grace3DS
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          make all 2>&1 | tee out/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elf
          path: Grace3DS/out/
  cia:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Grace3DS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: Grace3DS/out/
      - name: CIA tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a out/tools.log) 2>&1
          mkdir -p /tmp/t && cd /tmp/t
          api() { curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases"; }
          mr=$(api 3DSGuy/Project_CTR | jq -r '[.[] | .assets[] | select(.name|test("makerom.*ubuntu.*x86_64.*zip";"i"))][0].browser_download_url')
          bt=$(api Epicpkmn11/bannertool | jq -r '[.[] | .assets[] | select(.name|test("bannertool.*zip";"i"))][0].browser_download_url')
          echo "makerom: $mr"; echo "bannertool: $bt"
          curl -sSL "$mr" -o mr.zip && unzip -oq mr.zip -d mr
          curl -sSL "$bt" -o bt.zip && unzip -oq bt.zip -d bt
          sudo install -m755 "$(find mr -type f -name makerom | head -1)" /usr/local/bin/makerom
          sudo install -m755 bt/linux-x86_64/bannertool /usr/local/bin/bannertool
          makerom 2>&1 | head -2; bannertool 2>&1 | head -2
      - name: Package CIA
        run: |
          set -o pipefail
          make cia 2>&1 | tee -a out/build.log
          ls -la out
      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grace3ds-ci-${{ github.run_number }}
          name: Grace 3DS build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            Grace3DS/out/Grace.cia
            Grace3DS/out/grace.3dsx
            Grace3DS/out/build.log
            Grace3DS/out/tools.log
