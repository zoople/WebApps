name: Build MW Sound APK
on:
  push:
    paths: ['MWSound/**', '.github/workflows/build-mw-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MWSound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MWSound/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Detector test
        run: npm test
      - name: Create Android project
        run: npx cap add android
      - name: Allow a big heap (decoding audio for auto-detect)
        run: sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: MWSound/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mw-sound-apk
          path: MWSound/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
